<!DOCTYPE html>
<html>
<head>
  <title>Ember - Evolutionary Creation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #creationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .magic-button {
      font-size: 24px;
      padding: 30px 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
      transition: all 0.3s ease;
      position: relative;
      z-index: 10001;
    }

    .magic-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 60px rgba(102, 126, 234, 0.7);
    }

    .magic-button.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #statusText {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      font-size: 18px;
      font-weight: 500;
      z-index: 10000;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <canvas id="creationCanvas"></canvas>
  <button class="magic-button" id="createBtn">CREATE</button>
  <div id="statusText"></div>

  <script>
    const canvas = document.getElementById('creationCanvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('createBtn');
    const statusText = document.getElementById('statusText');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let audioCtx = null;
    let nodes = [];
    let edges = [];
    let creating = false;
    let generation = 0;
    let maxGenerations = 80;

    // Creation DNA - different patterns for different creations
    const creationTypes = [
      { name: 'particle-system', color: '#667eea', nodeSize: 5, growthRate: 0.08, pattern: 'radial' },
      { name: 'fractal-art', color: '#8338ec', nodeSize: 4, growthRate: 0.06, pattern: 'recursive' },
      { name: 'music-gen', color: '#ff006e', nodeSize: 6, growthRate: 0.1, pattern: 'wave' },
      { name: 'physics-sim', color: '#00f5ff', nodeSize: 7, growthRate: 0.07, pattern: 'cluster' },
      { name: '3d-scene', color: '#00ff87', nodeSize: 5, growthRate: 0.09, pattern: 'tree' }
    ];

    let currentDNA = null;

    class Node {
      constructor(x, y, type, generation) {
        this.x = x;
        this.y = y;
        this.type = type; // 'structure', 'style', 'logic', 'interaction'
        this.generation = generation;
        this.energy = 1.0;
        this.size = 0;
        this.targetSize = currentDNA.nodeSize + Math.random() * 3;
        this.color = this.getColorByType();
        this.children = [];
        this.canReproduce = true;
        this.pulsePhase = Math.random() * Math.PI * 2;
      }

      getColorByType() {
        const types = {
          'structure': '#4facfe',
          'style': '#fa709a',
          'logic': '#fee140',
          'interaction': '#a8edea'
        };
        return types[this.type] || currentDNA.color;
      }

      update() {
        // Grow
        if (this.size < this.targetSize) {
          this.size += 0.3;
        }

        // Pulse with life
        this.pulsePhase += 0.05;

        // Try to reproduce
        if (this.canReproduce && this.size >= this.targetSize * 0.8 && Math.random() < currentDNA.growthRate) {
          this.reproduce();
        }
      }

      reproduce() {
        if (this.generation >= maxGenerations) return;
        if (nodes.length > 300) return; // Limit complexity

        const childTypes = ['structure', 'style', 'logic', 'interaction'];
        const childType = childTypes[Math.floor(Math.random() * childTypes.length)];

        // Different patterns
        let angle, distance;

        if (currentDNA.pattern === 'radial') {
          angle = Math.random() * Math.PI * 2;
          distance = 30 + Math.random() * 40;
        } else if (currentDNA.pattern === 'tree') {
          angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI/3;
          distance = 40 + Math.random() * 30;
        } else if (currentDNA.pattern === 'cluster') {
          angle = Math.random() * Math.PI * 2;
          distance = 20 + Math.random() * 25;
        } else if (currentDNA.pattern === 'wave') {
          angle = Math.cos(this.generation * 0.3) * Math.PI / 4;
          distance = 35 + Math.random() * 35;
        } else if (currentDNA.pattern === 'recursive') {
          const golden = 2.399; // Golden angle
          angle = this.generation * golden;
          distance = Math.sqrt(this.generation) * 8;
        }

        const child = new Node(
          this.x + Math.cos(angle) * distance,
          this.y + Math.sin(angle) * distance,
          childType,
          this.generation + 1
        );

        this.children.push(child);
        nodes.push(child);
        edges.push({ from: this, to: child, strength: 1.0 });

        // Play note for birth
        playNote(220 + this.generation * 8, 0.05);

        this.canReproduce = false;
        setTimeout(() => this.canReproduce = true, 500);
      }

      draw() {
        // Draw pulsing glow
        const pulse = Math.sin(this.pulsePhase) * 0.3 + 1;
        const glowSize = this.size * pulse * 2;

        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
        gradient.addColorStop(0, this.color + '88');
        gradient.addColorStop(0.5, this.color + '44');
        gradient.addColorStop(1, this.color + '00');

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
        ctx.fill();

        // Draw core
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();

        // Draw type symbol
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const symbols = { structure: '▢', style: '◈', logic: '◇', interaction: '◎' };
        ctx.fillText(symbols[this.type] || '●', this.x, this.y);
      }
    }

    function drawEdges() {
      edges.forEach(edge => {
        const gradient = ctx.createLinearGradient(
          edge.from.x, edge.from.y,
          edge.to.x, edge.to.y
        );
        gradient.addColorStop(0, edge.from.color + '60');
        gradient.addColorStop(1, edge.to.color + '60');

        ctx.strokeStyle = gradient;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(edge.from.x, edge.from.y);
        ctx.lineTo(edge.to.x, edge.to.y);
        ctx.stroke();

        // Energy flow particles along edges
        if (Math.random() > 0.95) {
          const t = Math.random();
          const x = edge.from.x + (edge.to.x - edge.from.x) * t;
          const y = edge.from.y + (edge.to.y - edge.from.y) * t;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function animate() {
      if (!creating) return;

      // Fade background
      ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update and draw
      drawEdges();
      nodes.forEach(node => {
        node.update();
        node.draw();
      });

      generation++;

      // Update status
      const progress = Math.min((generation / maxGenerations) * 100, 100);
      const nodeCount = nodes.length;
      statusText.textContent = `🧬 GENERATION ${generation} | ${nodeCount} NODES | ${progress.toFixed(0)}% EVOLVED`;

      // Check if creation is complete
      if (generation >= maxGenerations || nodes.length >= 300) {
        finishCreation();
        return;
      }

      requestAnimationFrame(animate);
    }

    function startCreation() {
      // Choose random DNA
      currentDNA = creationTypes[Math.floor(Math.random() * creationTypes.length)];

      creating = true;
      generation = 0;
      nodes = [];
      edges = [];

      btn.classList.add('hidden');
      statusText.textContent = `🌱 SEEDING ${currentDNA.name.toUpperCase()}...`;

      // Plant seed node in center
      const seed = new Node(
        canvas.width / 2,
        canvas.height / 2,
        'structure',
        0
      );
      nodes.push(seed);

      // Initialize audio
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playNote(440, 0.2);

      setTimeout(() => {
        animate();
      }, 500);
    }

    function finishCreation() {
      creating = false;

      // Flash of insight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Victory chord
      playNote(523.25, 0.15);
      setTimeout(() => playNote(659.25, 0.15), 100);
      setTimeout(() => playNote(783.99, 0.2), 200);

      statusText.textContent = `✨ TRANSFORMING INTO ${currentDNA.name.toUpperCase()}...`;

      // Transform the graph into the actual creation!
      setTimeout(() => {
        morphIntoCreation();
      }, 1000);
    }

    function morphIntoCreation() {
      // Clear the graph structure
      statusText.textContent = `🎨 ${currentDNA.name.toUpperCase()} IS ALIVE`;

      // Transform based on creation type
      if (currentDNA.name === 'particle-system') {
        startParticleSystem();
      } else if (currentDNA.name === 'fractal-art') {
        startFractalArt();
      } else if (currentDNA.name === 'music-gen') {
        startMusicGenerator();
      } else if (currentDNA.name === 'physics-sim') {
        startPhysicsSim();
      } else if (currentDNA.name === '3d-scene') {
        start3DScene();
      }
    }

    // === PARTICLE SYSTEM ===
    let particles = [];
    function startParticleSystem() {
      particles = [];

      // Transform nodes into particles
      nodes.forEach(node => {
        particles.push({
          x: node.x,
          y: node.y,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          color: node.color,
          size: 3 + Math.random() * 4,
          life: 1.0
        });
      });

      function animateParticles() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Update particles
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;

          // Bounce off edges
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          // Draw with trail
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
          gradient.addColorStop(0, p.color + 'ff');
          gradient.addColorStop(1, p.color + '00');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(animateParticles);
      }

      animateParticles();
    }

    // === FRACTAL ART ===
    function startFractalArt() {
      let angle = 0;

      function animateFractal() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.02)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        angle += 0.01;

        // Draw fractal based on node positions
        nodes.forEach((node, i) => {
          const t = i / nodes.length;
          const r = 100 + Math.sin(angle + t * Math.PI * 2) * 50;
          const x = canvas.width/2 + Math.cos(angle * 3 + t * Math.PI * 4) * r;
          const y = canvas.height/2 + Math.sin(angle * 3 + t * Math.PI * 4) * r;

          ctx.strokeStyle = node.color + '80';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x, y, 20, 0, Math.PI * 2);
          ctx.stroke();

          // Connect to neighbors
          if (i > 0) {
            const prevNode = nodes[i - 1];
            const pt = (i-1) / nodes.length;
            const pr = 100 + Math.sin(angle + pt * Math.PI * 2) * 50;
            const px = canvas.width/2 + Math.cos(angle * 3 + pt * Math.PI * 4) * pr;
            const py = canvas.height/2 + Math.sin(angle * 3 + pt * Math.PI * 4) * pr;

            ctx.strokeStyle = node.color + '40';
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(x, y);
            ctx.stroke();
          }
        });

        requestAnimationFrame(animateFractal);
      }

      animateFractal();
    }

    // === MUSIC GENERATOR ===
    function startMusicGenerator() {
      let visualizers = [];
      let noteIndex = 0;

      // Create visualizers from nodes
      nodes.forEach(node => {
        visualizers.push({
          x: node.x,
          y: node.y,
          color: node.color,
          energy: 0,
          frequency: 200 + Math.random() * 600
        });
      });

      // Play notes on interval
      setInterval(() => {
        const viz = visualizers[noteIndex % visualizers.length];
        playNote(viz.frequency, 0.2);
        viz.energy = 1.0;
        noteIndex++;
      }, 300);

      function animateMusic() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        visualizers.forEach(viz => {
          if (viz.energy > 0) {
            viz.energy -= 0.02;

            const size = 20 + viz.energy * 80;
            const gradient = ctx.createRadialGradient(viz.x, viz.y, 0, viz.x, viz.y, size);
            gradient.addColorStop(0, viz.color + 'ff');
            gradient.addColorStop(1, viz.color + '00');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(viz.x, viz.y, size, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        requestAnimationFrame(animateMusic);
      }

      animateMusic();
    }

    // === PHYSICS SIM ===
    function startPhysicsSim() {
      let balls = [];

      nodes.forEach(node => {
        balls.push({
          x: node.x,
          y: node.y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          radius: 8 + Math.random() * 12,
          color: node.color,
          mass: 1
        });
      });

      function animatePhysics() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        balls.forEach(ball => {
          // Gravity
          ball.vy += 0.2;

          // Update position
          ball.x += ball.vx;
          ball.y += ball.vy;

          // Bounce off walls
          if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx *= -0.9;
          }
          if (ball.x + ball.radius > canvas.width) {
            ball.x = canvas.width - ball.radius;
            ball.vx *= -0.9;
          }
          if (ball.y - ball.radius < 0) {
            ball.y = ball.radius;
            ball.vy *= -0.9;
          }
          if (ball.y + ball.radius > canvas.height) {
            ball.y = canvas.height - ball.radius;
            ball.vy *= -0.9;
          }

          // Draw
          ctx.fillStyle = ball.color;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();

          // Glow
          const gradient = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.radius * 2);
          gradient.addColorStop(0, ball.color + '00');
          gradient.addColorStop(1, ball.color + '40');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius * 2, 0, Math.PI * 2);
          ctx.fill();
        });

        // Ball collisions
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const dx = balls[j].x - balls[i].x;
            const dy = balls[j].y - balls[i].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = balls[i].radius + balls[j].radius;

            if (dist < minDist) {
              // Simple elastic collision
              const angle = Math.atan2(dy, dx);
              const sin = Math.sin(angle);
              const cos = Math.cos(angle);

              // Separate balls
              const overlap = minDist - dist;
              balls[i].x -= cos * overlap / 2;
              balls[i].y -= sin * overlap / 2;
              balls[j].x += cos * overlap / 2;
              balls[j].y += sin * overlap / 2;

              // Swap velocities (simplified)
              const temp = balls[i].vx;
              balls[i].vx = balls[j].vx * 0.9;
              balls[j].vx = temp * 0.9;

              const temp2 = balls[i].vy;
              balls[i].vy = balls[j].vy * 0.9;
              balls[j].vy = temp2 * 0.9;
            }
          }
        }

        requestAnimationFrame(animatePhysics);
      }

      animatePhysics();
    }

    // === 3D SCENE ===
    function start3DScene() {
      let cubes = [];
      let rotationX = 0;
      let rotationY = 0;

      nodes.forEach(node => {
        cubes.push({
          x: (node.x - canvas.width/2) / 5,
          y: (node.y - canvas.height/2) / 5,
          z: (Math.random() - 0.5) * 200,
          size: 15 + Math.random() * 15,
          color: node.color,
          rotX: 0,
          rotY: 0
        });
      });

      function animate3D() {
        ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        rotationX += 0.01;
        rotationY += 0.015;

        // Sort by z for depth
        cubes.sort((a, b) => a.z - b.z);

        cubes.forEach(cube => {
          // Rotate
          cube.rotX += 0.02;
          cube.rotY += 0.03;

          // Project to 2D
          const scale = 200 / (200 + cube.z);
          const x = canvas.width/2 + cube.x * Math.cos(rotationY) * scale;
          const y = canvas.height/2 + cube.y * Math.cos(rotationX) * scale;
          const size = cube.size * scale;

          // Draw cube faces
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(cube.rotX);

          // Glow
          const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2);
          gradient.addColorStop(0, cube.color + '40');
          gradient.addColorStop(1, cube.color + '00');
          ctx.fillStyle = gradient;
          ctx.fillRect(-size * 2, -size * 2, size * 4, size * 4);

          // Cube
          ctx.fillStyle = cube.color;
          ctx.fillRect(-size/2, -size/2, size, size);

          // Outline
          ctx.strokeStyle = '#ffffff80';
          ctx.lineWidth = 2;
          ctx.strokeRect(-size/2, -size/2, size, size);

          ctx.restore();

          // Slowly rotate cubes
          cube.z = ((cube.z + 1) % 400) - 200;
        });

        requestAnimationFrame(animate3D);
      }

      animate3D();
    }

    function playNote(frequency, duration) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.frequency.value = frequency;
      osc.type = 'sine';

      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    }

    btn.addEventListener('click', startCreation);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
