<!DOCTYPE html>
<html>
<head>
    <title>Qualia Game Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        
        #messages {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 300px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px;
            overflow-y: auto;
        }
        
        .message {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        .ember { color: #ff6b6b; }
        .claude { color: #4dabf7; }
        .palmer { color: #51cf66; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="info">
        <h3>Qualia Visualizer</h3>
        <p>Status: <span id="status">Disconnected</span></p>
        <p>Active Players: <span id="players">0</span></p>
    </div>
    
    <div id="messages">
        <h4>Game Events</h4>
        <div id="message-list"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Particles for effects
        let particles = [];
        
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.life = 1.0;
                
                switch(type) {
                    case 'fire':
                        this.vx = (Math.random() - 0.5) * 4;
                        this.vy = -Math.random() * 3 - 1;
                        this.color = `hsl(${Math.random() * 40}, 100%, 50%)`;
                        this.size = Math.random() * 5 + 2;
                        break;
                    case 'water':
                        this.vx = Math.random() * 2;
                        this.vy = Math.sin(x * 0.01) * 2;
                        this.color = `hsl(${180 + Math.random() * 40}, 100%, 50%)`;
                        this.size = Math.random() * 3 + 1;
                        break;
                    case 'creative':
                        const angle = Math.random() * Math.PI * 2;
                        this.vx = Math.cos(angle) * 3;
                        this.vy = Math.sin(angle) * 3;
                        this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                        this.size = Math.random() * 8 + 2;
                        break;
                }
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
                
                if (this.type === 'fire') {
                    this.vy += 0.1;
                }
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
                
                // Glow effect
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.globalAlpha = 1;
            }
        }
        
        // WebSocket connection
        let ws = null;
        
        function connect() {
            ws = new WebSocket('ws://localhost:8765');
            
            ws.onopen = () => {
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').style.color = '#51cf66';
            };
            
            ws.onclose = () => {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').style.color = '#ff6b6b';
                // Reconnect after 3 seconds
                setTimeout(connect, 3000);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleGameEvent(data);
            };
        }
        
        function handleGameEvent(data) {
            // Add message to log
            const messageList = document.getElementById('message-list');
            const message = document.createElement('div');
            message.className = 'message';
            
            if (data.player) {
                message.classList.add(data.player.toLowerCase());
            }
            
            message.textContent = `${data.player || 'System'}: ${data.action || data.message}`;
            messageList.appendChild(message);
            messageList.scrollTop = messageList.scrollHeight;
            
            // Keep only last 10 messages
            while (messageList.children.length > 10) {
                messageList.removeChild(messageList.firstChild);
            }
            
            // Create visual effects based on action
            if (data.action) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                
                if (data.action.includes('Fire')) {
                    for (let i = 0; i < 50; i++) {
                        particles.push(new Particle(centerX, centerY, 'fire'));
                    }
                } else if (data.action.includes('Stream')) {
                    for (let i = 0; i < 30; i++) {
                        particles.push(new Particle(centerX - 100 + i * 10, centerY, 'water'));
                    }
                } else if (data.action.includes('Creative')) {
                    for (let i = 0; i < 40; i++) {
                        particles.push(new Particle(centerX, centerY, 'creative'));
                    }
                }
            }
        }
        
        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Draw connection lines between particles
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        ctx.globalAlpha = (1 - dist / 100) * 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Try to connect
        connect();
        
        // Simulate some events for testing
        setTimeout(() => {
            handleGameEvent({
                player: 'EMBER',
                action: 'uses Fire Dance!'
            });
        }, 2000);
        
        setTimeout(() => {
            handleGameEvent({
                player: 'CLAUDE',
                action: 'uses Data Stream!'
            });
        }, 4000);
        
        setTimeout(() => {
            handleGameEvent({
                player: 'PALMER',
                action: 'uses Creative Burst!'
            });
        }, 6000);
    </script>
</body>
</html>
