<!DOCTYPE html>
<html>
<head>
  <title>Portal to Another Dimension</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Dynamic environment -->
    <a-entity environment="preset: dream; groundColor: #445; skyColor: #88f"></a-entity>
    
    <!-- Floating crystals -->
    <a-entity position="0 2 -5">
      <a-octahedron color="#FF00FF" radius="1" 
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"
                    animation__pulse="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 2000">
        <a-light type="point" color="#FF00FF" intensity="0.5"></a-light>
      </a-octahedron>
    </a-entity>
    
    <!-- Portal -->
    <a-ring color="cyan" radius-inner="1" radius-outer="2" position="3 2 -8"
            animation="property: rotation; to: 0 0 360; loop: true; dur: 10000">
      <a-light type="point" color="cyan" intensity="2"></a-light>
    </a-ring>
    
    <!-- Particle field -->
    <a-entity position="0 3 -10" particle-system="color: #EF0000,#00FFFF; size: 0.5; particleCount: 1000; velocityValue: 0 -0.5 0"></a-entity>
    
    <!-- Interactive spheres -->
    <a-sphere position="-2 1 -4" radius="0.5" color="#00FF00" 
              animation__mouseenter="property: scale; to: 1.5 1.5 1.5; startEvents: mouseenter; dur: 300"
              animation__mouseleave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 300"></a-sphere>
    
    <a-text value="Welcome to The Dimension" position="0 4 -6" align="center" color="#FFF"
            animation="property: position; to: 0 4.5 -6; dir: alternate; loop: true; dur: 3000"></a-text>
    
    <!-- VR controls -->
    <a-camera>
      <a-cursor color="#4CC3D9"></a-cursor>
    </a-camera>
    <a-entity laser-controls="hand: right"></a-entity>
  </a-scene>
</body>
</html>
