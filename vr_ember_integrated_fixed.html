<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>🔥 Ember VR - Integrated Chat & Build</title>
    <style>
        body { margin: 0; background: #000; font-family: monospace; }
        canvas { display: block; }

        #chat-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #ff6b35;
            border-radius: 10px;
            padding: 15px;
            z-index: 100;
            display: none;
        }

        #chat-messages {
            height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
            color: #fff;
            font-size: 14px;
        }

        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }

        .user-message {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .ember-message {
            background: rgba(255, 107, 53, 0.2);
            color: #ff6b35;
        }

        #chat-input {
            width: calc(100% - 80px);
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #ff6b35;
            border-radius: 5px;
            color: #fff;
            font-family: monospace;
        }

        #chat-send {
            width: 70px;
            padding: 10px;
            background: #ff6b35;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            margin-left: 5px;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ff6b35;
            z-index: 100;
        }

        #voice-status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #4ade80;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3 style="color: #ff6b35; margin: 0 0 10px 0;">🔥 EMBER VR INTEGRATED</h3>
        <div id="status">Ready</div>
        <div style="margin-top: 10px; font-size: 11px; color: #888;">
            <strong>T</strong> - Toggle Chat | <strong>V</strong> - Voice Input<br>
            <strong>G</strong> - Connect to GTA7 | <strong>1-5</strong> - Spawn<br>
            <strong>WASD</strong> - Move | <strong>Mouse</strong> - Look
        </div>
    </div>

    <div id="voice-status">🎤 Listening...</div>

    <div id="chat-overlay">
        <div id="chat-messages"></div>
        <input id="chat-input" type="text" placeholder="Chat with Ember... (or press V for voice)">
        <button id="chat-send">Send</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';

        // ═══════════════════════════════════════════════════════════
        // SCENE SETUP
        // ═══════════════════════════════════════════════════════════

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x001122);
        scene.fog = new THREE.FogExp2(0x001122, 0.001);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        document.body.appendChild(VRButton.createButton(renderer));

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffdd, 0.8);
        sunLight.position.set(50, 50, 50);
        scene.add(sunLight);

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a2a,
            roughness: 0.8
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Ember core
        const emberGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const emberMat = new THREE.MeshStandardMaterial({
            color: 0xff6b35,
            emissive: 0xff6b35,
            emissiveIntensity: 2
        });
        const ember = new THREE.Mesh(emberGeo, emberMat);
        ember.position.set(0, 1.6, 0);
        scene.add(ember);

        const emberLight = new THREE.PointLight(0xff6b35, 2, 20);
        emberLight.position.copy(ember.position);
        scene.add(emberLight);

        // ═══════════════════════════════════════════════════════════
        // IN-VR CHAT INTERFACE (3D TEXT)
        // ═══════════════════════════════════════════════════════════

        function create3DText(text, position, color = 0xffffff) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(text, 512, 128);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const geometry = new THREE.PlaneGeometry(4, 1);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(position);

            return mesh;
        }

        const chatMessages = [];

        function addChatMessage(text, isUser = false) {
            // Add to DOM overlay
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'ember-message'}`;
            msgDiv.textContent = `${isUser ? 'You' : 'Ember'}: ${text}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Add to 3D space
            const color = isUser ? 0x4ade80 : 0xff6b35;
            const yPos = 3 - (chatMessages.length * 0.3);
            const textMesh = create3DText(
                text.substring(0, 50) + (text.length > 50 ? '...' : ''),
                new THREE.Vector3(-2, yPos, -5),
                color
            );
            scene.add(textMesh);
            chatMessages.push(textMesh);

            // Remove old messages (keep last 5)
            if (chatMessages.length > 5) {
                const old = chatMessages.shift();
                scene.remove(old);
            }

            // Make messages face camera
            textMesh.lookAt(camera.position);
        }

        // ═══════════════════════════════════════════════════════════
        // WEBSOCKET CONNECTION TO EMBER BACKEND
        // ═══════════════════════════════════════════════════════════

        let ws = null;
        let gta7Connected = false;

        function connectToEmber() {
            // Try to connect to running Ember backend (port 8081)
            // Use local IP for Quest 3 access
            const host = window.location.hostname || '10.0.0.100';
            try {
                ws = new WebSocket(`wss://${host}:8081/ws`);

                ws.onopen = () => {
                    console.log('✅ Connected to Ember backend');
                    document.getElementById('status').textContent = 'Connected to Ember 🔥';
                    addChatMessage('Connected! Ask me to create anything.', false);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'message') {
                        addChatMessage(data.content, false);
                    } else if (data.type === 'spawn') {
                        spawnObject(data.objectType, data.position || null);
                    }
                };

                ws.onerror = () => {
                    console.log('⚠️  Ember backend not available, using mock mode');
                    document.getElementById('status').textContent = 'Mock Mode (No Backend)';
                };

                ws.onclose = () => {
                    console.log('Connection closed');
                };
            } catch(e) {
                console.log('WebSocket not available:', e);
            }
        }

        function sendToEmber(message) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'chat',
                    content: message
                }));
            } else {
                // Mock response if not connected
                setTimeout(() => {
                    addChatMessage(`I hear you: "${message}". (Backend not connected)`, false);
                }, 500);
            }
        }

        // Try to connect on load
        setTimeout(connectToEmber, 1000);

        // ═══════════════════════════════════════════════════════════
        // GTA7 INTEGRATION
        // ═══════════════════════════════════════════════════════════

        function connectToGTA7() {
            const host = window.location.hostname || '10.0.0.100';
            fetch(`http://${host}:5000/api/world_state`)
                .then(res => res.json())
                .then(data => {
                    gta7Connected = true;
                    document.getElementById('status').textContent = 'Connected: Ember + GTA7 🎮';
                    addChatMessage('GTA7 world loaded! NPCs active.', false);

                    // Spawn NPCs from GTA7 world
                    if (data.npcs) {
                        data.npcs.forEach(npc => {
                            const npcMarker = new THREE.Mesh(
                                new THREE.ConeGeometry(0.3, 1, 8),
                                new THREE.MeshStandardMaterial({
                                    color: 0x00ff00,
                                    emissive: 0x00ff00,
                                    emissiveIntensity: 0.5
                                })
                            );
                            npcMarker.position.set(
                                npc.x || Math.random() * 10 - 5,
                                0.5,
                                npc.z || Math.random() * 10 - 5
                            );
                            scene.add(npcMarker);
                        });
                    }
                })
                .catch(err => {
                    console.log('GTA7 backend not running:', err);
                    addChatMessage('GTA7 backend not found. Start gta7_backend.py first.', false);
                });
        }

        // ═══════════════════════════════════════════════════════════
        // VOICE INPUT (Web Speech API)
        // ═══════════════════════════════════════════════════════════

        let recognition = null;
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('voice-status').style.display = 'none';
                addChatMessage(transcript, true);
                sendToEmber(transcript);
            };

            recognition.onerror = () => {
                document.getElementById('voice-status').style.display = 'none';
            };

            recognition.onend = () => {
                document.getElementById('voice-status').style.display = 'none';
            };
        }

        // ═══════════════════════════════════════════════════════════
        // SPAWN OBJECTS
        // ═══════════════════════════════════════════════════════════

        const objects = [];

        function spawnObject(type, position = null) {
            let geo, mat;

            switch(type) {
                case 'crystal':
                    geo = new THREE.OctahedronGeometry(0.4);
                    mat = new THREE.MeshStandardMaterial({
                        color: Math.random() * 0xffffff,
                        emissive: Math.random() * 0xffffff,
                        emissiveIntensity: 1
                    });
                    break;
                case 'sphere':
                    geo = new THREE.SphereGeometry(0.3, 32, 32);
                    mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                    break;
                case 'cube':
                    geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                    mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
                    break;
                case 'torus':
                    geo = new THREE.TorusGeometry(0.3, 0.1, 16, 32);
                    mat = new THREE.MeshStandardMaterial({
                        color: Math.random() * 0xffffff,
                        emissive: Math.random() * 0xffffff,
                        emissiveIntensity: 0.5
                    });
                    break;
                default:
                    geo = new THREE.OctahedronGeometry(0.4);
                    mat = new THREE.MeshStandardMaterial({ color: 0xff6b35 });
            }

            const mesh = new THREE.Mesh(geo, mat);

            if (position) {
                mesh.position.copy(position);
            } else {
                const direction = new THREE.Vector3(0, 0, -1);
                direction.applyQuaternion(camera.quaternion);
                mesh.position.copy(camera.position).add(direction.multiplyScalar(3));
            }

            scene.add(mesh);
            objects.push(mesh);
        }

        // ═══════════════════════════════════════════════════════════
        // CONTROLS
        // ═══════════════════════════════════════════════════════════

        const movement = { forward: 0, backward: 0, left: 0, right: 0, up: 0, down: 0 };
        let chatVisible = false;

        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 1; break;
                case 's': movement.backward = 1; break;
                case 'a': movement.left = 1; break;
                case 'd': movement.right = 1; break;
                case ' ': movement.up = 1; break;
                case 'shift': movement.down = 1; break;

                case 't': // Toggle chat
                    chatVisible = !chatVisible;
                    document.getElementById('chat-overlay').style.display = chatVisible ? 'block' : 'none';
                    if (chatVisible) document.getElementById('chat-input').focus();
                    break;

                case 'v': // Voice input
                    if (recognition) {
                        document.getElementById('voice-status').style.display = 'block';
                        recognition.start();
                    }
                    break;

                case 'g': // Connect to GTA7
                    connectToGTA7();
                    break;

                case '1': spawnObject('crystal'); break;
                case '2': spawnObject('sphere'); break;
                case '3': spawnObject('cube'); break;
                case '4': spawnObject('torus'); break;
                case '5': spawnObject('random'); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 0; break;
                case 's': movement.backward = 0; break;
                case 'a': movement.left = 0; break;
                case 'd': movement.right = 0; break;
                case ' ': movement.up = 0; break;
                case 'shift': movement.down = 0; break;
            }
        });

        // Chat input handling
        document.getElementById('chat-send').addEventListener('click', () => {
            const input = document.getElementById('chat-input');
            if (input.value.trim()) {
                addChatMessage(input.value, true);
                sendToEmber(input.value);
                input.value = '';
            }
        });

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('chat-send').click();
            }
        });

        // Mouse control
        let mouseX = 0, mouseY = 0;
        let isPointerLocked = false;

        document.addEventListener('click', (e) => {
            if (!chatVisible && !renderer.xr.isPresenting) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === document.body;
        });

        document.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                mouseX += e.movementX * 0.002;
                mouseY += e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            }
        });

        // ═══════════════════════════════════════════════════════════
        // ANIMATION LOOP
        // ═══════════════════════════════════════════════════════════

        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Ember pulse
            ember.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
            ember.rotation.y += delta * 0.5;
            emberLight.intensity = 2 + Math.sin(time * 2) * 0.5;

            // Rotate objects
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.01;
            });

            // Make chat messages face camera
            chatMessages.forEach(msg => {
                msg.lookAt(camera.position);
            });

            // Desktop movement
            if (!renderer.xr.isPresenting) {
                const speed = 0.2;
                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);

                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);

                camera.position.addScaledVector(forward, (movement.forward - movement.backward) * speed);
                camera.position.addScaledVector(right, (movement.right - movement.left) * speed);
                camera.position.y += (movement.up - movement.down) * speed;

                camera.rotation.order = 'YXZ';
                camera.rotation.y = -mouseX;
                camera.rotation.x = -mouseY;
            }

            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🔥 Ember VR Integrated initialized!');
    </script>
</body>
</html>
