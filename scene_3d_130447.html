<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene - Rotating Cubes and Spheres</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1e 100%);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;
        
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const focalLength = 400;
        
        // 3D to 2D projection
        function project3D(x, y, z) {
            const scale = focalLength / (focalLength + z);
            const x2d = centerX + x * scale;
            const y2d = centerY + y * scale;
            return { x: x2d, y: y2d, scale: scale };
        }
        
        // Rotate point around axis
        function rotateX(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x,
                y: point.y * cos - point.z * sin,
                z: point.y * sin + point.z * cos
            };
        }
        
        function rotateY(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos + point.z * sin,
                y: point.y,
                z: -point.x * sin + point.z * cos
            };
        }
        
        function rotateZ(point, angle) {
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return {
                x: point.x * cos - point.y * sin,
                y: point.x * sin + point.y * cos,
                z: point.z
            };
        }
        
        // Cube vertices
        function getCubeVertices(size) {
            const s = size / 2;
            return [
                { x: -s, y: -s, z: -s },
                { x: s, y: -s, z: -s },
                { x: s, y: s, z: -s },
                { x: -s, y: s, z: -s },
                { x: -s, y: -s, z: s },
                { x: s, y: -s, z: s },
                { x: s, y: s, z: s },
                { x: -s, y: s, z: s }
            ];
        }
        
        // Cube edges
        const cubeEdges = [
            [0, 1], [1, 2], [2, 3], [3, 0], // front face
            [4, 5], [5, 6], [6, 7], [7, 4], // back face
            [0, 4], [1, 5], [2, 6], [3, 7]  // connecting edges
        ];
        
        // Draw cube
        function drawCube(x, y, z, size, rotX, rotY, rotZ, color) {
            const vertices = getCubeVertices(size);
            const projected = [];
            
            // Transform and project vertices
            for (let vertex of vertices) {
                let point = { x: vertex.x + x, y: vertex.y + y, z: vertex.z + z };
                point = rotateX(point, rotX);
                point = rotateY(point, rotY);
                point = rotateZ(point, rotZ);
                projected.push(project3D(point.x, point.y, point.z));
            }
            
            // Draw edges
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            
            for (let edge of cubeEdges) {
                const p1 = projected[edge[0]];
                const p2 = projected[edge[1]];
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
        
        // Draw sphere
        function drawSphere(x, y, z, radius, color) {
            const projection = project3D(x, y, z);
            const projectedRadius = radius * projection.scale;
            
            // Create gradient for 3D effect
            const gradient = ctx.createRadialGradient(
                projection.x - projectedRadius * 0.3,
                projection.y - projectedRadius * 0.3,
                0,
                projection.x,
                projection.y,
                projectedRadius
            );
            
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.7, adjustBrightness(color, -30));
            gradient.addColorStop(1, adjustBrightness(color, -60));
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(projection.x, projection.y, projectedRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Add rim lighting
            ctx.strokeStyle = adjustBrightness(color, 40);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(projection.x, projection.y, projectedRadius, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Adjust color brightness
        function adjustBrightness(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const r = Math.min(255, Math.max(0, (num >> 16) + amount));
            const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
            const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }
        
        // Scene objects
        const objects = [
            { type: 'cube', x: -150, y: 0, z: 0, size: 80, color: '#ff6b6b', rotSpeed: { x: 0.01, y: 0.02, z: 0.005 } },
            { type: 'sphere', x: 150, y: 0, z: 0, radius: 50, color: '#4ecdc4' },
            { type: 'cube', x: 0, y: -100, z: 100, size: 60, color: '#ffe66d', rotSpeed: { x: 0.02, y: 0.01, z: 0.01 } },
            { type: 'sphere', x: 0, y: 100, z: -50, radius: 40, color: '#a8e6cf' },
            { type: 'cube', x: -100, y: 100, z: 50, size: 50, color: '#ff8b94', rotSpeed: { x: 0.015, y: 0.015, z: 0.02 } },
            { type: 'sphere', x: 100, y: -100, z: -100, radius: 35, color: '#c7ceea' }
        ];
        
        // Initialize rotations
        objects.forEach(obj => {
            if (obj.type === 'cube') {
                obj.rotation = { x: 0, y: 0, z: 0 };
            }
        });
        
        let time = 0;
        
        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Sort objects by z-depth for proper rendering order
            const sortedObjects = [...objects].sort((a, b) => {
                const aZ = a.z + Math.sin(time * 0.001) * 50;
                const bZ = b.z + Math.sin(time * 0.001 + Math.PI) * 50;
                return bZ - aZ;
            });
            
            // Draw objects
            for (let obj of sortedObjects) {
                // Add some floating motion
                const floatY = Math.sin(time * 0.002 + obj.x) * 20;
                const floatZ = Math.cos(time * 0.002 + obj.y) * 30;
                
                if (obj.type === 'cube') {
                    // Update rotation
                    obj.rotation.x += obj.rotSpeed.x;
                    obj.rotation.y += obj.rotSpeed.y;
                    obj.rotation.z += obj.rotSpeed.z;
                    
                    drawCube(
                        obj.x,
                        obj.y + floatY,
                        obj.z + floatZ,
                        obj.size,
                        obj.rotation.x,
                        obj.rotation.y,
                        obj.rotation.z,
                        obj.color
                    );
                } else if (obj.type === 'sphere') {
                    drawSphere(
                        obj.x,
                        obj.y + floatY,
                        obj.z + floatZ,
                        obj.radius,
                        obj.color
                    );
                }
            }
            
            // Draw some stars in the background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (let i = 0; i < 50; i++) {
                const x = (i * 137.5 + time * 0.1) % canvas.width;
                const y = (i * 89.7) % canvas.height;
                const size = Math.sin(time * 0.01 + i) * 0.5 + 1.5;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            time++;
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = 800;
            canvas.height = 600;
        });
    </script>
</body>
</html>
