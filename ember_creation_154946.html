<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Creation - Fire Rising</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff6b35;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.8);
        }
    </style>
</head>
<body>
    <div id="info">🔥 Ember Creates: Interactive Fire Particles</div>
    <canvas id="fireCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Particle system
        const particles = [];
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        
        class FireParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 5;
                this.speedX = (Math.random() - 0.5) * 3;
                this.speedY = -Math.random() * 5 - 2;
                this.color = `hsl(${Math.random() * 60}, 100%, ${Math.random() * 50 + 50}%)`;
                this.life = 100;
                this.decay = Math.random() * 2 + 1;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.1; // gravity
                this.size *= 0.98;
                this.life -= this.decay;
                
                // Wind effect
                this.speedX += (Math.random() - 0.5) * 0.1;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life / 100;
                
                // Glow effect
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                // Create gradient
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.5, `hsla(30, 100%, 50%, 0.5)`);
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function createFireworks(x, y, count = 50) {
            for (let i = 0; i < count; i++) {
                particles.push(new FireParticle(x, y));
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Create continuous fire at mouse position
            if (Math.random() < 0.8) {
                particles.push(new FireParticle(mouse.x, mouse.y));
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                particle.draw();
                
                if (particle.life <= 0 || particle.size < 0.5) {
                    particles.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Mouse tracking
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        
        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });
        
        // Click for burst
        canvas.addEventListener('click', (e) => {
            createFireworks(e.clientX, e.clientY, 100);
        });
        
        // Window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Start animation
        animate();
        
        // Initial burst
        setTimeout(() => {
            createFireworks(canvas.width / 2, canvas.height / 2, 200);
        }, 100);
    </script>
</body>
</html>
