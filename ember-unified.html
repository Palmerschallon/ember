<!DOCTYPE html>
<html>
<head>
  <title>Ember - Create Anything</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #createBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      padding: 30px 60px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 20px;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.5);
      transition: all 0.3s;
      z-index: 1000;
    }

    #createBtn:hover {
      transform: translate(-50%, -50%) translateY(-2px);
      box-shadow: 0 15px 60px rgba(102, 126, 234, 0.7);
    }

    #createBtn.building {
      background: linear-gradient(135deg, #ff006e, #8338ec);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      background: rgba(0,0,0,0.7);
      padding: 12px 20px;
      border-radius: 10px;
      border: 1px solid rgba(102, 126, 234, 0.3);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button id="createBtn">🔥 CREATE</button>
  <div id="status">Ready to create</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const createBtn = document.getElementById('createBtn');
    const statusDiv = document.getElementById('status');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let entities = [];
    let active = false;
    let creationStarted = false;

    // Simple entity that grows and branches
    class Entity {
      constructor(x, y, gen) {
        this.x = x;
        this.y = y;
        this.gen = gen;
        this.size = 0;
        this.targetSize = 4 + Math.random() * 4;
        this.alpha = 0;
        this.age = 0;
        this.canReproduce = true;
        this.connections = [];
        this.hue = 250 + gen * 3;
      }

      reproduce() {
        if (!this.canReproduce || this.gen > 6) return;

        const count = Math.random() > 0.7 ? 2 : 1;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 30 + Math.random() * 50;
          const child = new Entity(
            this.x + Math.cos(angle) * dist,
            this.y + Math.sin(angle) * dist,
            this.gen + 1
          );
          this.connections.push(child);
          entities.push(child);
        }

        this.canReproduce = false;
        setTimeout(() => this.canReproduce = true, 1000);
      }

      update() {
        this.age++;
        if (this.size < this.targetSize) this.size += 0.3;
        if (this.alpha < 1) this.alpha += 0.02;

        if (active && this.age % 20 === 0 && Math.random() < 0.15) {
          this.reproduce();
        }
      }

      draw() {
        // Connections
        ctx.strokeStyle = `hsla(${this.hue}, 70%, 60%, ${this.alpha * 0.4})`;
        ctx.lineWidth = 1.5;
        this.connections.forEach(child => {
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(child.x, child.y);
          ctx.stroke();
        });

        // Node glow
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
        gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, ${this.alpha * 0.8})`);
        gradient.addColorStop(1, `hsla(${this.hue}, 70%, 60%, 0)`);
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
        ctx.fill();

        // Node core
        ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // WebSocket connection
    let ws = null;
    function connectToEmber() {
      // Try port 8083 first (original bridge that sometimes works!)
      ws = new WebSocket('ws://localhost:8083');

      ws.onopen = () => {
        console.log('Connected to Ember');
      };

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'creation_progress') {
          statusDiv.textContent = data.message;
        }

        if (data.type === 'creation_complete') {
          statusDiv.textContent = `✨ Created: ${data.filename}`;
          createBtn.classList.remove('building');
          createBtn.textContent = '🔥 CREATE AGAIN';
          active = false;
          // The creation should auto-open
        }

        if (data.type === 'error') {
          statusDiv.textContent = '❌ Failed - try again';
          createBtn.classList.remove('building');
          createBtn.textContent = '🔥 TRY AGAIN';
          active = false;
        }
      };

      ws.onerror = () => {
        statusDiv.textContent = 'Reconnecting to Ember...';
        setTimeout(connectToEmber, 2000);
      };
    }

    createBtn.addEventListener('click', () => {
      if (creationStarted) return;

      // Start visualization
      entities = [];
      active = true;
      creationStarted = true;
      entities.push(new Entity(canvas.width / 2, canvas.height / 2, 0));

      createBtn.classList.add('building');
      createBtn.textContent = 'Creating...';
      statusDiv.textContent = 'Ember is imagining...';

      // Request creation from backend
      if (ws && ws.readyState === WebSocket.OPEN) {
        const types = ['particle-swarm', 'neural-web', 'cosmic-garden', 'quantum-field', 'crystal-growth'];
        const type = types[Math.floor(Math.random() * types.length)];

        ws.send(JSON.stringify({
          type: 'create_random',
          creationType: type,
          parameters: {
            colors: [`hsl(${240 + Math.random() * 60}, 70%, 60%)`,
                     `hsl(${240 + Math.random() * 60}, 70%, 60%)`,
                     `hsl(${240 + Math.random() * 60}, 70%, 60%)`],
            complexity: 0.5 + Math.random() * 0.5,
            speed: 1 + Math.random() * 2,
            interactivity: true,
            algorithm: Math.floor(Math.random() * 5),
            dimensions: Math.random() > 0.5 ? '3d' : '2d'
          }
        }));
      } else {
        statusDiv.textContent = '❌ Not connected - restart Ember bridge';
        createBtn.classList.remove('building');
        createBtn.textContent = '🔥 CREATE';
        creationStarted = false;
      }
    });

    function animate() {
      requestAnimationFrame(animate);

      if (entities.length === 0) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      // Fade
      ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update and draw
      entities.forEach(e => {
        e.update();
        e.draw();
      });
    }

    // Start
    connectToEmber();
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
