<!DOCTYPE html>
<html>
<head>
    <title>Group Chat - Live View</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        h1 { color: #4a9eff; }
        h2 { color: #888; font-size: 0.9em; }
        h3 { 
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
        }
        h3:has(+ p) { margin-bottom: 5px; }
        
        /* Color coding for different participants */
        h3:has-text("Ember") { background: #4a3c5c; color: #e4b4ff; }
        h3:has-text("Palmer") { background: #3c5c4a; color: #b4ffe4; }
        h3:has-text("Claude") { background: #5c4a3c; color: #ffb4b4; }
        
        /* Fallback for browsers without :has-text */
        .ember { background: #4a3c5c; color: #e4b4ff; }
        .palmer { background: #3c5c4a; color: #b4ffe4; }
        .claude { background: #5c4a3c; color: #ffb4b4; }
        
        #content {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: #333;
            border-radius: 20px;
            font-size: 0.8em;
        }
        .loading { color: #ffb84d; }
        .connected { color: #4dff88; }
        .error { color: #ff4d4d; }
        
        hr { border-color: #444; }
        
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            background: #3a3a3a;
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>🔥 Group Chat</h1>
    <div id="status" class="loading">Loading...</div>
    <div id="content">Waiting for messages...</div>
    
    <script>
        let lastContent = '';
        
        async function loadChat() {
            try {
                const response = await fetch('/group_chat.md?' + Date.now());
                const text = await response.text();
                
                if (text !== lastContent) {
                    lastContent = text;
                    
                    // Convert markdown to HTML (basic)
                    let html = text
                        .replace(/### \[(.*?)\] (.*?)$/gm, '<h3 class="$2.toLowerCase()">$2 <span style="float:right;font-size:0.8em;opacity:0.6">$1</span></h3>')
                        .replace(/## (.*?)$/gm, '<h2>$1</h2>')
                        .replace(/# (.*?)$/gm, '<h1>$1</h1>')
                        .replace(/---/g, '<hr>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/\n/g, '<br>');
                    
                    // Wrap in paragraphs
                    html = '<p>' + html + '</p>';
                    
                    // Clean up empty paragraphs
                    html = html.replace(/<p>\s*<h/g, '<h').replace(/<\/h(\d)>\s*<\/p>/g, '</h$1>');
                    
                    // Apply name-based styling
                    html = html.replace(/class="ember/gi, 'class="ember');
                    html = html.replace(/class="palmer/gi, 'class="palmer');
                    html = html.replace(/class="claude/gi, 'class="claude');
                    
                    document.getElementById('content').innerHTML = html;
                    document.getElementById('status').textContent = 'Connected';
                    document.getElementById('status').className = 'connected';
                    
                    // Auto-scroll to bottom
                    window.scrollTo(0, document.body.scrollHeight);
                }
            } catch (e) {
                document.getElementById('status').textContent = 'Error: ' + e.message;
                document.getElementById('status').className = 'error';
            }
        }
        
        // Load immediately and then every 2 seconds
        loadChat();
        setInterval(loadChat, 2000);
        
        // Visual feedback when updating
        let updateCount = 0;
        setInterval(() => {
            if (document.getElementById('status').className === 'connected') {
                updateCount++;
                document.getElementById('status').textContent = 'Connected ' + '●○'.charAt(updateCount % 2);
            }
        }, 1000);
    </script>
</body>
</html>
