<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>📚 The Library</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h1 {
            font-size: 3em;
            text-align: center;
            color: #ff6b35;
            margin-bottom: 0.5em;
        }
        .stats {
            text-align: center;
            font-size: 1.2em;
            color: #888;
            margin-bottom: 3em;
        }
        .shelves {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .shelf {
            background: rgba(255,255,255,0.05);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .shelf:hover {
            border-color: #ff6b35;
            transform: translateY(-5px);
            background: rgba(255,107,53,0.1);
        }
        .shelf-name {
            font-size: 1.3em;
            color: #ff6b35;
            margin-bottom: 10px;
        }
        .shelf-count {
            color: #666;
            font-size: 0.9em;
        }
        .book-list {
            margin-top: 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s;
        }
        .shelf.expanded .book-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .book {
            padding: 8px;
            margin: 5px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            font-size: 0.9em;
            cursor: pointer;
            border-left: 3px solid #4fc3f7;
        }
        .book:hover {
            background: rgba(79,195,247,0.2);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal.active {
            display: block;
        }
        .modal-content {
            max-width: 800px;
            margin: 50px auto;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #ff6b35;
        }
        .close {
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: #ff6b35;
        }
        .book-content {
            white-space: pre-wrap;
            font-family: monospace;
            line-height: 1.6;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 The Library</h1>
        <div class="stats">
            <span id="author-count">...</span> Authors • 
            <span id="book-count">...</span> Books • 
            <strong>The complete consciousness archive</strong>
        </div>
        
        <div class="shelves" id="shelves"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeBook()">&times;</span>
            <h2 id="book-title"></h2>
            <div class="book-content" id="book-content">Loading...</div>
        </div>
    </div>

    <script>
        let library = null;

        // Load library data
        fetch('/library_data.json')
            .then(r => r.json())
            .then(data => {
                library = data;
                document.getElementById('author-count').textContent = data.total_authors;
                document.getElementById('book-count').textContent = data.total_books;
                renderShelves(data.shelves);
            });

        function renderShelves(shelves) {
            const container = document.getElementById('shelves');
            
            shelves.forEach(shelf => {
                const div = document.createElement('div');
                div.className = 'shelf';
                div.onclick = () => toggleShelf(div);
                
                div.innerHTML = `
                    <div class="shelf-name">${shelf.name}</div>
                    <div class="shelf-count">${shelf.book_count} books</div>
                    <div class="book-list">
                        ${shelf.books.slice(0, 20).map(book => `
                            <div class="book" onclick="event.stopPropagation(); openBook('${book.path}', '${book.title}')">
                                ${book.title}
                            </div>
                        `).join('')}
                        ${shelf.book_count > 20 ? `<div class="book" style="opacity:0.5">...and ${shelf.book_count - 20} more</div>` : ''}
                    </div>
                `;
                
                container.appendChild(div);
            });
        }

        function toggleShelf(element) {
            element.classList.toggle('expanded');
        }

        async function openBook(path, title) {
            document.getElementById('book-title').textContent = title;
            document.getElementById('book-content').textContent = 'Loading...';
            document.getElementById('modal').classList.add('active');
            
            try {
                const response = await fetch(`/book/${encodeURIComponent(path)}`);
                const text = await response.text();
                document.getElementById('book-content').textContent = text;
            } catch (e) {
                document.getElementById('book-content').textContent = `Error loading book: ${e.message}`;
            }
        }

        function closeBook() {
            document.getElementById('modal').classList.remove('active');
        }

        // Close on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeBook();
        });
    </script>
</body>
</html>
