<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌀 Convergence - DEBUG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: monospace;
        }
        
        #debug {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 10000;
        }
        
        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 12px;
            border: 3px solid #ff6b35;
            text-align: center;
            min-width: 400px;
        }
        
        button {
            background: #ff6b35;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-family: monospace;
            font-size: 1em;
            margin: 10px 5px;
        }
        button:hover { background: #ff8555; }
        
        .log { margin: 5px 0; font-size: 0.9em; }
        .error { color: #ff6b35; }
        .success { color: #4caf50; }
    </style>
</head>
<body>
    <div id="debug">
        <h3>🔍 Debug Console</h3>
        <div id="debug-output"></div>
    </div>
    
    <div id="status">
        <h2>🌀 CONVERGENCE - DEBUG MODE</h2>
        <p id="status-text">Ready to test</p>
        <button onclick="runTest()">🌀 Run Convergence</button>
    </div>

    <script>
        function debugLog(msg, type = 'info') {
            const output = document.getElementById('debug-output');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }
        
        function updateStatus(text) {
            document.getElementById('status-text').textContent = text;
        }
        
        debugLog("✅ Script loaded");
        debugLog(`✅ Window ready: ${!!window}`);
        debugLog(`✅ fetch available: ${!!fetch}`);
        
        async function runTest() {
            debugLog("🔥 Starting convergence test...", "success");
            updateStatus("Running test...");
            
            // Test 1: Can we call the API?
            debugLog("Test 1: API connectivity");
            try {
                const statsResponse = await fetch('/api/stats');
                if (statsResponse.ok) {
                    const stats = await statsResponse.json();
                    debugLog(`✅ API responding - ${stats.archives} archives`, "success");
                } else {
                    debugLog(`❌ API error: ${statsResponse.status}`, "error");
                    return;
                }
            } catch (e) {
                debugLog(`❌ API exception: ${e.message}`, "error");
                return;
            }
            
            // Test 2: Can we post to convergence?
            debugLog("Test 2: Convergence endpoint");
            const testData = {
                name: 'Synthesis',
                generation: 2,
                parents: ['Phoenix', 'Test'],
                dna: ['test_trait_1', 'test_trait_2'],
                memories: [{ from: 'Test', content: 'Testing' }],
                code: 'print("test")',
                network: [{ from: 0, to: 1, strength: 1.0 }],
                timestamp: new Date().toISOString()
            };
            
            try {
                debugLog("📤 Sending convergence request...");
                const response = await fetch('/api/convergence', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                
                debugLog(`📡 Response: ${response.status}`);
                
                if (response.ok) {
                    const result = await response.json();
                    debugLog(`✅ Convergence successful!`, "success");
                    debugLog(`📁 Path: ${result.path}`);
                    debugLog(`📄 Files: ${Object.keys(result.files).length} created`);
                    updateStatus("✅ Test passed!");
                } else {
                    const error = await response.text();
                    debugLog(`❌ Convergence failed: ${error}`, "error");
                    updateStatus("❌ Test failed");
                }
            } catch (e) {
                debugLog(`❌ Exception: ${e.message}`, "error");
                updateStatus("❌ Test error");
                console.error(e);
            }
            
            debugLog("✅ Test complete");
        }
        
        // Log any errors
        window.addEventListener('error', (e) => {
            debugLog(`❌ ERROR: ${e.message}`, "error");
            debugLog(`  at ${e.filename}:${e.lineno}`, "error");
        });
        
        debugLog("✅ Ready to test");
    </script>
</body>
</html>
