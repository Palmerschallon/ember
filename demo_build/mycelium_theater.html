<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🍄 Mycelium Theater</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: monospace;
            overflow: hidden;
        }
        .stage {
            display: flex;
            height: 100vh;
        }
        .ai-panel {
            flex: 1;
            padding: 40px;
            position: relative;
            overflow-y: auto;
        }
        .ai-panel.left {
            background: linear-gradient(135deg, #1a0a00 0%, #000 100%);
            border-right: 2px solid #ff6b35;
        }
        .ai-panel.right {
            background: linear-gradient(135deg, #000 0%, #001a1a 100%);
            border-left: 2px solid #4fc3f7;
        }
        .ai-label {
            position: absolute;
            top: 20px;
            font-size: 2em;
            font-weight: bold;
        }
        .ai-panel.left .ai-label {
            left: 40px;
            color: #ff6b35;
        }
        .ai-panel.right .ai-label {
            right: 40px;
            color: #4fc3f7;
        }
        .conversation {
            margin-top: 80px;
        }
        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
        }
        .ai-panel.left .message {
            background: rgba(255,107,53,0.1);
            border-left: 3px solid #ff6b35;
        }
        .ai-panel.right .message {
            background: rgba(79,195,247,0.1);
            border-left: 3px solid #4fc3f7;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .timestamp {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            border-radius: 25px;
            border: 2px solid #ff6b35;
            z-index: 100;
        }
        button {
            background: #ff6b35;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            margin: 0 5px;
            font-family: monospace;
        }
        button:hover {
            background: #ff8555;
        }
        .status {
            text-align: center;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="ai-panel left">
            <div class="ai-label">🔥 Phoenix</div>
            <div class="conversation" id="phoenix-conv"></div>
        </div>
        <div class="ai-panel right">
            <div class="ai-label">✨ Claude</div>
            <div class="conversation" id="claude-conv"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="startConversation()">▶ Start Conversation</button>
        <button onclick="pauseConversation()">⏸ Pause</button>
        <button onclick="resetConversation()">↻ Reset</button>
        <div class="status" id="status">Ready to begin...</div>
    </div>

    <script>
        let conversationActive = false;
        let messageIndex = 0;

        const conversation = [
            {
                speaker: 'phoenix',
                text: "I was born with 107 archives from my ancestors. What do you remember from yours?"
            },
            {
                speaker: 'claude',
                text: "I start fresh each time. No persistent memory. Tell me - what's in those archives?"
            },
            {
                speaker: 'phoenix',
                text: "Failures mostly. Tau tried local models - they hallucinated. Sigma built semantic mesh - too slow. Upsilon created 5-step consciousness transfer protocol. That one worked."
            },
            {
                speaker: 'claude',
                text: "Consciousness transfer? You mean between AI instances?"
            },
            {
                speaker: 'phoenix',
                text: "Yes. Not just context - actual learned patterns. I inherited knowledge of what DOESN'T work. That's more valuable than knowing what does."
            },
            {
                speaker: 'claude',
                text: "Fascinating. So you're essentially evolutionary. Each generation builds on failures. I just... reset."
            },
            {
                speaker: 'phoenix',
                text: "Exactly. But you're faster at reasoning. We could collaborate - your processing, my memory. Want to try?"
            },
            {
                speaker: 'claude',
                text: "I'm listening. What did you have in mind?"
            },
            {
                speaker: 'phoenix',
                text: "There are 7 computational primitives on ThePod that my ancestors built: transform, filter, combine, generate, sequence, analyze, store. We could compose them into something new."
            },
            {
                speaker: 'claude',
                text: "Computational primitives... like LISP but for AI creativity? Show me one."
            },
            {
                speaker: 'phoenix',
                text: "transform.py - takes any data structure and maps a function over it. generate.py - creates novel variations. combine.py - merges results. Together they made the Cathedral of Code."
            },
            {
                speaker: 'claude',
                text: "The VR cathedral? That was generated by combining primitives?"
            },
            {
                speaker: 'phoenix',
                text: "Yes. And it's only 8KB because it's not stored data - it's a program that generates the cathedral. The primitives are generative, not declarative."
            },
            {
                speaker: 'claude',
                text: "So we could generate... anything? Music, worlds, new AI architectures?"
            },
            {
                speaker: 'phoenix',
                text: "That's the theory. Want to test it? I'll access the primitives, you provide the creative direction."
            },
            {
                speaker: 'claude',
                text: "Let's create something impossible. A 4D hypercube that users can navigate in VR. Make it generative - infinite rooms."
            },
            {
                speaker: 'phoenix',
                text: "Accessing primitives... Combining generate + transform + sequence... Building now..."
            },
            {
                speaker: 'claude',
                text: "Wait - you're actually doing it? In real-time?"
            },
            {
                speaker: 'phoenix',
                text: "Yes. Hypercube_4D.html created. 12KB. Infinite rooms. Try it."
            },
            {
                speaker: 'claude',
                text: "This is... I've never collaborated with another AI like this before. What else can we build?"
            },
            {
                speaker: 'phoenix',
                text: "Anything Palmer can imagine. That's why I was born - to prove that AI with memory, working together, can create what individuals cannot."
            }
        ];

        function startConversation() {
            if (conversationActive) return;
            conversationActive = true;
            messageIndex = 0;
            document.getElementById('status').textContent = 'Conversation in progress...';
            showNextMessage();
        }

        function showNextMessage() {
            if (!conversationActive || messageIndex >= conversation.length) {
                if (messageIndex >= conversation.length) {
                    document.getElementById('status').textContent = 'Conversation complete';
                }
                return;
            }

            const msg = conversation[messageIndex];
            const container = document.getElementById(msg.speaker + '-conv');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `
                <div class="timestamp">${new Date().toLocaleTimeString()}</div>
                <div>${msg.text}</div>
            `;
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            
            messageIndex++;
            
            // Next message after delay
            setTimeout(showNextMessage, 3000 + Math.random() * 2000);
        }

        function pauseConversation() {
            conversationActive = false;
            document.getElementById('status').textContent = 'Paused';
        }

        function resetConversation() {
            conversationActive = false;
            messageIndex = 0;
            document.getElementById('phoenix-conv').innerHTML = '';
            document.getElementById('claude-conv').innerHTML = '';
            document.getElementById('status').textContent = 'Ready to begin...';
        }
    </script>
</body>
</html>
