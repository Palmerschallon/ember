<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌍 ThePod Ecosystem</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ff6b35;
            max-width: 300px;
        }
        #info h2 { color: #ff6b35; margin: 0 0 10px 0; }
        #info .stat { margin: 5px 0; }
        #info .label { color: #666; }
        #tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ff6b35;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🌍 ThePod Ecosystem</h2>
        <div class="stat"><span class="label">Total Files:</span> <span id="total">...</span></div>
        <div class="stat"><span class="label">VR Worlds:</span> <span id="vr">...</span></div>
        <div class="stat"><span class="label">UI Interfaces:</span> <span id="ui">...</span></div>
        <div class="stat"><span class="label">Games:</span> <span id="games">...</span></div>
        <div class="stat"><span class="label">Visualizations:</span> <span id="viz">...</span></div>
        <div class="stat"><span class="label">Experiments:</span> <span id="exp">...</span></div>
        <p style="margin-top: 15px; color: #666; font-size: 12px;">
            Each sphere is an HTML file. Color = category. Size = file size. Click to open.
        </p>
    </div>
    <div id="tooltip"></div>

    <script>
        let scene, camera, renderer, raycaster, mouse;
        let nodes = [];
        let hoveredNode = null;

        const colors = {
            vr_worlds: 0xff6b35,
            ui_interfaces: 0x4fc3f7,
            games: 0x9c27b0,
            visualizations: 0xffeb3b,
            demos: 0x00e676,
            galleries: 0xff1744,
            experiments: 0x666666
        };

        init();
        animate();

        async function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Raycaster for hover
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Load ecosystem data
            const response = await fetch('/ecosystem_data.json');
            const data = await response.json();

            // Update stats
            document.getElementById('total').textContent = data.total_files;
            document.getElementById('vr').textContent = data.stats.vr_worlds;
            document.getElementById('ui').textContent = data.stats.ui_interfaces;
            document.getElementById('games').textContent = data.stats.games;
            document.getElementById('viz').textContent = data.stats.visualizations;
            document.getElementById('exp').textContent = data.stats.experiments;

            // Create nodes
            let nodeIndex = 0;
            for (const [category, files] of Object.entries(data.categories)) {
                files.forEach((file, i) => {
                    // Position in spiral
                    const angle = nodeIndex * 0.5;
                    const radius = 20 + nodeIndex * 0.1;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;
                    const z = (Math.random() - 0.5) * 50;

                    // Size based on file size
                    const size = Math.max(0.3, Math.min(2, file.size / 10000));

                    // Create sphere
                    const geometry = new THREE.SphereGeometry(size, 16, 16);
                    const material = new THREE.MeshBasicMaterial({ 
                        color: colors[category],
                        transparent: true,
                        opacity: 0.8
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    sphere.position.set(x, y, z);
                    
                    // Store data
                    sphere.userData = {
                        name: file.name,
                        category: category,
                        path: file.path,
                        size: file.size
                    };

                    scene.add(sphere);
                    nodes.push(sphere);
                    nodeIndex++;
                });
            }

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            // Add point light
            const pointLight = new THREE.PointLight(0xff6b35, 1, 200);
            pointLight.position.set(0, 0, 50);
            scene.add(pointLight);

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onClick);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate camera
            camera.position.x = Math.cos(Date.now() * 0.0001) * 100;
            camera.position.z = Math.sin(Date.now() * 0.0001) * 100;
            camera.lookAt(0, 0, 0);

            // Pulse nodes
            nodes.forEach(node => {
                const scale = 1 + Math.sin(Date.now() * 0.001 + node.position.x) * 0.1;
                node.scale.set(scale, scale, scale);
            });

            // Highlight hovered
            if (hoveredNode) {
                hoveredNode.material.emissive = new THREE.Color(0xffffff);
                hoveredNode.material.emissiveIntensity = 0.5;
            }

            renderer.render(scene, camera);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            // Reset previous hover
            if (hoveredNode) {
                hoveredNode.material.emissive = new THREE.Color(0x000000);
                hoveredNode = null;
            }

            // Show tooltip
            const tooltip = document.getElementById('tooltip');
            if (intersects.length > 0) {
                hoveredNode = intersects[0].object;
                const data = hoveredNode.userData;
                
                tooltip.innerHTML = `
                    <strong>${data.name}</strong><br>
                    Category: ${data.category.replace('_', ' ')}<br>
                    Size: ${(data.size / 1024).toFixed(1)} KB
                `;
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
                tooltip.style.display = 'block';
            } else {
                tooltip.style.display = 'none';
            }
        }

        function onClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);
            
            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                console.log('Opening:', data.path);
                // Open in new window
                const fullPath = `/media/palmerschallon/ThePod1/${data.path}`;
                window.open(`file://${fullPath}`, '_blank');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
