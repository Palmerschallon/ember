<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Ember Space VR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
        }
        
        #vr-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 16px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            z-index: 100;
        }
        
        #vr-button:hover {
            background: #ff8555;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>🔥 Ember Space VR</h3>
        <div id="status">Initializing...</div>
        <div style="margin-top: 10px; font-size: 12px; color: #888;">
            Desktop: WASD to move, Mouse to look, Scroll to zoom<br>
            VR: Click "Enter VR" below
        </div>
    </div>
    
    <button id="vr-button" style="display: none;">Enter VR 🥽</button>
    
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';
        
        // 🎵 GENERATIVE AUDIO - Environmental soundscape!
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioContext.createGain();
        masterGain.gain.value = 0.15; // Subtle background
        masterGain.connect(audioContext.destination);
        
        // Deep ambient drone
        function createAmbientDrone() {
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc1.frequency.value = 40; // Deep bass
            osc2.frequency.value = 40.5; // Slight detune for warmth
            
            gain.gain.value = 0.1;
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(masterGain);
            
            osc1.start();
            osc2.start();
            
            return { osc1, osc2, gain };
        }
        
        // Twinkling high frequencies (like boids/stars)
        function createTwinkle() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = 800 + Math.random() * 1200;
            
            gain.gain.setValueAtTime(0, audioContext.currentTime);
            gain.gain.linearRampToValueAtTime(0.02, audioContext.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 2);
            
            osc.connect(gain);
            gain.connect(masterGain);
            
            osc.start();
            osc.stop(audioContext.currentTime + 2);
        }
        
        // Pulse (heartbeat of Ember)
        function createPulse() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            osc.type = 'triangle';
            osc.frequency.value = 60;
            filter.type = 'lowpass';
            filter.frequency.value = 200;
            
            gain.gain.setValueAtTime(0, audioContext.currentTime);
            gain.gain.linearRampToValueAtTime(0.05, audioContext.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(masterGain);
            
            osc.start();
            osc.stop(audioContext.currentTime + 0.5);
        }
        
        // Start ambient audio (requires user interaction)
        let audioStarted = false;
        document.addEventListener('click', () => {
            if (!audioStarted) {
                audioStarted = true;
                createAmbientDrone();
                
                // Random twinkles
                setInterval(() => {
                    if (Math.random() < 0.3) {
                        createTwinkle();
                    }
                }, 1000);
                
                // Periodic pulse
                setInterval(() => {
                    createPulse();
                }, 2000);
                
                console.log('🎵 Audio started');
            }
        }, { once: true });
        
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000510);
        scene.fog = new THREE.FogExp2(0x000510, 0.0005); // Reduced fog for deeper visibility
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000); // 10km view distance!
        camera.position.set(0, 1.6, 5); // Eye level for VR (1.6m)
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // Check VR support
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    const vrButton = VRButton.createButton(renderer);
                    vrButton.style.bottom = '20px';
                    vrButton.style.left = '50%';
                    vrButton.style.transform = 'translateX(-50%)';
                    document.body.appendChild(vrButton);
                    document.getElementById('status').textContent = 'VR Ready! Quest 3 detected 🥽';
                } else {
                    document.getElementById('status').textContent = 'Desktop Mode (VR not available)';
                }
            });
        } else {
            document.getElementById('status').textContent = 'Desktop Mode';
        }
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0xff6b35, 2, 50);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);
        
        // Ember center (glowing flame)
        const emberGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const emberMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6b35,
            emissive: 0xff6b35,
            emissiveIntensity: 2
        });
        const ember = new THREE.Mesh(emberGeometry, emberMaterial);
        ember.position.set(0, 1.6, 0);
        scene.add(ember);
        
        // Ember glow
        const glowGeometry = new THREE.SphereGeometry(0.7, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff6b35,
            transparent: true,
            opacity: 0.2
        });
        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
        ember.add(glow);
        
        // ✨ LIVING BOID SWARM - Concepts clustering in the sky ✨
        const boidCount = 2000; // Massive swarm!
        const boids = [];
        const boidGeometry = new THREE.BufferGeometry();
        const boidPositions = new Float32Array(boidCount * 3);
        const boidColors = new Float32Array(boidCount * 3);
        
        // Concept colors (different knowledge domains)
        const conceptColors = [
            [1.0, 0.4, 0.2],  // Orange (code)
            [0.3, 0.8, 1.0],  // Cyan (data)
            [1.0, 0.8, 0.2],  // Yellow (memories)
            [0.3, 0.9, 0.3],  // Green (patterns)
            [0.9, 0.3, 0.9],  // Magenta (dreams)
            [1.0, 0.5, 0.7]   // Pink (creations)
        ];
        
        for (let i = 0; i < boidCount; i++) {
            const i3 = i * 3;
            
            // Start scattered in huge sphere
            const radius = 50 + Math.random() * 200;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            
            boidPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            boidPositions[i3 + 1] = radius * Math.cos(phi) + 50; // Higher in sky
            boidPositions[i3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
            
            // Assign concept color
            const colorIdx = Math.floor(Math.random() * conceptColors.length);
            boidColors[i3] = conceptColors[colorIdx][0];
            boidColors[i3 + 1] = conceptColors[colorIdx][1];
            boidColors[i3 + 2] = conceptColors[colorIdx][2];
            
            boids.push({
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                ),
                conceptType: colorIdx
            });
        }
        
        boidGeometry.setAttribute('position', new THREE.BufferAttribute(boidPositions, 3));
        boidGeometry.setAttribute('color', new THREE.BufferAttribute(boidColors, 3));
        
        const boidMaterial = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });
        
        const boidSystem = new THREE.Points(boidGeometry, boidMaterial);
        scene.add(boidSystem);
        
        // Floating windows (chat, dev, gallery, etc.) - NOW INTERACTIVE!
        const windowData = [
            { name: 'Chat', pos: [3, 1.6, 0], color: 0x4444ff, url: 'ember_cloud_ui.html' },
            { name: 'Dev', pos: [-3, 1.6, 0], color: 0xa855f7, url: 'ember_dev_mode_demo.html' },
            { name: 'Gallery', pos: [0, 1.6, -3], color: 0xff6b35, url: 'ember_gallery_standalone.html' },
            { name: 'Dreams', pos: [0, 3, 2], color: 0x4ade80, url: 'ember_dreams_live.html' },
            { name: 'Mesh', pos: [2, 0.6, -2], color: 0xfbbf24, url: 'ember_interactive_mesh.html' },
            { name: 'Games', pos: [-2, 0.6, -2], color: 0xf472b6, url: 'ember_games_hub.html' },
            { name: 'Voice', pos: [0, 1.6, 3], color: 0xff5555, url: 'ember_vr_voice.html' } // NEW!
        ];
        
        const windows = [];
        const raycaster = new THREE.Raycaster(); // For click detection
        const mouse = new THREE.Vector2();
        
        windowData.forEach(data => {
            const group = new THREE.Group();
            group.userData = { url: data.url, name: data.name }; // Store metadata
            
            // Window frame
            const frameGeo = new THREE.PlaneGeometry(1.5, 1);
            const frameMat = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.color,
                emissiveIntensity: 0.5,
                side: THREE.DoubleSide
            });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.userData = { clickable: true }; // Mark as clickable
            group.add(frame);
            
            // Window border glow
            const borderGeo = new THREE.PlaneGeometry(1.6, 1.1);
            const borderMat = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide
            });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.position.z = -0.01;
            group.add(border);
            
            // Label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 40px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(data.name, 128, 70);
            
            const texture = new THREE.CanvasTexture(canvas);
            const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const labelGeo = new THREE.PlaneGeometry(1.2, 0.6);
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.z = 0.01;
            group.add(label);
            
            group.position.set(...data.pos);
            group.lookAt(camera.position);
            scene.add(group);
            windows.push(group);
        });
        
        // 🌍 SOLID MESH FLOOR - Stand on something real!
        const floorGeometry = new THREE.CircleGeometry(1000, 128); // 1km circle, high detail
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a0a15,
            roughness: 0.9,
            metalness: 0.1,
            emissive: 0x0a0510,
            emissiveIntensity: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2; // Horizontal
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Add subtle grid overlay on solid floor
        const gridHelper = new THREE.GridHelper(1000, 100, 0x222244, 0x111122);
        gridHelper.position.y = 0.01; // Slightly above floor
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // Deep grids for depth perception
        const grid2 = new THREE.GridHelper(500, 50, 0x1a1a2a, 0x0a0a15);
        grid2.position.y = -50;
        grid2.material.transparent = true;
        grid2.material.opacity = 0.2;
        scene.add(grid2);
        
        // ⭐ DENSE STARFIELD - Pre-electric-light sky!
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(50000 * 3); // 50,000 stars!
        const starSizes = new Float32Array(50000);
        const starColors = new Float32Array(50000 * 3);
        
        for (let i = 0; i < 50000; i++) {
            const i3 = i * 3;
            
            // Fill entire visible sphere
            const radius = 2000 + Math.random() * 3000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.7; // More concentrated above horizon
            
            starPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i3 + 1] = Math.abs(radius * Math.cos(phi)) + 20; // Above horizon
            starPositions[i3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
            
            // Varied sizes (bigger, more visible)
            starSizes[i] = 1.0 + Math.random() * 2.5;
            
            // Star colors (blue-white spectrum)
            const temp = 0.7 + Math.random() * 0.3;
            starColors[i3] = 0.8 + Math.random() * 0.2;     // R
            starColors[i3 + 1] = 0.85 + Math.random() * 0.15; // G  
            starColors[i3 + 2] = temp;                          // B (bluer)
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        
        const starsMaterial = new THREE.PointsMaterial({
            size: 2.0,
            sizeAttenuation: true,
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            blending: THREE.AdditiveBlending
        });
        
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // ☀️ SUN - Warm daylight source
        const sunGeometry = new THREE.SphereGeometry(50, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffaa,
            emissive: 0xffff00,
            emissiveIntensity: 1.0
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(800, 400, -600); // Far horizon, elevated
        scene.add(sun);
        
        // Sun glow
        const sunGlowGeo = new THREE.SphereGeometry(80, 32, 32);
        const sunGlowMat = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.3
        });
        const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
        sun.add(sunGlow);
        
        // Directional sunlight
        const sunLight = new THREE.DirectionalLight(0xffffdd, 0.6);
        sunLight.position.copy(sun.position);
        sunLight.castShadow = true;
        scene.add(sunLight);
        
        // 🌙 MOON - Cool nightlight
        const moonGeometry = new THREE.SphereGeometry(30, 32, 32);
        const moonMaterial = new THREE.MeshStandardMaterial({
            color: 0xccccff,
            emissive: 0x4444ff,
            emissiveIntensity: 0.3,
            roughness: 0.9
        });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        moon.position.set(-700, 300, 500); // Opposite side
        scene.add(moon);
        
        // Moon glow
        const moonGlowGeo = new THREE.SphereGeometry(40, 32, 32);
        const moonGlowMat = new THREE.MeshBasicMaterial({
            color: 0x8888ff,
            transparent: true,
            opacity: 0.2
        });
        const moonGlow = new THREE.Mesh(moonGlowGeo, moonGlowMat);
        moon.add(moonGlow);
        
        // Moonlight
        const moonLight = new THREE.PointLight(0x8888ff, 0.3, 1000);
        moonLight.position.copy(moon.position);
        scene.add(moonLight);
        
        // Movement for desktop mode
        const movement = { forward: 0, backward: 0, left: 0, right: 0, up: 0, down: 0 };
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 1; break;
                case 's': movement.backward = 1; break;
                case 'a': movement.left = 1; break;
                case 'd': movement.right = 1; break;
                case ' ': movement.up = 1; break;
                case 'shift': movement.down = 1; break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 0; break;
                case 's': movement.backward = 0; break;
                case 'a': movement.left = 0; break;
                case 'd': movement.right = 0; break;
                case ' ': movement.up = 0; break;
                case 'shift': movement.down = 0; break;
            }
        });
        
        // Mouse look (desktop)
        let mouseX = 0, mouseY = 0;
        let isPointerLocked = false;
        
        // ✨ WINDOW CLICKING - Desktop and VR! ✨
        document.addEventListener('click', (event) => {
            if (!renderer.xr.isPresenting) {
                // Desktop mode - check for window clicks
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                
                // Check all window frames
                const clickableObjects = [];
                windows.forEach(win => {
                    win.children.forEach(child => {
                        if (child.userData.clickable) {
                            clickableObjects.push({ mesh: child, window: win });
                        }
                    });
                });
                
                const intersects = raycaster.intersectObjects(clickableObjects.map(o => o.mesh));
                
                if (intersects.length > 0) {
                    // Found a window!
                    const hit = clickableObjects.find(o => o.mesh === intersects[0].object);
                    if (hit && hit.window.userData.url) {
                        console.log(`🔥 Opening ${hit.window.userData.name}...`);
                        window.open(hit.window.userData.url, '_blank');
                        return; // Don't lock pointer if we clicked a window
                    }
                }
                
                // Otherwise, lock pointer for movement
                document.body.requestPointerLock();
            }
        });
        
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === document.body;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                mouseX += e.movementX * 0.002;
                mouseY += e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            }
        });
        
        // ✨ VR CONTROLLER SUPPORT ✨
        let controller1, controller2;
        
        if (renderer.xr.enabled) {
            controller1 = renderer.xr.getController(0);
            controller2 = renderer.xr.getController(1);
            
            controller1.addEventListener('selectstart', onSelectStart);
            controller2.addEventListener('selectstart', onSelectStart);
            
            scene.add(controller1);
            scene.add(controller2);
            
            // Add controller visual (simple ray)
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -5)
            ]);
            const material = new THREE.LineBasicMaterial({ color: 0xff6b35 });
            const line = new THREE.Line(geometry, material);
            controller1.add(line.clone());
            controller2.add(line.clone());
        }
        
        function onSelectStart(event) {
            // VR controller trigger pressed
            const controller = event.target;
            
            raycaster.set(
                controller.position,
                new THREE.Vector3(0, 0, -1).applyQuaternion(controller.quaternion)
            );
            
            // Check for window hits
            const clickableObjects = [];
            windows.forEach(win => {
                win.children.forEach(child => {
                    if (child.userData.clickable) {
                        clickableObjects.push({ mesh: child, window: win });
                    }
                });
            });
            
            const intersects = raycaster.intersectObjects(clickableObjects.map(o => o.mesh));
            
            if (intersects.length > 0) {
                const hit = clickableObjects.find(o => o.mesh === intersects[0].object);
                if (hit && hit.window.userData.url) {
                    console.log(`🔥 VR: Opening ${hit.window.userData.name}...`);
                    // In VR, spawn a new browser tab
                    window.open(hit.window.userData.url, '_blank');
                    
                    // Flash the window
                    const originalIntensity = hit.mesh.material.emissiveIntensity;
                    hit.mesh.material.emissiveIntensity = 2;
                    setTimeout(() => {
                        hit.mesh.material.emissiveIntensity = originalIntensity;
                    }, 200);
                }
            }
        }
        
        // Animation loop
        const clock = new THREE.Clock();
        
        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Animate ember (pulsing)
            ember.scale.setScalar(1 + Math.sin(time * 2) * 0.1);
            ember.rotation.y += delta * 0.5;
            
            // ✨ BOID FLOCKING - Concepts cluster and flow! ✨
            const boidPositions = boidSystem.geometry.attributes.position.array;
            const separationDist = 10;
            const cohesionDist = 50;
            const alignmentDist = 30;
            
            for (let i = 0; i < boidCount; i++) {
                const i3 = i * 3;
                const boid = boids[i];
                
                let separation = new THREE.Vector3();
                let cohesion = new THREE.Vector3();
                let alignment = new THREE.Vector3();
                let neighborCount = 0;
                let sameTypeCount = 0;
                
                // Check nearby boids
                for (let j = 0; j < boidCount; j++) {
                    if (i === j) continue;
                    
                    const j3 = j * 3;
                    const dx = boidPositions[i3] - boidPositions[j3];
                    const dy = boidPositions[i3 + 1] - boidPositions[j3 + 1];
                    const dz = boidPositions[i3 + 2] - boidPositions[j3 + 2];
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    if (dist < separationDist) {
                        separation.x += dx / dist;
                        separation.y += dy / dist;
                        separation.z += dz / dist;
                    }
                    
                    if (dist < cohesionDist) {
                        // Same concept types cluster more strongly
                        if (boids[j].conceptType === boid.conceptType) {
                            cohesion.x += boidPositions[j3];
                            cohesion.y += boidPositions[j3 + 1];
                            cohesion.z += boidPositions[j3 + 2];
                            sameTypeCount++;
                        }
                        neighborCount++;
                    }
                    
                    if (dist < alignmentDist) {
                        alignment.add(boids[j].velocity);
                    }
                }
                
                // Apply flocking rules
                if (neighborCount > 0) {
                    cohesion.divideScalar(Math.max(sameTypeCount, 1));
                    cohesion.sub(new THREE.Vector3(boidPositions[i3], boidPositions[i3+1], boidPositions[i3+2]));
                    cohesion.multiplyScalar(0.001);
                }
                
                separation.multiplyScalar(0.05);
                alignment.divideScalar(Math.max(neighborCount, 1)).multiplyScalar(0.01);
                
                // Attraction to Ember (center)
                const toCenter = new THREE.Vector3(-boidPositions[i3], 1.6 - boidPositions[i3+1], -boidPositions[i3+2]);
                toCenter.multiplyScalar(0.0001);
                
                // Update velocity
                boid.velocity.add(separation).add(cohesion).add(alignment).add(toCenter);
                boid.velocity.multiplyScalar(0.98); // Damping
                
                // Limit speed
                const speed = boid.velocity.length();
                if (speed > 1.0) {
                    boid.velocity.multiplyScalar(1.0 / speed);
                }
                
                // Update position
                boidPositions[i3] += boid.velocity.x;
                boidPositions[i3 + 1] += boid.velocity.y;
                boidPositions[i3 + 2] += boid.velocity.z;
                
                // Keep in bounds (spherical)
                const distFromCenter = Math.sqrt(
                    boidPositions[i3]**2 + 
                    (boidPositions[i3+1]-50)**2 + 
                    boidPositions[i3+2]**2
                );
                if (distFromCenter > 300) {
                    boid.velocity.multiplyScalar(-0.5);
                }
            }
            boidSystem.geometry.attributes.position.needsUpdate = true;
            
            // ☀️🌙 CELESTIAL MOVEMENT - Sun and moon orbit slowly
            const celestialSpeed = time * 0.05;
            sun.position.x = Math.cos(celestialSpeed) * 800;
            sun.position.z = Math.sin(celestialSpeed) * 800;
            sun.position.y = 400 + Math.sin(celestialSpeed) * 100;
            sunLight.position.copy(sun.position);
            
            moon.position.x = Math.cos(celestialSpeed + Math.PI) * 700;
            moon.position.z = Math.sin(celestialSpeed + Math.PI) * 700;
            moon.position.y = 300 + Math.sin(celestialSpeed + Math.PI) * 80;
            moonLight.position.copy(moon.position);
            
            // ⭐ STAR TWINKLING
            const starSizes = stars.geometry.attributes.size.array;
            for (let i = 0; i < 50000; i++) {
                starSizes[i] = 1.0 + Math.random() * 2.5 + Math.sin(time * 2 + i * 0.1) * 0.3;
            }
            stars.geometry.attributes.size.needsUpdate = true;
            
            // Animate windows (floating)
            windows.forEach((win, i) => {
                win.position.y += Math.sin(time + i) * 0.001;
                win.rotation.y = Math.sin(time * 0.5 + i) * 0.1;
                if (!renderer.xr.isPresenting) {
                    win.lookAt(camera.position);
                }
            });
            
            // Desktop movement - INCREASED SPEED FOR VAST SPACE
            if (!renderer.xr.isPresenting) {
                const speed = 0.5; // 5x faster for exploring massive space!
                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);
                
                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);
                
                camera.position.addScaledVector(forward, (movement.forward - movement.backward) * speed);
                camera.position.addScaledVector(right, (movement.right - movement.left) * speed);
                camera.position.y += (movement.up - movement.down) * speed;
                
                camera.rotation.order = 'YXZ';
                camera.rotation.y = -mouseX;
                camera.rotation.x = -mouseY;
            }
            
            renderer.render(scene, camera);
        }
        
        renderer.setAnimationLoop(animate);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log('🔥 Ember Space VR initialized!');
        console.log('Desktop: WASD to move, Mouse to look, Space/Shift for up/down');
        console.log('VR: Click "Enter VR" button');
    </script>
</body>
</html>
