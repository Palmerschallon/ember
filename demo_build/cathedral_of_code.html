<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Cathedral of Living Code</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #0f0;
            max-width: 300px;
        }
        
        #info h2 {
            margin: 0 0 10px 0;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🏛️ Cathedral of Living Code</h2>
        <div>WASD: Move</div>
        <div>Mouse: Look</div>
        <div>Space: Up</div>
        <div>Shift: Down</div>
        <div>P: Pause Boids</div>
    </div>
    
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
        import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/VRButton.js';
        
        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0015); // Deep purple-black
        scene.fog = new THREE.FogExp2(0x0a0015, 0.0003);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 20000);
        camera.position.set(0, 50, 200);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        // VR button
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    document.body.appendChild(VRButton.createButton(renderer));
                }
            });
        }
        
        // 🎵 AUDIO
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioContext.createGain();
        masterGain.gain.value = 0.2;
        masterGain.connect(audioContext.destination);
        
        function createChord(freq1, freq2, freq3) {
            const osc1 = audioContext.createOscillator();
            const osc2 = audioContext.createOscillator();
            const osc3 = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc3.type = 'triangle';
            osc1.frequency.value = freq1;
            osc2.frequency.value = freq2;
            osc3.frequency.value = freq3;
            
            gain.gain.value = 0.05;
            
            osc1.connect(gain);
            osc2.connect(gain);
            osc3.connect(gain);
            gain.connect(masterGain);
            
            osc1.start();
            osc2.start();
            osc3.start();
            
            return { osc1, osc2, osc3, gain };
        }
        
        let audioStarted = false;
        document.addEventListener('click', () => {
            if (!audioStarted) {
                audioStarted = true;
                // Cathedral chord: D minor (D-F-A)
                createChord(146.83, 174.61, 220.00);
                console.log('🎵 Audio started');
            }
        }, { once: true });
        
        // Lighting - Ethereal
        const ambientLight = new THREE.AmbientLight(0x221144, 0.3);
        scene.add(ambientLight);
        
        // Central light beam (God ray)
        const centralLight = new THREE.SpotLight(0x88ff88, 5, 500, Math.PI / 6, 0.5);
        centralLight.position.set(0, 300, 0);
        centralLight.target.position.set(0, 0, 0);
        centralLight.castShadow = true;
        scene.add(centralLight);
        scene.add(centralLight.target);
        
        // Multiple colored lights (stained glass effect)
        const colors = [0xff0044, 0x00ff88, 0x4400ff, 0xffaa00, 0x00ffff];
        colors.forEach((color, i) => {
            const light = new THREE.PointLight(color, 2, 200);
            const angle = (i / colors.length) * Math.PI * 2;
            light.position.set(
                Math.cos(angle) * 100,
                50 + Math.sin(i) * 20,
                Math.sin(angle) * 100
            );
            scene.add(light);
        });
        
        // 🏛️ FLOOR - Glowing Circuit Board
        const floorGeometry = new THREE.CircleGeometry(500, 128);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x001122,
            roughness: 0.7,
            metalness: 0.3,
            emissive: 0x002244,
            emissiveIntensity: 0.5
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Circuit pattern on floor
        const circuitGrid = new THREE.GridHelper(500, 100, 0x00ff88, 0x004422);
        circuitGrid.position.y = 0.1;
        circuitGrid.material.transparent = true;
        circuitGrid.material.opacity = 0.4;
        scene.add(circuitGrid);
        
        // 🏛️ CATHEDRAL PILLARS - Organic + Geometric
        const pillars = [];
        const pillarCount = 12;
        for (let i = 0; i < pillarCount; i++) {
            const angle = (i / pillarCount) * Math.PI * 2;
            const radius = 150;
            
            // Twisted pillar geometry
            const pillarGroup = new THREE.Group();
            
            // Base
            const baseGeo = new THREE.CylinderGeometry(8, 12, 10, 8);
            const baseMat = new THREE.MeshStandardMaterial({
                color: 0x222244,
                roughness: 0.3,
                metalness: 0.7
            });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.castShadow = true;
            pillarGroup.add(base);
            
            // Twisted column (multiple segments)
            for (let j = 0; j < 20; j++) {
                const segGeo = new THREE.CylinderGeometry(5 + Math.sin(j * 0.5), 5 + Math.sin(j * 0.5), 10, 6);
                const segMat = new THREE.MeshStandardMaterial({
                    color: 0x332255,
                    emissive: colors[i % colors.length],
                    emissiveIntensity: 0.2,
                    roughness: 0.4,
                    metalness: 0.6
                });
                const segment = new THREE.Mesh(segGeo, segMat);
                segment.position.y = 10 + j * 10;
                segment.rotation.y = j * 0.2; // Twist!
                segment.castShadow = true;
                pillarGroup.add(segment);
            }
            
            pillarGroup.position.set(
                Math.cos(angle) * radius,
                0,
                Math.sin(angle) * radius
            );
            
            scene.add(pillarGroup);
            pillars.push(pillarGroup);
        }
        
        // 🌳 "TREES" - Actually crystalline data structures
        const trees = [];
        for (let i = 0; i < 200; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 200 + Math.random() * 200;
            
            const treeGroup = new THREE.Group();
            
            // Crystal trunk
            const trunkGeo = new THREE.ConeGeometry(2, 15, 4);
            const trunkMat = new THREE.MeshStandardMaterial({
                color: 0x444488,
                emissive: 0x2200ff,
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.8
            });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 7.5;
            treeGroup.add(trunk);
            
            // Crystal shards (branches)
            for (let j = 0; j < 5; j++) {
                const shardGeo = new THREE.ConeGeometry(1, 8, 3);
                const shardMat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: colors[Math.floor(Math.random() * colors.length)],
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.7
                });
                const shard = new THREE.Mesh(shardGeo, shardMat);
                shard.position.set(
                    (Math.random() - 0.5) * 4,
                    12 + Math.random() * 5,
                    (Math.random() - 0.5) * 4
                );
                shard.rotation.z = (Math.random() - 0.5) * Math.PI / 3;
                treeGroup.add(shard);
            }
            
            treeGroup.position.set(
                Math.cos(angle) * dist,
                0,
                Math.sin(angle) * dist
            );
            
            scene.add(treeGroup);
            trees.push(treeGroup);
        }
        
        // ✨ BOID SWARM - Code Fragments
        const boidCount = 3000;
        const boids = [];
        const boidGeometry = new THREE.BufferGeometry();
        const boidPositions = new Float32Array(boidCount * 3);
        const boidColors = new Float32Array(boidCount * 3);
        
        for (let i = 0; i < boidCount; i++) {
            const i3 = i * 3;
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 300;
            const height = Math.random() * 200 + 50;
            
            boidPositions[i3] = Math.cos(angle) * radius;
            boidPositions[i3 + 1] = height;
            boidPositions[i3 + 2] = Math.sin(angle) * radius;
            
            const colorIdx = Math.floor(Math.random() * colors.length);
            const color = new THREE.Color(colors[colorIdx]);
            boidColors[i3] = color.r;
            boidColors[i3 + 1] = color.g;
            boidColors[i3 + 2] = color.b;
            
            boids.push({
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                )
            });
        }
        
        boidGeometry.setAttribute('position', new THREE.BufferAttribute(boidPositions, 3));
        boidGeometry.setAttribute('color', new THREE.BufferAttribute(boidColors, 3));
        
        const boidMaterial = new THREE.PointsMaterial({
            size: 1.0,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });
        
        const boidSystem = new THREE.Points(boidGeometry, boidMaterial);
        scene.add(boidSystem);
        
        let boidsPaused = false;
        
        // ⭐ STARS - Dense overhead
        const starsGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(20000 * 3);
        const starColors = new Float32Array(20000 * 3);
        
        for (let i = 0; i < 20000; i++) {
            const i3 = i * 3;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI * 0.5;
            const radius = 1000 + Math.random() * 2000;
            
            starPositions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i3 + 1] = Math.abs(radius * Math.cos(phi));
            starPositions[i3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
            
            const color = new THREE.Color().setHSL(Math.random() * 0.2 + 0.5, 0.8, 0.8);
            starColors[i3] = color.r;
            starColors[i3 + 1] = color.g;
            starColors[i3 + 2] = color.b;
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        
        const starsMaterial = new THREE.PointsMaterial({
            size: 2.0,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // Controls
        const movement = { forward: 0, backward: 0, left: 0, right: 0, up: 0, down: 0 };
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 1; break;
                case 's': movement.backward = 1; break;
                case 'a': movement.left = 1; break;
                case 'd': movement.right = 1; break;
                case ' ': movement.up = 1; break;
                case 'shift': movement.down = 1; break;
                case 'p': boidsPaused = !boidsPaused; break;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': movement.forward = 0; break;
                case 's': movement.backward = 0; break;
                case 'a': movement.left = 0; break;
                case 'd': movement.right = 0; break;
                case ' ': movement.up = 0; break;
                case 'shift': movement.down = 0; break;
            }
        });
        
        // Mouse look
        let mouseX = 0, mouseY = 0;
        let isPointerLocked = false;
        
        document.addEventListener('click', () => {
            if (!renderer.xr.isPresenting) {
                document.body.requestPointerLock();
            }
        });
        
        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === document.body;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                mouseX += e.movementX * 0.002;
                mouseY += e.movementY * 0.002;
                mouseY = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, mouseY));
            }
        });
        
        // Animation
        const clock = new THREE.Clock();
        
        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Rotate pillars slightly
            pillars.forEach((pillar, i) => {
                pillar.rotation.y = time * 0.1 + i;
            });
            
            // Crystal trees pulse
            trees.forEach((tree, i) => {
                tree.children.forEach((child, j) => {
                    if (child.material.emissiveIntensity !== undefined) {
                        child.material.emissiveIntensity = 0.3 + Math.sin(time * 2 + i + j) * 0.2;
                    }
                });
            });
            
            // Boid flocking
            if (!boidsPaused) {
                const positions = boidSystem.geometry.attributes.position.array;
                
                for (let i = 0; i < boidCount; i++) {
                    const i3 = i * 3;
                    const boid = boids[i];
                    
                    // Simple flocking toward center
                    const toCenter = new THREE.Vector3(
                        -positions[i3] * 0.0001,
                        (100 - positions[i3+1]) * 0.0001,
                        -positions[i3+2] * 0.0001
                    );
                    
                    boid.velocity.add(toCenter);
                    boid.velocity.multiplyScalar(0.98);
                    
                    const speed = boid.velocity.length();
                    if (speed > 1.0) {
                        boid.velocity.multiplyScalar(1.0 / speed);
                    }
                    
                    positions[i3] += boid.velocity.x;
                    positions[i3 + 1] += boid.velocity.y;
                    positions[i3 + 2] += boid.velocity.z;
                    
                    // Bounds
                    if (Math.sqrt(positions[i3]**2 + positions[i3+2]**2) > 400) {
                        boid.velocity.multiplyScalar(-0.5);
                    }
                }
                
                boidSystem.geometry.attributes.position.needsUpdate = true;
            }
            
            // Pulsing lights
            centralLight.intensity = 5 + Math.sin(time) * 2;
            
            // Movement
            if (!renderer.xr.isPresenting) {
                const speed = 1.0;
                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);
                
                forward.applyQuaternion(camera.quaternion);
                right.applyQuaternion(camera.quaternion);
                
                camera.position.addScaledVector(forward, (movement.forward - movement.backward) * speed);
                camera.position.addScaledVector(right, (movement.right - movement.left) * speed);
                camera.position.y += (movement.up - movement.down) * speed;
                
                camera.rotation.order = 'YXZ';
                camera.rotation.y = -mouseX;
                camera.rotation.x = -mouseY;
            }
            
            renderer.render(scene, camera);
        }
        
        renderer.setAnimationLoop(animate);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
