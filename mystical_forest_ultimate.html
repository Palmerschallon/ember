<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mystical Forest Ultimate VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene environment="preset: forest; groundColor: #223; groundColor2: #112; playArea: 3; dressingAmount: 150">

        <!-- Custom Shaders -->
        <a-assets>
            <a-asset-item id="pulse-shader-vertex" response-type="text">
                <script type="x-shader/x-vertex">
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    uniform float time;

                    void main() {
                        vUv = uv;
                        vNormal = normal;
                        vec3 pos = position;
                        float pulse = sin(time * 2.0 + position.y * 5.0) * 0.05;
                        pos += normal * pulse;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                </script>
            </a-asset-item>
        </a-assets>

        <!-- Sky with animated stars -->
        <a-sky color="#001122" material="shader: flat">
            <a-animation attribute="material.color"
                       from="#001122" to="#112244"
                       dur="20000"
                       repeat="indefinite"
                       direction="alternate"></a-animation>
        </a-sky>

        <!-- Atmospheric lighting -->
        <a-light type="ambient" color="#334466" intensity="0.6"></a-light>
        <a-light type="point" position="0 5 0" color="#88ffff" intensity="1.5" distance="20">
            <a-animation attribute="intensity" from="1.5" to="0.5" dur="3000" repeat="indefinite" direction="alternate"></a-animation>
        </a-light>
        <a-light type="point" position="-5 3 -5" color="#ff88ff" intensity="1" distance="15"></a-light>
        <a-light type="point" position="5 3 -5" color="#88ff88" intensity="1" distance="15"></a-light>

        <!-- Glowing Mushroom Grove -->
        <a-entity id="mushroom-grove">
            <!-- Hero Mushroom -->
            <a-entity position="-3 0 -5">
                <a-cone color="#ff6b9d" height="0.8" radius-bottom="0.4" radius-top="0.6"
                        material="emissive: #ff6b9d; emissiveIntensity: 1.2">
                    <a-animation attribute="material.emissiveIntensity" from="0.8" to="1.5" dur="2000" repeat="indefinite" direction="alternate"></a-animation>
                    <a-animation attribute="scale" from="1 1 1" to="1.05 1.05 1.05" dur="3000" repeat="indefinite" direction="alternate"></a-animation>
                </a-cone>
                <a-cylinder position="0 -0.35 0" radius="0.2" height="0.7" color="#feca57"></a-cylinder>

                <!-- Spores floating up -->
                <a-entity position="0 0.5 0"
                          particle-system="preset: dust; particleCount: 100; color: #ff6b9d,#ff88aa; size: 0.05; velocityValue: 0 1 0; velocitySpread: 0.2 0 0.2">
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Crystal Formation -->
        <a-entity id="crystal-cluster" position="3 0 -4">
            <!-- Large central crystal -->
            <a-octahedron position="0 1 0" radius="0.7" color="#00d2ff"
                         material="emissive: #00d2ff; emissiveIntensity: 1.5; transparent: true; opacity: 0.8">
                <a-animation attribute="rotation" to="0 360 0" dur="6000" repeat="indefinite"></a-animation>
                <a-animation attribute="position" from="0 1 0" to="0 1.5 0" dur="4000" repeat="indefinite" direction="alternate" easing="easeInOutSine"></a-animation>
            </a-octahedron>

            <!-- Surrounding smaller crystals -->
            <a-tetrahedron position="-0.8 0.5 0" radius="0.3" color="#ff00d2"
                          material="emissive: #ff00d2; emissiveIntensity: 1.2">
                <a-animation attribute="rotation" to="360 0 360" dur="5000" repeat="indefinite"></a-animation>
            </a-tetrahedron>

            <a-tetrahedron position="0.8 0.6 0.5" radius="0.4" color="#d2ff00"
                          material="emissive: #d2ff00; emissiveIntensity: 1.2">
                <a-animation attribute="rotation" to="0 360 0" dur="7000" repeat="indefinite"></a-animation>
            </a-tetrahedron>
        </a-entity>

        <!-- AI Creatures - Curious Orbs -->
        <a-entity id="creatures">
            <a-sphere class="creature" position="-2 2 -8" radius="0.3" color="#88ff88"
                     material="emissive: #88ff88; emissiveIntensity: 2">
                <a-animation attribute="position"
                           from="-2 2 -8" to="-3 2.5 -7"
                           dur="5000" repeat="indefinite" direction="alternate" easing="easeInOutSine"></a-animation>
            </a-sphere>

            <a-sphere class="creature" position="4 1.5 -6" radius="0.25" color="#ff8888"
                     material="emissive: #ff8888; emissiveIntensity: 2">
                <a-animation attribute="position"
                           from="4 1.5 -6" to="3 2 -7"
                           dur="6000" repeat="indefinite" direction="alternate" easing="easeInOutSine"></a-animation>
            </a-sphere>

            <a-sphere class="creature" position="0 3 -10" radius="0.35" color="#8888ff"
                     material="emissive: #8888ff; emissiveIntensity: 2">
                <a-animation attribute="position"
                           from="0 3 -10" to="1 2.5 -9"
                           dur="7000" repeat="indefinite" direction="alternate" easing="easeInOutSine"></a-animation>
            </a-sphere>
        </a-entity>

        <!-- Magic Portal -->
        <a-entity position="0 2 -12">
            <a-torus position="0 0 0" radius="2" radius-tubular="0.1" color="#ff00ff"
                    material="emissive: #ff00ff; emissiveIntensity: 2; transparent: true; opacity: 0.6">
                <a-animation attribute="rotation" to="0 360 0" dur="10000" repeat="indefinite"></a-animation>
            </a-torus>
            <a-circle radius="2" color="#8800ff"
                     material="emissive: #8800ff; emissiveIntensity: 1; transparent: true; opacity: 0.4; side: double">
                <a-animation attribute="material.opacity" from="0.4" to="0.7" dur="2000" repeat="indefinite" direction="alternate"></a-animation>
            </a-circle>
        </a-entity>

        <!-- Floating Fireflies -->
        <a-entity position="0 1 -5"
                  particle-system="preset: dust; particleCount: 500; color: #ffff88,#88ffff,#ff88ff; size: 0.08; velocityValue: 0.1 0.5 0.1; velocitySpread: 2 1 2; maxAge: 10">
        </a-entity>

        <!-- Interactive Magic Orb -->
        <a-sphere id="magic-orb"
                  position="0 1.5 -3"
                  radius="0.4"
                  color="#ee5a24"
                  class="clickable"
                  material="emissive: #ee5a24; emissiveIntensity: 1.5">
            <a-animation attribute="rotation" to="360 360 0" dur="8000" repeat="indefinite"></a-animation>
            <a-animation begin="click" attribute="scale" from="1 1 1" to="1.5 1.5 1.5" dur="300" direction="alternate"></a-animation>
        </a-sphere>

        <!-- Creation Spawn Point -->
        <a-entity id="spawn-marker" position="0 0 -5" visible="false">
            <a-ring color="#ffff00" radius-inner="0.3" radius-outer="0.4"></a-ring>
        </a-entity>

        <!-- Mystical Fog -->
        <a-entity fog="type: exponential; color: #223344; density: 0.03"></a-entity>

        <!-- Player with Movement -->
        <a-entity id="rig" movement-controls="speed: 0.2" position="0 0 0">
            <a-entity camera look-controls position="0 1.6 0">
                <a-cursor color="#4cd137" fuse="true" fuse-timeout="1000"
                         raycaster="objects: .clickable"></a-cursor>
            </a-entity>
        </a-entity>

        <!-- UI Instructions -->
        <a-text value="MYSTICAL FOREST VR\n\nMove: WASD / Thumbstick\nLook: Mouse / VR Headset\nCreate: Press C + Click\nInteract: Gaze at objects"
                position="-2 2.5 -3"
                width="4"
                align="center"
                color="#ffffff"
                material="transparent: true; opacity: 0.8">
        </a-text>

    </a-scene>

    <style>
        body { margin: 0; overflow: hidden; }
        #creation-mode-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #4cd137;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
        }
    </style>

    <div id="creation-mode-ui">CREATION MODE ACTIVE - Click to spawn</div>

    <script>
        let creationMode = false;
        let creationCount = 0;

        // Creation mode toggle
        document.addEventListener('keydown', function(e) {
            if(e.key === 'c' || e.key === 'C') {
                creationMode = !creationMode;
                const ui = document.getElementById('creation-mode-ui');
                ui.style.display = creationMode ? 'block' : 'none';
                const marker = document.querySelector('#spawn-marker');
                marker.setAttribute('visible', creationMode);
            }
        });

        // Spawn objects in creation mode
        document.querySelector('a-scene').addEventListener('click', function(e) {
            if(!creationMode) return;

            const scene = document.querySelector('a-scene');
            const camera = document.querySelector('[camera]');
            const cameraPos = camera.getAttribute('position');
            const cameraRot = camera.getAttribute('rotation');

            // Calculate spawn position in front of camera
            const distance = 3;
            const radY = (cameraRot.y * Math.PI) / 180;
            const spawnX = cameraPos.x + Math.sin(radY) * distance;
            const spawnZ = cameraPos.z - Math.cos(radY) * distance;
            const spawnY = cameraPos.y - 0.5;

            // Random object type
            const types = ['mushroom', 'crystal', 'orb'];
            const type = types[Math.floor(Math.random() * types.length)];

            let entity;
            if(type === 'mushroom') {
                entity = document.createElement('a-entity');
                entity.innerHTML = `
                    <a-cone color="#${Math.floor(Math.random()*16777215).toString(16)}"
                           height="0.5" radius-bottom="0.3" radius-top="0.4"
                           material="emissive: #ff6b9d; emissiveIntensity: 1">
                    </a-cone>
                    <a-cylinder position="0 -0.25 0" radius="0.15" height="0.5" color="#feca57"></a-cylinder>
                `;
            } else if(type === 'crystal') {
                entity = document.createElement('a-octahedron');
                entity.setAttribute('radius', 0.4);
                entity.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
                entity.setAttribute('material', 'emissive: #00d2ff; emissiveIntensity: 1.5');
                entity.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 5000; loop: true');
            } else {
                entity = document.createElement('a-sphere');
                entity.setAttribute('radius', 0.3);
                entity.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
                entity.setAttribute('material', 'emissive: #ff8888; emissiveIntensity: 2');
            }

            entity.setAttribute('position', `${spawnX} ${spawnY} ${spawnZ}`);
            entity.setAttribute('animation__spawn', 'property: scale; from: 0 0 0; to: 1 1 1; dur: 500; easing: easeOutElastic');
            scene.appendChild(entity);

            creationCount++;
            console.log(`Created ${type} #${creationCount} at`, spawnX.toFixed(2), spawnY.toFixed(2), spawnZ.toFixed(2));
        });

        // Interactive orb color change
        document.querySelector('#magic-orb').addEventListener('click', function() {
            const newColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            this.setAttribute('color', newColor);
            this.setAttribute('material', `emissive: ${newColor}; emissiveIntensity: 2`);
        });

        // Creature AI - move towards player when close
        setInterval(() => {
            const camera = document.querySelector('[camera]');
            if(!camera) return;

            const cameraPos = camera.getAttribute('position');
            const creatures = document.querySelectorAll('.creature');

            creatures.forEach(creature => {
                const creaturePos = creature.getAttribute('position');
                const dx = cameraPos.x - creaturePos.x;
                const dy = cameraPos.y - creaturePos.y;
                const dz = cameraPos.z - creaturePos.z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                // If player is close, move towards them slowly
                if(distance < 5) {
                    const moveSpeed = 0.02;
                    const newX = creaturePos.x + (dx * moveSpeed);
                    const newY = creaturePos.y + (dy * moveSpeed);
                    const newZ = creaturePos.z + (dz * moveSpeed);
                    creature.setAttribute('position', `${newX} ${newY} ${newZ}`);
                }
            });
        }, 100);

        // Procedural mushroom spawning
        const scene = document.querySelector('a-scene');
        for(let i = 0; i < 12; i++) {
            const mushroom = document.createElement('a-entity');
            const x = Math.random() * 20 - 10;
            const z = Math.random() * 20 - 20;
            const hue = Math.floor(Math.random() * 360);

            mushroom.innerHTML = `
                <a-cone color="hsl(${hue}, 80%, 60%)"
                       height="${0.3 + Math.random() * 0.5}"
                       radius-bottom="0.3" radius-top="0.4"
                       material="emissive: hsl(${hue}, 80%, 60%); emissiveIntensity: 0.8">
                    <a-animation attribute="material.emissiveIntensity" from="0.5" to="1.2" dur="${1500 + Math.random() * 1000}" repeat="indefinite" direction="alternate"></a-animation>
                </a-cone>
                <a-cylinder position="0 -${0.2 + Math.random() * 0.1} 0" radius="0.15" height="0.4" color="#d4a574"></a-cylinder>
            `;
            mushroom.setAttribute('position', `${x} 0 ${z}`);
            scene.appendChild(mushroom);
        }

        console.log('🔥 Mystical Forest Ultimate VR loaded!');
        console.log('Press C to enter creation mode');
    </script>
</body>
</html>
