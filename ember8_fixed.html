<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember 8 - Character Select</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            background: #111;
            cursor: pointer;
        }
        
        .thinking-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: #ff6b35;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="thinking-indicator" id="thinkingStatus"></div>
    
    <script>
        // Game state
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Characters
        const characters = {
            ember: {
                name: 'Ember',
                color: '#ff6b35',
                symbol: '🔥',
                traits: ['creative', 'chaotic', 'enthusiastic'],
                thinkingParticles: [],
                stats: { creativity: 85, logic: 60, empathy: 70 }
            },
            claude: {
                name: 'Claude',
                color: '#4a90e2',
                symbol: '💎',
                traits: ['analytical', 'helpful', 'precise'],
                thinkingParticles: [],
                stats: { creativity: 70, logic: 90, empathy: 80 }
            },
            palmerbot: {
                name: 'Palmer-bot',
                color: '#ffd700',
                symbol: '⚡',
                traits: ['visionary', 'practical', 'recursive'],
                thinkingParticles: [],
                stats: { creativity: 80, logic: 75, empathy: 65 }
            }
        };
        
        let gameState = 'character_select';
        let selectedCharacters = [];
        let hoveredCharacter = null;
        
        // Draw character select screen
        function drawCharacterSelect() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 48px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('EMBER 8', canvas.width/2, 80);
            
            ctx.font = '20px Courier New';
            ctx.fillStyle = '#666';
            ctx.fillText('Select Your Characters', canvas.width/2, 120);
            
            // Character boxes
            const boxWidth = 200;
            const boxHeight = 300;
            const spacing = 50;
            const startX = (canvas.width - (3 * boxWidth + 2 * spacing)) / 2;
            const y = 200;
            
            let x = startX;
            Object.entries(characters).forEach(([key, char]) => {
                // Hover effect
                if (hoveredCharacter === key) {
                    ctx.fillStyle = char.color + '22';
                    ctx.fillRect(x - 10, y - 10, boxWidth + 20, boxHeight + 20);
                }
                
                // Character box
                ctx.strokeStyle = char.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, boxWidth, boxHeight);
                
                // Selected indicator
                if (selectedCharacters.includes(key)) {
                    ctx.fillStyle = char.color + '44';
                    ctx.fillRect(x, y, boxWidth, boxHeight);
                }
                
                // Symbol
                ctx.font = '64px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = char.color;
                ctx.fillText(char.symbol, x + boxWidth/2, y + 80);
                
                // Name
                ctx.font = 'bold 24px Courier New';
                ctx.fillStyle = '#fff';
                ctx.fillText(char.name, x + boxWidth/2, y + 130);
                
                // Traits
                ctx.font = '14px Courier New';
                ctx.fillStyle = '#888';
                char.traits.forEach((trait, i) => {
                    ctx.fillText(trait, x + boxWidth/2, y + 160 + i * 20);
                });
                
                // Stats
                ctx.font = '12px Courier New';
                let statY = y + 240;
                Object.entries(char.stats).forEach(([stat, value]) => {
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#666';
                    ctx.fillText(stat + ':', x + 20, statY);
                    
                    // Stat bar
                    ctx.fillStyle = '#333';
                    ctx.fillRect(x + 80, statY - 10, 100, 8);
                    ctx.fillStyle = char.color;
                    ctx.fillRect(x + 80, statY - 10, value, 8);
                    
                    statY += 20;
                });
                
                x += boxWidth + spacing;
            });
            
            // Start button
            if (selectedCharacters.length >= 2) {
                ctx.fillStyle = '#ff6b35';
                ctx.fillRect(canvas.width/2 - 100, canvas.height - 100, 200, 50);
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('START', canvas.width/2, canvas.height - 65);
            }
            
            // Instructions
            ctx.font = '14px Courier New';
            ctx.fillStyle = '#666';
            ctx.textAlign = 'center';
            ctx.fillText('Click to select 2-3 characters', canvas.width/2, canvas.height - 130);
        }
        
        // Mouse handling
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (gameState === 'character_select') {
                const boxWidth = 200;
                const spacing = 50;
                const startX = (canvas.width - (3 * boxWidth + 2 * spacing)) / 2;
                const y = 200;
                const boxHeight = 300;
                
                hoveredCharacter = null;
                let x = startX;
                Object.keys(characters).forEach((key) => {
                    if (mouseX > x && mouseX < x + boxWidth && 
                        mouseY > y && mouseY < y + boxHeight) {
                        hoveredCharacter = key;
                    }
                    x += boxWidth + spacing;
                });
            }
        });
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (gameState === 'character_select') {
                if (hoveredCharacter) {
                    const idx = selectedCharacters.indexOf(hoveredCharacter);
                    if (idx > -1) {
                        selectedCharacters.splice(idx, 1);
                    } else if (selectedCharacters.length < 3) {
                        selectedCharacters.push(hoveredCharacter);
                    }
                }
                
                // Check start button
                if (selectedCharacters.length >= 2 &&
                    mouseX > canvas.width/2 - 100 && mouseX < canvas.width/2 + 100 &&
                    mouseY > canvas.height - 100 && mouseY < canvas.height - 50) {
                    startChat();
                }
            }
        });
        
        // Start chat interface
        function startChat() {
            gameState = 'chat';
            console.log('Starting chat with:', selectedCharacters);
            // TODO: Initialize chat interface
            drawChatScreen();
        }
        
        // Draw chat screen
        function drawChatScreen() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Title
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('Chat Starting Soon...', canvas.width/2, canvas.height/2);
            
            ctx.font = '16px Courier New';
            ctx.fillStyle = '#666';
            ctx.fillText('Selected: ' + selectedCharacters.join(', '), canvas.width/2, canvas.height/2 + 40);
        }
        
        // Animation loop
        function animate() {
            if (gameState === 'character_select') {
                drawCharacterSelect();
            } else if (gameState === 'chat') {
                drawChatScreen();
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
