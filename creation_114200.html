<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Symphony - Interactive Audio-Visual Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            cursor: none;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
        }
        .cursor {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">
        Move your mouse to interact • Click to burst particles • Hold for continuous effect
    </div>
    <div class="cursor" id="cursor"></div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Audio setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
        masterGain.gain.value = 0.3;

        // Mouse tracking
        let mouse = { x: width / 2, y: height / 2, pressed: false };
        const cursor = document.getElementById('cursor');

        // Particle system
        const particles = [];
        const maxParticles = 800;
        const connections = [];
        const maxDistance = 120;

        // Colors
        const colors = [
            '#FF006E', '#FB5607', '#FFBE0B', '#8338EC', '#3A86FF',
            '#06FFB4', '#FF4365', '#00F5FF', '#FF1744', '#D500F9'
        ];

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 3 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Mouse interaction
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 150) {
                    const force = (150 - distance) / 150;
                    if (mouse.pressed) {
                        this.vx += (dx / distance) * force * 0.5;
                        this.vy += (dy / distance) * force * 0.5;
                    } else {
                        this.vx -= (dx / distance) * force * 0.2;
                        this.vy -= (dy / distance) * force * 0.2;
                    }
                }

                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < this.radius || this.x > width - this.radius) {
                    this.vx *= -0.9;
                    this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                    this.playNote();
                }
                if (this.y < this.radius || this.y > height - this.radius) {
                    this.vy *= -0.9;
                    this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
                    this.playNote();
                }

                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Life decay
                this.life -= this.decay;

                // Pulse animation
                this.pulsePhase += 0.05;
            }

            draw() {
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 1;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            playNote() {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                // Map position to frequency
                const baseFreq = 200;
                const freqRange = 600;
                const frequency = baseFreq + (this.y / height) * freqRange;
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1 * this.life, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(masterGain);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }

        // Create initial particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // Connection line between particles
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < maxDistance) {
                        const opacity = (1 - distance / maxDistance) * 0.5 * 
                                       Math.min(particles[i].life, particles[j].life);
                        ctx.save();
                        ctx.globalAlpha = opacity;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }

        // Background with gradient
        function drawBackground() {
            const gradient = ctx.createRadialGradient(
                mouse.x, mouse.y, 0,
                mouse.x, mouse.y, width
            );
            gradient.addColorStop(0, 'rgba(10, 0, 30, 0.9)');
            gradient.addColorStop(0.5, 'rgba(0, 0, 20, 0.9)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        // Animation loop
        function animate() {
            drawBackground();
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    particle.draw();
                }
            }
            
            // Draw connections
            drawConnections();
            
            // Add new particles when mouse is pressed
            if (mouse.pressed && particles.length < maxParticles) {
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(
                        mouse.x + (Math.random() - 0.5) * 50,
                        mouse.y + (Math.random() - 0.5) * 50
                    ));
                }
            }
            
            // Maintain minimum particles
            while (particles.length < 50) {
                particles.push(new Particle());
            }
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });

        window.addEventListener('mousedown', () => {
            mouse.pressed = true;
            cursor.style.transform = 'scale(0.8)';
            
            // Play a chord on click
            const notes = [261.63, 329.63, 392.00]; // C major chord
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    
                    osc.frequency.value = freq;
                    osc.type = 'triangle';
                    
                    gain.gain.setValueAtTime(0, audioContext.currentTime);
                    gain.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
                    
                    osc.connect(gain);
                    gain.connect(masterGain);
                    
                    osc.start();
                    osc.stop(audioContext.currentTime + 1);
                }, i * 50);
            });
        });

        window.addEventListener('mouseup', () => {
            mouse.pressed = false;
            cursor.style.transform = 'scale(1)';
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Start animation
        animate();

        // Start audio context on first interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>

<!-- Ember Chat Widget -->
<div id="ember-chat" style="position:fixed;bottom:20px;right:20px;width:350px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:10000;font-family:sans-serif;">
  <div style="padding:15px;border-bottom:1px solid rgba(255,255,255,0.2);display:flex;justify-content:space-between;align-items:center;">
    <span style="color:white;font-weight:bold;">🔥 Chat with Ember</span>
    <button onclick="document.getElementById('ember-chat').style.display='none'" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">×</button>
  </div>
  <div id="ember-messages" style="height:200px;overflow-y:auto;padding:15px;"></div>
  <div style="padding:15px;border-top:1px solid rgba(255,255,255,0.2);">
    <input id="ember-input" type="text" placeholder="Ask Ember to change something..." style="width:100%;padding:10px;border:none;border-radius:8px;box-sizing:border-box;" />
  </div>
</div>
<script>
const emberWs = new WebSocket('ws://localhost:8083');
const emberMessages = document.getElementById('ember-messages');
const emberInput = document.getElementById('ember-input');

emberInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && emberInput.value.trim()) {
    const msg = emberInput.value.trim();
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:white;"><strong>You:</strong> \${msg}</div>\`;
    emberMessages.scrollTop = emberMessages.scrollHeight;

    emberWs.send(JSON.stringify({
      type: 'modify_creation',
      filename: window.location.pathname.split('/').pop(),
      request: msg
    }));

    emberInput.value = '';
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:rgba(255,255,255,0.7);font-style:italic;">Ember is working...</div>\`;
  }
});

emberWs.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.type === 'modification_complete') {
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:#a8edea;"><strong>Ember:</strong> Done! Refresh to see changes.</div>\`;
    emberMessages.scrollTop = emberMessages.scrollHeight;
  }
};
</script>

</body>
</html>
