<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .ember-name {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
        }
        
        .dots {
            display: flex;
            gap: 4px;
            margin-left: 2px;
        }
        
        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ff3b30;
            animation: ripple 2.4s ease-in-out infinite;
        }
        
        .dot:nth-child(2) {
            animation-delay: 0.4s;
        }
        
        .dot:nth-child(3) {
            animation-delay: 0.8s;
        }
        
        @keyframes ripple {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(-4px) scale(1.2);
            }
        }
        
        .sleep-btn {
            margin-left: auto;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .sleep-btn:hover {
            border-color: #555;
            color: #aaa;
        }
        
        .sleep-btn.sleeping {
            border-color: #ff3b30;
            color: #ff3b30;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 0 30px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .message {
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
        }
        
        .message.user {
            align-self: flex-end;
            color: #aaa;
        }
        
        .message.ember {
            align-self: flex-start;
            color: #fff;
        }
        
        .input-area {
            padding: 20px 30px 30px 30px;
            border-top: 1px solid #1a1a1a;
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #222;
            color: #fff;
            padding: 14px 18px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus {
            border-color: #333;
        }
        
        input::placeholder {
            color: #444;
        }
        
        .loading {
            color: #666;
            font-size: 14px;
            font-style: italic;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #222;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="ember-name">Ember</div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <button class="sleep-btn" onclick="toggleSleep()">Sleep</button>
    </div>
    
    <div class="messages" id="messages"></div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="input" 
                placeholder="Type a message..."
                onkeypress="handleKeyPress(event)"
                autocomplete="off"
            />
        </div>
    </div>
    
    <script>
        let sleeping = false;
        let loading = false;
        let interactionCount = 0; // Mock interaction history
        
        // Mock greeting based on interaction count
        function loadGreeting() {
            let greeting;
            if (interactionCount === 0) {
                greeting = "Hi. I'm Ember.\n\nI can help you organize files, search for information, and build things together. Everything we create lives in your Pod.\n\nWhat would you like to do?";
            } else {
                const greetings = [
                    "Welcome back. What should we work on?",
                    "Ready when you are.",
                    "Hi again. What's on your mind?",
                ];
                greeting = greetings[Math.floor(Math.random() * greetings.length)];
            }
            addMessage(greeting, false);
        }
        
        function toggleSleep() {
            sleeping = !sleeping;
            const btn = document.querySelector('.sleep-btn');
            btn.textContent = sleeping ? 'Wake' : 'Sleep';
            btn.classList.toggle('sleeping', sleeping);
        }
        
        function addMessage(text, isUser) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'ember');
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }
        
        // Mock sendMessage for design iteration
        async function sendMessage() {
            if (loading) return;
            
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            interactionCount++;
            
            if (sleeping) {
                addMessage("(sleeping)", false);
                return;
            }
            
            loading = true;
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ember loading';
            loadingMsg.textContent = 'thinking...';
            document.getElementById('messages').appendChild(loadingMsg);
            
            // Simulate response delay
            setTimeout(() => {
                loadingMsg.remove();
                
                // Mock responses for design testing
                const mockResponses = [
                    "I can help with that. What specifically would you like to know?",
                    "Let me check your Pod for that information...",
                    "That's an interesting question. Based on what I know from your files, here's what I found...",
                    "I've organized your files into categories: Projects, Documents, and Media. Would you like to see the breakdown?",
                ];
                
                addMessage(mockResponses[Math.floor(Math.random() * mockResponses.length)], false);
                loading = false;
            }, 1000);
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadGreeting();
            document.getElementById('input').focus();
        });
    </script>
</body>
</html>
