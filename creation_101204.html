<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Plane Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            cursor: none;
        }
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="instructions">Move mouse to control plane • Collect clouds for points • Avoid red storms!</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game variables
        let score = 0;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let gameSpeed = 2;

        // Plane object
        const plane = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 80,
            height: 60,
            speed: 0.1,
            angle: 0
        };

        // Arrays for game objects
        const clouds = [];
        const storms = [];
        const particles = [];
        const stars = [];

        // Initialize stars
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.5
            });
        }

        // Cloud class
        class Cloud {
            constructor() {
                this.x = canvas.width + Math.random() * 200;
                this.y = Math.random() * canvas.height;
                this.width = 80 + Math.random() * 40;
                this.height = 40 + Math.random() * 20;
                this.speed = Math.random() * 2 + gameSpeed;
                this.collected = false;
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                // Draw cloud shape
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width * 0.3, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.3, this.y, this.width * 0.4, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.6, this.y, this.width * 0.3, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.2, this.y - this.height * 0.2, this.width * 0.25, 0, Math.PI * 2);
                ctx.arc(this.x + this.width * 0.4, this.y - this.height * 0.1, this.width * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Storm class
        class Storm {
            constructor() {
                this.x = canvas.width + Math.random() * 200;
                this.y = Math.random() * canvas.height;
                this.radius = 40 + Math.random() * 30;
                this.speed = Math.random() * 2 + gameSpeed + 1;
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                ctx.fillStyle = 'rgba(139, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Lightning effect
                if (Math.random() < 0.1) {
                    ctx.strokeStyle = 'yellow';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - this.radius);
                    ctx.lineTo(this.x + Math.random() * 20 - 10, this.y);
                    ctx.lineTo(this.x + Math.random() * 20 - 10, this.y + this.radius);
                    ctx.stroke();
                }
            }
        }

        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 4 - 2;
                this.life = 1.0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.02;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 0, ${this.life})`;
                ctx.fillRect(this.x, this.y, 4, 4);
            }
        }

        // Draw plane function
        function drawPlane() {
            ctx.save();
            ctx.translate(plane.x, plane.y);
            ctx.rotate(plane.angle);
            
            // Plane body
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(-plane.width/2, -plane.height/4, plane.width, plane.height/2);
            
            // Wings
            ctx.fillStyle = '#4ECDC4';
            ctx.fillRect(-plane.width/3, -plane.height/2, plane.width*0.7, plane.height);
            
            // Cockpit
            ctx.fillStyle = '#45B7D1';
            ctx.beginPath();
            ctx.arc(plane.width/3, 0, plane.height/4, 0, Math.PI * 2);
            ctx.fill();
            
            // Tail
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.moveTo(-plane.width/2, -plane.height/4);
            ctx.lineTo(-plane.width/2 - 20, -plane.height/2);
            ctx.lineTo(-plane.width/2 - 20, plane.height/2);
            ctx.lineTo(-plane.width/2, plane.height/4);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        // Mouse move handler
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            mouseX = e.touches[0].clientX;
            mouseY = e.touches[0].clientY;
        });

        // Collision detection
        function checkCollision(obj1, obj2, radius = 0) {
            if (radius > 0) {
                // Circle collision for storms
                const dx = obj1.x - obj2.x;
                const dy = obj1.y - obj2.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < radius + plane.width/2;
            } else {
                // Rectangle collision for clouds
                return obj1.x < obj2.x + obj2.width &&
                       obj1.x + plane.width > obj2.x &&
                       obj1.y < obj2.y + obj2.height &&
                       obj1.y + plane.height > obj2.y;
            }
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw and update stars
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
                star.x -= star.speed;
                if (star.x < 0) {
                    star.x = canvas.width;
                }
            });
            
            // Update plane position with smooth movement
            const dx = mouseX - plane.x;
            const dy = mouseY - plane.y;
            plane.x += dx * plane.speed;
            plane.y += dy * plane.speed;
            
            // Calculate plane angle based on movement
            plane.angle = Math.atan2(dy, dx) * 0.1;
            
            // Generate new clouds
            if (Math.random() < 0.02) {
                clouds.push(new Cloud());
            }
            
            // Generate new storms
            if (Math.random() < 0.01) {
                storms.push(new Storm());
            }
            
            // Update and draw clouds
            for (let i = clouds.length - 1; i >= 0; i--) {
                const cloud = clouds[i];
                cloud.update();
                cloud.draw();
                
                // Check collision with plane
                if (!cloud.collected && checkCollision(plane, cloud)) {
                    cloud.collected = true;
                    score += 10;
                    document.getElementById('score').textContent = `Score: ${score}`;
                    
                    // Create particles
                    for (let j = 0; j < 10; j++) {
                        particles.push(new Particle(cloud.x + cloud.width/2, cloud.y));
                    }
                    
                    clouds.splice(i, 1);
                }
                
                // Remove off-screen clouds
                if (cloud.x < -cloud.width) {
                    clouds.splice(i, 1);
                }
            }
            
            // Update and draw storms
            for (let i = storms.length - 1; i >= 0; i--) {
                const storm = storms[i];
                storm.update();
                storm.draw();
                
                // Check collision with plane
                if (checkCollision(plane, storm, storm.radius)) {
                    score = Math.max(0, score - 20);
                    document.getElementById('score').textContent = `Score: ${score}`;
                    
                    // Create red particles
                    for (let j = 0; j < 15; j++) {
                        particles.push(new Particle(plane.x, plane.y));
                    }
                    
                    storms.splice(i, 1);
                }
                
                // Remove off-screen storms
                if (storm.x < -storm.radius * 2) {
                    storms.splice(i, 1);
                }
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                particle.draw();
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Draw plane
            drawPlane();
            
            // Draw plane trail
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(plane.x - plane.width/2, plane.y);
            ctx.lineTo(plane.x - plane.width/2 - 50, plane.y);
            ctx.stroke();
            
            // Increase difficulty over time
            if (score > 0 && score % 100 === 0) {
                gameSpeed += 0.5;
            }
            
            requestAnimationFrame(gameLoop);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start game
        gameLoop();
    </script>
</body>
</html>
