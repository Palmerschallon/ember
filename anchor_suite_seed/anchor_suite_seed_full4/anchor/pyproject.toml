[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-ledger"
version = "0.1.0"
description = "Anchor – a local, immutable ledger for your ideas."
authors = [
  { name = "Palmer Schallon", email = "example@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "requests>=2.0.0"
]

[project.scripts]
anchor = "anchor.cli:main"
