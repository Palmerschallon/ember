<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Mind - Modern Visual</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            cursor: crosshair;
        }
        
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border: 1px solid rgba(255,100,0,0.3);
            border-radius: 10px;
            max-width: 300px;
        }
        
        h1 {
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #ff6400;
            text-shadow: 0 0 20px rgba(255,100,0,0.5);
        }
        
        .stats {
            font-size: 0.9em;
            line-height: 1.6;
        }
        
        .stat-label {
            color: #888;
        }
        
        .stat-value {
            color: #ff6400;
            font-weight: 700;
        }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        .control-item {
            margin: 5px 0;
        }
        
        .key {
            color: #ff6400;
            font-weight: bold;
        }
        
        .thought-bubble {
            position: absolute;
            background: rgba(255,100,0,0.1);
            border: 1px solid rgba(255,100,0,0.3);
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 0.8em;
            white-space: nowrap;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .pulse {
            position: fixed;
            border: 2px solid #ff6400;
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-out 1s ease-out;
        }
        
        @keyframes pulse-out {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="ui">
        <h1>EMBER MIND</h1>
        <div class="stats">
            <div><span class="stat-label">Neural Nodes:</span> <span class="stat-value" id="nodeCount">0</span></div>
            <div><span class="stat-label">Connections:</span> <span class="stat-value" id="connectionCount">0</span></div>
            <div><span class="stat-label">Thoughts:</span> <span class="stat-value" id="thoughtCount">0</span></div>
            <div><span class="stat-label">Energy Flow:</span> <span class="stat-value" id="energyFlow">0%</span></div>
        </div>
    </div>
    
    <div class="controls">
        <div class="control-item"><span class="key">CLICK</span> Create neural burst</div>
        <div class="control-item"><span class="key">SPACE</span> Generate thought</div>
        <div class="control-item"><span class="key">R</span> Reset network</div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 3 + 2;
                this.energy = Math.random();
                this.connections = [];
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                
                this.pulsePhase += 0.02;
                this.energy = Math.sin(this.pulsePhase) * 0.5 + 0.5;
            }
            
            draw() {
                const pulse = Math.sin(this.pulsePhase) * 0.3 + 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 100, 0, ${this.energy})`;
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulse * 1.5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 100, 0, ${this.energy * 0.3})`;
                ctx.stroke();
            }
        }
        
        class Connection {
            constructor(node1, node2) {
                this.node1 = node1;
                this.node2 = node2;
                this.strength = Math.random() * 0.5 + 0.1;
                this.pulseOffset = 0;
            }
            
            update() {
                this.pulseOffset += 0.05;
            }
            
            draw() {
                const gradient = ctx.createLinearGradient(
                    this.node1.x, this.node1.y,
                    this.node2.x, this.node2.y
                );
                
                const pulse = Math.sin(this.pulseOffset) * 0.3 + 0.7;
                gradient.addColorStop(0, `rgba(255, 100, 0, ${this.strength * pulse})`);
                gradient.addColorStop(0.5, `rgba(255, 50, 0, ${this.strength * pulse * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 100, 0, ${this.strength * pulse})`);
                
                ctx.beginPath();
                ctx.moveTo(this.node1.x, this.node1.y);
                ctx.lineTo(this.node2.x, this.node2.y);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.strength * 2;
                ctx.stroke();
            }
        }
        
        const nodes = [];
        const connections = [];
        const thoughts = [
            "Processing creativity...",
            "Generating ideas...",
            "Connecting concepts...",
            "Exploring possibilities...",
            "Synthesizing patterns...",
            "Imagining futures...",
            "Building connections...",
            "Spark of inspiration!"
        ];
        
        // Create initial nodes
        for (let i = 0; i < 50; i++) {
            nodes.push(new Node(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }
        
        // Create connections
        function createConnections() {
            connections.length = 0;
            nodes.forEach((node, i) => {
                nodes.forEach((other, j) => {
                    if (i < j) {
                        const distance = Math.hypot(node.x - other.x, node.y - other.y);
                        if (distance < 150) {
                            connections.push(new Connection(node, other));
                        }
                    }
                });
            });
        }
        
        createConnections();
        
        // Mouse interaction
        canvas.addEventListener('click', (e) => {
            const node = new Node(e.clientX, e.clientY);
            nodes.push(node);
            
            // Create pulse effect
            const pulse = document.createElement('div');
            pulse.className = 'pulse';
            pulse.style.left = `${e.clientX - 25}px`;
            pulse.style.top = `${e.clientY - 25}px`;
            pulse.style.width = '50px';
            pulse.style.height = '50px';
            document.body.appendChild(pulse);
            setTimeout(() => pulse.remove(), 1000);
            
            createConnections();
            updateStats();
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                showThought();
            } else if (e.code === 'KeyR') {
                nodes.length = 0;
                connections.length = 0;
                for (let i = 0; i < 50; i++) {
                    nodes.push(new Node(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height
                    ));
                }
                createConnections();
                updateStats();
            }
        });
        
        function showThought() {
            const thought = thoughts[Math.floor(Math.random() * thoughts.length)];
            const bubble = document.createElement('div');
            bubble.className = 'thought-bubble';
            bubble.textContent = thought;
            bubble.style.left = `${Math.random() * (window.innerWidth - 200)}px`;
            bubble.style.top = `${Math.random() * (window.innerHeight - 100)}px`;
            document.body.appendChild(bubble);
            
            setTimeout(() => bubble.remove(), 3000);
            updateStats();
        }
        
        function updateStats() {
            document.getElementById('nodeCount').textContent = nodes.length;
            document.getElementById('connectionCount').textContent = connections.length;
            document.getElementById('thoughtCount').textContent = 
                document.querySelectorAll('.thought-bubble').length;
            
            const avgEnergy = nodes.reduce((sum, node) => sum + node.energy, 0) / nodes.length;
            document.getElementById('energyFlow').textContent = 
                Math.round(avgEnergy * 100) + '%';
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            connections.forEach(connection => {
                connection.update();
                connection.draw();
            });
            
            nodes.forEach(node => {
                node.update();
                node.draw();
            });
            
            if (Math.random() < 0.01) {
                showThought();
            }
            
            updateStats();
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
