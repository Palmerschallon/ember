<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1a2a" stop-opacity="1"/>
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur class="blur" stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#backgroundGradient)"/>
  
  <g transform="translate(400,300)">
    <path d="M0,0 
             Q150,100 250,50 
             T400,-100 
             Q200,-200 0,-150 
             T-250,50 
             Q-150,100 0,0" 
          fill="none" 
          stroke="rgba(55,200,220,0.4)" 
          stroke-width="3"
          filter="url(#glow)"/>
    
    <g opacity="0.7">
      <circle cx="0" cy="0" r="40" fill="rgba(100,220,180,0.2)" filter="url(#glow)"/>
      <circle cx="150" cy="100" r="30" fill="rgba(220,100,150,0.2)" filter="url(#glow)"/>
      <circle cx="250" cy="50" r="25" fill="rgba(100,150,220,0.2)" filter="url(#glow)"/>
      <circle cx="400" cy="-100" r="35" fill="rgba(200,100,220,0.2)" filter="url(#glow)"/>
      <circle cx="-250" cy="50" r="28" fill="rgba(220,180,100,0.2)" filter="url(#glow)"/>
      <circle cx="-150" cy="100" r="32" fill="rgba(100,220,150,0.2)" filter="url(#glow)"/>
    </g>
    
    <g stroke="rgba(100,220,220,0.3)" stroke-width="2">
      <line x1="0" y1="0" x2="150" y2="100" />
      <line x1="150" y1="100" x2="250" y2="50" />
      <line x1="250" y1="50" x2="400" y2="-100" />
      <line x1="0" y1="0" x2="-250" y2="50" />
      <line x1="-250" y1="50" x2="-150" y2="100" />
    </g>
  </g>
</svg>