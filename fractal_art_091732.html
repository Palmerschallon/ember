<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mandelbrot Fractal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            cursor: zoom-in;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            user-select: none;
        }
        .controls h3 {
            margin: 0 0 10px 0;
            color: #bd9ee5;
        }
        .controls p {
            margin: 5px 0;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9ff287;
            font-size: 18px;
            display: none;
        }
        button {
            background: #c30091;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #a00079;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <h3>Mandelbrot Explorer</h3>
        <p>Click to zoom in</p>
        <p>Right-click to zoom out</p>
        <p>Zoom level: <span id="zoomLevel">1.0</span>x</p>
        <button onclick="resetView()">Reset View</button>
    </div>
    <div class="loading" id="loading">Calculating fractal...</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const zoomLevelDisplay = document.getElementById('zoomLevel');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            drawFractal();
        });
        
        // Color palette
        const colors = [
            { r: 195, g: 0, b: 145 },    // #c30091
            { r: 189, g: 158, b: 229 },  // #bd9ee5
            { r: 159, g: 242, b: 135 }   // #9ff287
        ];
        
        // Fractal parameters
        let centerX = -0.5;
        let centerY = 0;
        let zoom = 1;
        let maxIterations = 100;
        
        // Convert pixel coordinates to complex plane coordinates
        function pixelToComplex(px, py) {
            const scale = 3 / zoom;
            const x = (px - canvas.width / 2) * scale / canvas.width + centerX;
            const y = (py - canvas.height / 2) * scale / canvas.height + centerY;
            return { x, y };
        }
        
        // Calculate Mandelbrot set membership
        function mandelbrot(cx, cy) {
            let x = 0;
            let y = 0;
            let iteration = 0;
            
            while (x * x + y * y <= 4 && iteration < maxIterations) {
                const xtemp = x * x - y * y + cx;
                y = 2 * x * y + cy;
                x = xtemp;
                iteration++;
            }
            
            if (iteration === maxIterations) {
                return { iteration, smooth: 0 };
            }
            
            // Smooth coloring
            const smooth = iteration + 1 - Math.log(Math.log(Math.sqrt(x * x + y * y))) / Math.log(2);
            return { iteration, smooth };
        }
        
        // Interpolate between colors
        function getColor(value) {
            if (value === 0) return { r: 0, g: 0, b: 0 };
            
            // Map value to color range
            const colorValue = (value / maxIterations) * colors.length;
            const index1 = Math.floor(colorValue) % colors.length;
            const index2 = (index1 + 1) % colors.length;
            const t = colorValue - Math.floor(colorValue);
            
            // Smooth interpolation
            const smoothT = t * t * (3 - 2 * t);
            
            return {
                r: Math.floor(colors[index1].r + (colors[index2].r - colors[index1].r) * smoothT),
                g: Math.floor(colors[index1].g + (colors[index2].g - colors[index1].g) * smoothT),
                b: Math.floor(colors[index1].b + (colors[index2].b - colors[index1].b) * smoothT)
            };
        }
        
        // Draw the fractal
        function drawFractal() {
            loading.style.display = 'block';
            
            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            
            // Use requestAnimationFrame to prevent blocking
            let y = 0;
            
            function drawRow() {
                const rowsPerFrame = 5; // Adjust for performance
                
                for (let row = 0; row < rowsPerFrame && y < canvas.height; row++, y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const c = pixelToComplex(x, y);
                        const result = mandelbrot(c.x, c.y);
                        
                        let color;
                        if (result.iteration === maxIterations) {
                            // Inside the set - use a dark purple
                            color = { r: 40, g: 0, b: 30 };
                        } else {
                            // Outside the set - use smooth coloring
                            color = getColor(result.smooth);
                        }
                        
                        const index = (y * canvas.width + x) * 4;
                        data[index] = color.r;
                        data[index + 1] = color.g;
                        data[index + 2] = color.b;
                        data[index + 3] = 255;
                    }
                }
                
                if (y < canvas.height) {
                    requestAnimationFrame(drawRow);
                } else {
                    ctx.putImageData(imageData, 0, 0);
                    loading.style.display = 'none';
                    
                    // Add subtle gradient overlay for depth
                    const gradient = ctx.createRadialGradient(
                        canvas.width / 2, canvas.height / 2, 0,
                        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) / 2
                    );
                    gradient.addColorStop(0, 'rgba(189, 158, 229, 0.05)');
                    gradient.addColorStop(1, 'rgba(195, 0, 145, 0.1)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            drawRow();
        }
        
        // Mouse click handler for zooming
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            
            const c = pixelToComplex(px, py);
            centerX = c.x;
            centerY = c.y;
            zoom *= 2;
            
            // Increase iterations as we zoom in for more detail
            maxIterations = Math.min(100 + Math.floor(Math.log2(zoom) * 20), 500);
            
            updateZoomDisplay();
            drawFractal();
        });
        
        // Right-click to zoom out
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            zoom = Math.max(zoom / 2, 0.5);
            maxIterations = Math.max(100, maxIterations - 20);
            
            updateZoomDisplay();
            drawFractal();
        });
        
        // Update zoom level display
        function updateZoomDisplay() {
            zoomLevelDisplay.textContent = zoom.toFixed(1);
        }
        
        // Reset view
        function resetView() {
            centerX = -0.5;
            centerY = 0;
            zoom = 1;
            maxIterations = 100;
            updateZoomDisplay();
            drawFractal();
        }
        
        // Initial draw
        drawFractal();
    </script>
</body>
</html>
