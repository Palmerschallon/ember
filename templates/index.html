<!DOCTYPE html>
<html>
<head>
    <title>Ember</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a1a1a;
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .status {
            font-size: 12px;
            color: #888;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            margin-bottom: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background: #1e3a5f;
            margin-left: auto;
        }
        .ember-message {
            background: #1a1a1a;
            border: 1px solid #333;
        }
        .tools-used {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            font-family: monospace;
        }
        .input-area {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 20px;
            display: flex;
            gap: 10px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #1e3a5f;
        }
        button {
            background: #1e3a5f;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2a4a7f;
        }
        button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .thinking {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>EMBER</h1>
        <div class="status" id="status">Pod: 0 KB | Patterns: 0</div>
    </div>
    
    <div class="chat-container" id="chat"></div>
    
    <div class="input-area">
        <input type="text" id="input" placeholder="What do you want to make?" autofocus>
        <button id="send">Send</button>
    </div>
    
    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        
        function addMessage(text, isUser, toolsUsed) {
            const msg = document.createElement('div');
            msg.className = 'message ' + (isUser ? 'user-message' : 'ember-message');
            msg.textContent = text;
            
            if (toolsUsed && toolsUsed.length > 0) {
                const tools = document.createElement('div');
                tools.className = 'tools-used';
                tools.textContent = '🔧 ' + toolsUsed.join(' → ');
                msg.appendChild(tools);
            }
            
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }
        
        async function updateStatus() {
            const res = await fetch('/status');
            const data = await res.json();
            document.getElementById('status').textContent = 
                `Pod: ${data.pod_size_kb} KB | Patterns: ${data.patterns_learned}`;
        }
        
        async function send() {
            const message = input.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            sendBtn.disabled = true;
            
            addMessage('Thinking...', false);
            
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                const data = await res.json();
                
                chat.removeChild(chat.lastChild); // Remove "Thinking..."
                addMessage(data.response, false, data.tools_used);
                updateStatus();
            } catch (err) {
                chat.removeChild(chat.lastChild);
                addMessage('Error: ' + err.message, false);
            }
            
            sendBtn.disabled = false;
            input.focus();
        }
        
        sendBtn.onclick = send;
        input.onkeypress = (e) => { if (e.key === 'Enter') send(); };
        
        // Initial status
        updateStatus();
        
        // Welcome message
        addMessage('Hi. I'm Ember.\n\nI can organize files, search, read, and write.\n\nWhat do you want to do?', false);
    </script>
</body>
</html>
