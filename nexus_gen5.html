<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Generation 5 - Quantum Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0ff;
            font-size: 12px;
            text-shadow: 0 0 10px #0ff;
            pointer-events: none;
            z-index: 10;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 11px;
            text-align: center;
            opacity: 0.7;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">
        NEXUS GEN-5 | QUANTUM WEB<br>
        NODES: <span id="nodeCount">0</span><br>
        CONNECTIONS: <span id="connCount">0</span><br>
        ENERGY: <span id="energy">100</span>%
    </div>
    
    <div id="controls">
        CLICK: Add Node | SPACE: Pulse | R: Reset | M: Toggle Mode
    </div>
    
    <canvas id="nexusCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // System state
        let nodes = [];
        let connections = [];
        let particles = [];
        let pulseWaves = [];
        let energy = 100;
        let mode = 'quantum'; // quantum, neural, cosmic
        let time = 0;
        
        // Node class
        class Node {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = 4 + Math.random() * 4;
                this.energy = 1;
                this.hue = Math.random() * 360;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.type = Math.random() > 0.7 ? 'core' : 'standard';
            }
            
            update() {
                // Quantum fluctuation
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;
                
                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Boundary wrapping
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                // Energy pulsing
                this.energy = 0.5 + 0.5 * Math.sin(time * 0.02 + this.pulsePhase);
            }
            
            draw() {
                const glowSize = this.radius * (1 + this.energy);
                
                // Outer glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize * 3);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 50%, ${0.3 * this.energy})`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - glowSize * 3, this.y - glowSize * 3, glowSize * 6, glowSize * 6);
                
                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${0.8 + this.energy * 0.2})`;
                ctx.fill();
                
                // Inner core
                if (this.type === 'core') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
            }
        }
        
        // Connection class
        class Connection {
            constructor(node1, node2) {
                this.node1 = node1;
                this.node2 = node2;
                this.strength = 0.5 + Math.random() * 0.5;
                this.pulseOffset = Math.random() * Math.PI * 2;
            }
            
            draw() {
                const dx = this.node2.x - this.node1.x;
                const dy = this.node2.y - this.node1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 200) return;
                
                const opacity = (1 - distance / 200) * this.strength;
                const pulse = Math.sin(time * 0.03 + this.pulseOffset) * 0.5 + 0.5;
                
                ctx.beginPath();
                ctx.moveTo(this.node1.x, this.node1.y);
                
                // Quantum entanglement effect
                const midX = (this.node1.x + this.node2.x) / 2;
                const midY = (this.node1.y + this.node2.y) / 2;
                const offsetX = Math.sin(time * 0.02 + distance) * 20;
                const offsetY = Math.cos(time * 0.02 + distance) * 20;
                
                ctx.quadraticCurveTo(midX + offsetX, midY + offsetY, this.node2.x, this.node2.y);
                
                ctx.strokeStyle = `hsla(${(this.node1.hue + this.node2.hue) / 2}, 100%, 50%, ${opacity * pulse})`;
                ctx.lineWidth = 1 + pulse;
                ctx.stroke();
                
                // Energy particles along connection
                if (Math.random() < 0.02) {
                    particles.push(new Particle(this.node1.x, this.node1.y, this.node2.x, this.node2.y));
                }
            }
        }
        
        // Particle class
        class Particle {
            constructor(x1, y1, x2, y2) {
                this.x = x1;
                this.y = y1;
                this.targetX = x2;
                this.targetY = y2;
                this.life = 1;
                this.speed = 0.02 + Math.random() * 0.02;
            }
            
            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                this.life -= 0.01;
                return this.life > 0;
            }
            
            draw() {
                ctx.fillStyle = `hsla(180, 100%, 50%, ${this.life})`;
                ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
            }
        }
        
        // Pulse wave class
        class PulseWave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 300;
                this.life = 1;
            }
            
            update() {
                this.radius += 5;
                this.life = 1 - (this.radius / this.maxRadius);
                return this.life > 0;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(200, 100%, 50%, ${this.life * 0.5})`;
                ctx.lineWidth = 2 * this.life;
                ctx.stroke();
            }
        }
        
        // Initialize system
        function init() {
            // Create initial nodes
            for (let i = 0; i < 8; i++) {
                nodes.push(new Node(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }
            
            // Create connections
            updateConnections();
        }
        
        // Update connections based on proximity
        function updateConnections() {
            connections = [];
            
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[j].x - nodes[i].x;
                    const dy = nodes[j].y - nodes[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200) {
                        connections.push(new Connection(nodes[i], nodes[j]));
                    }
                }
            }
        }
        
        // Main animation loop
        function animate() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update time
            time++;
            
            // Update and draw connections
            updateConnections();
            connections.forEach(conn => conn.draw());
            
            // Update and draw nodes
            nodes.forEach(node => {
                node.update();
                node.draw();
            });
            
            // Update and draw particles
            particles = particles.filter(particle => {
                particle.update();
                particle.draw();
                return particle.life > 0;
            });
            
            // Update and draw pulse waves
            pulseWaves = pulseWaves.filter(wave => {
                wave.update();
                wave.draw();
                return wave.life > 0;
            });
            
            // Update energy
            energy = Math.max(0, energy - 0.01);
            if (nodes.length > 0) {
                energy = Math.min(100, energy + 0.02);
            }
            
            // Update UI
            document.getElementById('nodeCount').textContent = nodes.length;
            document.getElementById('connCount').textContent = connections.length;
            document.getElementById('energy').textContent = Math.floor(energy);
            
            requestAnimationFrame(animate);
        }
        
        // Event handlers
        canvas.addEventListener('click', (e) => {
            nodes.push(new Node(e.clientX, e.clientY));
            pulseWaves.push(new PulseWave(e.clientX, e.clientY));
            energy = Math.min(100, energy + 5);
        });
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case ' ':
                    // Create pulse at center
                    pulseWaves.push(new PulseWave(canvas.width / 2, canvas.height / 2));
                    break;
                case 'r':
                    // Reset
                    nodes = [];
                    connections = [];
                    particles = [];
                    pulseWaves = [];
                    energy = 100;
                    init();
                    break;
                case 'm':
                    // Toggle mode
                    const modes = ['quantum', 'neural', 'cosmic'];
                    const currentIndex = modes.indexOf(mode);
                    mode = modes[(currentIndex + 1) % modes.length];
                    console.log('Mode:', mode);
                    break;
            }
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Start
        init();
        animate();
    </script>
</body>
</html>
