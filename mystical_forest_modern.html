<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Forest - Modern Experience</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-size: 28px;
            font-weight: 200;
            letter-spacing: 3px;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            opacity: 0;
            animation: fadeIn 2s ease-out 0.5s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1 class="title">MYSTICAL FOREST</h1>
        <p class="subtitle">Move your mouse to explore the magic</p>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let time = 0;

        // Particle system for fireflies
        class Firefly {
            constructor() {
                this.reset();
                this.phase = Math.random() * Math.PI * 2;
                this.speed = 0.5 + Math.random() * 1.5;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 3 + 1;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.hue = 60 + Math.random() * 60; // Yellow-green range
            }

            update() {
                // Wander behavior
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;
                
                // Attract to mouse slightly
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 200) {
                    this.vx += dx * 0.0001;
                    this.vy += dy * 0.0001;
                }
                
                // Apply velocity
                this.x += this.vx * this.speed;
                this.y += this.vy * this.speed;
                
                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                // Wrap around screen
                if (this.x < -50) this.x = width + 50;
                if (this.x > width + 50) this.x = -50;
                if (this.y < -50) this.y = height + 50;
                if (this.y > height + 50) this.y = -50;
                
                // Pulsing glow effect
                this.phase += 0.05;
                
                // Life decay
                this.life -= this.decay;
                if (this.life <= 0) {
                    this.reset();
                }
            }

            draw() {
                const brightness = Math.sin(this.phase) * 0.5 + 0.5;
                const alpha = this.life * brightness;
                
                // Glow effect
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                
                // Outer glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 10);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha})`);
                gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 50%, ${alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 30%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - this.size * 10, this.y - this.size * 10, this.size * 20, this.size * 20);
                
                // Inner bright core
                ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Tree class for the mystical forest
        class Tree {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.height = 100 + Math.random() * 200;
                this.branches = [];
                this.swayPhase = Math.random() * Math.PI * 2;
                this.swaySpeed = 0.01 + Math.random() * 0.02;
                this.thickness = 10 + Math.random() * 20;
                this.generateBranches();
            }

            generateBranches() {
                const branchCount = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < branchCount; i++) {
                    this.branches.push({
                        angle: (Math.random() - 0.5) * Math.PI * 0.8,
                        length: this.height * (0.3 + Math.random() * 0.4),
                        position: 0.3 + Math.random() * 0.5,
                        thickness: this.thickness * (0.3 + Math.random() * 0.4)
                    });
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Sway effect
                const sway = Math.sin(this.swayPhase + time * this.swaySpeed) * 5;
                ctx.rotate(sway * 0.01);
                
                // Draw trunk
                const gradient = ctx.createLinearGradient(0, 0, 0, -this.height);
                gradient.addColorStop(0, '#1a1a1a');
                gradient.addColorStop(0.5, '#2a2a3a');
                gradient.addColorStop(1, '#3a3a4a');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -this.height);
                ctx.stroke();
                
                // Draw branches
                this.branches.forEach(branch => {
                    ctx.save();
                    ctx.translate(0, -this.height * branch.position);
                    ctx.rotate(branch.angle + sway * 0.02);
                    
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = branch.thickness;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -branch.length);
                    ctx.stroke();
                    
                    // Mystical leaves (glowing dots)
                    const leafCount = Math.floor(branch.length / 20);
                    for (let i = 0; i < leafCount; i++) {
                        const leafPos = (i / leafCount) * branch.length;
                        const leafX = (Math.random() - 0.5) * 20;
                        const glowSize = 2 + Math.sin(time * 0.05 + i) * 1;
                        
                        ctx.fillStyle = `hsla(${120 + Math.sin(time * 0.02 + i) * 30}, 70%, 60%, 0.8)`;
                        ctx.beginPath();
                        ctx.arc(leafX, -leafPos, glowSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    ctx.restore();
                });
                
                ctx.restore();
            }
        }

        // Fog/mist particle
        class FogParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = -Math.random() * 0.1 - 0.05;
                this.size = Math.random() * 100 + 50;
                this.alpha = 0;
                this.targetAlpha = Math.random() * 0.1 + 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Fade in/out
                if (this.alpha < this.targetAlpha) {
                    this.alpha += 0.001;
                }
                
                // Reset when off screen
                if (this.y < -this.size) {
                    this.y = height + this.size;
                    this.x = Math.random() * width;
                }
                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                gradient.addColorStop(0, 'rgba(100, 120, 150, 0.3)');
                gradient.addColorStop(0.5, 'rgba(80, 100, 130, 0.1)');
                gradient.addColorStop(1, 'rgba(60, 80, 110, 0)');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                ctx.restore();
            }
        }

        // Initialize scene
        const fireflies = Array(50).fill().map(() => new Firefly());
        const trees = Array(15).fill().map(() => new Tree(Math.random() * width, height - 50));
        const fog = Array(10).fill().map(() => new FogParticle());

        // Mouse tracking
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Handle resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Animation loop
        function animate() {
            time += 0.016;
            
            // Create gradient background
            const bgGradient = ctx.createRadialGradient(width/2, height, 0, width/2, height/2, height);
            bgGradient.addColorStop(0, '#0a0a1a');
            bgGradient.addColorStop(0.5, '#0f1a2a');
            bgGradient.addColorStop(1, '#1a2a3a');
            
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);
            
            // Draw fog first
            fog.forEach(f => {
                f.update();
                f.draw();
            });
            
            // Draw trees
            trees.sort((a, b) => a.y - b.y); // Depth sorting
            trees.forEach(tree => tree.draw());
            
            // Draw fireflies
            fireflies.forEach(firefly => {
                firefly.update();
                firefly.draw();
            });
            
            // Ambient light from cursor
            const cursorGradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 200);
            cursorGradient.addColorStop(0, 'rgba(100, 150, 200, 0.1)');
            cursorGradient.addColorStop(0.5, 'rgba(80, 120, 180, 0.05)');
            cursorGradient.addColorStop(1, 'rgba(60, 100, 160, 0)');
            
            ctx.fillStyle = cursorGradient;
            ctx.fillRect(mouseX - 200, mouseY - 200, 400, 400);
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
