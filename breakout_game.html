<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        .info {
            position: absolute;
            top: 20px;
            color: #fff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 40px;
            display: none;
            text-align: center;
        }
        .game-over button {
            font-size: 20px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
            background: #0ff;
            border: none;
            color: #000;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="info">
        <div>Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
        <div style="margin-top: 10px; font-size: 14px;">Use Arrow Keys or Mouse to move paddle</div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="game-over" id="gameOver">
        <div id="gameOverText"></div>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game variables
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        
        // Paddle
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 20,
            width: 100,
            height: 10,
            dx: 7
        };
        
        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 8,
            dx: 4,
            dy: -4
        };
        
        // Bricks
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickWidth = 65;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;
        
        let bricks = [];
        function initBricks() {
            for(let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for(let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1,
                        color: `hsl(${r * 60}, 100%, 50%)`
                    };
                }
            }
        }
        initBricks();
        
        // Controls
        let rightPressed = false;
        let leftPressed = false;
        
        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        document.addEventListener("mousemove", mouseMoveHandler, false);
        
        function keyDownHandler(e) {
            if(e.key == "Right" || e.key == "ArrowRight") {
                rightPressed = true;
            }
            else if(e.key == "Left" || e.key == "ArrowLeft") {
                leftPressed = true;
            }
        }
        
        function keyUpHandler(e) {
            if(e.key == "Right" || e.key == "ArrowRight") {
                rightPressed = false;
            }
            else if(e.key == "Left" || e.key == "ArrowLeft") {
                leftPressed = false;
            }
        }
        
        function mouseMoveHandler(e) {
            const relativeX = e.clientX - canvas.offsetLeft;
            if(relativeX > 0 && relativeX < canvas.width) {
                paddle.x = relativeX - paddle.width / 2;
            }
        }
        
        // Collision detection
        function collisionDetection() {
            for(let c = 0; c < brickColumnCount; c++) {
                for(let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if(b.status == 1) {
                        if(ball.x > b.x && ball.x < b.x + brickWidth && 
                           ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            document.getElementById('score').textContent = score;
                            
                            // Check if all bricks are destroyed
                            if(score == brickRowCount * brickColumnCount * 10) {
                                gameRunning = false;
                                document.getElementById('gameOverText').textContent = 'YOU WIN! 🎉';
                                document.getElementById('gameOver').style.display = 'block';
                            }
                        }
                    }
                }
            }
        }
        
        // Drawing functions
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();
        }
        
        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = "#0ff";
            ctx.fill();
            ctx.closePath();
        }
        
        function drawBricks() {
            for(let c = 0; c < brickColumnCount; c++) {
                for(let r = 0; r < brickRowCount; r++) {
                    if(bricks[c][r].status == 1) {
                        const brickX = (c*(brickWidth+brickPadding))+brickOffsetLeft;
                        const brickY = (r*(brickHeight+brickPadding))+brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }
        
        function draw() {
            if(!gameRunning) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();
            
            // Ball collision with walls
            if(ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if(ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }
            else if(ball.y + ball.dy > canvas.height - ball.radius) {
                // Ball hit paddle
                if(ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // Calculate hit position for angle
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.dx = 8 * (hitPos - 0.5);
                    ball.dy = -ball.dy;
                }
                else {
                    // Ball missed paddle
                    lives--;
                    document.getElementById('lives').textContent = lives;
                    if(lives <= 0) {
                        gameRunning = false;
                        document.getElementById('gameOverText').textContent = 'GAME OVER';
                        document.getElementById('gameOver').style.display = 'block';
                    }
                    else {
                        ball.x = canvas.width / 2;
                        ball.y = canvas.height - 30;
                        ball.dx = 4;
                        ball.dy = -4;
                        paddle.x = canvas.width / 2 - 50;
                    }
                }
            }
            
            // Move paddle
            if(rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.dx;
            }
            else if(leftPressed && paddle.x > 0) {
                paddle.x -= paddle.dx;
            }
            
            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            requestAnimationFrame(draw);
        }
        
        function resetGame() {
            score = 0;
            lives = 3;
            gameRunning = true;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 30;
            ball.dx = 4;
            ball.dy = -4;
            paddle.x = canvas.width / 2 - 50;
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('gameOver').style.display = 'none';
            initBricks();
            draw();
        }
        
        draw();
    </script>
</body>
</html>
