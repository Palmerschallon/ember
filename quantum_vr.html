<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Creatures VR - Modern Edition</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #0a0a0a;
        }
        
        #vr-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 20px;
            color: #00ffff;
            font-size: 14px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .quantum-state {
            margin: 5px 0;
            opacity: 0.8;
        }
        
        #enter-vr-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 30px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }
        
        #enter-vr-button:hover {
            background: #ffffff;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
</head>
<body>
    <div id="info-panel">
        <h3>Quantum Creatures VR</h3>
        <div class="quantum-state">Wave Function: <span id="wave-state">Superposition</span></div>
        <div class="quantum-state">Entangled Pairs: <span id="entangled">0</span></div>
        <div class="quantum-state">Quantum Probability: <span id="probability">100%</span></div>
        <div class="quantum-state">Look around to interact!</div>
    </div>
    
    <button id="enter-vr-button">Enter VR</button>
    
    <a-scene id="vr-container" vr-mode-ui="enabled: true" background="color: #001122">
        <!-- Quantum Environment -->
        <a-entity environment="preset: starry; groundColor: #001133; skyColor: #000011"></a-entity>
        
        <!-- Quantum Particles -->
        <a-entity id="quantum-field" position="0 2 0" particle-system="
            preset: dust;
            particleCount: 2000;
            color: #00ffff, #ff00ff, #ffff00;
            size: 0.5;
            velocityValue: 0 0.1 0;
            velocitySpread: 0.5 0 0.5;
            accelerationValue: 0 -0.001 0;
            opacity: 0.3, 1;
            blending: 1
        "></a-entity>
        
        <!-- Quantum Creatures -->
        <!-- Schrödinger's Cat Entity -->
        <a-entity id="quantum-cat" position="-3 1.5 -5">
            <a-sphere radius="0.6" color="#00ff88" opacity="0.7" animation="property: opacity; to: 0.3; dur: 2000; dir: alternate; loop: true"></a-sphere>
            <a-sphere radius="0.4" position="0 0.8 0" color="#00ff88" opacity="0.7"></a-sphere>
            <a-box width="0.1" height="0.4" depth="0.1" position="-0.2 -0.5 0.2" color="#00ff88" opacity="0.7"></a-box>
            <a-box width="0.1" height="0.4" depth="0.1" position="0.2 -0.5 0.2" color="#00ff88" opacity="0.7"></a-box>
            <a-cone radius-bottom="0.3" radius-top="0" height="0.5" position="0 0 -0.5" rotation="90 0 0" color="#00ff88" opacity="0.7"></a-cone>
            <a-text value="Quantum Cat" position="0 1.5 0" align="center" color="#00ffff" scale="0.5 0.5 0.5"></a-text>
            
            <!-- Quantum superposition effect -->
            <a-sphere radius="0.6" color="#ff0088" opacity="0.3" position="1 0 0" animation="property: position; to: -1 0 0; dur: 3000; dir: alternate; loop: true"></a-sphere>
        </a-entity>
        
        <!-- Wave-Particle Duality Bird -->
        <a-entity id="wave-bird" position="3 3 -4" animation="property: position; to: 3 4 -4; dur: 2000; dir: alternate; loop: true">
            <a-sphere radius="0.3" color="#ffff00" opacity="0.8"></a-sphere>
            <a-cone radius-bottom="0.2" radius-top="0.4" height="0.6" position="-0.5 0 0" rotation="0 0 90" color="#ffff00" opacity="0.8"></a-cone>
            <a-cone radius-bottom="0.2" radius-top="0.4" height="0.6" position="0.5 0 0" rotation="0 0 -90" color="#ffff00" opacity="0.8"></a-cone>
            
            <!-- Wave representation -->
            <a-torus radius="1" radius-tubular="0.02" color="#ffff00" opacity="0.4" animation="property: scale; to: 1.5 1.5 1.5; dur: 1000; dir: alternate; loop: true"></a-torus>
        </a-entity>
        
        <!-- Quantum Tunneling Mole -->
        <a-entity id="tunnel-mole" position="0 0.5 -6">
            <a-sphere radius="0.5" color="#8B4513" opacity="0.8"></a-sphere>
            <a-sphere radius="0.15" position="-0.2 0.1 0.4" color="#FFC0CB"></a-sphere>
            <a-sphere radius="0.15" position="0.2 0.1 0.4" color="#FFC0CB"></a-sphere>
            
            <!-- Tunneling effect -->
            <a-animation attribute="position" from="0 0.5 -6" to="0 0.5 -3" dur="3000" direction="alternate" repeat="indefinite"></a-animation>
            <a-animation attribute="opacity" from="0.8" to="0.2" dur="1500" direction="alternate" repeat="indefinite"></a-animation>
        </a-entity>
        
        <!-- Entangled Butterflies -->
        <a-entity id="butterfly1" position="-2 2 -3">
            <a-sphere radius="0.2" color="#ff00ff"></a-sphere>
            <a-plane width="0.4" height="0.3" position="-0.3 0 0" rotation="0 30 0" color="#ff00ff" opacity="0.7"></a-plane>
            <a-plane width="0.4" height="0.3" position="0.3 0 0" rotation="0 -30 0" color="#ff00ff" opacity="0.7"></a-plane>
            <a-animation attribute="rotation" to="0 360 0" dur="5000" repeat="indefinite"></a-animation>
        </a-entity>
        
        <a-entity id="butterfly2" position="2 2 -3">
            <a-sphere radius="0.2" color="#00ffff"></a-sphere>
            <a-plane width="0.4" height="0.3" position="-0.3 0 0" rotation="0 30 0" color="#00ffff" opacity="0.7"></a-plane>
            <a-plane width="0.4" height="0.3" position="0.3 0 0" rotation="0 -30 0" color="#00ffff" opacity="0.7"></a-plane>
            <a-animation attribute="rotation" to="0 -360 0" dur="5000" repeat="indefinite"></a-animation>
        </a-entity>
        
        <!-- Quantum Energy Orbs -->
        <a-entity id="energy-orb1" position="-4 1 -2" geometry="primitive: sphere; radius: 0.3" material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 2" animation="property: position; to: -4 3 -2; dur: 3000; dir: alternate; loop: true"></a-entity>
        
        <a-entity id="energy-orb2" position="4 1 -2" geometry="primitive: sphere; radius: 0.3" material="color: #ff00ff; emissive: #ff00ff; emissiveIntensity: 2" animation="property: position; to: 4 3 -2; dur: 3000; dir: alternate; loop: true"></a-entity>
        
        <!-- Interactive Quantum Portal -->
        <a-entity id="quantum-portal" position="0 2 -8">
            <a-torus radius="2" radius-tubular="0.1" color="#00ffff" opacity="0.5" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true"></a-torus>
            <a-torus radius="1.5" radius-tubular="0.1" color="#ff00ff" opacity="0.5" animation="property: rotation; to: 0 -360 0; dur: 8000; loop: true"></a-torus>
            <a-torus radius="1" radius-tubular="0.1" color="#ffff00" opacity="0.5" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true"></a-torus>
        </a-entity>
        
        <!-- VR Camera with controls -->
        <a-entity camera look-controls wasd-controls position="0 1.6 0">
            <a-cursor color="#00ffff" fuse="true" fuse-timeout="1500"></a-cursor>
        </a-entity>
        
        <!-- Ambient lighting -->
        <a-light type="ambient" color="#001144"></a-light>
        <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.5"></a-light>
    </a-scene>
    
    <script>
        // Quantum state management
        let waveStates = ['Superposition', 'Collapsed', 'Entangled', 'Tunneling'];
        let currentState = 0;
        let entangledCount = 0;
        
        // Update quantum states
        setInterval(() => {
            currentState = (currentState + 1) % waveStates.length;
            document.getElementById('wave-state').textContent = waveStates[currentState];
            
            // Random probability
            let probability = Math.floor(Math.random() * 100);
            document.getElementById('probability').textContent = probability + '%';
            
            // Entangled pairs
            if (Math.random() > 0.5) {
                entangledCount = Math.min(entangledCount + 1, 10);
            } else {
                entangledCount = Math.max(entangledCount - 1, 0);
            }
            document.getElementById('entangled').textContent = entangledCount;
        }, 2000);
        
        // Quantum creature interactions
        document.querySelector('#quantum-cat').addEventListener('click', function() {
            this.setAttribute('animation', 'property: rotation; to: 0 360 0; dur: 1000');
            setTimeout(() => {
                this.removeAttribute('animation');
            }, 1000);
        });
        
        // Butterfly entanglement
        let butterfly1 = document.querySelector('#butterfly1');
        let butterfly2 = document.querySelector('#butterfly2');
        
        setInterval(() => {
            // Synchronize butterfly colors to show entanglement
            if (Math.random() > 0.5) {
                butterfly1.querySelector('a-sphere').setAttribute('color', '#ff00ff');
                butterfly2.querySelector('a-sphere').setAttribute('color', '#ff00ff');
            } else {
                butterfly1.querySelector('a-sphere').setAttribute('color', '#00ffff');
                butterfly2.querySelector('a-sphere').setAttribute('color', '#00ffff');
            }
        }, 3000);
        
        // VR button handler
        document.getElementById('enter-vr-button').addEventListener('click', () => {
            document.querySelector('a-scene').enterVR();
        });
        
        // Quantum portal interaction
        document.querySelector('#quantum-portal').addEventListener('mouseenter', function() {
            this.setAttribute('scale', '1.2 1.2 1.2');
        });
        
        document.querySelector('#quantum-portal').addEventListener('mouseleave', function() {
            this.setAttribute('scale', '1 1 1');
        });
        
        // Add quantum sparkles
        function createQuantumSparkle() {
            let scene = document.querySelector('a-scene');
            let sparkle = document.createElement('a-sphere');
            sparkle.setAttribute('radius', '0.05');
            sparkle.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
            sparkle.setAttribute('position', {
                x: (Math.random() - 0.5) * 10,
                y: Math.random() * 5,
                z: -Math.random() * 10
            });
            sparkle.setAttribute('animation', 'property: opacity; from: 1; to: 0; dur: 2000');
            scene.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 2000);
        }
        
        setInterval(createQuantumSparkle, 500);
    </script>
</body>
</html>
