<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mystical Forest VR</title>
    <meta name="description" content="Interactive VR Forest">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
</head>
<body>
    <a-scene environment="preset: forest; groundColor: #445; groundColor2: #224; playArea: 1.5; dressingAmount: 100">
        <!-- Sky with gradient -->
        <a-sky color="#001122"></a-sky>
        
        <!-- Ambient and directional lighting -->
        <a-light type="ambient" color="#445"></a-light>
        <a-light type="directional" position="0 10 -5" color="#ffeedd" intensity="0.5"></a-light>
        
        <!-- Glowing mushrooms -->
        <a-entity id="mushroom1" position="-3 0 -5">
            <a-cone color="#ff6b9d" height="0.5" radius-bottom="0.3" radius-top="0.5" 
                    material="emissive: #ff6b9d; emissiveIntensity: 0.5">
                <a-animation attribute="material.emissiveIntensity"
                           dur="2000"
                           from="0.5"
                           to="1"
                           repeat="indefinite"
                           direction="alternate"></a-animation>
            </a-cone>
            <a-cylinder position="0 -0.25 0" radius="0.15" height="0.5" color="#feca57"></a-cylinder>
        </a-entity>
        
        <!-- Floating crystals -->
        <a-entity position="2 3 -4">
            <a-octahedron color="#00d2d3" radius="0.5" 
                         material="emissive: #00d2d3; emissiveIntensity: 0.8">
                <a-animation attribute="rotation"
                           dur="5000"
                           to="0 360 0"
                           repeat="indefinite"></a-animation>
                <a-animation attribute="position"
                           dur="3000"
                           from="0 0 0"
                           to="0 0.5 0"
                           repeat="indefinite"
                           direction="alternate"></a-animation>
            </a-octahedron>
        </a-entity>
        
        <!-- Magical particles -->
        <a-entity position="0 2 -3" 
                  particle-system="preset: dust; 
                                 particleCount: 1000; 
                                 color: #00ff88, #0088ff; 
                                 size: 0.1;
                                 velocityValue: 0 0.2 0;
                                 velocitySpread: 0.5 0 0.5;
                                 opacity: 0.5">
        </a-entity>
        
        <!-- Interactive glowing orb -->
        <a-sphere id="magic-orb" 
                  position="0 1.5 -3" 
                  radius="0.3" 
                  color="#ee5a24"
                  material="emissive: #ee5a24; emissiveIntensity: 1"
                  animation__mouseenter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
                  animation__mouseleave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
        </a-sphere>
        
        <!-- Mystical fog -->
        <a-fog type="exponential" color="#223344" density="0.05"></a-fog>
        
        <!-- Player camera with controls -->
        <a-entity camera 
                  look-controls 
                  wasd-controls 
                  position="0 1.6 0">
            <a-cursor color="#4cd137" fuse="true" fuse-timeout="1500"></a-cursor>
        </a-entity>
        
        <!-- Instructions -->
        <a-text value="Welcome to the Mystical Forest\nLook around with mouse/VR headset\nMove with WASD keys\nGaze at the orange orb!" 
                position="0 3 -5" 
                align="center" 
                color="#ffffff"
                font="kelsonsans">
        </a-text>
    </a-scene>
    
    <script>
        // Add interactivity
        document.querySelector('#magic-orb').addEventListener('click', function() {
            this.setAttribute('color', '#' + Math.floor(Math.random()*16777215).toString(16));
        });
        
        // Add more mushrooms randomly
        const scene = document.querySelector('a-scene');
        for(let i = 0; i < 5; i++) {
            const mushroom = document.querySelector('#mushroom1').cloneNode(true);
            mushroom.setAttribute('position', 
                `${Math.random() * 10 - 5} 0 ${Math.random() * 10 - 10}`
            );
            scene.appendChild(mushroom);
        }
    </script>
</body>
</html>
