<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Breaker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
        }
        
        #gameOver h2 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ff00ff;
        }
        
        button {
            font-size: 1.5em;
            padding: 10px 30px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ff44ff;
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
        <div>Level: <span id="level">1</span></div>
    </div>
    
    <div id="gameOver">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Game state
        let game = {
            score: 0,
            lives: 3,
            level: 1,
            isPaused: false,
            isGameOver: false
        };
        
        // Paddle
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 10,
            speed: 8,
            dx: 0
        };
        
        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            radius: 8,
            speed: 5,
            dx: 4,
            dy: -4
        };
        
        // Bricks
        const brickInfo = {
            rowCount: 5,
            columnCount: 10,
            width: 70,
            height: 20,
            padding: 10,
            offsetTop: 60,
            offsetLeft: 35
        };
        
        let bricks = [];
        
        // Particles
        let particles = [];
        
        // Stars background
        let stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }
        
        // Initialize bricks
        function createBricks() {
            bricks = [];
            for (let c = 0; c < brickInfo.columnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickInfo.rowCount; r++) {
                    const hue = (r * 60 + c * 20) % 360;
                    bricks[c][r] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        color: `hsl(${hue}, 100%, 50%)`
                    };
                }
            }
        }
        
        // Create particle effect
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 5,
                    dy: Math.random() * -5,
                    size: Math.random() * 4 + 2,
                    life: 1,
                    color: color
                });
            }
        }
        
        // Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') paddle.dx = paddle.speed;
            else if (e.key === 'ArrowLeft') paddle.dx = -paddle.speed;
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                paddle.dx = 0;
            }
        });
        
        // Draw functions
        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            ctx.globalAlpha = 1;
        }
        
        function drawPaddle() {
            ctx.fillStyle = '#0ff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // Glow effect
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowBlur = 0;
        }
        
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }
        
        function drawBricks() {
            for (let c = 0; c < brickInfo.columnCount; c++) {
                for (let r = 0; r < brickInfo.rowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickInfo.width + brickInfo.padding) + brickInfo.offsetLeft;
                        const brickY = r * (brickInfo.height + brickInfo.padding) + brickInfo.offsetTop;
                        
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fillRect(brickX, brickY, brickInfo.width, brickInfo.height);
                        
                        // Glow
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = bricks[c][r].color;
                        ctx.fillRect(brickX, brickY, brickInfo.width, brickInfo.height);
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }
        
        function drawParticles() {
            particles = particles.filter(p => p.life > 0);
            
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.2; // gravity
                p.life -= 0.02;
            });
            
            ctx.globalAlpha = 1;
        }
        
        // Update functions
        function updatePaddle() {
            paddle.x += paddle.dx;
            
            // Boundaries
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }
        
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Wall collision
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // Paddle collision
            if (ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                
                // Add spin based on where ball hits paddle
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = 8 * (hitPos - 0.5);
            }
            
            // Bottom boundary (lose life)
            if (ball.y + ball.radius > canvas.height) {
                game.lives--;
                updateUI();
                
                if (game.lives <= 0) {
                    game.isGameOver = true;
                    document.getElementById('gameOver').style.display = 'block';
                    document.getElementById('finalScore').textContent = game.score;
                } else {
                    resetBall();
                }
            }
        }
        
        function collisionDetection() {
            for (let c = 0; c < brickInfo.columnCount; c++) {
                for (let r = 0; r < brickInfo.rowCount; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 1) {
                        if (ball.x > brick.x &&
                            ball.x < brick.x + brickInfo.width &&
                            ball.y > brick.y &&
                            ball.y < brick.y + brickInfo.height) {
                            
                            ball.dy = -ball.dy;
                            brick.status = 0;
                            game.score += 10;
                            
                            createParticles(brick.x + brickInfo.width/2, brick.y + brickInfo.height/2, brick.color);
                            
                            updateUI();
                            
                            // Check if level complete
                            if (isLevelComplete()) {
                                game.level++;
                                ball.speed += 0.5;
                                createBricks();
                                resetBall();
                                updateUI();
                            }
                        }
                    }
                }
            }
        }
        
        function isLevelComplete() {
            for (let c = 0; c < brickInfo.columnCount; c++) {
                for (let r = 0; r < brickInfo.rowCount; r++) {
                    if (bricks[c][r].status === 1) return false;
                }
            }
            return true;
        }
        
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 60;
            ball.dx = 4;
            ball.dy = -4;
        }
        
        function updateUI() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('lives').textContent = game.lives;
            document.getElementById('level').textContent = game.level;
        }
        
        function resetGame() {
            game.score = 0;
            game.lives = 3;
            game.level = 1;
            game.isGameOver = false;
            ball.speed = 5;
            
            createBricks();
            resetBall();
            updateUI();
            
            document.getElementById('gameOver').style.display = 'none';
        }
        
        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawStars();
            
            if (!game.isGameOver) {
                drawBricks();
                drawPaddle();
                drawBall();
                drawParticles();
                
                updatePaddle();
                updateBall();
                collisionDetection();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            paddle.y = canvas.height - 30;
        });
        
        // Initialize game
        createBricks();
        gameLoop();
    </script>
</body>
</html>
