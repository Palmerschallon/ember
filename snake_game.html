<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            filter: drop-shadow(0 0 20px rgba(0, 255, 100, 0.5));
        }
        
        canvas {
            border: 2px solid #0f9;
            background: #000;
        }
        
        #scoreBoard {
            position: absolute;
            top: -40px;
            left: 0;
            right: 0;
            text-align: center;
            color: #0f9;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 100, 0.8);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #0f9;
        }
        
        #gameOver h2 {
            margin: 0 0 10px 0;
            font-size: 36px;
            color: #f44;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.8);
        }
        
        #gameOver p {
            margin: 10px 0;
            font-size: 20px;
        }
        
        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #0f9;
            border: none;
            color: #000;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        #gameOver button:hover {
            background: #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }
        
        .instructions {
            position: absolute;
            bottom: -50px;
            left: 0;
            right: 0;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="scoreBoard">Score: 0</div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="gameOver">
            <h2>GAME OVER!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>High Score: <span id="highScore">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
        <div class="instructions">Use Arrow Keys or WASD to control the snake</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game configuration
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // Game state
        let snake = [
            {x: 10, y: 10}
        ];
        let direction = {x: 0, y: 0};
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let lastRenderTime = 0;
        const gameSpeed = 10; // Moves per second
        
        // Particle system for food collection
        let particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 1;
                this.decay = 0.02;
                this.size = Math.random() * 3 + 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size *= 0.98;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }
        
        // Initialize game
        function init() {
            placeFood();
            gameRunning = true;
            document.getElementById('highScore').textContent = highScore;
        }
        
        // Place food randomly
        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // Make sure food doesn't spawn on snake
            for(let segment of snake) {
                if(segment.x === food.x && segment.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }
        
        // Input handling
        document.addEventListener('keydown', (e) => {
            if(!gameRunning) return;
            
            const key = e.key.toLowerCase();
            
            // Prevent snake from going back into itself
            if((key === 'arrowup' || key === 'w') && direction.y === 0) {
                direction = {x: 0, y: -1};
            }
            else if((key === 'arrowdown' || key === 's') && direction.y === 0) {
                direction = {x: 0, y: 1};
            }
            else if((key === 'arrowleft' || key === 'a') && direction.x === 0) {
                direction = {x: -1, y: 0};
            }
            else if((key === 'arrowright' || key === 'd') && direction.x === 0) {
                direction = {x: 1, y: 0};
            }
        });
        
        // Update game state
        function update() {
            // Move snake head
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            
            // Check wall collision
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // Check self collision
            for(let segment of snake) {
                if(head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            // Check food collision
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('scoreBoard').textContent = `Score: ${score}`;
                
                // Create particles
                for(let i = 0; i < 10; i++) {
                    particles.push(new Particle(
                        food.x * gridSize + gridSize/2,
                        food.y * gridSize + gridSize/2
                    ));
                }
                
                placeFood();
            } else {
                snake.pop();
            }
            
            // Update particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => p.update());
        }
        
        // Render game
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw food
            ctx.fillStyle = '#f44';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f44';
            const foodPulse = Math.sin(Date.now() * 0.005) * 2;
            ctx.fillRect(
                food.x * gridSize + (gridSize - foodPulse) / 2,
                food.y * gridSize + (gridSize - foodPulse) / 2,
                gridSize - 4 + foodPulse,
                gridSize - 4 + foodPulse
            );
            
            // Draw snake
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f9';
            snake.forEach((segment, index) => {
                // Gradient from head to tail
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize, segment.y * gridSize,
                    segment.x * gridSize + gridSize, segment.y * gridSize + gridSize
                );
                
                if(index === 0) {
                    // Head
                    gradient.addColorStop(0, '#0ff');
                    gradient.addColorStop(1, '#0f9');
                } else {
                    // Body segments fade
                    const fade = 1 - (index / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(0, 255, 153, ${fade})`);
                    gradient.addColorStop(1, `rgba(0, 255, 100, ${fade})`);
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * gridSize + 2,
                    segment.y * gridSize + 2,
                    gridSize - 4,
                    gridSize - 4
                );
            });
            
            // Draw particles
            particles.forEach(p => p.draw());
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            document.getElementById('gameOver').style.display = 'block';
        }
        
        // Reset game
        function resetGame() {
            snake = [{x: 10, y: 10}];
            direction = {x: 0, y: 0};
            score = 0;
            particles = [];
            document.getElementById('scoreBoard').textContent = 'Score: 0';
            document.getElementById('gameOver').style.display = 'none';
            placeFood();
            gameRunning = true;
        }
        
        // Game loop
        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);
            
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if(secondsSinceLastRender < 1 / gameSpeed) return;
            
            lastRenderTime = currentTime;
            
            if(gameRunning && (direction.x !== 0 || direction.y !== 0)) {
                update();
            }
            draw();
        }
        
        // Start game
        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
