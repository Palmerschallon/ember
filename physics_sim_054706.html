<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Physics Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .info h3 {
            margin: 0 0 10px 0;
            color: #8c29c1;
        }
        
        .controls {
            line-height: 1.6;
        }
        
        .controls span {
            color: #109492;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="info">
        <h3>Physics Playground</h3>
        <div class="controls">
            <span>Click</span> - Spawn random object<br>
            <span>Drag</span> - Move objects<br>
            <span>Space</span> - Clear all objects<br>
            <span>R</span> - Rain mode toggle<br>
            <span>G</span> - Toggle gravity direction
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // Color scheme
        const colors = ['#1c24fb', '#8c29c1', '#109492'];
        const gravityMultiplier = 0.9595671478067638;
        
        // Matter.js setup
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              World = Matter.World,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Constraint = Matter.Constraint,
              Composite = Matter.Composite,
              Events = Matter.Events;
        
        // Create engine
        const engine = Engine.create();
        engine.world.gravity.y = gravityMultiplier;
        
        // Create renderer
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#0a0a0a'
            }
        });
        
        // Ground and walls
        const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight - 20, window.innerWidth, 40, {
            isStatic: true,
            render: { fillStyle: '#333' }
        });
        
        const leftWall = Bodies.rectangle(0, window.innerHeight / 2, 40, window.innerHeight, {
            isStatic: true,
            render: { fillStyle: '#333' }
        });
        
        const rightWall = Bodies.rectangle(window.innerWidth, window.innerHeight / 2, 40, window.innerHeight, {
            isStatic: true,
            render: { fillStyle: '#333' }
        });
        
        World.add(engine.world, [ground, leftWall, rightWall]);
        
        // Object creation functions
        function getRandomColor() {
            return colors[Math.floor(Math.random() * colors.length)];
        }
        
        function createRandomObject(x, y) {
            const type = Math.floor(Math.random() * 5);
            const color = getRandomColor();
            let body;
            
            switch(type) {
                case 0: // Circle
                    body = Bodies.circle(x, y, 20 + Math.random() * 30, {
                        restitution: 0.7,
                        render: { fillStyle: color }
                    });
                    break;
                case 1: // Rectangle
                    body = Bodies.rectangle(x, y, 30 + Math.random() * 40, 30 + Math.random() * 40, {
                        restitution: 0.6,
                        render: { fillStyle: color }
                    });
                    break;
                case 2: // Pentagon
                    body = Bodies.polygon(x, y, 5, 25 + Math.random() * 20, {
                        restitution: 0.5,
                        render: { fillStyle: color }
                    });
                    break;
                case 3: // Hexagon
                    body = Bodies.polygon(x, y, 6, 25 + Math.random() * 20, {
                        restitution: 0.6,
                        render: { fillStyle: color }
                    });
                    break;
                case 4: // Triangle
                    body = Bodies.polygon(x, y, 3, 30 + Math.random() * 20, {
                        restitution: 0.7,
                        render: { fillStyle: color }
                    });
                    break;
            }
            
            return body;
        }
        
        // Create initial 23 objects with springs and chains
        const initialObjects = [];
        
        // Create some individual objects
        for (let i = 0; i < 10; i++) {
            const x = 100 + (window.innerWidth - 200) * Math.random();
            const y = 100 + Math.random() * 200;
            const obj = createRandomObject(x, y);
            initialObjects.push(obj);
        }
        
        // Create a chain of connected objects
        const chainStartX = window.innerWidth / 2 - 100;
        const chainY = 100;
        const chainObjects = [];
        
        for (let i = 0; i < 5; i++) {
            const obj = Bodies.circle(chainStartX + i * 40, chainY, 15, {
                restitution: 0.8,
                render: { fillStyle: getRandomColor() }
            });
            chainObjects.push(obj);
            initialObjects.push(obj);
        }
        
        // Connect chain objects
        for (let i = 0; i < chainObjects.length - 1; i++) {
            const constraint = Constraint.create({
                bodyA: chainObjects[i],
                bodyB: chainObjects[i + 1],
                length: 50,
                stiffness: 0.8,
                render: {
                    strokeStyle: '#8c29c1',
                    lineWidth: 2
                }
            });
            World.add(engine.world, constraint);
        }
        
        // Create a newton's cradle-like structure
        const cradleX = window.innerWidth - 300;
        const cradleY = 100;
        const cradleBalls = [];
        
        for (let i = 0; i < 4; i++) {
            const ball = Bodies.circle(cradleX + i * 35, cradleY + 100, 17, {
                restitution: 0.9,
                render: { fillStyle: getRandomColor() }
            });
            cradleBalls.push(ball);
            initialObjects.push(ball);
            
            // Add constraint to ceiling
            const constraint = Constraint.create({
                pointA: { x: cradleX + i * 35, y: cradleY },
                bodyB: ball,
                length: 100,
                stiffness: 1,
                render: {
                    strokeStyle: '#109492',
                    lineWidth: 1
                }
            });
            World.add(engine.world, constraint);
        }
        
        // Create some objects connected with springs
        const springGroup = [];
        for (let i = 0; i < 4; i++) {
            const obj = Bodies.polygon(200 + i * 60, 300, 6, 25, {
                restitution: 0.5,
                render: { fillStyle: getRandomColor() }
            });
            springGroup.push(obj);
            initialObjects.push(obj);
        }
        
        // Connect with springs in a web
        for (let i = 0; i < springGroup.length; i++) {
            for (let j = i + 1; j < springGroup.length; j++) {
                if (Math.random() > 0.5) {
                    const spring = Constraint.create({
                        bodyA: springGroup[i],
                        bodyB: springGroup[j],
                        stiffness: 0.05,
                        damping: 0.1,
                        render: {
                            strokeStyle: '#1c24fb',
                            lineWidth: 1
                        }
                    });
                    World.add(engine.world, spring);
                }
            }
        }
        
        World.add(engine.world, initialObjects);
        
        // Mouse control
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: {
                    visible: false
                }
            }
        });
        
        World.add(engine.world, mouseConstraint);
        render.mouse = mouse;
        
        // Click to spawn objects
        let rainMode = false;
        
        render.canvas.addEventListener('click', (e) => {
            if (!mouseConstraint.body) {
                const obj = createRandomObject(e.clientX, e.clientY);
                World.add(engine.world, obj);
            }
        });
        
        // Keyboard controls
        let gravityDirection = 1;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                // Clear all non-static bodies
                const allBodies = Composite.allBodies(engine.world);
                const dynamicBodies = allBodies.filter(body => !body.isStatic);
                World.remove(engine.world, dynamicBodies);
            } else if (e.key === 'r' || e.key === 'R') {
                rainMode = !rainMode;
            } else if (e.key === 'g' || e.key === 'G') {
                gravityDirection *= -1;
                engine.world.gravity.y = gravityMultiplier * gravityDirection;
            }
        });
        
        // Rain mode
        setInterval(() => {
            if (rainMode) {
                const x = Math.random() * window.innerWidth;
                const obj = createRandomObject(x, -50);
                World.add(engine.world, obj);
                
                // Remove old objects to prevent too many
                const allBodies = Composite.allBodies(engine.world);
                if (allBodies.length > 100) {
                    const toRemove = allBodies.filter(body => !body.isStatic && body.position.y > window.innerHeight + 100);
                    World.remove(engine.world, toRemove);
                }
            }
        }, 200);
        
        // Window resize
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            
            // Update ground and walls
            Matter.Body.setPosition(ground, { x: window.innerWidth / 2, y: window.innerHeight - 20 });
            Matter.Body.setVertices(ground, Bodies.rectangle(window.innerWidth / 2, window.innerHeight - 20, window.innerWidth, 40).vertices);
            
            Matter.Body.setPosition(rightWall, { x: window.innerWidth, y: window.innerHeight / 2 });
            Matter.Body.setVertices(rightWall, Bodies.rectangle(window.innerWidth, window.innerHeight / 2, 40, window.innerHeight).vertices);
        });
        
        // Run the engine
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);
        
        // Add some visual effects
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                // Make objects briefly "glow" on collision
                const originalColorA = pair.bodyA.render.fillStyle;
                const originalColorB = pair.bodyB.render.fillStyle;
                
                if (!pair.bodyA.isStatic) {
                    pair.bodyA.render.fillStyle = '#fff';
                    setTimeout(() => {
                        pair.bodyA.render.fillStyle = originalColorA;
                    }, 100);
                }
                
                if (!pair.bodyB.isStatic) {
                    pair.bodyB.render.fillStyle = '#fff';
                    setTimeout(() => {
                        pair.bodyB.render.fillStyle = originalColorB;
                    }, 100);
                }
            });
        });
    </script>
</body>
</html>
