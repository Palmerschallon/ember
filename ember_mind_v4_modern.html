<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Mind v4 - Neural Architecture</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Modern Theming */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --dark-bg: #0a0a0f;
            --dark-surface: #1a1a2e;
            --light-text: #ffffff;
            --muted-text: #a0a0b8;
            --glow-primary: #667eea;
            --glow-secondary: #f093fb;
            --glow-accent: #4facfe;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark-bg);
            color: var(--light-text);
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* Background Grid Pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(102, 126, 234, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 126, 234, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        /* Main Container */
        .neural-viewport {
            display: grid;
            place-items: center;
            height: 100vh;
            position: relative;
            z-index: 2;
            perspective: 1000px;
            perspective-origin: 50% 50%;
        }

        /* Header */
        .header {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.875rem, 2vw, 1rem);
            color: var(--muted-text);
            opacity: 0;
            animation: fadeInUp 1s ease-out 0.5s forwards;
        }

        /* Neural Architecture Container */
        #neural-container {
            width: min(90vw, 800px);
            height: min(90vh, 800px);
            position: relative;
            transform-style: preserve-3d;
            animation: neuralRotate 40s infinite linear;
            will-change: transform;
        }

        @keyframes neuralRotate {
            from { transform: rotateY(0deg) rotateX(10deg); }
            to { transform: rotateY(360deg) rotateX(10deg); }
        }

        /* Cognitive Layers - Modern Glass Morphism */
        .cognitive-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transform-style: preserve-3d;
            transition: all 0.6s var(--transition-smooth);
        }

        /* Core Consciousness - Inner Layer */
        #core-consciousness {
            transform: translateZ(0px);
            background: radial-gradient(circle at center, 
                rgba(102, 126, 234, 0.4), 
                rgba(240, 147, 251, 0.2), 
                transparent 70%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 60px rgba(102, 126, 234, 0.6),
                inset 0 0 60px rgba(240, 147, 251, 0.3);
            animation: pulseCore 4s ease-in-out infinite;
        }

        @keyframes pulseCore {
            0%, 100% { 
                transform: translateZ(0px) scale(1);
                box-shadow: 
                    0 0 60px rgba(102, 126, 234, 0.6),
                    inset 0 0 60px rgba(240, 147, 251, 0.3);
            }
            50% { 
                transform: translateZ(50px) scale(1.1);
                box-shadow: 
                    0 0 120px rgba(102, 126, 234, 0.8),
                    inset 0 0 80px rgba(240, 147, 251, 0.5);
            }
        }

        /* Memory Networks - Second Layer */
        #memory-networks {
            transform: translateZ(-200px);
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(79, 172, 254, 0.15) 60deg,
                transparent 120deg,
                rgba(245, 87, 108, 0.15) 180deg,
                transparent 240deg,
                rgba(102, 126, 234, 0.15) 300deg,
                transparent 360deg
            );
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            animation: memoryFlow 15s linear infinite;
        }

        @keyframes memoryFlow {
            from { transform: translateZ(-200px) rotate(0deg); }
            to { transform: translateZ(-200px) rotate(-360deg); }
        }

        /* Pattern Recognition - Third Layer */
        #pattern-recognition {
            transform: translateZ(-400px);
            background: 
                repeating-conic-gradient(
                    from 0deg at 50% 50%,
                    transparent 0deg,
                    rgba(255, 255, 255, 0.03) 10deg,
                    transparent 20deg
                ),
                radial-gradient(circle at center, transparent 30%, rgba(79, 172, 254, 0.1) 70%);
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
            );
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: patternMorph 8s ease-in-out infinite;
        }

        @keyframes patternMorph {
            0%, 100% { 
                transform: translateZ(-400px) scale(1) rotate(0deg);
                filter: hue-rotate(0deg);
            }
            50% { 
                transform: translateZ(-400px) scale(1.15) rotate(180deg);
                filter: hue-rotate(60deg);
            }
        }

        /* Neural Connections */
        .neural-connections {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .connection {
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--glow-accent), transparent);
            opacity: 0;
            animation: connectionPulse 3s ease-in-out infinite;
        }

        .connection:nth-child(1) {
            height: 200px;
            top: 20%;
            left: 30%;
            transform: rotate(45deg);
            animation-delay: 0s;
        }

        .connection:nth-child(2) {
            height: 150px;
            top: 40%;
            right: 25%;
            transform: rotate(-30deg);
            animation-delay: 1s;
        }

        .connection:nth-child(3) {
            height: 180px;
            bottom: 30%;
            left: 45%;
            transform: rotate(60deg);
            animation-delay: 2s;
        }

        @keyframes connectionPulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.8; }
        }

        /* Information Panel */
        .info-panel {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: fadeInUp 1s ease-out 1s forwards;
        }

        .info-panel h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-panel p {
            font-size: 0.875rem;
            color: var(--muted-text);
            line-height: 1.6;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            #neural-container {
                width: min(95vw, 600px);
                height: min(95vw, 600px);
            }

            .header h1 {
                font-size: 1.75rem;
            }

            .info-panel {
                width: 90%;
                padding: 1rem 1.5rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Loading State */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.875rem;
            color: var(--muted-text);
            opacity: 0;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Interactive Hover Effects */
        .cognitive-layer:hover {
            filter: brightness(1.2);
            transform: scale(1.02);
        }

        /* Focus Styles for Accessibility */
        *:focus {
            outline: 2px solid var(--glow-primary);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="header" role="banner">
        <h1>Ember Mind v4</h1>
        <p>Neural Architecture Visualization</p>
    </header>

    <!-- Main Neural Viewport -->
    <main class="neural-viewport" role="main" aria-label="Neural network visualization">
        <div id="neural-container">
            <!-- Core Consciousness Layer -->
            <div class="cognitive-layer" id="core-consciousness" role="img" aria-label="Core consciousness layer"></div>
            
            <!-- Memory Networks Layer -->
            <div class="cognitive-layer" id="memory-networks" role="img" aria-label="Memory networks layer"></div>
            
            <!-- Pattern Recognition Layer -->
            <div class="cognitive-layer" id="pattern-recognition" role="img" aria-label="Pattern recognition layer"></div>
            
            <!-- Neural Connections -->
            <div class="neural-connections" aria-hidden="true">
                <div class="connection"></div>
                <div class="connection"></div>
                <div class="connection"></div>
            </div>
        </div>
    </main>

    <!-- Information Panel -->
    <aside class="info-panel" role="complementary">
        <h2>Neural Architecture</h2>
        <p>Exploring the intricate layers of artificial consciousness through dynamic visualization.</p>
    </aside>

    <script>
        // Progressive Enhancement - Add interactivity
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('neural-container');
            let isInteracting = false;
            
            // Mouse/Touch interaction
            container.addEventListener('mouseenter', () => {
                container.style.animationPlayState = 'paused';
            });
            
            container.addEventListener('mouseleave', () => {
                container.style.animationPlayState = 'running';
            });
            
            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ') {
                    e.preventDefault();
                    const isPaused = container.style.animationPlayState === 'paused';
                    container.style.animationPlayState = isPaused ? 'running' : 'paused';
                }
            });
        });
    </script>
</body>
</html>
