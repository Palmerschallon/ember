<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            opacity: 0.7;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="info">Click to add particles | Particles: <span id="count">0</span></div>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countElement = document.getElementById('count');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Color palette
        const colors = ['#b8e6dc', '#7fc65f', '#4a50a0'];
        
        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 3 + 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.life = 1.0;
                this.decay = Math.random() * 0.002 + 0.001;
                this.trail = [];
                this.maxTrailLength = 20;
            }
            
            update() {
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Add some gravity
                this.vy += 0.02;
                
                // Bounce off walls
                if (this.x < this.radius || this.x > canvas.width - this.radius) {
                    this.vx *= -0.8;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }
                if (this.y < this.radius || this.y > canvas.height - this.radius) {
                    this.vy *= -0.8;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                }
                
                // Update trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }
                
                // Decay life
                this.life -= this.decay;
            }
            
            interact(other) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 100 && distance > 0) {
                    // Attraction/repulsion force
                    const force = 0.05 / distance;
                    const fx = (dx / distance) * force;
                    const fy = (dy / distance) * force;
                    
                    // Apply forces
                    if (distance < 50) {
                        // Repel if too close
                        this.vx -= fx;
                        this.vy -= fy;
                    } else {
                        // Attract if within range
                        this.vx += fx * 0.5;
                        this.vy += fy * 0.5;
                    }
                }
            }
            
            draw() {
                // Draw trail
                ctx.strokeStyle = this.color + '20';
                ctx.lineWidth = this.radius * 0.5;
                ctx.beginPath();
                for (let i = 0; i < this.trail.length; i++) {
                    if (i === 0) {
                        ctx.moveTo(this.trail[i].x, this.trail[i].y);
                    } else {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }
                }
                ctx.stroke();
                
                // Draw particle with glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2);
                gradient.addColorStop(0, this.color + Math.floor(this.life * 255).toString(16).padStart(2, '0'));
                gradient.addColorStop(0.5, this.color + Math.floor(this.life * 128).toString(16).padStart(2, '0'));
                gradient.addColorStop(1, this.color + '00');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw core
                ctx.fillStyle = this.color + Math.floor(this.life * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Particle array
        let particles = [];
        
        // Create initial particles
        function createInitialParticles() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                ));
            }
        }
        createInitialParticles();
        
        // Mouse click handler
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Add burst of particles
            for (let i = 0; i < 5; i++) {
                const particle = new Particle(x, y);
                particle.vx = (Math.random() - 0.5) * 5;
                particle.vy = (Math.random() - 0.5) * 5 - 2;
                particles.push(particle);
            }
        });
        
        // Animation loop
        function animate() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                // Interact with nearby particles
                for (let j = 0; j < particles.length; j++) {
                    if (i !== j) {
                        particle.interact(particles[j]);
                    }
                }
                
                particle.update();
                particle.draw();
                
                // Remove dead particles
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Draw connections between nearby particles
            ctx.strokeStyle = '#ffffff10';
            ctx.lineWidth = 1;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[j].x - particles[i].x;
                    const dy = particles[j].y - particles[i].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 80) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            
            // Update particle count
            countElement.textContent = particles.length;
            
            // Keep minimum particles
            if (particles.length < 20) {
                particles.push(new Particle(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height * 0.3
                ));
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
