<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowing Color Field Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Color palette
        const colors = [
            { r: 251, g: 113, b: 83 },  // #fb7153
            { r: 68, g: 230, b: 242 },  // #44e6f2
            { r: 35, g: 100, b: 19 }    // #236413
        ];
        
        // Wave parameters
        class Wave {
            constructor(amplitude, frequency, speed, phase) {
                this.amplitude = amplitude;
                this.frequency = frequency;
                this.speed = speed;
                this.phase = phase;
                this.offset = Math.random() * Math.PI * 2;
            }
            
            getValue(x, time) {
                return Math.sin((x * this.frequency) + (time * this.speed) + this.phase + this.offset) * this.amplitude;
            }
        }
        
        // Create multiple wave layers
        const waves = [
            new Wave(0.3, 0.002, 0.0008, 0),
            new Wave(0.2, 0.003, -0.0012, Math.PI / 3),
            new Wave(0.25, 0.0015, 0.001, Math.PI / 2),
            new Wave(0.15, 0.004, -0.0015, Math.PI)
        ];
        
        // Noise-like function for organic movement
        function noise(x, y, time) {
            const n1 = Math.sin(x * 0.01 + time * 0.0005) * Math.cos(y * 0.01 - time * 0.0003);
            const n2 = Math.sin(x * 0.007 - time * 0.0007) * Math.cos(y * 0.013 + time * 0.0004);
            const n3 = Math.sin(x * 0.023 + y * 0.019 + time * 0.0006);
            return (n1 + n2 + n3) / 3;
        }
        
        // Interpolate between colors
        function lerpColor(color1, color2, t) {
            return {
                r: color1.r + (color2.r - color1.r) * t,
                g: color1.g + (color2.g - color1.g) * t,
                b: color1.b + (color2.b - color1.b) * t
            };
        }
        
        // Get color at position and time
        function getColorAt(x, y, time) {
            // Calculate wave influences
            let waveSum = 0;
            for (let wave of waves) {
                waveSum += wave.getValue(x + y * 0.5, time);
            }
            
            // Add noise for organic feel
            const noiseValue = noise(x, y, time);
            const combinedValue = (waveSum + noiseValue) * 0.5;
            
            // Map to color indices
            const colorPosition = (combinedValue + 1) * 1.5; // Normalize to 0-3 range
            const index1 = Math.floor(colorPosition) % colors.length;
            const index2 = (index1 + 1) % colors.length;
            const t = colorPosition - Math.floor(colorPosition);
            
            // Smooth interpolation
            const smoothT = t * t * (3 - 2 * t); // Smoothstep function
            return lerpColor(colors[index1], colors[index2], smoothT);
        }
        
        let time = 0;
        
        // Create image data for pixel manipulation
        let imageData;
        let data;
        
        function initImageData() {
            imageData = ctx.createImageData(canvas.width, canvas.height);
            data = imageData.data;
        }
        initImageData();
        
        // Animation loop
        function animate() {
            time += 1;
            
            // Sample resolution for performance
            const sampleSize = 2; // Adjust for quality vs performance
            
            // Fill canvas with flowing colors
            for (let x = 0; x < canvas.width; x += sampleSize) {
                for (let y = 0; y < canvas.height; y += sampleSize) {
                    const color = getColorAt(x, y, time);
                    
                    // Apply color to pixels
                    for (let dx = 0; dx < sampleSize; dx++) {
                        for (let dy = 0; dy < sampleSize; dy++) {
                            const px = x + dx;
                            const py = y + dy;
                            if (px < canvas.width && py < canvas.height) {
                                const index = (py * canvas.width + px) * 4;
                                data[index] = color.r;
                                data[index + 1] = color.g;
                                data[index + 2] = color.b;
                                data[index + 3] = 255;
                            }
                        }
                    }
                }
            }
            
            // Apply the image data to canvas
            ctx.putImageData(imageData, 0, 0);
            
            // Add subtle gradient overlays for depth
            const gradient1 = ctx.createRadialGradient(
                canvas.width * 0.3 + Math.sin(time * 0.0002) * 100,
                canvas.height * 0.4 + Math.cos(time * 0.0003) * 100,
                0,
                canvas.width * 0.3 + Math.sin(time * 0.0002) * 100,
                canvas.height * 0.4 + Math.cos(time * 0.0003) * 100,
                canvas.width * 0.6
            );
            gradient1.addColorStop(0, 'rgba(251, 113, 83, 0.2)');
            gradient1.addColorStop(1, 'rgba(251, 113, 83, 0)');
            ctx.fillStyle = gradient1;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const gradient2 = ctx.createRadialGradient(
                canvas.width * 0.7 + Math.cos(time * 0.0003) * 80,
                canvas.height * 0.6 + Math.sin(time * 0.0002) * 80,
                0,
                canvas.width * 0.7 + Math.cos(time * 0.0003) * 80,
                canvas.height * 0.6 + Math.sin(time * 0.0002) * 80,
                canvas.width * 0.5
            );
            gradient2.addColorStop(0, 'rgba(68, 230, 242, 0.15)');
            gradient2.addColorStop(1, 'rgba(68, 230, 242, 0)');
            ctx.fillStyle = gradient2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            requestAnimationFrame(animate);
        }
        
        // Handle resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            initImageData();
        });
        
        animate();
    </script>
</body>
</html>
