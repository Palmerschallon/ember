<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowing Gradient Field</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            cursor: none;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">Move mouse to affect the flow</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Mouse tracking
        let mouse = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vx: 0,
            vy: 0
        };
        
        canvas.addEventListener('mousemove', (e) => {
            const newX = e.clientX;
            const newY = e.clientY;
            mouse.vx = newX - mouse.x;
            mouse.vy = newY - mouse.y;
            mouse.x = newX;
            mouse.y = newY;
        });
        
        // Flow field parameters
        const gridSize = 20;
        const noiseScale = 0.01;
        const timeScale = 0.001;
        const mouseInfluence = 150;
        const flowStrength = 2;
        
        // Particle system
        const particles = [];
        const particleCount = 2000;
        
        class Particle {
            constructor() {
                this.reset();
                this.lifespan = Math.random() * 200 + 100;
                this.life = this.lifespan;
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = 0;
                this.vy = 0;
                this.prevX = this.x;
                this.prevY = this.y;
                this.hue = Math.random() * 60 + 180; // Blues to purples
            }
            
            update(flowField, time) {
                this.prevX = this.x;
                this.prevY = this.y;
                
                // Get flow field influence
                const gridX = Math.floor(this.x / gridSize);
                const gridY = Math.floor(this.y / gridSize);
                const index = gridY * Math.ceil(canvas.width / gridSize) + gridX;
                
                if (flowField[index]) {
                    this.vx += flowField[index].x * flowStrength;
                    this.vy += flowField[index].y * flowStrength;
                }
                
                // Mouse influence
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < mouseInfluence && dist > 0) {
                    const force = (1 - dist / mouseInfluence) * 0.5;
                    this.vx += (dx / dist) * force * mouse.vx * 0.1;
                    this.vy += (dy / dist) * force * mouse.vy * 0.1;
                }
                
                // Apply velocity with damping
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                
                // Wrap around edges
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                // Update life
                this.life--;
                if (this.life <= 0) {
                    this.reset();
                    this.life = this.lifespan;
                }
            }
            
            draw() {
                const opacity = this.life / this.lifespan;
                const saturation = 70 + Math.sin(this.x * 0.01 + this.y * 0.01) * 30;
                const lightness = 50 + Math.sin(this.x * 0.005 - this.y * 0.005) * 20;
                
                ctx.strokeStyle = `hsla(${this.hue}, ${saturation}%, ${lightness}%, ${opacity * 0.3})`;
                ctx.lineWidth = 1 + opacity;
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }
        
        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
        
        // Perlin noise implementation
        function noise(x, y) {
            // Simple noise function
            return Math.sin(x * 12.9898 + y * 4.1414) * 43758.5453 % 1;
        }
        
        function smoothNoise(x, y) {
            const corners = (noise(x-1, y-1) + noise(x+1, y-1) + noise(x-1, y+1) + noise(x+1, y+1)) / 16;
            const sides = (noise(x-1, y) + noise(x+1, y) + noise(x, y-1) + noise(x, y+1)) / 8;
            const center = noise(x, y) / 4;
            return corners + sides + center;
        }
        
        function interpolatedNoise(x, y) {
            const intX = Math.floor(x);
            const intY = Math.floor(y);
            const fracX = x - intX;
            const fracY = y - intY;
            
            const v1 = smoothNoise(intX, intY);
            const v2 = smoothNoise(intX + 1, intY);
            const v3 = smoothNoise(intX, intY + 1);
            const v4 = smoothNoise(intX + 1, intY + 1);
            
            const i1 = v1 * (1 - fracX) + v2 * fracX;
            const i2 = v3 * (1 - fracX) + v4 * fracX;
            
            return i1 * (1 - fracY) + i2 * fracY;
        }
        
        // Generate flow field
        function generateFlowField(time) {
            const field = [];
            const cols = Math.ceil(canvas.width / gridSize);
            const rows = Math.ceil(canvas.height / gridSize);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const angle = interpolatedNoise(
                        x * noiseScale + time * timeScale,
                        y * noiseScale + time * timeScale
                    ) * Math.PI * 4;
                    
                    field.push({
                        x: Math.cos(angle),
                        y: Math.sin(angle)
                    });
                }
            }
            
            return field;
        }
        
        // Animation loop
        let time = 0;
        
        function animate() {
            // Create gradient background
            const gradient = ctx.createRadialGradient(
                mouse.x, mouse.y, 0,
                mouse.x, mouse.y, canvas.width * 0.7
            );
            gradient.addColorStop(0, 'rgba(20, 10, 40, 0.02)');
            gradient.addColorStop(0.5, 'rgba(10, 5, 30, 0.02)');
            gradient.addColorStop(1, 'rgba(0, 0, 10, 0.02)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Generate flow field
            const flowField = generateFlowField(time);
            
            // Update and draw particles
            particles.forEach(particle => {
                particle.update(flowField, time);
                particle.draw();
            });
            
            // Draw mouse influence area
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, mouseInfluence, 0, Math.PI * 2);
            ctx.stroke();
            
            // Update time
            time++;
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
    </script>
</body>
</html>
