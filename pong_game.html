<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Pong</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        }

        canvas {
            border: 2px solid #00ffff;
            background: #111;
        }

        #gameOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00ffff;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            display: none;
        }

        #gameOverlay h2 {
            margin: 10px 0;
            font-size: 48px;
        }

        #gameOverlay button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        #gameOverlay button:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        #instructions {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="gameOverlay">
            <h2>GAME OVER</h2>
            <p id="winner"></p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
        <div id="instructions">
            Player 1: W/S | Player 2: ↑/↓
        </div>
    </div>

    <script>
        // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverlay = document.getElementById('gameOverlay');
        const winnerText = document.getElementById('winner');

        // Game constants
        const PADDLE_WIDTH = 15;
        const PADDLE_HEIGHT = 80;
        const BALL_SIZE = 10;
        const PADDLE_SPEED = 6;
        const BALL_SPEED_INITIAL = 5;
        const WINNING_SCORE = 5;
        const PARTICLE_COUNT = 20;

        // Game state
        let gameRunning = true;
        let ballSpeedX = BALL_SPEED_INITIAL;
        let ballSpeedY = BALL_SPEED_INITIAL * 0.5;
        let particles = [];

        // Game objects
        const leftPaddle = {
            x: 30,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#00ffff'
        };

        const rightPaddle = {
            x: canvas.width - 30 - PADDLE_WIDTH,
            y: canvas.height / 2 - PADDLE_HEIGHT / 2,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            score: 0,
            color: '#ff00ff'
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: BALL_SIZE,
            trail: []
        };

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // Particle system for visual effects
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = 0.02;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.98;
                this.vy *= 0.98;
            }

            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                ctx.globalAlpha = 1;
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Update paddles based on input
        function updatePaddles() {
            // Left paddle (W/S)
            if (keys['w'] || keys['W']) {
                leftPaddle.y = Math.max(0, leftPaddle.y - PADDLE_SPEED);
            }
            if (keys['s'] || keys['S']) {
                leftPaddle.y = Math.min(canvas.height - leftPaddle.height, leftPaddle.y + PADDLE_SPEED);
            }

            // Right paddle (Arrow keys)
            if (keys['ArrowUp']) {
                rightPaddle.y = Math.max(0, rightPaddle.y - PADDLE_SPEED);
            }
            if (keys['ArrowDown']) {
                rightPaddle.y = Math.min(canvas.height - rightPaddle.height, rightPaddle.y + PADDLE_SPEED);
            }
        }

        // Ball physics and collision
        function updateBall() {
            // Add to trail
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 10) {
                ball.trail.shift();
            }

            // Move ball
            ball.x += ballSpeedX;
            ball.y += ballSpeedY;

            // Top/bottom collision
            if (ball.y - ball.size <= 0 || ball.y + ball.size >= canvas.height) {
                ballSpeedY = -ballSpeedY;
                createParticles(ball.x, ball.y, '#ffffff');
            }

            // Paddle collision
            if (ballSpeedX < 0) {
                // Left paddle
                if (ball.x - ball.size <= leftPaddle.x + leftPaddle.width &&
                    ball.y >= leftPaddle.y &&
                    ball.y <= leftPaddle.y + leftPaddle.height &&
                    ball.x - ball.size > leftPaddle.x) {
                    
                    ballSpeedX = -ballSpeedX * 1.05; // Slight speed increase
                    let hitPos = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
                    ballSpeedY = hitPos * BALL_SPEED_INITIAL;
                    createParticles(ball.x, ball.y, leftPaddle.color);
                }
            } else {
                // Right paddle
                if (ball.x + ball.size >= rightPaddle.x &&
                    ball.y >= rightPaddle.y &&
                    ball.y <= rightPaddle.y + rightPaddle.height &&
                    ball.x + ball.size < rightPaddle.x + rightPaddle.width) {
                    
                    ballSpeedX = -ballSpeedX * 1.05;
                    let hitPos = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
                    ballSpeedY = hitPos * BALL_SPEED_INITIAL;
                    createParticles(ball.x, ball.y, rightPaddle.color);
                }
            }

            // Scoring
            if (ball.x < 0) {
                rightPaddle.score++;
                createParticles(ball.x, ball.y, '#ff0000');
                resetBall();
                checkWin();
            } else if (ball.x > canvas.width) {
                leftPaddle.score++;
                createParticles(ball.x, ball.y, '#ff0000');
                resetBall();
                checkWin();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.trail = [];
            ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED_INITIAL;
            ballSpeedY = (Math.random() - 0.5) * BALL_SPEED_INITIAL;
        }

        function checkWin() {
            if (leftPaddle.score >= WINNING_SCORE || rightPaddle.score >= WINNING_SCORE) {
                gameRunning = false;
                gameOverlay.style.display = 'block';
                winnerText.textContent = leftPaddle.score >= WINNING_SCORE ? 'Player 1 Wins!' : 'Player 2 Wins!';
            }
        }

        function resetGame() {
            leftPaddle.score = 0;
            rightPaddle.score = 0;
            leftPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            rightPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            resetBall();
            particles = [];
            gameRunning = true;
            gameOverlay.style.display = 'none';
        }

        // Rendering
        function draw() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(17, 17, 17, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw scores
            ctx.font = '48px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(leftPaddle.score, canvas.width / 4, 60);
            ctx.fillStyle = '#ff00ff';
            ctx.fillText(rightPaddle.score, 3 * canvas.width / 4 - 30, 60);

            // Draw paddles with glow
            ctx.shadowColor = leftPaddle.color;
            ctx.shadowBlur = 20;
            ctx.fillStyle = leftPaddle.color;
            ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);

            ctx.shadowColor = rightPaddle.color;
            ctx.fillStyle = rightPaddle.color;
            ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

            // Draw ball trail
            ctx.shadowBlur = 0;
            ball.trail.forEach((point, index) => {
                ctx.globalAlpha = index / ball.trail.length * 0.5;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(point.x, point.y, ball.size * (index / ball.trail.length), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Draw ball with glow
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw particles
            particles = particles.filter(particle => particle.life > 0);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
        }

        // Game loop
        function gameLoop() {
            if (gameRunning) {
                updatePaddles();
                updateBall();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
