<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="info">
        Click and drag to create particles! Move mouse to attract them.
    </div>
    <canvas id="particleCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.radius = Math.random() * 3 + 1;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.life = 1.0;
                this.decay = Math.random() * 0.005 + 0.005;
            }
            
            update() {
                // Apply gravity
                this.vy += 0.1;
                
                // Update position
                this.x += this.vx;
                this.y += this.vy;
                
                // Apply friction
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Decrease life
                this.life -= this.decay;
                
                // Bounce off walls
                if (this.x < this.radius || this.x > canvas.width - this.radius) {
                    this.vx = -this.vx * 0.8;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }
                if (this.y < this.radius || this.y > canvas.height - this.radius) {
                    this.vy = -this.vy * 0.8;
                    this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
                }
            }
            
            attract(mx, my) {
                const dx = mx - this.x;
                const dy = my - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 200) {
                    const force = (200 - distance) / 200 * 0.5;
                    this.vx += (dx / distance) * force;
                    this.vy += (dy / distance) * force;
                }
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Particle system
        const particles = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isMouseDown = false;
        
        // Mouse events
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            if (isMouseDown) {
                // Create particles while dragging
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(mouseX, mouseY));
                }
            }
        });
        
        canvas.addEventListener('mousedown', () => {
            isMouseDown = true;
        });
        
        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
        });
        
        canvas.addEventListener('click', (e) => {
            // Create burst of particles on click
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        });
        
        // Touch events for mobile
        canvas.addEventListener('touchstart', (e) => {
            isMouseDown = true;
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            
            // Create burst on touch
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(mouseX, mouseY));
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
            
            if (isMouseDown) {
                for (let i = 0; i < 5; i++) {
                    particles.push(new Particle(mouseX, mouseY));
                }
            }
        });
        
        canvas.addEventListener('touchend', () => {
            isMouseDown = false;
        });
        
        // Animation loop
        function animate() {
            // Clear canvas with trail effect
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                
                particle.attract(mouseX, mouseY);
                particle.update();
                particle.draw();
                
                // Remove dead particles
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Limit particle count
            if (particles.length > 500) {
                particles.splice(0, particles.length - 500);
            }
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Create initial particles
        for (let i = 0; i < 50; i++) {
            particles.push(new Particle(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }
    </script>
</body>
</html>
