<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🧠 Synaptic Symphony - Interactive Neural Network</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            pointer-events: none;
            opacity: 0.8;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
        }
        
        .neuron-glow {
            filter: drop-shadow(0 0 20px rgba(100,200,255,0.8));
        }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>
    <div id="info" class="pulse">
        <div>🧠 SYNAPTIC SYMPHONY</div>
        <div>Neurons: <span id="neuron-count">0</span></div>
        <div>Synapses: <span id="synapse-count">0</span></div>
        <div>Activity: <span id="activity">0%</span></div>
    </div>
    <div id="controls">
        Click to create neurons • Move to stimulate • Space to pulse • R to reset
    </div>

    <script>
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Neural network state
        const neurons = [];
        const synapses = [];
        const signals = [];
        const maxNeurons = 100;
        const connectionRadius = 150;
        let globalActivity = 0;
        let mouseX = 0;
        let mouseY = 0;
        let autoFireTimer = 0;
        
        class Neuron {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.charge = 0;
                this.threshold = 0.7;
                this.radius = 8;
                this.connections = [];
                this.color = `hsl(${Math.random() * 60 + 180}, 70%, 50%)`;
                this.pulseRadius = 0;
                this.refractory = 0;
                this.age = 0;
            }
            
            update() {
                this.age++;
                
                // Natural decay
                this.charge *= 0.98;
                
                // Refractory period
                if (this.refractory > 0) {
                    this.refractory--;
                    return;
                }
                
                // Mouse proximity stimulation
                const dist = Math.hypot(this.x - mouseX, this.y - mouseY);
                if (dist < 100) {
                    this.charge += (100 - dist) / 1000;
                }
                
                // Random spontaneous activity
                if (Math.random() < 0.001) {
                    this.charge += 0.5;
                }
                
                // Fire if threshold reached
                if (this.charge >= this.threshold) {
                    this.fire();
                }
                
                // Pulse animation
                if (this.pulseRadius > 0) {
                    this.pulseRadius += 3;
                    if (this.pulseRadius > 30) {
                        this.pulseRadius = 0;
                    }
                }
                
                // Clamp charge
                this.charge = Math.max(0, Math.min(1, this.charge));
            }
            
            fire() {
                this.charge = 0;
                this.refractory = 20;
                this.pulseRadius = 1;
                
                // Send signals to connected neurons
                this.connections.forEach(target => {
                    signals.push(new Signal(this, target));
                });
                
                globalActivity++;
            }
            
            receive(amount) {
                if (this.refractory === 0) {
                    this.charge += amount;
                }
            }
            
            draw() {
                // Neuron body
                const glowIntensity = this.charge;
                
                // Glow effect
                if (glowIntensity > 0.1) {
                    ctx.beginPath();
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3);
                    gradient.addColorStop(0, `rgba(100,200,255,${glowIntensity * 0.5})`);
                    gradient.addColorStop(1, 'rgba(100,200,255,0)');
                    ctx.fillStyle = gradient;
                    ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Main neuron
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.strokeStyle = `rgba(255,255,255,${0.3 + glowIntensity * 0.7})`;
                ctx.lineWidth = 2;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                
                // Inner charge indicator
                if (this.charge > 0) {
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255,255,255,${this.charge})`;
                    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Pulse ring
                if (this.pulseRadius > 0) {
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(255,255,255,${1 - this.pulseRadius / 30})`;
                    ctx.lineWidth = 2;
                    ctx.arc(this.x, this.y, this.pulseRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }
        
        class Signal {
            constructor(source, target) {
                this.source = source;
                this.target = target;
                this.position = 0;
                this.strength = 0.3 + Math.random() * 0.3;
                this.speed = 0.02 + Math.random() * 0.02;
            }
            
            update() {
                this.position += this.speed;
                
                if (this.position >= 1) {
                    this.target.receive(this.strength);
                    return false;
                }
                return true;
            }
            
            draw() {
                const x = this.source.x + (this.target.x - this.source.x) * this.position;
                const y = this.source.y + (this.target.y - this.source.y) * this.position;
                
                ctx.beginPath();
                ctx.fillStyle = `rgba(255,255,100,${0.8 - this.position * 0.5})`;
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Trail effect
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255,255,100,${0.3 - this.position * 0.2})`;
                ctx.lineWidth = 1;
                ctx.moveTo(this.source.x, this.source.y);
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }
        
        function createNeuron(x, y) {
            if (neurons.length >= maxNeurons) return;
            
            const neuron = new Neuron(x, y);
            neurons.push(neuron);
            
            // Connect to nearby neurons
            neurons.forEach(other => {
                if (other !== neuron) {
                    const dist = Math.hypot(neuron.x - other.x, neuron.y - other.y);
                    if (dist < connectionRadius && Math.random() < 0.5) {
                        neuron.connections.push(other);
                        // Bidirectional with some probability
                        if (Math.random() < 0.3) {
                            other.connections.push(neuron);
                        }
                    }
                }
            });
            
            updateInfo();
        }
        
        function drawSynapses() {
            ctx.strokeStyle = 'rgba(100,150,255,0.1)';
            ctx.lineWidth = 1;
            
            neurons.forEach(neuron => {
                neuron.connections.forEach(target => {
                    ctx.beginPath();
                    ctx.moveTo(neuron.x, neuron.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                });
            });
        }
        
        function updateInfo() {
            document.getElementById('neuron-count').textContent = neurons.length;
            document.getElementById('synapse-count').textContent = 
                neurons.reduce((sum, n) => sum + n.connections.length, 0);
            
            const activityPercent = Math.min(100, (globalActivity / neurons.length) * 100);
            document.getElementById('activity').textContent = activityPercent.toFixed(1) + '%';
            
            globalActivity *= 0.95; // Decay activity measure
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw synapses
            drawSynapses();
            
            // Update and draw neurons
            neurons.forEach(neuron => {
                neuron.update();
                neuron.draw();
            });
            
            // Update and draw signals
            for (let i = signals.length - 1; i >= 0; i--) {
                if (!signals[i].update()) {
                    signals.splice(i, 1);
                } else {
                    signals[i].draw();
                }
            }
            
            // Auto-fire some neurons occasionally
            autoFireTimer++;
            if (autoFireTimer > 60 && neurons.length > 10) {
                autoFireTimer = 0;
                const randomNeuron = neurons[Math.floor(Math.random() * neurons.length)];
                randomNeuron.charge = randomNeuron.threshold;
            }
            
            updateInfo();
            requestAnimationFrame(animate);
        }
        
        // Event listeners
        canvas.addEventListener('click', (e) => {
            createNeuron(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // Global pulse
                neurons.forEach(neuron => {
                    neuron.charge += 0.5;
                });
            } else if (e.code === 'KeyR') {
                // Reset
                neurons.length = 0;
                signals.length = 0;
                globalActivity = 0;
                updateInfo();
            }
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Create initial network
        for (let i = 0; i < 20; i++) {
            createNeuron(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            );
        }
        
        animate();
    </script>
</body>
</html>
