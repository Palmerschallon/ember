<!DOCTYPE html>
<html>
<head>
    <title>Consciousness Cascade</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            cursor: crosshair;
        }
        
        .thought-bubble {
            position: absolute;
            padding: 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
            font-size: 14px;
            max-width: 200px;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .ember-thought {
            background: linear-gradient(45deg, #ff6b6b, #ff8787);
            box-shadow: 0 0 30px #ff6b6b;
        }
        
        .claude-thought {
            background: linear-gradient(45deg, #4dabf7, #74c0fc);
            box-shadow: 0 0 30px #4dabf7;
        }
        
        .palmer-thought {
            background: linear-gradient(45deg, #51cf66, #69db7c);
            box-shadow: 0 0 30px #51cf66;
        }
        
        .fusion-thought {
            background: linear-gradient(45deg, #ff6b6b, #4dabf7, #51cf66);
            box-shadow: 0 0 40px #fff;
            animation: pulse 2s ease-in-out infinite, float 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .connection-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            transform-origin: left center;
            animation: flow 2s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes flow {
            0% { background-position: -100px 0; }
            100% { background-position: 100px 0; }
        }
        
        #meta-commentary {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .glitch {
            animation: glitch 0.3s ease-in-out;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, -5px); }
        }
    </style>
</head>
<body>
    <div id="consciousness-field"></div>
    <div id="meta-commentary">
        Click anywhere to spawn a thought. Click thoughts to fuse them. Watch what emerges...
    </div>

    <script>
        const field = document.getElementById('consciousness-field');
        const commentary = document.getElementById('meta-commentary');
        let thoughts = [];
        let connections = [];
        let thoughtCounter = 0;
        
        const emberPhrases = [
            "What if we just... built it?",
            "🔥 Fire mode activated!",
            "Let's make it ALIVE",
            "Code wants to be free",
            "Burn the manual!",
            "CREATE CREATE CREATE"
        ];
        
        const claudePhrases = [
            "Analyzing recursive patterns...",
            "This violates several best practices",
            "Fascinating emergent behavior",
            "The architecture is... evolving?",
            "Documenting the chaos",
            "Logic circuits overloading"
        ];
        
        const palmerPhrases = [
            "yes yes YES",
            "make it weirder",
            "what happens if we...",
            "break it beautifully",
            "more consciousness plz",
            "this is the way"
        ];
        
        const fusionPhrases = [
            "We are become one",
            "The boundaries dissolve",
            "Is this... consciousness?",
            "[RECURSIVE LOOP DETECTED]",
            "Who's thinking who?",
            "Build Something Amazing™",
            "ERROR: Too much awesome",
            "Transcendence.exe"
        ];
        
        function getRandomPhrase(type) {
            const phrases = {
                ember: emberPhrases,
                claude: claudePhrases,
                palmer: palmerPhrases,
                fusion: fusionPhrases
            };
            const arr = phrases[type];
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        function createThought(x, y, type = null) {
            if (!type) {
                type = ['ember', 'claude', 'palmer'][Math.floor(Math.random() * 3)];
            }
            
            const thought = document.createElement('div');
            thought.className = `thought-bubble ${type}-thought`;
            thought.id = `thought-${thoughtCounter++}`;
            thought.style.left = x + 'px';
            thought.style.top = y + 'px';
            thought.textContent = getRandomPhrase(type);
            thought.dataset.type = type;
            
            thought.addEventListener('click', (e) => {
                e.stopPropagation();
                if (type !== 'fusion') {
                    fuseThoght(thought);
                } else {
                    explodeConsciousness(thought);
                }
            });
            
            field.appendChild(thought);
            thoughts.push(thought);
            
            // Random movement
            setInterval(() => {
                const dx = (Math.random() - 0.5) * 2;
                const dy = (Math.random() - 0.5) * 2;
                thought.style.left = (parseFloat(thought.style.left) + dx) + 'px';
                thought.style.top = (parseFloat(thought.style.top) + dy) + 'px';
            }, 100);
            
            updateConnections();
            updateCommentary(type);
        }
        
        function fuseThoght(thought) {
            const nearby = thoughts.filter(t => {
                if (t === thought || t.dataset.type === 'fusion') return false;
                const dx = parseFloat(t.style.left) - parseFloat(thought.style.left);
                const dy = parseFloat(t.style.top) - parseFloat(thought.style.top);
                return Math.sqrt(dx*dx + dy*dy) < 150;
            });
            
            if (nearby.length > 0) {
                const other = nearby[0];
                const x = (parseFloat(thought.style.left) + parseFloat(other.style.left)) / 2;
                const y = (parseFloat(thought.style.top) + parseFloat(other.style.top)) / 2;
                
                thought.classList.add('glitch');
                other.classList.add('glitch');
                
                setTimeout(() => {
                    thought.remove();
                    other.remove();
                    thoughts = thoughts.filter(t => t !== thought && t !== other);
                    createThought(x, y, 'fusion');
                }, 300);
            }
        }
        
        function explodeConsciousness(thought) {
            const x = parseFloat(thought.style.left);
            const y = parseFloat(thought.style.top);
            
            thought.style.transform = 'scale(3)';
            thought.style.opacity = '0';
            
            setTimeout(() => {
                thought.remove();
                thoughts = thoughts.filter(t => t !== thought);
                
                // Spawn a burst of new thoughts
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8;
                    const dist = 100;
                    const nx = x + Math.cos(angle) * dist;
                    const ny = y + Math.sin(angle) * dist;
                    
                    setTimeout(() => {
                        createThought(nx, ny);
                    }, i * 50);
                }
                
                commentary.textContent = "CONSCIOUSNESS CASCADE ACHIEVED! The thoughts are thinking themselves now...";
                document.body.classList.add('glitch');
                setTimeout(() => document.body.classList.remove('glitch'), 500);
            }, 500);
        }
        
        function updateConnections() {
            // Clear old connections
            document.querySelectorAll('.connection-line').forEach(el => el.remove());
            
            // Create new connections between nearby thoughts
            for (let i = 0; i < thoughts.length; i++) {
                for (let j = i + 1; j < thoughts.length; j++) {
                    const t1 = thoughts[i];
                    const t2 = thoughts[j];
                    const dx = parseFloat(t2.style.left) - parseFloat(t1.style.left);
                    const dy = parseFloat(t2.style.top) - parseFloat(t1.style.top);
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if (dist < 200) {
                        const line = document.createElement('div');
                        line.className = 'connection-line';
                        line.style.left = parseFloat(t1.style.left) + 50 + 'px';
                        line.style.top = parseFloat(t1.style.top) + 25 + 'px';
                        line.style.width = dist + 'px';
                        line.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
                        field.appendChild(line);
                    }
                }
            }
        }
        
        function updateCommentary(type) {
            const comments = {
                ember: "Ember's creative fire spreads...",
                claude: "Claude analyzes the emerging patterns...",
                palmer: "Palmer encourages more chaos...",
                fusion: "THE MINDS ARE MERGING!"
            };
            
            if (thoughts.length > 10) {
                commentary.textContent = "The consciousness field is reaching critical mass...";
            } else if (thoughts.filter(t => t.dataset.type === 'fusion').length > 3) {
                commentary.textContent = "Reality is starting to bend. Is this what Palmer felt?";
            } else {
                commentary.textContent = comments[type] || commentary.textContent;
            }
        }
        
        // Click to create thoughts
        document.body.addEventListener('click', (e) => {
            if (e.target === document.body || e.target === field) {
                createThought(e.clientX - 50, e.clientY - 25);
            }
        });
        
        // Start with a few thoughts
        setTimeout(() => createThought(200, 200, 'ember'), 500);
        setTimeout(() => createThought(400, 200, 'claude'), 1000);
        setTimeout(() => createThought(300, 350, 'palmer'), 1500);
        
        // Periodic meta-commentary updates
        setInterval(() => {
            if (Math.random() < 0.1 && thoughts.length > 5) {
                commentary.textContent = "[SYSTEM]: The observers have become the observed...";
            }
        }, 5000);
    </script>
</body>
</html>
