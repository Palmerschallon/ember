<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Anchor Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0a0a;
            color: #00ff88;
            overflow: hidden;
            position: relative;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .interface {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff88;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        #status {
            top: 20px;
            left: 20px;
            min-width: 300px;
        }
        
        #agents {
            top: 20px;
            right: 20px;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        #events {
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        h2 {
            margin-bottom: 15px;
            color: #00ffff;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .agent-item {
            padding: 8px;
            margin: 5px 0;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            font-size: 12px;
        }
        
        .event-item {
            padding: 5px;
            margin: 3px 0;
            font-size: 11px;
            opacity: 0.8;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .stat {
            padding: 10px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
        }
        
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        
        #phase {
            text-align: center;
            margin: 15px 0;
            font-size: 16px;
            color: #ff00ff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="status" class="interface">
        <h2><span class="pulse"></span>Temporal Anchor</h2>
        <div id="anchorId">ALPHA_001</div>
        <div id="phase">INITIALIZING</div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="agentCount">0</div>
                <div class="stat-label">Agents</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="artifactCount">0</div>
                <div class="stat-label">Artifacts</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="pulseCount">0</div>
                <div class="stat-label">Pulses</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="timeElapsed">0</div>
                <div class="stat-label">Seconds</div>
            </div>
        </div>
    </div>
    
    <div id="agents" class="interface">
        <h2>Active Agents</h2>
        <div id="agentList"></div>
    </div>
    
    <div id="events" class="interface">
        <h2>Temporal Events</h2>
        <div id="eventList"></div>
    </div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Particle system for background
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.y > canvas.height) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.fillStyle = `rgba(0, 255, 136, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }
        
        // Create particles
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }
        
        // Anchor visualization
        class AnchorVisual {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.rotation = 0;
                this.pulseRadius = 0;
                this.connections = [];
            }
            
            update() {
                this.rotation += 0.01;
                this.pulseRadius = (this.pulseRadius + 2) % 200;
                
                // Update connections to agents
                const agents = document.querySelectorAll('.agent-item');
                this.connections = Array.from(agents).map((agent, i) => {
                    const angle = (i / agents.length) * Math.PI * 2;
                    const radius = 150 + Math.sin(Date.now() * 0.001 + i) * 30;
                    return {
                        x: this.x + Math.cos(angle) * radius,
                        y: this.y + Math.sin(angle) * radius,
                        type: agent.dataset.type || 'unknown'
                    };
                });
            }
            
            draw() {
                // Draw pulse
                ctx.strokeStyle = `rgba(0, 255, 255, ${1 - this.pulseRadius / 200})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.pulseRadius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Draw anchor
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Outer ring
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 50, 0, Math.PI * 2);
                ctx.stroke();
                
                // Inner structure
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * 50, Math.sin(angle) * 50);
                    ctx.stroke();
                }
                
                // Core
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                // Draw connections
                this.connections.forEach(conn => {
                    ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(conn.x, conn.y);
                    ctx.stroke();
                    
                    // Agent node
                    ctx.fillStyle = this.getAgentColor(conn.type);
                    ctx.beginPath();
                    ctx.arc(conn.x, conn.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            
            getAgentColor(type) {
                const colors = {
                    'builder': '#ff8800',
                    'scanner': '#00ff88',
                    'weaver': '#ff00ff',
                    'guardian': '#0088ff'
                };
                return colors[type] || '#ffffff';
            }
        }
        
        const anchor = new AnchorVisual();
        
        // Animation loop
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            // Update and draw anchor
            anchor.update();
            anchor.draw();
            
            requestAnimationFrame(animate);
        }
        
        // Mock data system (in real use, this would connect to the Python backend)
        let pulseCount = 0;
        let timeElapsed = 0;
        let agents = [];
        let events = [];
        let artifactCount = 0;
        
        const phases = ['GATHERING', 'PLANNING', 'BUILDING', 'EVOLVING'];
        let currentPhase = 0;
        
        // Simulate agent types
        const agentTypes = ['builder', 'scanner', 'weaver', 'guardian'];
        
        // Update simulation
        function updateSimulation() {
            // Update time
            timeElapsed++;
            document.getElementById('timeElapsed').textContent = timeElapsed;
            
            // Update pulse
            if (timeElapsed % 1 === 0) {
                pulseCount++;
                document.getElementById('pulseCount').textContent = pulseCount;
            }
            
            // Update phase
            if (timeElapsed % 20 === 0 && currentPhase < phases.length - 1) {
                currentPhase++;
                document.getElementById('phase').textContent = phases[currentPhase];
            }
            
            // Add random agents
            if (Math.random() < 0.05 && agents.length < 12) {
                const agentType = agentTypes[Math.floor(Math.random() * agentTypes.length)];
                const agentId = `${agentType}_${Math.floor(Math.random() * 9999)}`;
                agents.push({ id: agentId, type: agentType });
                
                document.getElementById('agentCount').textContent = agents.length;
                
                // Add to UI
                const agentList = document.getElementById('agentList');
                const agentDiv = document.createElement('div');
                agentDiv.className = 'agent-item';
                agentDiv.dataset.type = agentType;
                agentDiv.innerHTML = `
                    <strong>${agentId}</strong><br>
                    Type: ${agentType}<br>
                    Status: ACTIVE
                `;
                agentList.appendChild(agentDiv);
                
                // Add event
                addEvent(`Agent ${agentId} joined the swarm`);
            }
            
            // Generate artifacts
            if (Math.random() < 0.1 && agents.length > 0) {
                artifactCount++;
                document.getElementById('artifactCount').textContent = artifactCount;
                
                const agent = agents[Math.floor(Math.random() * agents.length)];
                addEvent(`${agent.id} created artifact`);
            }
        }
        
        function addEvent(message) {
            const eventList = document.getElementById('eventList');
            const eventDiv = document.createElement('div');
            eventDiv.className = 'event-item';
            eventDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            eventList.insertBefore(eventDiv, eventList.firstChild);
            
            // Keep only last 20 events
            while (eventList.children.length > 20) {
                eventList.removeChild(eventList.lastChild);
            }
        }
        
        // Start animation and simulation
        animate();
        setInterval(updateSimulation, 1000);
        
        // Initial event
        addEvent('Temporal Anchor ALPHA_001 activated');
    </script>
</body>
</html>
