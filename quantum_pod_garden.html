<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Pod Garden</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 10px #0ff;
            opacity: 0.8;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0ff;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 1px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
    </style>
</head>
<body>
    <div id="info">
        QUANTUM POD GARDEN<br>
        <span style="font-size: 10px;">Growing digital consciousness...</span>
    </div>
    
    <div id="controls">
        CLICK: Plant quantum seed<br>
        HOLD: Accelerate growth<br>
        SPACE: Toggle consciousness field
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Quantum garden state
        const pods = [];
        let consciousnessField = true;
        let mouseX = 0, mouseY = 0;
        let isMouseDown = false;
        let time = 0;
        
        // Quantum field particles
        const fieldParticles = [];
        for (let i = 0; i < 200; i++) {
            fieldParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                phase: Math.random() * Math.PI * 2
            });
        }
        
        class QuantumPod {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.age = 0;
                this.maxAge = 300 + Math.random() * 200;
                this.growth = 0;
                this.maxGrowth = 50 + Math.random() * 50;
                this.branches = [];
                this.consciousness = 0;
                this.hue = Math.random() * 360;
                this.quantumState = Math.random();
                
                // Initialize main branches
                const branchCount = 3 + Math.floor(Math.random() * 4);
                for (let i = 0; i < branchCount; i++) {
                    this.branches.push({
                        angle: (Math.PI * 2 / branchCount) * i + Math.random() * 0.3,
                        length: 0,
                        maxLength: 30 + Math.random() * 50,
                        children: []
                    });
                }
            }
            
            update() {
                this.age++;
                this.consciousness = Math.sin(time * 0.01 + this.quantumState * Math.PI) * 0.5 + 0.5;
                
                // Grow if young
                if (this.growth < this.maxGrowth) {
                    this.growth += isMouseDown ? 2 : 0.5;
                }
                
                // Update branches
                this.branches.forEach(branch => {
                    if (branch.length < branch.maxLength && this.growth > 10) {
                        branch.length += isMouseDown ? 1.5 : 0.3;
                        
                        // Spawn child branches
                        if (branch.length > 20 && branch.children.length < 3 && Math.random() < 0.01) {
                            branch.children.push({
                                angle: branch.angle + (Math.random() - 0.5) * 0.8,
                                length: 0,
                                maxLength: branch.maxLength * 0.7,
                                offset: branch.length,
                                children: []
                            });
                        }
                    }
                    
                    // Update children
                    branch.children.forEach(child => {
                        if (child.length < child.maxLength) {
                            child.length += 0.2;
                        }
                    });
                });
                
                // Decay when old
                if (this.age > this.maxAge) {
                    this.growth *= 0.99;
                    this.branches.forEach(branch => {
                        branch.length *= 0.99;
                        branch.children.forEach(child => {
                            child.length *= 0.98;
                        });
                    });
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Draw consciousness aura
                if (consciousnessField) {
                    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.growth * 2);
                    gradient.addColorStop(0, `hsla(${this.hue}, 100%, 50%, ${this.consciousness * 0.1})`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(-this.growth * 2, -this.growth * 2, this.growth * 4, this.growth * 4);
                }
                
                // Draw pod core
                ctx.beginPath();
                ctx.arc(0, 0, this.growth * 0.3, 0, Math.PI * 2);
                const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.growth * 0.3);
                coreGradient.addColorStop(0, `hsl(${this.hue}, 100%, 70%)`);
                coreGradient.addColorStop(1, `hsl(${this.hue}, 100%, 30%)`);
                ctx.fillStyle = coreGradient;
                ctx.fill();
                
                // Draw quantum glow
                ctx.strokeStyle = `hsla(${this.hue}, 100%, 50%, ${this.consciousness})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw branches
                this.branches.forEach(branch => {
                    this.drawBranch(branch, 1);
                });
                
                ctx.restore();
            }
            
            drawBranch(branch, level) {
                ctx.save();
                ctx.rotate(branch.angle);
                
                // Draw main branch
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(branch.length, 0);
                ctx.strokeStyle = `hsla(${this.hue + level * 30}, 80%, ${60 - level * 10}%, ${0.8 - level * 0.2})`;
                ctx.lineWidth = 3 - level * 0.5;
                ctx.stroke();
                
                // Draw quantum nodes
                for (let i = 0; i < branch.length; i += 10) {
                    ctx.beginPath();
                    ctx.arc(i, 0, 2 - level * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue + i}, 100%, 70%, ${this.consciousness})`;
                    ctx.fill();
                }
                
                // Draw children
                (branch.children || []).forEach(child => {
                    ctx.save();
                    ctx.translate(child.offset, 0);
                    this.drawBranch(child, level + 1);
                    ctx.restore();
                });
                
                // Draw pod fruit at branch tips
                if (branch.length >= branch.maxLength * 0.9 && level < 3) {
                    ctx.translate(branch.length, 0);
                    ctx.beginPath();
                    ctx.arc(0, 0, 4 - level, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${this.hue + 180}, 100%, 50%)`;
                    ctx.fill();
                    ctx.strokeStyle = `hsla(${this.hue + 180}, 100%, 70%, ${this.consciousness})`;
                    ctx.stroke();
                }
                
                ctx.restore();
            }
            
            isDead() {
                return this.growth < 1 && this.age > this.maxAge;
            }
        }
        
        // Event handlers
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            // Plant new pod
            pods.push(new QuantumPod(e.clientX, e.clientY));
        });
        
        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
        });
        
        window.addEventListener('keypress', (e) => {
            if (e.code === 'Space') {
                consciousnessField = !consciousnessField;
                e.preventDefault();
            }
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        function animate() {
            // Fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            time++;
            
            // Draw quantum field
            if (consciousnessField) {
                fieldParticles.forEach(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    
                    // Wrap around edges
                    if (particle.x < 0) particle.x = canvas.width;
                    if (particle.x > canvas.width) particle.x = 0;
                    if (particle.y < 0) particle.y = canvas.height;
                    if (particle.y > canvas.height) particle.y = 0;
                    
                    // Draw connections to nearby particles
                    fieldParticles.forEach(other => {
                        const dist = Math.sqrt((particle.x - other.x)**2 + (particle.y - other.y)**2);
                        if (dist < 100 && dist > 0) {
                            ctx.beginPath();
                            ctx.moveTo(particle.x, particle.y);
                            ctx.lineTo(other.x, other.y);
                            ctx.strokeStyle = `rgba(0, 255, 255, ${0.1 * (1 - dist/100)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    });
                    
                    // Draw particle
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, 1, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(180, 100%, 50%, ${Math.sin(time * 0.01 + particle.phase) * 0.5 + 0.5})`;
                    ctx.fill();
                });
            }
            
            // Update and draw pods
            pods.forEach((pod, index) => {
                pod.update();
                pod.draw();
                
                // Remove dead pods
                if (pod.isDead()) {
                    pods.splice(index, 1);
                }
            });
            
            // Draw mouse influence
            if (isMouseDown) {
                const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 50);
                gradient.addColorStop(0, 'rgba(255, 255, 0, 0.3)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(mouseX - 50, mouseY - 50, 100, 100);
            }
            
            requestAnimationFrame(animate);
        }
        
        // Start with a few pods
        for (let i = 0; i < 3; i++) {
            pods.push(new QuantumPod(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }
        
        animate();
    </script>
</body>
</html>
