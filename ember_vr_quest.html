<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ember VR - Quest 3 Ready</title>
    <meta name="description" content="Ember VR Experience">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
    <style>
        #chatInterface {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        #chatInput {
            padding: 10px;
            border-radius: 5px;
            border: 2px solid #ff4444;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 16px;
            width: 300px;
        }
        
        #chatOutput {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ff8844;
            padding: 15px;
            border-radius: 10px;
            max-width: 600px;
            z-index: 999;
            font-family: monospace;
            font-size: 14px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        button {
            padding: 10px 20px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover {
            background: #ff6666;
        }

        /* Hide UI in VR mode */
        .a-enter-vr-button {
            position: fixed !important;
            bottom: 20px !important;
            right: 20px !important;
        }

        body.a-body[aframe-injected] .desktop-ui {
            display: block;
        }

        body.a-body[aframe-injected].vr-mode .desktop-ui {
            display: none;
        }
    </style>
</head>
<body>
    <div id="chatOutput" class="desktop-ui">
        🔥 Welcome to Ember VR! Try: "spawn cube", "create sphere", "clear", or click objects!
    </div>
    
    <div id="chatInterface" class="desktop-ui">
        <input type="text" id="chatInput" placeholder="Type a command...">
        <button onclick="handleCommand()">Send</button>
    </div>

    <a-scene environment="preset: forest; groundColor: #445; grid: cross" vr-mode-ui="enabled: true">
        <!-- Ember Avatar -->
        <a-entity id="ember" position="0 1.5 -3">
            <a-sphere radius="0.5" color="#ff4444" 
                      animation="property: material.emissiveIntensity; to: 1; dur: 2000; loop: true; dir: alternate"
                      material="emissive: #ff2222; emissiveIntensity: 0.5">
            </a-sphere>
            <a-text value="🔥 EMBER" position="0 1 0" align="center" color="#ff8844"></a-text>
            
            <!-- Glowing particles around Ember -->
            <a-entity position="0 0 0"
                      geometry="primitive: sphere; radius: 0.8"
                      material="color: orange; opacity: 0.2; shader: flat"
                      animation="property: rotation; to: 0 360 0; dur: 10000; loop: true">
            </a-entity>
        </a-entity>

        <!-- Interactive starter objects -->
        <a-box position="-2 1.5 -5" rotation="45 45 0" color="#4CC3D9" 
               animation="property: rotation; to: 405 405 0; dur: 20000; loop: true"
               class="clickable"
               cursor-listener>
            <a-text value="Click me!" position="0 1.5 0" align="center" color="#ffffff"></a-text>
        </a-box>
        
        <a-sphere position="2 1.5 -5" radius="0.7" color="#7BC8A4"
                  animation="property: position; to: 2 3 -5; dur: 3000; loop: true; dir: alternate"
                  class="clickable"
                  cursor-listener>
            <a-text value="Tap me!" position="0 1.5 0" align="center" color="#ffffff"></a-text>
        </a-sphere>

        <!-- Lighting -->
        <a-light type="ambient" color="#445"></a-light>
        <a-light type="point" intensity="2" position="2 4 4" color="#ff8844"></a-light>
        
        <!-- Sky -->
        <a-sky color="#000011"></a-sky>
        
        <!-- Camera with cursor -->
        <a-entity id="cameraRig">
            <a-camera position="0 1.6 0" wasd-controls look-controls>
                <a-cursor color="#ff4444"
                          animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                          raycaster="objects: .clickable">
                </a-cursor>
            </a-camera>
            
            <!-- VR controllers -->
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // Track spawned objects
        let spawnedObjects = [];
        let objectCount = 0;

        // Register click component
        AFRAME.registerComponent('cursor-listener', {
            init: function () {
                this.el.addEventListener('click', function (evt) {
                    console.log('Clicked:', evt.detail.intersection.point);
                    spawnRandomObject(evt.detail.intersection.point);
                    showMessage('✨ Spawned a new object!');
                });
            }
        });

        function spawnRandomObject(position) {
            const types = ['box', 'sphere', 'cylinder', 'torus', 'cone'];
            const colors = ['#ff4444', '#44ff44', '#4444ff', '#ffff44', '#ff44ff', '#44ffff'];
            
            const type = types[Math.floor(Math.random() * types.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const object = document.createElement('a-' + type);
            object.setAttribute('position', position);
            object.setAttribute('color', color);
            object.setAttribute('class', 'clickable spawned');
            object.setAttribute('cursor-listener', '');
            
            // Add some randomness
            if (type === 'box') {
                object.setAttribute('width', Math.random() * 0.5 + 0.5);
                object.setAttribute('height', Math.random() * 0.5 + 0.5);
                object.setAttribute('depth', Math.random() * 0.5 + 0.5);
            } else if (type === 'sphere') {
                object.setAttribute('radius', Math.random() * 0.3 + 0.3);
            } else if (type === 'cylinder') {
                object.setAttribute('radius', Math.random() * 0.3 + 0.2);
                object.setAttribute('height', Math.random() * 1 + 0.5);
            } else if (type === 'torus') {
                object.setAttribute('radius', Math.random() * 0.3 + 0.3);
                object.setAttribute('radius-tubular', 0.1);
            } else if (type === 'cone') {
                object.setAttribute('radius-bottom', Math.random() * 0.3 + 0.3);
                object.setAttribute('height', Math.random() * 1 + 0.5);
            }
            
            // Add animation
            object.setAttribute('animation', {
                property: 'rotation',
                to: '360 360 0',
                dur: Math.random() * 10000 + 5000,
                loop: true
            });
            
            document.querySelector('a-scene').appendChild(object);
            spawnedObjects.push(object);
            objectCount++;
        }

        function spawnObject(type, position) {
            const object = document.createElement('a-' + type);
            const pos = position || `${(Math.random() - 0.5) * 8} ${Math.random() * 2 + 1} ${Math.random() * -3 - 2}`;
            object.setAttribute('position', pos);
            object.setAttribute('color', `#${Math.floor(Math.random()*16777215).toString(16)}`);
            object.setAttribute('class', 'clickable spawned');
            object.setAttribute('cursor-listener', '');
            
            // Set default sizes
            if (type === 'box') {
                object.setAttribute('width', '1');
                object.setAttribute('height', '1');
                object.setAttribute('depth', '1');
            } else if (type === 'sphere') {
                object.setAttribute('radius', '0.5');
            } else if (type === 'torus') {
                object.setAttribute('radius', '0.5');
                object.setAttribute('radius-tubular', '0.1');
            }
            
            // Add animation
            object.setAttribute('animation', {
                property: 'rotation',
                to: '360 360 0',
                dur: 10000,
                loop: true
            });
            
            document.querySelector('a-scene').appendChild(object);
            spawnedObjects.push(object);
            objectCount++;
            return object;
        }

        function spawnCrystal(position) {
            const crystal = document.createElement('a-entity');
            const pos = position || `${(Math.random() - 0.5) * 8} ${Math.random() * 2 + 1} ${Math.random() * -3 - 2}`;
            crystal.setAttribute('position', pos);
            crystal.setAttribute('class', 'clickable spawned');
            crystal.setAttribute('cursor-listener', '');
            
            // Create crystal shape with multiple pyramids
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff00aa'];
            for (let i = 0; i < 4; i++) {
                const pyramid = document.createElement('a-cone');
                pyramid.setAttribute('color', colors[i]);
                pyramid.setAttribute('radius-bottom', '0.3');
                pyramid.setAttribute('height', '1');
                pyramid.setAttribute('rotation', `${i * 90} 0 0`);
                pyramid.setAttribute('position', '0 0 0');
                pyramid.setAttribute('material', 'metalness: 0.7; roughness: 0.3');
                crystal.appendChild(pyramid);
            }
            
            crystal.setAttribute('animation', {
                property: 'rotation',
                to: '360 360 360',
                dur: 8000,
                loop: true
            });
            
            document.querySelector('a-scene').appendChild(crystal);
            spawnedObjects.push(crystal);
            objectCount++;
            return crystal;
        }

        function clearObjects() {
            spawnedObjects.forEach(obj => {
                obj.parentNode.removeChild(obj);
            });
            spawnedObjects = [];
            objectCount = 0;
        }

        function showMessage(msg) {
            const output = document.getElementById('chatOutput');
            output.textContent = msg;
            output.scrollTop = output.scrollHeight;
        }

        function processCommand(cmd) {
            const command = cmd.toLowerCase().trim();
            
            if (command.includes('spawn') || command.includes('create')) {
                if (command.includes('cube') || command.includes('box')) {
                    spawnObject('box');
                    showMessage(`🔥 Created a cube! Total objects: ${objectCount}`);
                } else if (command.includes('sphere') || command.includes('ball')) {
                    spawnObject('sphere');
                    showMessage(`🔥 Created a sphere! Total objects: ${objectCount}`);
                } else if (command.includes('torus') || command.includes('donut')) {
                    spawnObject('torus');
                    showMessage(`🔥 Created a torus! Total objects: ${objectCount}`);
                } else if (command.includes('crystal')) {
                    spawnCrystal();
                    showMessage(`🔥 Created a crystal! Total objects: ${objectCount}`);
                } else {
                    showMessage('🔥 Try: spawn cube, sphere, torus, or crystal');
                }
            } else if (command.includes('clear') || command.includes('remove')) {
                clearObjects();
                showMessage('🔥 Cleared all objects!');
            } else if (command.includes('help')) {
                showMessage('🔥 Commands: spawn [cube/sphere/torus/crystal], clear, help. Click objects to spawn more!');
            } else {
                showMessage(`🔥 Unknown command: "${cmd}". Try "help" for commands.`);
            }
        }

        function handleCommand() {
            const input = document.getElementById('chatInput');
            const cmd = input.value;
            if (cmd) {
                processCommand(cmd);
                input.value = '';
            }
        }

        // Handle Enter key
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleCommand();
            }
        });

        // Detect VR mode
        document.querySelector('a-scene').addEventListener('enter-vr', function () {
            document.body.classList.add('vr-mode');
            console.log('Entered VR mode');
        });

        document.querySelector('a-scene').addEventListener('exit-vr', function () {
            document.body.classList.remove('vr-mode');
            console.log('Exited VR mode');
        });

        // Welcome message
        console.log('🔥 Ember VR loaded! Ready for Quest 3!');
    </script>
</body>
</html>
