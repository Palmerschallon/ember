<!DOCTYPE html>
<html>
<head>
    <title>🍄 Gnome Village</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D98E 60%, #654321 100%);
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
        }
        
        #village {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .gnome {
            position: absolute;
            transition: all 0.5s ease;
            cursor: pointer;
        }
        
        .gnome-sprite {
            width: 40px;
            height: 50px;
        }
        
        .gnome-info {
            position: absolute;
            background: rgba(255,255,255,0.9);
            padding: 5px;
            border-radius: 5px;
            font-size: 12px;
            bottom: 55px;
            left: -30px;
            width: 100px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .energy-bar {
            width: 100%;
            height: 5px;
            background: #ddd;
            margin-top: 3px;
            border-radius: 3px;
        }
        
        .energy-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .mushroom {
            position: absolute;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div id="village">
        <div id="status">🔌 Connecting to gnome server...</div>
        <!-- Random mushrooms for decoration -->
        <div class="mushroom" style="top: 80%; left: 10%;">🍄</div>
        <div class="mushroom" style="top: 75%; left: 30%;">🍄</div>
        <div class="mushroom" style="top: 85%; left: 60%;">🍄</div>
        <div class="mushroom" style="top: 70%; left: 80%;">🍄</div>
    </div>

    <script>
        const village = document.getElementById('village');
        const status = document.getElementById('status');
        const gnomes = new Map();
        
        // SVG template for gnomes
        function createGnomeSVG(color) {
            return `
            <svg class="gnome-sprite" xmlns="http://www.w3.org/2000/svg">
                <!-- Gnome body -->
                <ellipse cx="20" cy="35" rx="12" ry="15" fill="#8B4513"/>
                
                <!-- Gnome hat -->
                <path d="M 20 5 L 35 25 L 5 25 Z" fill="${color}"/>
                
                <!-- Face -->
                <circle cx="20" cy="25" r="8" fill="#FDBCB4"/>
                
                <!-- Eyes -->
                <circle cx="16" cy="24" r="2" fill="black"/>
                <circle cx="24" cy="24" r="2" fill="black"/>
                
                <!-- Beard -->
                <ellipse cx="20" cy="30" rx="6" ry="8" fill="white"/>
                
                <!-- Nose -->
                <circle cx="20" cy="26" r="2" fill="#FF6B6B"/>
            </svg>`;
        }
        
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8766');
            
            ws.onopen = () => {
                status.innerHTML = '✅ Connected to gnome village!';
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'gnome_update') {
                    updateGnomes(data.gnomes);
                }
            };
            
            ws.onerror = (error) => {
                status.innerHTML = '❌ Connection error! Retrying...';
                setTimeout(connectWebSocket, 2000);
            };
            
            ws.onclose = () => {
                status.innerHTML = '🔌 Connection lost! Reconnecting...';
                setTimeout(connectWebSocket, 2000);
            };
        }
        
        function updateGnomes(gnomeData) {
            gnomeData.forEach(data => {
                let gnomeEl = gnomes.get(data.name);
                
                if (!gnomeEl) {
                    // Create new gnome
                    gnomeEl = document.createElement('div');
                    gnomeEl.className = 'gnome';
                    gnomeEl.innerHTML = `
                        ${createGnomeSVG(data.color)}
                        <div class="gnome-info">
                            <strong>${data.name}</strong><br>
                            <span class="mood">Feeling ${data.mood}</span><br>
                            <span class="activity">${data.activity}</span>
                            <div class="energy-bar">
                                <div class="energy-fill" style="width: ${data.energy}%"></div>
                            </div>
                        </div>
                    `;
                    
                    village.appendChild(gnomeEl);
                    gnomes.set(data.name, gnomeEl);
                }
                
                // Update position
                gnomeEl.style.left = data.x + 'px';
                gnomeEl.style.top = data.y + 'px';
                
                // Update info
                const mood = gnomeEl.querySelector('.mood');
                const activity = gnomeEl.querySelector('.activity');
                const energyFill = gnomeEl.querySelector('.energy-fill');
                
                mood.textContent = `Feeling ${data.mood}`;
                activity.textContent = data.activity;
                energyFill.style.width = data.energy + '%';
            });
        }
        
        // Connect to WebSocket
        connectWebSocket();
    </script>
</body>
</html>
