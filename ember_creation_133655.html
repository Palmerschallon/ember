<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember Creation - Fire Dance</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a0a0a, #000000);
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff6600;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
            font-size: 14px;
            pointer-events: none;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .ember-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ff9933;
            font-size: 18px;
            text-shadow: 0 0 15px rgba(255, 153, 51, 0.7);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Click and drag to create fire streams | Move mouse to influence embers</div>
    <div class="ember-counter">Embers: <span id="count">0</span></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let embers = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        class Ember {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx + (Math.random() - 0.5) * 2;
                this.vy = vy + Math.random() * -3 - 1;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
                this.size = Math.random() * 4 + 2;
                this.hue = Math.random() * 60; // Red to yellow range
                this.trail = [];
                this.maxTrailLength = 10;
            }

            update() {
                // Add current position to trail
                this.trail.push({ x: this.x, y: this.y, life: this.life });
                if (this.trail.length > this.maxTrailLength) {
                    this.trail.shift();
                }

                // Physics
                this.vy += 0.05; // Gravity
                this.vx *= 0.99; // Air resistance
                this.vy *= 0.99;

                // Mouse influence
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    const force = (150 - distance) / 150 * 0.2;
                    this.vx += dx / distance * force;
                    this.vy += dy / distance * force;
                }

                // Wind effect
                this.vx += Math.sin(Date.now() * 0.001 + this.y * 0.01) * 0.1;

                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;

                // Turbulence
                if (Math.random() < 0.1) {
                    this.vx += (Math.random() - 0.5) * 0.5;
                    this.vy += (Math.random() - 0.5) * 0.5;
                }
            }

            draw() {
                // Draw trail
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    const alpha = (i / this.trail.length) * point.life * 0.3;
                    const gradient = ctx.createRadialGradient(
                        point.x, point.y, 0,
                        point.x, point.y, this.size * 2
                    );
                    gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha})`);
                    gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(point.x - this.size * 2, point.y - this.size * 2, 
                                 this.size * 4, this.size * 4);
                }

                // Draw ember
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 1.5
                );
                
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 90%, ${this.life})`);
                gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 70%, ${this.life * 0.7})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        function createEmberBurst(x, y, count = 5) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = Math.random() * 3 + 1;
                embers.push(new Ember(
                    x,
                    y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed - 2
                ));
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            if (isDrawing) {
                const dx = e.clientX - lastX;
                const dy = e.clientY - lastY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance > 5) {
                    const steps = Math.floor(distance / 5);
                    for (let i = 0; i < steps; i++) {
                        const t = i / steps;
                        const x = lastX + dx * t;
                        const y = lastY + dy * t;
                        createEmberBurst(x, y, 3);
                    }
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initial embers
        for (let i = 0; i < 50; i++) {
            embers.push(new Ember(
                Math.random() * canvas.width,
                canvas.height - Math.random() * 100,
                (Math.random() - 0.5) * 2,
                -Math.random() * 3 - 1
            ));
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw embers
            for (let i = embers.length - 1; i >= 0; i--) {
                const ember = embers[i];
                ember.update();
                ember.draw();
                
                // Remove dead embers
                if (ember.life <= 0 || ember.y > canvas.height + 50 ||
                    ember.x < -50 || ember.x > canvas.width + 50) {
                    embers.splice(i, 1);
                }
            }
            
            // Spawn new embers occasionally
            if (Math.random() < 0.1 && embers.length < 500) {
                createEmberBurst(
                    Math.random() * canvas.width,
                    canvas.height,
                    2
                );
            }
            
            // Update counter
            document.getElementById('count').textContent = embers.length;
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
