<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Platformer Genesis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #000428, #004e92);
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #gameCanvas {
            border: 2px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            text-align: center;
            font-size: 14px;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            pointer-events: none;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div>LEVEL: <span id="level">1</span></div>
    </div>
    <div id="controls">
        Arrow Keys: Move | Space: Jump | R: Reset
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;
        
        // Game state
        let score = 0;
        let level = 1;
        let gameRunning = true;
        
        // Physics constants
        const GRAVITY = 0.5;
        const FRICTION = 0.8;
        const JUMP_POWER = -12;
        const MOVE_SPEED = 5;
        
        // Player object
        const player = {
            x: 100,
            y: 400,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            color: '#00ffff',
            grounded: false,
            trail: []
        };
        
        // Platform types
        const PLATFORM_TYPES = {
            NORMAL: { color: '#444', solid: true },
            MOVING: { color: '#ff00ff', solid: true },
            BOUNCY: { color: '#00ff00', solid: true, bounce: -20 },
            DISAPPEARING: { color: '#ff0000', solid: true, timer: 100 }
        };
        
        // Platforms array
        let platforms = [
            { x: 0, y: 550, width: 200, height: 50, type: 'NORMAL' },
            { x: 250, y: 450, width: 150, height: 20, type: 'NORMAL' },
            { x: 450, y: 350, width: 100, height: 20, type: 'BOUNCY' },
            { x: 600, y: 250, width: 100, height: 20, type: 'MOVING', moveX: 2, minX: 550, maxX: 700 },
            { x: 300, y: 150, width: 80, height: 20, type: 'DISAPPEARING', timer: 100 }
        ];
        
        // Collectibles
        let collectibles = [
            { x: 275, y: 400, size: 15, collected: false },
            { x: 475, y: 300, size: 15, collected: false },
            { x: 650, y: 200, size: 15, collected: false }
        ];
        
        // Particles array
        let particles = [];
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R') resetLevel();
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Create particle effect
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color: color || '#00ffff'
                });
            }
        }
        
        // Update player physics
        function updatePlayer() {
            // Store previous position for trail
            player.trail.push({ x: player.x + player.width/2, y: player.y + player.height/2 });
            if (player.trail.length > 10) player.trail.shift();
            
            // Horizontal movement
            if (keys['ArrowLeft']) {
                player.vx = -MOVE_SPEED;
            } else if (keys['ArrowRight']) {
                player.vx = MOVE_SPEED;
            } else {
                player.vx *= FRICTION;
            }
            
            // Jumping
            if (keys[' '] && player.grounded) {
                player.vy = JUMP_POWER;
                player.grounded = false;
                createParticles(player.x + player.width/2, player.y + player.height, 5);
            }
            
            // Apply gravity
            player.vy += GRAVITY;
            
            // Update position
            player.x += player.vx;
            player.y += player.vy;
            
            // Reset grounded state
            player.grounded = false;
            
            // Platform collision
            platforms.forEach((platform, index) => {
                const platformType = PLATFORM_TYPES[platform.type];
                
                if (platformType.solid && 
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y < platform.y + platform.height &&
                    player.y + player.height > platform.y) {
                    
                    // Top collision
                    if (player.vy > 0 && player.y < platform.y) {
                        player.y = platform.y - player.height;
                        player.grounded = true;
                        
                        if (platform.type === 'BOUNCY') {
                            player.vy = platformType.bounce;
                            createParticles(player.x + player.width/2, player.y + player.height, 8, '#00ff00');
                        } else {
                            player.vy = 0;
                        }
                        
                        // Handle disappearing platforms
                        if (platform.type === 'DISAPPEARING') {
                            platform.timer--;
                            if (platform.timer <= 0) {
                                platforms.splice(index, 1);
                                createParticles(platform.x + platform.width/2, platform.y + platform.height/2, 20, '#ff0000');
                            }
                        }
                    }
                }
            });
            
            // Collectible collision
            collectibles.forEach((coin, index) => {
                if (!coin.collected) {
                    const dist = Math.sqrt(
                        Math.pow(player.x + player.width/2 - coin.x, 2) +
                        Math.pow(player.y + player.height/2 - coin.y, 2)
                    );
                    
                    if (dist < coin.size + player.width/2) {
                        coin.collected = true;
                        score += 100;
                        createParticles(coin.x, coin.y, 10, '#ffff00');
                        document.getElementById('score').textContent = score;
                    }
                }
            });
            
            // Keep player in bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            
            // Check if player fell off
            if (player.y > canvas.height) {
                resetLevel();
            }
        }
        
        // Update moving platforms
        function updatePlatforms() {
            platforms.forEach(platform => {
                if (platform.type === 'MOVING' && platform.moveX) {
                    platform.x += platform.moveX;
                    if (platform.x <= platform.minX || platform.x >= platform.maxX) {
                        platform.moveX = -platform.moveX;
                    }
                }
            });
        }
        
        // Update particles
        function updateParticles() {
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.2;
                particle.life--;
                particle.vx *= 0.98;
                return particle.life > 0;
            });
        }
        
        // Draw everything
        function draw() {
            // Clear canvas with trail effect
            ctx.fillStyle = 'rgba(0, 4, 40, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw player trail
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            player.trail.forEach((point, index) => {
                if (index === 0) {
                    ctx.moveTo(point.x, point.y);
                } else {
                    ctx.lineTo(point.x, point.y);
                }
            });
            ctx.stroke();
            
            // Draw platforms
            platforms.forEach(platform => {
                const platformType = PLATFORM_TYPES[platform.type];
                ctx.fillStyle = platformType.color;
                
                if (platform.type === 'DISAPPEARING' && platform.timer < 50) {
                    ctx.globalAlpha = platform.timer / 100;
                }
                
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.globalAlpha = 1;
                
                // Platform glow effect
                ctx.shadowColor = platformType.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                ctx.shadowBlur = 0;
            });
            
            // Draw collectibles
            collectibles.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowColor = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.size + Math.sin(Date.now() * 0.005) * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });
            
            // Draw particles
            particles.forEach(particle => {
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 30;
                ctx.fillRect(particle.x - 2, particle.y - 2, 4, 4);
            });
            ctx.globalAlpha = 1;
            
            // Draw player
            ctx.fillStyle = player.color;
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;
            
            // Draw player eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x + 5, player.y + 8, 5, 5);
            ctx.fillRect(player.x + 20, player.y + 8, 5, 5);
        }
        
        // Reset level
        function resetLevel() {
            player.x = 100;
            player.y = 400;
            player.vx = 0;
            player.vy = 0;
            player.grounded = false;
            player.trail = [];
            
            // Reset disappearing platforms
            platforms.forEach(platform => {
                if (platform.type === 'DISAPPEARING') {
                    platform.timer = 100;
                }
            });
            
            // Reset collectibles
            collectibles.forEach(coin => {
                coin.collected = false;
            });
            
            score = Math.max(0, score - 50);
            document.getElementById('score').textContent = score;
        }
        
        // Game loop
        function gameLoop() {
            if (gameRunning) {
                updatePlayer();
                updatePlatforms();
                updateParticles();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        gameLoop();
    </script>
</body>
</html>
