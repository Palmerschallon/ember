<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ember Command Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }
        
        /* Left Panel - Creations Library */
        .creations-panel {
            width: 300px;
            background: #111;
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
        }
        
        .creation-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .creation-card:hover {
            border-color: #ff006e;
            box-shadow: 0 0 20px rgba(255,0,110,0.3);
        }
        
        .creation-card.active {
            border-color: #00ff88;
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }
        
        /* Center - Canvas */
        .canvas-area {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
        }
        
        .big-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff);
            color: white;
            border: none;
            padding: 30px 60px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(255,0,110,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .big-button:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 15px 60px rgba(255,0,110,0.7);
        }
        
        /* Spawned Items */
        .spawned-item {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #fff;
            border-radius: 10px;
            cursor: move;
            padding: 10px;
            backdrop-filter: blur(10px);
        }
        
        .spawned-item.dragging {
            opacity: 0.5;
        }
        
        /* Right Panel - Mix Zone */
        .mix-panel {
            width: 300px;
            background: #111;
            border-left: 1px solid #333;
            padding: 20px;
        }
        
        .mix-zone {
            height: 300px;
            border: 2px dashed #666;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .mix-zone.active {
            border-color: #ff006e;
            box-shadow: inset 0 0 30px rgba(255,0,110,0.3);
        }
        
        /* Animation keyframes */
        @keyframes spawn {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(180deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }
        
        .spawn-animation {
            animation: spawn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="creations-panel">
        <h2 style="margin-bottom: 20px; color: #ff006e;">🔥 CREATIONS</h2>
        <div id="creationsLibrary"></div>
    </div>
    
    <div class="canvas-area" id="canvas">
        <button class="big-button" id="createButton">CREATE MAGIC</button>
    </div>
    
    <div class="mix-panel">
        <h2 style="margin-bottom: 20px; color: #00ff88;">🧪 MIX ZONE</h2>
        <div class="mix-zone" id="mixZone">
            <p style="color: #666;">Drop 2+ items here to mix</p>
        </div>
        <div id="mixResult"></div>
    </div>

    <script>
        // Available creations
        const creationTemplates = [
            { name: "3D Galaxy", emoji: "🌌", color: "#8338ec" },
            { name: "Particle Storm", emoji: "⚡", color: "#ff006e" },
            { name: "AI Art", emoji: "🎨", color: "#3a86ff" },
            { name: "Sound Wave", emoji: "🎵", color: "#06ffa5" },
            { name: "Data Viz", emoji: "📊", color: "#ffbe0b" },
            { name: "VR World", emoji: "🥽", color: "#fb5607" }
        ];
        
        let spawnedItems = [];
        let draggedItem = null;
        let mixedItems = [];
        
        // Initialize library
        function initLibrary() {
            const library = document.getElementById('creationsLibrary');
            creationTemplates.forEach(template => {
                const card = document.createElement('div');
                card.className = 'creation-card';
                card.innerHTML = `
                    <h3>${template.emoji} ${template.name}</h3>
                    <p style="color: #666; margin-top: 5px;">Click to select</p>
                `;
                card.style.borderColor = template.color;
                card.onclick = () => selectCreation(template);
                library.appendChild(card);
            });
        }
        
        let selectedCreation = null;
        
        function selectCreation(template) {
            selectedCreation = template;
            document.querySelectorAll('.creation-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }
        
        // Big button creates selected item
        document.getElementById('createButton').onclick = () => {
            if (!selectedCreation) {
                selectedCreation = creationTemplates[Math.floor(Math.random() * creationTemplates.length)];
            }
            spawnItem(selectedCreation);
        };
        
        function spawnItem(template) {
            const canvas = document.getElementById('canvas');
            const item = document.createElement('div');
            item.className = 'spawned-item spawn-animation';
            item.style.left = Math.random() * (canvas.offsetWidth - 200) + 'px';
            item.style.top = Math.random() * (canvas.offsetHeight - 200) + 'px';
            item.style.borderColor = template.color;
            item.innerHTML = `
                <h3>${template.emoji} ${template.name}</h3>
                <p style="margin-top: 10px;">Drag me!</p>
            `;
            
            // Make draggable
            let isDragging = false;
            let startX, startY, initialX, initialY;
            
            item.onmousedown = (e) => {
                isDragging = true;
                item.classList.add('dragging');
                startX = e.clientX;
                startY = e.clientY;
                initialX = item.offsetLeft;
                initialY = item.offsetTop;
                draggedItem = { element: item, template: template };
            };
            
            document.onmousemove = (e) => {
                if (isDragging) {
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    item.style.left = initialX + dx + 'px';
                    item.style.top = initialY + dy + 'px';
                    
                    // Check if over mix zone
                    const mixZone = document.getElementById('mixZone');
                    const rect = mixZone.getBoundingClientRect();
                    if (e.clientX >= rect.left && e.clientX <= rect.right &&
                        e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        mixZone.classList.add('active');
                    } else {
                        mixZone.classList.remove('active');
                    }
                }
            };
            
            document.onmouseup = (e) => {
                if (isDragging) {
                    isDragging = false;
                    item.classList.remove('dragging');
                    
                    // Check if dropped in mix zone
                    const mixZone = document.getElementById('mixZone');
                    const rect = mixZone.getBoundingClientRect();
                    if (e.clientX >= rect.left && e.clientX <= rect.right &&
                        e.clientY >= rect.top && e.clientY <= rect.bottom) {
                        addToMixZone(draggedItem);
                        item.remove();
                    }
                    mixZone.classList.remove('active');
                }
            };
            
            canvas.appendChild(item);
            spawnedItems.push({ element: item, template: template });
        }
        
        function addToMixZone(item) {
            mixedItems.push(item.template);
            const mixZone = document.getElementById('mixZone');
            
            if (mixedItems.length === 1) {
                mixZone.innerHTML = `<p>${item.template.emoji} Waiting for partner...</p>`;
            } else if (mixedItems.length === 2) {
                mixZone.innerHTML = `<p>${mixedItems[0].emoji} + ${mixedItems[1].emoji}</p>`;
                setTimeout(() => createMixedCreation(), 1000);
            }
        }
        
        function createMixedCreation() {
            const result = document.getElementById('mixResult');
            const combo = `${mixedItems[0].name} × ${mixedItems[1].name}`;
            
            result.innerHTML = `
                <div style="background: #1a1a1a; padding: 20px; border-radius: 10px; border: 2px solid #00ff88;">
                    <h3>✨ NEW CREATION!</h3>
                    <p style="margin-top: 10px;">${mixedItems[0].emoji}${mixedItems[1].emoji} ${combo}</p>
                    <button style="margin-top: 15px; background: #00ff88; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;"
                            onclick="window.open('mix-result.html', '_blank')">
                        OPEN MIXED CREATION
                    </button>
                </div>
            `;
            
            // Reset mix zone
            document.getElementById('mixZone').innerHTML = '<p style="color: #666;">Drop 2+ items here to mix</p>';
            mixedItems = [];
        }
        
        // Initialize
        initLibrary();
    </script>
</body>
</html>
