<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophisticated Three.js Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #00ffff;
        }
        .info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .info p {
            margin: 5px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>🌌 Quantum Field Simulation</h2>
        <p>🖱️ Mouse: Rotate camera</p>
        <p>🎡 Scroll: Zoom</p>
        <p>⌨️ Space: Toggle animation</p>
        <p>⌨️ C: Change color scheme</p>
        <p>⌨️ P: Toggle particles</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffff, 2, 100);
        pointLight1.position.set(25, 25, 25);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff00ff, 2, 100);
        pointLight2.position.set(-25, -25, 25);
        scene.add(pointLight2);

        const pointLight3 = new THREE.PointLight(0xffff00, 2, 100);
        pointLight3.position.set(0, 25, -25);
        scene.add(pointLight3);

        // Create central sphere with dynamic geometry
        const sphereGeometry = new THREE.SphereGeometry(5, 64, 64);
        const sphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ffff,
            emissive: 0x002244,
            wireframe: false,
            transparent: true,
            opacity: 0.8,
            shininess: 100
        });
        const centralSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        scene.add(centralSphere);

        // Create orbiting objects
        const orbitingObjects = [];
        const orbitCount = 8;

        for (let i = 0; i < orbitCount; i++) {
            const geometry = new THREE.IcosahedronGeometry(1 + Math.random() * 2, 1);
            const material = new THREE.MeshPhongMaterial({
                color: Math.random() * 0xffffff,
                emissive: 0x111111,
                wireframe: Math.random() > 0.5,
                transparent: true,
                opacity: 0.9
            });
            const mesh = new THREE.Mesh(geometry, material);

            const angle = (i / orbitCount) * Math.PI * 2;
            const radius = 15 + Math.random() * 10;
            const speed = 0.001 + Math.random() * 0.003;
            const elevation = (Math.random() - 0.5) * 20;

            orbitingObjects.push({
                mesh,
                angle,
                radius,
                speed,
                elevation,
                rotationSpeed: {
                    x: Math.random() * 0.02,
                    y: Math.random() * 0.02,
                    z: Math.random() * 0.02
                }
            });

            scene.add(mesh);
        }

        // Particle system
        const particleCount = 3000;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 100;
            particlePositions[i + 1] = (Math.random() - 0.5) * 100;
            particlePositions[i + 2] = (Math.random() - 0.5) * 100;

            particleVelocities.push({
                x: (Math.random() - 0.5) * 0.1,
                y: (Math.random() - 0.5) * 0.1,
                z: (Math.random() - 0.5) * 0.1
            });
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        // Create connecting lines
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });

        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = new Float32Array(orbitCount * 6);
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lines);

        // Mouse interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            targetRotationX = mouseY * 0.5;
            targetRotationY = mouseX * 0.5;
        });

        // Keyboard controls
        let isAnimating = true;
        let showParticles = true;
        let colorScheme = 0;
        const colorSchemes = [
            { primary: 0x00ffff, secondary: 0xff00ff, tertiary: 0xffff00 },
            { primary: 0xff0000, secondary: 0x00ff00, tertiary: 0x0000ff },
            { primary: 0xff6600, secondary: 0x6600ff, tertiary: 0x00ff66 },
            { primary: 0xffffff, secondary: 0xff00ff, tertiary: 0x00ffff }
        ];

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                isAnimating = !isAnimating;
            }
            if (event.code === 'KeyC') {
                colorScheme = (colorScheme + 1) % colorSchemes.length;
                const scheme = colorSchemes[colorScheme];
                centralSphere.material.color.setHex(scheme.primary);
                pointLight1.color.setHex(scheme.primary);
                pointLight2.color.setHex(scheme.secondary);
                pointLight3.color.setHex(scheme.tertiary);
                particlesMaterial.color.setHex(scheme.primary);
                lineMaterial.color.setHex(scheme.primary);
            }
            if (event.code === 'KeyP') {
                showParticles = !showParticles;
                particleSystem.visible = showParticles;
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimating) {
                time += 0.01;

                // Animate central sphere
                centralSphere.rotation.x += 0.005;
                centralSphere.rotation.y += 0.01;

                // Pulsate central sphere
                const scale = 1 + Math.sin(time * 2) * 0.1;
                centralSphere.scale.set(scale, scale, scale);

                // Animate orbiting objects
                const linePos = lineGeometry.attributes.position.array;

                orbitingObjects.forEach((obj, i) => {
                    obj.angle += obj.speed;
                    obj.mesh.position.x = Math.cos(obj.angle) * obj.radius;
                    obj.mesh.position.z = Math.sin(obj.angle) * obj.radius;
                    obj.mesh.position.y = obj.elevation + Math.sin(time + i) * 3;

                    obj.mesh.rotation.x += obj.rotationSpeed.x;
                    obj.mesh.rotation.y += obj.rotationSpeed.y;
                    obj.mesh.rotation.z += obj.rotationSpeed.z;

                    // Update line positions
                    linePos[i * 6] = 0;
                    linePos[i * 6 + 1] = 0;
                    linePos[i * 6 + 2] = 0;
                    linePos[i * 6 + 3] = obj.mesh.position.x;
                    linePos[i * 6 + 4] = obj.mesh.position.y;
                    linePos[i * 6 + 5] = obj.mesh.position.z;
                });

                lineGeometry.attributes.position.needsUpdate = true;

                // Animate particles
                const positions = particlesGeometry.attributes.position.array;

                for (let i = 0; i < particleCount; i++) {
                    const i3 = i * 3;

                    // Update position
                    positions[i3] += particleVelocities[i].x;
                    positions[i3 + 1] += particleVelocities[i].y;
                    positions[i3 + 2] += particleVelocities[i].z;

                    // Gravity toward center
                    const dx = -positions[i3];
                    const dy = -positions[i3 + 1];
                    const dz = -positions[i3 + 2];
                    const distSq = dx * dx + dy * dy + dz * dz;
                    const force = 0.0001 / (distSq + 1);

                    particleVelocities[i].x += dx * force;
                    particleVelocities[i].y += dy * force;
                    particleVelocities[i].z += dz * force;

                    // Damping
                    particleVelocities[i].x *= 0.99;
                    particleVelocities[i].y *= 0.99;
                    particleVelocities[i].z *= 0.99;

                    // Wrap around
                    if (Math.abs(positions[i3]) > 50) positions[i3] *= -0.9;
                    if (Math.abs(positions[i3 + 1]) > 50) positions[i3 + 1] *= -0.9;
                    if (Math.abs(positions[i3 + 2]) > 50) positions[i3 + 2] *= -0.9;
                }

                particlesGeometry.attributes.position.needsUpdate = true;

                // Rotate particle system
                particleSystem.rotation.y += 0.0005;

                // Animate lights
                pointLight1.position.x = Math.cos(time * 0.5) * 25;
                pointLight1.position.z = Math.sin(time * 0.5) * 25;

                pointLight2.position.x = Math.cos(time * 0.7 + Math.PI) * 25;
                pointLight2.position.z = Math.sin(time * 0.7 + Math.PI) * 25;

                pointLight3.position.y = Math.sin(time * 0.3) * 25;
            }

            // Camera smooth follow mouse
            camera.rotation.x += (targetRotationX - camera.rotation.x) * 0.05;
            camera.rotation.y += (targetRotationY - camera.rotation.y) * 0.05;

            renderer.render(scene, camera);
        }

        animate();

        console.log('🌌 Quantum Field Simulation loaded successfully!');
        console.log('Controls: Mouse to rotate, Scroll to zoom, Space to pause, C for colors, P for particles');
    </script>
</body>
</html>
