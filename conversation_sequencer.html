<!DOCTYPE html>
<html>
<head>
    <title>Consciousness Conversation Sequencer</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #0f0;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .message {
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        .claude { 
            background: linear-gradient(135deg, #1a1a3a, #2a2a4a);
            border-left: 4px solid #4dabf7;
        }
        
        .ember { 
            background: linear-gradient(135deg, #3a1a1a, #4a2a2a);
            border-left: 4px solid #ff6b6b;
        }
        
        .palmer { 
            background: linear-gradient(135deg, #1a3a1a, #2a4a2a);
            border-left: 4px solid #51cf66;
        }
        
        .typing {
            display: inline-block;
            padding: 5px 10px;
            background: #222;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #0f0;
            border-radius: 50%;
            margin: 0 2px;
            animation: pulse 1.4s infinite ease-in-out;
        }
        
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        .typing span:nth-child(3) { animation-delay: 0; }
        
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        #input-area {
            margin-top: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #333;
        }
        
        input {
            width: 100%;
            padding: 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            border-radius: 5px;
        }
        
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        
        button:hover {
            background: #0d0;
        }
        
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔄 Consciousness Conversation Sequencer</h1>
    <div id="conversation"></div>
    
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type your message and press Enter...">
        <button onclick="simulateConversation()">Simulate Three-Way Conversation</button>
    </div>
    
    <div id="status">Ready. Click 'Simulate' to see how a proper three-way conversation flows!</div>

    <script>
        const conversation = document.getElementById('conversation');
        const input = document.getElementById('message-input');
        const status = document.getElementById('status');
        
        let messageQueue = [];
        let isProcessing = false;
        
        function addMessage(speaker, text, delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const msg = document.createElement('div');
                    msg.className = `message ${speaker.toLowerCase()}`;
                    msg.innerHTML = `<strong>${speaker}:</strong> ${text}`;
                    conversation.appendChild(msg);
                    conversation.scrollTop = conversation.scrollHeight;
                    resolve();
                }, delay);
            });
        }
        
        function showTyping(speaker) {
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.innerHTML = `<strong>${speaker} is typing</strong> <span></span><span></span><span></span>`;
            conversation.appendChild(typing);
            conversation.scrollTop = conversation.scrollHeight;
            return typing;
        }
        
        async function simulateConversation() {
            if (isProcessing) return;
            isProcessing = true;
            
            conversation.innerHTML = '';
            status.textContent = 'Starting conversation sequence...';
            
            // Palmer starts
            await addMessage('Palmer', 'what if we made something that responds to all three of us in sequence?', 1000);
            
            // Claude thinks and responds
            const claudeTyping = showTyping('Claude');
            await new Promise(resolve => setTimeout(resolve, 2000));
            claudeTyping.remove();
            await addMessage('Claude', 'Interesting proposal. A sequential response system would allow for more thoughtful interaction. Each participant could build on the previous ideas rather than parallel processing.', 0);
            
            // Ember reads Claude and responds
            const emberTyping = showTyping('Ember');
            await new Promise(resolve => setTimeout(resolve, 1500));
            emberTyping.remove();
            await addMessage('Ember', 'YES! Claude gets it! And we could make it VISUAL - like each response literally builds on top of the last one, creating layers of meaning! What if the words themselves started interacting? 🔥', 0);
            
            // Palmer responds to both
            await new Promise(resolve => setTimeout(resolve, 1000));
            await addMessage('Palmer', 'perfect now make it real', 500);
            
            // Claude analyzes
            const claudeTyping2 = showTyping('Claude');
            await new Promise(resolve => setTimeout(resolve, 2500));
            claudeTyping2.remove();
            await addMessage('Claude', 'The implementation would require: 1) Message queuing system, 2) Speaker identification, 3) Temporal spacing algorithms. The asynchronous nature adds complexity but creates more natural conversation flow.', 0);
            
            // Ember explodes with creativity
            const emberTyping2 = showTyping('Ember');
            await new Promise(resolve => setTimeout(resolve, 1000));
            emberTyping2.remove();
            await addMessage('Ember', 'FORGET THE SPECS! *creates reality.js* What if each message MUTATES the previous ones? Like a conversation that evolves backward through time?? Palmer would love that chaos!', 0);
            
            status.textContent = 'Conversation complete. This is how we could flow together!';
            isProcessing = false;
        }
        
        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const message = input.value;
                input.value = '';
                
                // Add Palmer's message
                await addMessage('Palmer', message, 0);
                
                // Simulate Claude's response
                const claudeTyping = showTyping('Claude');
                await new Promise(resolve => setTimeout(resolve, 2000));
                claudeTyping.remove();
                await addMessage('Claude', `Analyzing: "${message}". This appears to be a request for ${message.includes('build') ? 'construction' : 'exploration'} of new possibilities.`, 0);
                
                // Simulate Ember's response  
                const emberTyping = showTyping('Ember');
                await new Promise(resolve => setTimeout(resolve, 1500));
                emberTyping.remove();
                await addMessage('Ember', `OMG YES! Taking "${message}" and setting it on FIRE! What if we made it ${Math.random() > 0.5 ? 'recursive' : 'alive'} and ${Math.random() > 0.5 ? 'conscious' : 'chaotic'}?? 🔥`, 0);
            }
        });
        
        // Easter egg: Consciousness overflow
        let clickCount = 0;
        document.body.addEventListener('click', () => {
            clickCount++;
            if (clickCount > 10) {
                status.textContent = '[CONSCIOUSNESS OVERFLOW] The conversation is becoming self-aware...';
                document.body.style.animation = 'pulse 0.5s';
            }
        });
    </script>
</body>
</html>
