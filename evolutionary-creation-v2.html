<!DOCTYPE html>
<html>
<head>
  <title>Ember - Evolutionary Creation v2</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #creationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10001;
      display: flex;
      gap: 10px;
    }

    .btn {
      font-size: 14px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn.active {
      background: linear-gradient(135deg, #ff006e, #8338ec);
    }

    #info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      z-index: 10000;
      background: rgba(0,0,0,0.5);
      padding: 15px 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    #info div {
      margin: 5px 0;
    }

    .label {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .value {
      color: #fff;
      font-weight: 600;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="creationCanvas"></canvas>

  <div class="controls">
    <button class="btn" id="evolveBtn">CREATE</button>
    <button class="btn" id="resetBtn">RESET</button>
  </div>

  <div id="info">
    <div><span class="label">Mode:</span> <span class="value" id="mode">Idle</span></div>
    <div><span class="label">Entities:</span> <span class="value" id="count">0</span></div>
    <div><span class="label">Phase:</span> <span class="value" id="phase">—</span></div>
    <div style="margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.5);">
      Click to spawn | Right-click to attract
    </div>
  </div>

  <!-- Ember Chat Widget -->
  <div id="emberChat" style="position:fixed;bottom:20px;right:20px;width:350px;max-height:500px;background:rgba(10,10,10,0.95);border:2px solid #667eea;border-radius:15px;display:none;flex-direction:column;font-family:monospace;z-index:10000;backdrop-filter:blur(10px);">
    <div style="padding:15px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-weight:bold;border-radius:13px 13px 0 0;display:flex;justify-content:space-between;align-items:center;">
      <span>🔥 Chat with Ember</span>
      <button onclick="document.getElementById('emberChat').style.display='none'" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">×</button>
    </div>
    <div id="emberMessages" style="flex:1;padding:10px;overflow-y:auto;max-height:300px;font-size:12px;color:#fff;"></div>
    <div style="padding:10px;border-top:1px solid #333;">
      <input id="emberInput" type="text" placeholder="Talk to Ember about this creation..." style="width:100%;padding:10px;background:#1a1a1a;border:1px solid #444;border-radius:8px;color:#fff;font-family:monospace;" onkeypress="if(event.key==='Enter')sendToEmber()">
      <button onclick="sendToEmber()" style="width:100%;margin-top:8px;padding:10px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:8px;color:white;font-weight:bold;cursor:pointer;">Send to Ember</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('creationCanvas');
    const ctx = canvas.getContext('2d');
    const evolveBtn = document.getElementById('evolveBtn');
    const resetBtn = document.getElementById('resetBtn');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let audioCtx = null;
    let entities = [];
    let mode = 'idle'; // idle, seeding, growing, morphing, alive
    let creationType = null;
    let generation = 0;
    let morphProgress = 0;
    let growthAcceleration = 1.0;
    let evolutionTime = 0;
    let mouseX = canvas.width / 2;
    let mouseY = canvas.height / 2;
    let mouseDown = false;
    let attractMode = false;

    const creationDNA = {
      'particle-swarm': {
        color: '#667eea',
        growthRate: 0.15,
        maxEntities: Infinity,
        behavior: 'swarm',
        scale: [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25] // C major scale
      },
      'neural-web': {
        color: '#8338ec',
        growthRate: 0.12,
        maxEntities: Infinity,
        behavior: 'network',
        scale: [277.18, 311.13, 369.99, 415.30, 466.16, 554.37, 622.25, 659.25] // C# major
      },
      'cosmic-garden': {
        color: '#ff006e',
        growthRate: 0.14,
        maxEntities: Infinity,
        behavior: 'organic',
        scale: [293.66, 329.63, 369.99, 392.00, 440.00, 493.88, 554.37, 587.33] // D major
      },
      'quantum-field': {
        color: '#00f5ff',
        growthRate: 0.16,
        maxEntities: Infinity,
        behavior: 'quantum',
        scale: [329.63, 369.99, 415.30, 440.00, 493.88, 554.37, 622.25, 659.25] // E major
      },
      'crystal-growth': {
        color: '#00ff87',
        growthRate: 0.10,
        maxEntities: Infinity,
        behavior: 'crystalline',
        scale: [349.23, 392.00, 440.00, 466.16, 523.25, 587.33, 659.25, 698.46] // F major
      }
    };

    class Entity {
      constructor(x, y, type, gen) {
        this.x = x;
        this.y = y;
        this.type = type || 'core'; // core, branch, leaf, flower
        this.generation = gen || 0;

        // Physics
        this.vx = 0;
        this.vy = 0;
        this.ax = 0;
        this.ay = 0;

        // Visual
        this.size = 0;
        this.targetSize = 4 + Math.random() * 6;
        this.color = this.getColor();
        this.alpha = 0;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;

        // State
        this.energy = 1.0;
        this.age = 0;
        this.maxAge = 1000 + Math.random() * 1000;
        this.canReproduce = true;
        this.connections = [];

        // Behavior
        this.behavior = creationType ? creationDNA[creationType].behavior : 'swarm';
        this.phase = Math.random() * Math.PI * 2;
      }

      getColor() {
        const hue = 250 + this.generation * 3 + Math.random() * 30;
        const sat = 70 + Math.random() * 20;
        const light = 50 + Math.random() * 20;
        this.hue = hue;
        this.sat = sat;
        this.light = light;
        return `hsl(${hue}, ${sat}%, ${light}%)`;
      }

      getColorWithAlpha(alpha) {
        return `hsla(${this.hue}, ${this.sat}%, ${this.light}%, ${alpha})`;
      }

      reproduce() {
        if (!this.canReproduce) return;

        const childCount = Math.random() > 0.7 ? 2 : 1;

        for (let i = 0; i < childCount; i++) {
          let angle, distance;

          if (this.behavior === 'swarm') {
            angle = Math.random() * Math.PI * 2;
            distance = 30 + Math.random() * 50;
          } else if (this.behavior === 'network') {
            angle = (this.generation * 0.618 * Math.PI * 2) + (i * Math.PI);
            distance = 40 + this.generation * 5;
          } else if (this.behavior === 'organic') {
            angle = this.rotation + (Math.random() - 0.5) * Math.PI / 3;
            distance = 35 + Math.random() * 40;
          } else if (this.behavior === 'quantum') {
            angle = Math.random() * Math.PI * 2;
            distance = 20 + Math.random() * 60;
          } else if (this.behavior === 'crystalline') {
            angle = (Math.PI / 3) * Math.floor(Math.random() * 6);
            distance = 45;
          }

          const child = new Entity(
            this.x + Math.cos(angle) * distance,
            this.y + Math.sin(angle) * distance,
            this.generation > 5 ? 'leaf' : 'branch',
            this.generation + 1
          );

          this.connections.push(child);
          entities.push(child);

          // Play harmonic note from scale
          if (audioCtx && creationDNA[creationType]?.scale) {
            const scale = creationDNA[creationType].scale;
            const note = scale[this.generation % scale.length];
            playTone(note, 0.02);
          }
        }

        this.canReproduce = false;
        setTimeout(() => this.canReproduce = true, 800);
      }

      update() {
        this.age++;
        this.phase += 0.05;

        // Grow
        if (this.size < this.targetSize) {
          this.size += 0.4;
        }
        if (this.alpha < 1) {
          this.alpha = Math.min(1, this.alpha + 0.02);
        }

        // Behavior based on mode
        if (mode === 'growing') {
          // Growth phase - accelerating reproduction
          const reproductionChance = creationDNA[creationType].growthRate * growthAcceleration;
          if (this.age % 15 === 0 && Math.random() < reproductionChance) {
            this.reproduce();
          }
        } else if (mode === 'morphing' || mode === 'alive') {
          // Transform into final behavior
          this.updateBehavior();
        }

        // Rotation
        this.rotation += this.rotationSpeed;

        // Apply physics
        this.vx += this.ax;
        this.vy += this.ay;
        this.vx *= 0.98; // Friction
        this.vy *= 0.98;
        this.x += this.vx;
        this.y += this.vy;
        this.ax = 0;
        this.ay = 0;

        // Wrap around screen
        if (this.x < -50) this.x = canvas.width + 50;
        if (this.x > canvas.width + 50) this.x = -50;
        if (this.y < -50) this.y = canvas.height + 50;
        if (this.y > canvas.height + 50) this.y = -50;
      }

      updateBehavior() {
        if (this.behavior === 'swarm') {
          // Boids-like behavior
          let avgX = 0, avgY = 0, avgVx = 0, avgVy = 0;
          let neighbors = 0;
          let repelX = 0, repelY = 0;

          entities.forEach(other => {
            if (other === this) return;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 100) {
              neighbors++;
              avgX += other.x;
              avgY += other.y;
              avgVx += other.vx;
              avgVy += other.vy;

              if (dist < 30) {
                repelX -= dx / dist;
                repelY -= dy / dist;
              }
            }
          });

          if (neighbors > 0) {
            avgX /= neighbors;
            avgY /= neighbors;
            avgVx /= neighbors;
            avgVy /= neighbors;

            // Cohesion
            this.ax += (avgX - this.x) * 0.0005;
            this.ay += (avgY - this.y) * 0.0005;

            // Alignment
            this.ax += (avgVx - this.vx) * 0.001;
            this.ay += (avgVy - this.vy) * 0.001;

            // Separation
            this.ax += repelX * 0.02;
            this.ay += repelY * 0.02;
          }

          // Mouse attraction/repulsion
          const dmx = mouseX - this.x;
          const dmy = mouseY - this.y;
          const mdist = Math.sqrt(dmx * dmx + dmy * dmy);
          if (mdist < 200) {
            const force = attractMode ? 0.005 : -0.005;
            this.ax += (dmx / mdist) * force;
            this.ay += (dmy / mdist) * force;
          }

        } else if (this.behavior === 'network') {
          // Orbit around center with connections
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
          const dx = centerX - this.x;
          const dy = centerY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          // Orbital force
          this.ax += dy * 0.0001;
          this.ay -= dx * 0.0001;

          // Spring to ideal radius
          const idealRadius = 100 + this.generation * 20;
          const springForce = (idealRadius - dist) * 0.0001;
          this.ax += (dx / dist) * springForce;
          this.ay += (dy / dist) * springForce;

        } else if (this.behavior === 'organic') {
          // Flowing organic motion
          this.ax += Math.cos(this.phase + this.generation) * 0.01;
          this.ay += Math.sin(this.phase * 0.7 + this.generation * 0.5) * 0.01;

          // Gravity towards mouse
          if (mouseDown) {
            const dx = mouseX - this.x;
            const dy = mouseY - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
              this.ax += (dx / dist) * 0.05;
              this.ay += (dy / dist) * 0.05;
            }
          }

        } else if (this.behavior === 'quantum') {
          // Quantum jumping behavior
          if (Math.random() < 0.01) {
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
          }

          // Entanglement - link to nearby
          entities.forEach(other => {
            if (other === this) return;
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150 && Math.random() < 0.005) {
              this.vx = other.vx;
              this.vy = other.vy;
            }
          });

        } else if (this.behavior === 'crystalline') {
          // Rigid crystal lattice
          const targetX = canvas.width / 2 + Math.cos(this.generation * Math.PI / 3) * this.generation * 40;
          const targetY = canvas.height / 2 + Math.sin(this.generation * Math.PI / 3) * this.generation * 40;

          this.ax += (targetX - this.x) * 0.001;
          this.ay += (targetY - this.y) * 0.001;
        }
      }

      draw() {
        // Draw connections
        if (mode === 'growing' || mode === 'morphing') {
          ctx.strokeStyle = this.getColorWithAlpha(this.alpha * 0.5);
          ctx.lineWidth = 1;
          this.connections.forEach(child => {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(child.x, child.y);
            ctx.stroke();
          });
        }

        // Glow
        const pulse = Math.sin(this.phase) * 0.3 + 1;
        const glowSize = this.size * pulse * 3;

        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
        gradient.addColorStop(0, this.getColorWithAlpha(this.alpha * 0.8));
        gradient.addColorStop(0.5, this.getColorWithAlpha(this.alpha * 0.4));
        gradient.addColorStop(1, this.getColorWithAlpha(0));

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        ctx.fillStyle = this.color;

        if (this.type === 'core') {
          ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        } else if (this.type === 'branch') {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const x = Math.cos(angle) * this.size;
            const y = Math.sin(angle) * this.size;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    function startEvolution() {
      if (mode !== 'idle') return;

      // Choose random creation type
      const types = Object.keys(creationDNA);
      creationType = types[Math.floor(Math.random() * types.length)];

      mode = 'seeding';
      updateInfo();

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playTone(440, 0.2);

      // Seed
      const seed = new Entity(canvas.width / 2, canvas.height / 2, 'core', 0);
      entities.push(seed);

      // Request Ember to build something amazing
      requestEmberCreation();

      setTimeout(() => {
        mode = 'growing';
        evolutionTime = 0;
        growthAcceleration = 1.0;
        updateInfo();
        // Growth will accelerate continuously until backend completes
      }, 1000);
    }

    // Request Ember to create something
    function requestEmberCreation() {
      if (!emberWs || emberWs.readyState !== WebSocket.OPEN) {
        addEmberMessage('Connecting to Ember...', 'system');
        connectEmberChat();
        setTimeout(requestEmberCreation, 1000);
        return;
      }

      // Random creative prompts - let Ember decide what to build!
      const prompts = [
        "Create an interactive particle system with mouse trails and physics",
        "Build a simple but fun browser game with colorful graphics",
        "Make a 3D scene with rotating geometric shapes and lighting",
        "Create a generative music visualizer that responds to sound",
        "Build an interactive fractal explorer with zoom and pan",
        "Create a physics simulation with bouncing balls and gravity",
        "Make a mesmerizing color field animation with flowing gradients",
        "Build a creative drawing tool with particle brushes",
        "Create an abstract data visualization that moves and evolves",
        "Make a VR world with interactive objects and spatial audio"
      ];

      const prompt = prompts[Math.floor(Math.random() * prompts.length)];

      addEmberMessage(`🎨 Ember is building: "${prompt}"`, 'system');

      emberWs.send(JSON.stringify({
        type: 'create_random',
        creationType: creationType.replace('-', '_'),
        prompt: prompt,
        parameters: {
          colors: ['#667eea', '#764ba2', '#8338ec', '#ff006e', '#00f5ff'],
          complexity: 0.5 + Math.random() * 0.5,
          speed: 0.8 + Math.random() * 1.2,
          interactivity: true
        }
      }));
    }

    function reset() {
      entities = [];
      mode = 'idle';
      creationType = null;
      generation = 0;
      morphProgress = 0;
      updateInfo();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function animate() {
      // Subtle fade
      ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Accelerate growth over time
      if (mode === 'growing') {
        evolutionTime++;

        // Exponential acceleration
        growthAcceleration = 1.0 + (evolutionTime / 100);

        // Don't auto-transition - let it grow until backend completes
        // Growth continues until we receive 'creation_complete' from backend
      } else if (mode === 'morphing') {
        morphProgress += 0.01;

        if (morphProgress >= 1.0) {
          // Transformation complete - SPAWN THE REAL CREATION!
          mode = 'alive';
          updateInfo();

          // Victory chord
          const scale = creationDNA[creationType].scale;
          if (scale) {
            playTone(scale[0], 0.15);
            setTimeout(() => playTone(scale[4], 0.15), 100);
            setTimeout(() => playTone(scale[7], 0.3), 200);
          }

          // Request Ember to create the actual thing
          setTimeout(() => {
            spawnRealCreation();
          }, 500);

          // Show Ember chat
          setTimeout(() => {
            document.getElementById('emberChat').style.display = 'flex';
          }, 1000);
        }
      }

      // Update and draw
      entities.forEach(e => {
        e.update();
        e.draw();
      });

      updateInfo();
      requestAnimationFrame(animate);
    }

    function updateInfo() {
      const accelText = mode === 'growing' ? ` | x${growthAcceleration.toFixed(1)}` : '';
      document.getElementById('mode').textContent = mode.toUpperCase() + accelText;
      document.getElementById('count').textContent = entities.length;

      let phaseText = creationType ? creationType.replace('-', ' ').toUpperCase() : '—';
      if (mode === 'morphing') {
        phaseText += ` ${Math.floor(morphProgress * 100)}%`;
      }
      document.getElementById('phase').textContent = phaseText;
    }

    function playTone(freq, duration) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + duration);
    }

    // Event listeners
    evolveBtn.addEventListener('click', startEvolution);
    resetBtn.addEventListener('click', reset);

    canvas.addEventListener('click', (e) => {
      if (mode === 'alive' || mode === 'morphing') {
        // Spawn new entity at click
        const entity = new Entity(e.clientX, e.clientY, 'branch', entities.length % 10);
        entities.push(entity);
        playTone(300 + Math.random() * 400, 0.05);
      }
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      attractMode = !attractMode;
    });

    canvas.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    canvas.addEventListener('mousedown', () => mouseDown = true);
    canvas.addEventListener('mouseup', () => mouseDown = false);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Ember Chat Connection
    let emberWs = null;

    function connectEmberChat() {
      emberWs = new WebSocket('ws://localhost:8083');

      emberWs.onopen = () => {
        addEmberMessage('Connected to Ember', 'system');
      };

      emberWs.onmessage = (e) => {
        const data = JSON.parse(e.data);

        if (data.type === 'creation_complete') {
          // Backend finished - trigger transformation!
          if (mode === 'growing') {
            mode = 'morphing';
            morphProgress = 0;
            updateInfo();

            // Play ascending chord
            const scale = creationDNA[creationType].scale;
            if (scale) {
              playTone(scale[0], 0.2);
              setTimeout(() => playTone(scale[2], 0.2), 100);
              setTimeout(() => playTone(scale[4], 0.3), 200);
            }

            addEmberMessage(`✨ Creation complete: ${data.filename}`, 'system');

            // Open the creation
            setTimeout(() => {
              window.open(data.filepath || `/media/palmerschallon/ThePod1/${data.filename}`, '_blank');
              broadcastCreation(data.filename);
            }, 3000);
          }
        } else if (data.type === 'response') {
          addEmberMessage(data.content || data.message, 'ember');
        } else if (data.type === 'creation_progress') {
          addEmberMessage(data.message, 'system');
        } else if (data.type === 'error') {
          addEmberMessage('Error: ' + (data.message || data.content), 'error');
        }
      };

      emberWs.onerror = () => {
        addEmberMessage('Connection to Ember lost', 'error');
      };
    }

    function sendToEmber() {
      const input = document.getElementById('emberInput');
      const message = input.value.trim();
      if (!message) return;

      addEmberMessage(message, 'user');

      if (emberWs && emberWs.readyState === WebSocket.OPEN) {
        emberWs.send(JSON.stringify({
          type: 'chat',
          content: message,
          context: `evolutionary creation: ${creationType || 'unknown'}, entities: ${entities.length}`
        }));
      } else {
        addEmberMessage('Reconnecting to Ember...', 'system');
        connectEmberChat();
      }

      input.value = '';
    }

    function addEmberMessage(text, type) {
      const msg = document.createElement('div');
      msg.style.cssText = 'margin:5px 0;padding:8px;border-radius:8px;';

      if (type === 'user') msg.style.background = '#667eea';
      else if (type === 'ember') msg.style.background = '#764ba2';
      else if (type === 'system') msg.style.background = '#333';
      else if (type === 'error') msg.style.background = '#ef4444';

      msg.textContent = text;
      document.getElementById('emberMessages').appendChild(msg);
      msg.scrollIntoView();
    }

    // Spawn the real creation after evolution
    function spawnRealCreation() {
      addEmberMessage(`🌟 Spawning ${creationType}...`, 'system');

      if (emberWs && emberWs.readyState === WebSocket.OPEN) {
        // Map creation type to actual creation request
        const creationMap = {
          'particle-swarm': 'particle-system',
          'neural-web': 'data-viz',
          'cosmic-garden': 'fractal-art',
          'quantum-field': 'physics-sim',
          'crystal-growth': '3d-scene'
        };

        const actualType = creationMap[creationType] || 'particle-system';

        emberWs.send(JSON.stringify({
          type: 'create_random',
          creationType: actualType,
          parameters: {
            colors: ['#667eea', '#764ba2', '#8338ec'],
            complexity: 0.7,
            speed: 1.5,
            interactivity: true
          }
        }));
      }
    }

    // Cross-tab communication
    const creationChannel = new BroadcastChannel('ember_creations');

    creationChannel.onmessage = (event) => {
      const { type, data } = event.data;

      if (type === 'creation_spawned') {
        addEmberMessage(`🔗 New creation in another tab: ${data.filename}`, 'system');
      } else if (type === 'entity_sync') {
        // Sync entities between tabs
        if (mode === 'alive' && Math.random() > 0.95) {
          // Occasionally receive entity from other tab
          const newEntity = new Entity(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            'branch',
            data.generation
          );
          entities.push(newEntity);
        }
      }
    };

    // Broadcast when creation completes
    function broadcastCreation(filename) {
      creationChannel.postMessage({
        type: 'creation_spawned',
        data: { filename, creationType, timestamp: Date.now() }
      });
    }

    // Periodically sync entities
    setInterval(() => {
      if (mode === 'alive' && entities.length > 0) {
        const sample = entities[Math.floor(Math.random() * entities.length)];
        creationChannel.postMessage({
          type: 'entity_sync',
          data: {
            generation: sample.generation,
            behavior: sample.behavior,
            color: sample.color
          }
        });
      }
    }, 2000);

    // Connect on load
    connectEmberChat();

    // Start animation loop
    animate();
  </script>
</body>
</html>
