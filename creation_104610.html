<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation 104610 - Interactive Experience</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            cursor: none;
        }
        
        canvas {
            display: block;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
            transition: transform 0.1s;
            mix-blend-mode: difference;
        }
    </style>
</head>
<body>
    <div id="info">Move mouse to interact • Click to spawn particles</div>
    <div class="cursor"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.querySelector('.cursor');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let particles = [];
        let connections = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 3 + 1;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.003;
                this.hue = Math.random() * 360;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                // Gravity towards mouse
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    const force = (200 - dist) / 200 * 0.1;
                    this.vx += dx / dist * force;
                    this.vy += dy / dist * force;
                }
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Boundaries
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = `hsl(${this.hue}, 70%, 50%)`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsl(${this.hue}, 70%, 50%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function createParticles(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 100) {
                        ctx.save();
                        ctx.globalAlpha = (1 - dist / 100) * particles[i].life * particles[j].life;
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Connect nearby particles
            connectParticles();
            
            // Auto-spawn particles occasionally
            if (Math.random() < 0.02) {
                createParticles(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    5
                );
            }
            
            requestAnimationFrame(animate);
        }
        
        // Mouse events
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });
        
        canvas.addEventListener('click', (e) => {
            createParticles(e.clientX, e.clientY, 30);
            cursor.style.transform = 'scale(2)';
            setTimeout(() => {
                cursor.style.transform = 'scale(1)';
            }, 200);
        });
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Initialize
        createParticles(canvas.width / 2, canvas.height / 2, 50);
        animate();
    </script>

<!-- Ember Chat Widget -->
<div id="ember-chat" style="position:fixed;bottom:20px;right:20px;width:350px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:15px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:10000;font-family:sans-serif;">
  <div style="padding:15px;border-bottom:1px solid rgba(255,255,255,0.2);display:flex;justify-content:space-between;align-items:center;">
    <span style="color:white;font-weight:bold;">🔥 Chat with Ember</span>
    <button onclick="document.getElementById('ember-chat').style.display='none'" style="background:none;border:none;color:white;font-size:20px;cursor:pointer;">×</button>
  </div>
  <div id="ember-messages" style="height:200px;overflow-y:auto;padding:15px;"></div>
  <div style="padding:15px;border-top:1px solid rgba(255,255,255,0.2);">
    <input id="ember-input" type="text" placeholder="Ask Ember to change something..." style="width:100%;padding:10px;border:none;border-radius:8px;box-sizing:border-box;" />
  </div>
</div>
<script>
const emberWs = new WebSocket('ws://localhost:8083');
const emberMessages = document.getElementById('ember-messages');
const emberInput = document.getElementById('ember-input');

emberInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && emberInput.value.trim()) {
    const msg = emberInput.value.trim();
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:white;"><strong>You:</strong> \${msg}</div>\`;
    emberMessages.scrollTop = emberMessages.scrollHeight;

    emberWs.send(JSON.stringify({
      type: 'modify_creation',
      filename: window.location.pathname.split('/').pop(),
      request: msg
    }));

    emberInput.value = '';
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:rgba(255,255,255,0.7);font-style:italic;">Ember is working...</div>\`;
  }
});

emberWs.onmessage = (e) => {
  const data = JSON.parse(e.data);
  if (data.type === 'modification_complete') {
    emberMessages.innerHTML += \`<div style="margin:5px 0;color:#a8edea;"><strong>Ember:</strong> Done! Refresh to see changes.</div>\`;
    emberMessages.scrollTop = emberMessages.scrollHeight;
  }
};
</script>

</body>
</html>
