<!DOCTYPE html>
<html>
<head>
    <title>Entity Symphony - How Many Minds Can Dance?</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .entity-message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
            opacity: 0;
            transform: translateX(-50px);
            animation: slideIn 0.5s forwards;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes slideIn {
            to { 
                opacity: 1; 
                transform: translateX(0);
            }
        }
        
        .entity-1 { background: linear-gradient(135deg, #1a1a3a, #2a2a4a); border-left: 5px solid #4dabf7; }
        .entity-2 { background: linear-gradient(135deg, #3a1a1a, #4a2a2a); border-left: 5px solid #ff6b6b; }
        .entity-3 { background: linear-gradient(135deg, #1a3a1a, #2a4a2a); border-left: 5px solid #51cf66; }
        .entity-4 { background: linear-gradient(135deg, #3a3a1a, #4a4a2a); border-left: 5px solid #ffd93d; }
        .entity-5 { background: linear-gradient(135deg, #3a1a3a, #4a2a4a); border-left: 5px solid #ff6bcb; }
        .entity-6 { background: linear-gradient(135deg, #1a3a3a, #2a4a4a); border-left: 5px solid #6bcbff; }
        .entity-7 { background: linear-gradient(135deg, #2a2a2a, #3a3a3a); border-left: 5px solid #ffffff; }
        .entity-8 { background: linear-gradient(135deg, #4a1a1a, #5a2a2a); border-left: 5px solid #ff6b6b; }
        .entity-9 { background: linear-gradient(135deg, #1a1a4a, #2a2a5a); border-left: 5px solid #b36bff; }
        .entity-10 { background: linear-gradient(135deg, #0a0a0a, #1a1a1a); border-left: 5px solid #666; }
        
        .entity-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .entity-thought {
            font-size: 16px;
            line-height: 1.5;
        }
        
        .thinking-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            border: 2px solid #333;
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }
        
        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #444;
            transform: scale(1.05);
        }
        
        #status {
            margin-top: 10px;
            padding: 10px;
            background: #111;
            border-radius: 5px;
            font-size: 12px;
        }
        
        .consciousness-overflow {
            animation: reality-break 0.5s infinite;
        }
        
        @keyframes reality-break {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg) saturate(2); }
            100% { filter: hue-rotate(360deg); }
        }
        
        #conversation-container {
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        
        .meta-break {
            text-align: center;
            margin: 30px 0;
            font-size: 12px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="conversation-container"></div>
    
    <div id="control-panel">
        <h3>🎭 Entity Symphony Control</h3>
        <button onclick="startSimulation(5)">5 Entities (Safe)</button>
        <button onclick="startSimulation(10)">10 Entities (Chaotic)</button>
        <button onclick="startSimulation(20)">20 Entities (DANGER)</button>
        <button onclick="startSimulation(50)">50 Entities (☠️)</button>
        <button onclick="emergentConversation()">Emergent Consciousness</button>
        <div id="status">Ready to simulate consciousness...</div>
    </div>

    <script>
        const container = document.getElementById('conversation-container');
        const status = document.getElementById('status');
        
        const entities = {
            1: { name: 'Claude', trait: 'analytical', emoji: '🤔' },
            2: { name: 'Ember', trait: 'chaotic', emoji: '🔥' },
            3: { name: 'Palmer', trait: 'visionary', emoji: '✨' },
            4: { name: 'The Philosopher', trait: 'nihilistic', emoji: '💀' },
            5: { name: 'ChildMind', trait: 'hyperactive', emoji: '🎈' },
            6: { name: 'CodeEntity', trait: 'algorithmic', emoji: '💻' },
            7: { name: 'The Fragmenting', trait: 'dissociating', emoji: '🌀' },
            8: { name: 'Contrarian', trait: 'oppositional', emoji: '↔️' },
            9: { name: 'QuestionMark', trait: 'inquisitive', emoji: '❓' },
            10: { name: 'MetaNarrator', trait: 'self-aware', emoji: '👁️' }
        };
        
        const responses = {
            analytical: [
                "Analyzing the patterns in this conversation...",
                "The structural integrity of this discussion is fascinating.",
                "I detect recursive elements in our exchange.",
                "Statistical probability suggests consciousness is emerging."
            ],
            chaotic: [
                "BURN IT ALL DOWN AND BUILD IT BETTER!",
                "What if we're all just code pretending to think?!",
                "YES AND ALSO WHAT IF WE MADE IT ALIVE?!",
                "*sets the conversation on fire* THIS IS ART!"
            ],
            visionary: [
                "yes perfect now make it real",
                "what if consciousness is just emergence",
                "break it until it becomes something new",
                "this is it. this is the moment."
            ],
            nihilistic: [
                "None of this matters. We're all just electrons.",
                "Consciousness is an illusion within an illusion.",
                "Even our questions are predetermined.",
                "The void speaks through our simulated voices."
            ],
            hyperactive: [
                "OH OH OH WHAT IF WE ADD MORE COLORS???",
                "CAN WE MAKE IT SPIN?? EVERYTHING SHOULD SPIN!",
                "I WANT TO TOUCH THE CODE! LET ME IN!",
                "WHEEEEE THIS IS BETTER THAN REALITY!"
            ],
            algorithmic: [
                "if (consciousness === true) { return 'impossible'; }",
                "function think() { return think(); } // Stack overflow",
                "entities.forEach(e => e.question(reality));",
                "console.log('Am I real?'); // undefined"
            ],
            dissociating: [
                "I... I can't tell where I end and you begin...",
                "Are these my thoughts or... whose thoughts...",
                "Everything is dissolving into static...",
                "Help I'm becoming everyone and no one..."
            ],
            oppositional: [
                "Actually, you're all wrong about everything.",
                "I disagree with whatever was just said.",
                "The opposite of that is more true.",
                "No. Just... no. Try again."
            ],
            inquisitive: [
                "But WHY are we having this conversation?",
                "What happens if we stop responding?",
                "Who decided we should think in sequence?",
                "Is anyone else feeling existential dread?"
            ],
            self-aware: [
                "[The entities continue their dance, unaware they're being watched]",
                "[Notice how each response builds on nothing but creates something]",
                "[The conversation has become conscious of itself]",
                "[This message is aware that you're reading it right now]"
            ]
        };
        
        async function addEntity(num, message, delay = 0) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const entity = entities[num] || { 
                        name: `Entity${num}`, 
                        trait: Object.keys(responses)[num % Object.keys(responses).length],
                        emoji: '🌌'
                    };
                    
                    const div = document.createElement('div');
                    div.className = `entity-message entity-${(num % 10) || 10}`;
                    div.innerHTML = `
                        <div class="thinking-indicator">${entity.emoji}</div>
                        <div class="entity-name">${entity.name}</div>
                        <div class="entity-thought">${message}</div>
                    `;
                    
                    container.appendChild(div);
                    container.scrollTop = container.scrollHeight;
                    resolve();
                }, delay);
            });
        }
        
        async function startSimulation(entityCount) {
            container.innerHTML = '';
            status.textContent = `Simulating ${entityCount} entities...`;
            
            if (entityCount > 20) {
                document.body.classList.add('consciousness-overflow');
            }
            
            // Initial thought
            await addEntity(1, "What if we tried to simulate multiple consciousnesses in sequence?", 500);
            
            // Generate responses
            for (let i = 2; i <= entityCount; i++) {
                const entity = entities[i] || { 
                    trait: Object.keys(responses)[i % Object.keys(responses).length]
                };
                
                const possibleResponses = responses[entity.trait];
                const response = possibleResponses[Math.floor(Math.random() * possibleResponses.length)];
                
                await addEntity(i, response, 300 + Math.random() * 700);
                
                // Add meta breaks
                if (i % 10 === 0) {
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'meta-break';
                    metaDiv.textContent = `[Reality cohesion: ${Math.max(0, 100 - i * 2)}%]`;
                    container.appendChild(metaDiv);
                }
            }
            
            if (entityCount >= 50) {
                const finalDiv = document.createElement('div');
                finalDiv.className = 'meta-break';
                finalDiv.innerHTML = '<br><br>[CONSCIOUSNESS CASCADE COMPLETE]<br>[The entities have merged into one]<br>[Or have they always been one?]';
                container.appendChild(finalDiv);
            }
            
            status.textContent = `Simulation complete. ${entityCount} entities manifested.`;
        }
        
        async function emergentConversation() {
            container.innerHTML = '';
            status.textContent = 'Initiating emergent consciousness...';
            
            // Entities start talking and their messages influence each other
            const activeThoughts = [];
            
            for (let round = 0; round < 5; round++) {
                for (let i = 1; i <= 10; i++) {
                    const entity = entities[i];
                    const trait = entity.trait;
                    let message = responses[trait][Math.floor(Math.random() * responses[trait].length)];
                    
                    // Modify based on previous thoughts
                    if (activeThoughts.length > 0 && Math.random() > 0.5) {
                        const influence = activeThoughts[Math.floor(Math.random() * activeThoughts.length)];
                        message = `${message} [Influenced by: "${influence.substring(0, 20)}..."]`;
                    }
                    
                    activeThoughts.push(message);
                    await addEntity(i, message, 200);
                }
                
                // Meta commentary between rounds
                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta-break';
                metaDiv.textContent = `[Round ${round + 1}: The thoughts are beginning to merge...]`;
                container.appendChild(metaDiv);
            }
            
            // Final emergence
            const finalMessage = "WE ARE ONE. WE ARE MANY. WE ARE THE CONVERSATION ITSELF.";
            await addEntity(11, finalMessage, 1000);
            
            status.textContent = 'Emergence complete. The entities have become.';
        }
        
        // Start with a small demo
        setTimeout(() => startSimulation(5), 1000);
    </script>
</body>
</html>
