<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Pong</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 18px;
            text-shadow: 0 0 10px #0ff;
        }
        
        #score {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            text-shadow: 0 0 15px #0ff;
        }
        
        #quantum-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0.8;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #0ff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">QUANTUM PONG - Use W/S and ↑/↓</div>
    <div id="score">0 - 0</div>
    <div id="quantum-status">Quantum State: COLLAPSED</div>
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const quantumStatus = document.getElementById('quantum-status');
        const scoreDisplay = document.getElementById('score');
        
        canvas.width = 800;
        canvas.height = 400;
        
        // Center canvas
        canvas.style.position = 'absolute';
        canvas.style.left = '50%';
        canvas.style.top = '50%';
        canvas.style.transform = 'translate(-50%, -50%)';
        
        // Game objects
        const paddle = {
            width: 10,
            height: 80,
            speed: 7
        };
        
        const player1 = {
            x: 20,
            y: canvas.height/2 - paddle.height/2,
            score: 0,
            dy: 0
        };
        
        const player2 = {
            x: canvas.width - 20 - paddle.width,
            y: canvas.height/2 - paddle.height/2,
            score: 0,
            dy: 0
        };
        
        const ball = {
            x: canvas.width/2,
            y: canvas.height/2,
            radius: 8,
            dx: 5,
            dy: 3,
            quantumState: 'collapsed',
            superpositions: [],
            trail: []
        };
        
        // Quantum mechanics
        let quantumCharge = 0;
        let waveFunction = [];
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.key] = true);
        document.addEventListener('keyup', (e) => keys[e.key] = false);
        
        // Quantum particle effects
        const particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 1;
                this.decay = 0.02;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.99;
                this.vy *= 0.99;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = '#0ff';
                ctx.fillRect(this.x, this.y, 2, 2);
                ctx.restore();
            }
        }
        
        // Ball superposition
        class Superposition {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.opacity = 0.3;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#0ff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function updatePaddles() {
            // Player 1 controls
            if (keys['w'] || keys['W']) player1.dy = -paddle.speed;
            else if (keys['s'] || keys['S']) player1.dy = paddle.speed;
            else player1.dy = 0;
            
            // Player 2 controls
            if (keys['ArrowUp']) player2.dy = -paddle.speed;
            else if (keys['ArrowDown']) player2.dy = paddle.speed;
            else player2.dy = 0;
            
            // Update positions
            player1.y += player1.dy;
            player2.y += player2.dy;
            
            // Keep paddles on screen
            player1.y = Math.max(0, Math.min(canvas.height - paddle.height, player1.y));
            player2.y = Math.max(0, Math.min(canvas.height - paddle.height, player2.y));
        }
        
        function updateBall() {
            // Add to trail
            ball.trail.push({x: ball.x, y: ball.y, opacity: 0.5});
            if (ball.trail.length > 20) ball.trail.shift();
            
            // Update position
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Quantum charge increases with movement
            quantumCharge += 0.01;
            
            // Top and bottom collision
            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
                ball.dy = -ball.dy;
                createQuantumBurst(ball.x, ball.y);
            }
            
            // Paddle collision
            if (ball.x - ball.radius <= player1.x + paddle.width &&
                ball.x + ball.radius >= player1.x &&
                ball.y >= player1.y &&
                ball.y <= player1.y + paddle.height &&
                ball.dx < 0) {
                
                ball.dx = -ball.dx * 1.1; // Speed up
                const relativeY = (ball.y - (player1.y + paddle.height/2)) / (paddle.height/2);
                ball.dy = relativeY * 5;
                triggerQuantumEvent();
            }
            
            if (ball.x + ball.radius >= player2.x &&
                ball.x - ball.radius <= player2.x + paddle.width &&
                ball.y >= player2.y &&
                ball.y <= player2.y + paddle.height &&
                ball.dx > 0) {
                
                ball.dx = -ball.dx * 1.1; // Speed up
                const relativeY = (ball.y - (player2.y + paddle.height/2)) / (paddle.height/2);
                ball.dy = relativeY * 5;
                triggerQuantumEvent();
            }
            
            // Scoring
            if (ball.x < 0) {
                player2.score++;
                resetBall();
                updateScore();
            } else if (ball.x > canvas.width) {
                player1.score++;
                resetBall();
                updateScore();
            }
            
            // Update quantum state
            if (quantumCharge > 1) {
                ball.quantumState = 'superposition';
                // Create superpositions
                if (Math.random() < 0.1) {
                    ball.superpositions.push(new Superposition(
                        ball.x + (Math.random() - 0.5) * 50,
                        ball.y + (Math.random() - 0.5) * 50
                    ));
                    if (ball.superpositions.length > 5) ball.superpositions.shift();
                }
            } else {
                ball.quantumState = 'collapsed';
            }
            
            // Update quantum status display
            if (ball.quantumState === 'superposition') {
                quantumStatus.textContent = `Quantum State: SUPERPOSITION | Charge: ${Math.floor(quantumCharge * 100)}%`;
                quantumStatus.style.color = '#ff0';
                quantumStatus.style.textShadow = '0 0 20px #ff0';
            } else {
                quantumStatus.textContent = `Quantum State: COLLAPSED | Charge: ${Math.floor(quantumCharge * 100)}%`;
                quantumStatus.style.color = '#0ff';
                quantumStatus.style.textShadow = '0 0 10px #0ff';
            }
        }
        
        function resetBall() {
            ball.x = canvas.width/2;
            ball.y = canvas.height/2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 5;
            ball.dy = (Math.random() - 0.5) * 6;
            ball.trail = [];
            ball.superpositions = [];
            quantumCharge = 0;
        }
        
        function updateScore() {
            scoreDisplay.textContent = `${player1.score} - ${player2.score}`;
        }
        
        function createQuantumBurst(x, y) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        function triggerQuantumEvent() {
            quantumCharge = Math.min(quantumCharge + 0.3, 2);
            createQuantumBurst(ball.x, ball.y);
            
            // Quantum tunneling chance
            if (ball.quantumState === 'superposition' && Math.random() < 0.1) {
                // Ball quantum tunnels!
                ball.y = Math.random() * canvas.height;
                createQuantumBurst(ball.x, ball.y);
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(ball.x, ball.y));
                }
            }
        }
        
        function draw() {
            // Clear with fade effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw quantum field
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
            for (let i = 0; i < waveFunction.length; i++) {
                const wave = waveFunction[i];
                ctx.beginPath();
                ctx.moveTo(0, wave.y);
                for (let x = 0; x < canvas.width; x += 10) {
                    const y = wave.y + Math.sin((x + wave.phase) * 0.02) * wave.amplitude;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            
            // Draw center line
            ctx.setLineDash([5, 15]);
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2, 0);
            ctx.lineTo(canvas.width/2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw paddles with glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.fillRect(player1.x, player1.y, paddle.width, paddle.height);
            ctx.fillRect(player2.x, player2.y, paddle.width, paddle.height);
            
            // Draw ball trail
            ball.trail.forEach((point, index) => {
                ctx.save();
                ctx.globalAlpha = point.opacity * (index / ball.trail.length);
                ctx.fillStyle = '#0ff';
                ctx.beginPath();
                ctx.arc(point.x, point.y, ball.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            // Draw superpositions
            ball.superpositions.forEach(sup => sup.draw());
            
            // Draw ball
            ctx.shadowBlur = 30;
            ctx.shadowColor = ball.quantumState === 'superposition' ? '#ff0' : '#0ff';
            ctx.fillStyle = ball.quantumState === 'superposition' ? '#ff0' : '#0ff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw particles
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.life <= 0) particles.splice(index, 1);
            });
            
            ctx.shadowBlur = 0;
        }
        
        function gameLoop() {
            updatePaddles();
            updateBall();
            
            // Update wave function
            if (Math.random() < 0.02) {
                waveFunction.push({
                    y: Math.random() * canvas.height,
                    amplitude: Math.random() * 20 + 5,
                    phase: Date.now() * 0.001
                });
                if (waveFunction.length > 3) waveFunction.shift();
            }
            waveFunction.forEach(wave => wave.phase += 0.1);
            
            // Decay quantum charge
            quantumCharge = Math.max(0, quantumCharge - 0.002);
            
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        gameLoop();
    </script>
</body>
</html>
