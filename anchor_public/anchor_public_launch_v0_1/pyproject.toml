[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-ledger"
version = "0.1.0"
description = "Anchor – a local, immutable ledger for your ideas and decisions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Palmer Schallon" }
]
dependencies = [
  "rich>=13.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0"
]

[project.scripts]
anchor = "anchor.cli:main"
