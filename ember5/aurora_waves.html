<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Waves</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="aurora"></canvas>
    <script>
        const canvas = document.getElementById('aurora');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        const waves = [];
        
        class Wave {
            constructor(y, amplitude, frequency, phase, color) {
                this.y = y;
                this.amplitude = amplitude;
                this.frequency = frequency;
                this.phase = phase;
                this.color = color;
                this.opacity = Math.random() * 0.3 + 0.1;
            }
            
            draw(time) {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.globalAlpha = this.opacity;
                
                for (let x = 0; x <= canvas.width; x += 5) {
                    const y = this.y + Math.sin((x * this.frequency) + this.phase + time) * this.amplitude;
                    if (x === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.stroke();
                
                // Create glow effect
                ctx.shadowBlur = 50;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Fill gradient below wave
                const gradient = ctx.createLinearGradient(0, this.y - this.amplitude, 0, canvas.height);
                gradient.addColorStop(0, this.color + '40');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.globalAlpha = this.opacity * 0.3;
                ctx.fill();
                ctx.closePath();
            }
        }
        
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = -Math.random() * 2 - 0.5;
                this.opacity = 0;
                this.fadeIn = true;
                this.color = `hsl(${Math.random() * 60 + 170}, 100%, 70%)`;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.fadeIn) {
                    this.opacity += 0.02;
                    if (this.opacity >= 1) {
                        this.fadeIn = false;
                    }
                } else {
                    this.opacity -= 0.01;
                }
                
                if (this.opacity <= 0 || this.y < -10) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        // Initialize waves
        const colors = ['#00ffaa', '#00aaff', '#aa00ff', '#ff00aa', '#ffaa00'];
        for (let i = 0; i < 5; i++) {
            waves.push(new Wave(
                canvas.height * 0.3 + i * 60,
                30 + i * 10,
                0.002 + i * 0.0005,
                i * Math.PI / 3,
                colors[i]
            ));
        }
        
        // Initialize particles
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }
        
        let time = 0;
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            ctx.globalAlpha = 1;
            for (let i = 0; i < 200; i++) {
                const x = (i * 137.5) % canvas.width;
                const y = (i * 89) % canvas.height;
                const brightness = Math.sin(time * 0.001 + i) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.8})`;
                ctx.fillRect(x, y, 1, 1);
            }
            
            // Draw waves
            waves.forEach(wave => {
                wave.draw(time);
            });
            
            // Draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            time += 0.02;
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
