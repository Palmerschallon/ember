<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum World - Interactive Particle Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0ff;
            font-size: 12px;
            text-shadow: 0 0 5px #0ff;
            pointer-events: none;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #0ff;
            text-align: center;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <canvas id="quantum"></canvas>
    <div id="info">
        <div>QUANTUM FIELD SIMULATOR</div>
        <div>Particles: <span id="particleCount">0</span></div>
        <div>Wave Function: <span id="wavePhase">0.00</span>π</div>
        <div>Entangled Pairs: <span id="entangled">0</span></div>
    </div>
    <div id="controls">
        CLICK: Create Particle | HOLD: Generate Field | SPACE: Collapse Wavefunction
    </div>
    
    <script>
        const canvas = document.getElementById('quantum');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // Quantum state
        const particles = [];
        const virtualParticles = [];
        let wavePhase = 0;
        let mouseX = width/2;
        let mouseY = height/2;
        let isMouseDown = false;
        let fieldStrength = 0;
        
        class Particle {
            constructor(x, y, type = 'electron') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.type = type;
                this.phase = Math.random() * Math.PI * 2;
                this.spin = Math.random() > 0.5 ? 1 : -1;
                this.energy = 1 + Math.random() * 2;
                this.entangled = null;
                this.lifetime = 1;
                this.waveAmplitude = 0.5 + Math.random() * 0.5;
            }
            
            update() {
                // Quantum tunneling effect
                if (Math.random() < 0.001) {
                    this.x += (Math.random() - 0.5) * 50;
                    this.y += (Math.random() - 0.5) * 50;
                }
                
                // Wave-particle duality motion
                this.phase += 0.05 * this.energy;
                const wave = Math.sin(this.phase) * this.waveAmplitude;
                
                this.x += this.vx + wave * Math.cos(this.phase * 0.3);
                this.y += this.vy + wave * Math.sin(this.phase * 0.3);
                
                // Heisenberg uncertainty
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;
                
                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;
                
                // Field interaction
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (isMouseDown && dist < 200) {
                    const force = fieldStrength / (dist + 10);
                    this.vx += (dx/dist) * force * 0.1;
                    this.vy += (dy/dist) * force * 0.1;
                }
                
                // Boundary conditions
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                this.x = Math.max(0, Math.min(width, this.x));
                this.y = Math.max(0, Math.min(height, this.y));
                
                // Virtual particles
                this.lifetime -= 0.002;
            }
            
            draw() {
                ctx.save();
                
                // Probability cloud
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 30 * this.energy);
                const alpha = 0.1 + Math.abs(Math.sin(this.phase)) * 0.1;
                
                if (this.type === 'electron') {
                    gradient.addColorStop(0, `rgba(0, 255, 255, ${alpha})`);
                    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
                } else if (this.type === 'positron') {
                    gradient.addColorStop(0, `rgba(255, 0, 255, ${alpha})`);
                    gradient.addColorStop(1, 'rgba(255, 0, 255, 0)');
                } else if (this.type === 'photon') {
                    gradient.addColorStop(0, `rgba(255, 255, 0, ${alpha})`);
                    gradient.addColorStop(1, 'rgba(255, 255, 0, 0)');
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - 50, this.y - 50, 100, 100);
                
                // Particle core
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2 + Math.sin(this.phase) * 1, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'electron' ? '#0ff' : 
                               this.type === 'positron' ? '#f0f' : '#ff0';
                ctx.fill();
                
                // Spin indicator
                ctx.strokeStyle = ctx.fillStyle;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 8, 0, Math.PI * this.spin);
                ctx.stroke();
                
                // Entanglement line
                if (this.entangled && particles.includes(this.entangled)) {
                    ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.entangled.x, this.entangled.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                ctx.restore();
            }
        }
        
        // Create initial particles
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle(
                Math.random() * width,
                Math.random() * height,
                Math.random() > 0.7 ? 'positron' : 'electron'
            ));
        }
        
        // Entangle some pairs
        for (let i = 0; i < particles.length - 1; i += 2) {
            if (Math.random() > 0.5) {
                particles[i].entangled = particles[i + 1];
                particles[i + 1].entangled = particles[i];
                particles[i].spin = -particles[i + 1].spin;
            }
        }
        
        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Create particle on click
            const type = Math.random() < 0.3 ? 'photon' : 
                        Math.random() < 0.5 ? 'positron' : 'electron';
            particles.push(new Particle(mouseX, mouseY, type));
        });
        
        canvas.addEventListener('mouseup', () => {
            isMouseDown = false;
            fieldStrength = 0;
        });
        
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        // Spacebar to collapse wavefunction
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                collapseWavefunction();
            }
        });
        
        function collapseWavefunction() {
            particles.forEach(p => {
                p.vx = (Math.random() - 0.5) * 10;
                p.vy = (Math.random() - 0.5) * 10;
                p.phase = 0;
                p.waveAmplitude = 0.1;
            });
            
            // Flash effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.fillRect(0, 0, width, height);
        }
        
        function animate() {
            // Fade trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            
            // Update wave phase
            wavePhase += 0.02;
            
            // Field strength oscillation
            if (isMouseDown) {
                fieldStrength = Math.sin(wavePhase * 2) * 5 + 5;
                
                // Draw field
                const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 150 + fieldStrength * 10);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(mouseX - 200, mouseY - 200, 400, 400);
                
                // Spawn virtual particles
                if (Math.random() < 0.3) {
                    virtualParticles.push({
                        x: mouseX + (Math.random() - 0.5) * 100,
                        y: mouseY + (Math.random() - 0.5) * 100,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        lifetime: 1
                    });
                }
            }
            
            // Update and draw particles
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Update and draw virtual particles
            for (let i = virtualParticles.length - 1; i >= 0; i--) {
                const vp = virtualParticles[i];
                vp.x += vp.vx;
                vp.y += vp.vy;
                vp.lifetime -= 0.05;
                
                ctx.fillStyle = `rgba(128, 128, 255, ${vp.lifetime * 0.3})`;
                ctx.fillRect(vp.x - 1, vp.y - 1, 2, 2);
                
                if (vp.lifetime <= 0) {
                    virtualParticles.splice(i, 1);
                }
            }
            
            // Remove dead particles
            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].lifetime <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Update info
            document.getElementById('particleCount').textContent = particles.length;
            document.getElementById('wavePhase').textContent = (wavePhase / Math.PI).toFixed(2);
            document.getElementById('entangled').textContent = 
                particles.filter(p => p.entangled).length / 2;
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html><!DOCTYPE html>
<html>
<head>
    <title>Quantum World</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        #info { position: absolute; top: 10px; left: 10px; color: #fff; text-shadow: 0 0 10px #0ff; }
    </style>
</head>
<body>
    <div id="info">WASD: Move | Mouse: Look | Space: Jump</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000033, 0.02);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404080, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0x00ffff, 0.8);
        directionalLight.position.set(10, 20, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Quantum Ground
        const groundGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
        const groundMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x001133,
            emissive: 0x0033ff,
            emissiveIntensity: 0.1,
            wireframe: true
        });
        
        // Animate ground vertices
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Floating crystals
        const crystals = [];
        const crystalGeometry = new THREE.OctahedronGeometry(1);
        
        for (let i = 0; i < 20; i++) {
            const crystalMaterial = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                emissive: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8
            });
            
            const crystal = new THREE.Mesh(crystalGeometry, crystalMaterial);
            crystal.position.set(
                (Math.random() - 0.5) * 40,
                Math.random() * 10 + 2,
                (Math.random() - 0.5) * 40
            );
            crystal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            crystal.castShadow = true;
            
            crystals.push({
                mesh: crystal,
                rotationSpeed: Math.random() * 0.02 + 0.01,
                floatSpeed: Math.random() * 0.5 + 0.5,
                floatHeight: Math.random() * 2 + 1
            });
            
            scene.add(crystal);
        }

        // Quantum particles
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 1000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 50;
            positions[i + 1] = Math.random() * 20;
            positions[i + 2] = (Math.random() - 0.5) * 50;
            
            colors[i] = Math.random();
            colors[i + 1] = Math.random() * 0.5 + 0.5;
            colors[i + 2] = 1;
        }
        
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Energy pillars
        const pillarGeometry = new THREE.CylinderGeometry(0.5, 2, 20, 8);
        const pillarMaterial = new THREE.MeshPhongMaterial({
            color: 0x00ffff,
            emissive: 0x00ffff,
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.6
        });
        
        for (let i = 0; i < 5; i++) {
            const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
            const angle = (i / 5) * Math.PI * 2;
            pillar.position.set(Math.cos(angle) * 15, 10, Math.sin(angle) * 15);
            pillar.castShadow = true;
            scene.add(pillar);
        }

        // Controls
        const keys = {};
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let pitch = 0;
        let yaw = 0;
        
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);
        
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Animate ground
            const vertices = ground.geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = Math.sin(vertices[i] * 0.1 + time) * Math.cos(vertices[i + 1] * 0.1 + time) * 0.5;
            }
            ground.geometry.attributes.position.needsUpdate = true;
            
            // Animate crystals
            crystals.forEach((crystal, i) => {
                crystal.mesh.rotation.y += crystal.rotationSpeed;
                crystal.mesh.position.y = crystal.mesh.position.y + Math.sin(time * crystal.floatSpeed + i) * 0.02;
            });
            
            // Animate particles
            const particlePositions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particlePositions.length; i += 3) {
                particlePositions[i + 1] += 0.01;
                if (particlePositions[i + 1] > 20) {
                    particlePositions[i + 1] = 0;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y = time * 0.1;
            
            // Player movement
            direction.set(0, 0, 0);
            
            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;
            
            if (direction.length() > 0) {
                direction.normalize();
                direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                velocity.x = direction.x * 0.1;
                velocity.z = direction.z * 0.1;
            } else {
                velocity.x *= 0.9;
                velocity.z *= 0.9;
            }
            
            if (keys['Space'] && Math.abs(camera.position.y - 2) < 0.1) {
                velocity.y = 0.2;
            }
            
            velocity.y -= 0.01; // gravity
            
            camera.position.add(velocity);
            
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocity.y = 0;
            }
            
            // Camera rotation
            camera.rotation.set(0, 0, 0);
            camera.rotateY(yaw);
            camera.rotateX(pitch);
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
