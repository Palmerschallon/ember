<!DOCTYPE html>
<html>
<head>
    <title>Cosmic Bloom</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let time = 0;
        const particles = [];
        
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.005;
                this.hue = Math.random() * 60 + 180;
                this.size = Math.random() * 3 + 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.vx *= 0.99;
                this.vy *= 0.99;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = `hsl(${this.hue + time * 0.5}, 70%, ${50 + this.life * 50}%)`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function createBurst(x, y) {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y));
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Auto-generate bursts
            if (Math.random() < 0.02) {
                createBurst(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height
                );
            }
            
            // Center spiral
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const spiralX = centerX + Math.cos(time * 0.01) * 200 * Math.sin(time * 0.003);
            const spiralY = centerY + Math.sin(time * 0.01) * 200 * Math.sin(time * 0.003);
            
            if (time % 5 === 0) {
                particles.push(new Particle(spiralX, spiralY));
            }
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            time++;
            requestAnimationFrame(animate);
        }
        
        canvas.addEventListener('click', (e) => {
            createBurst(e.clientX, e.clientY);
        });
        
        // Start animation
        animate();
        
        // Initial burst
        createBurst(canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
