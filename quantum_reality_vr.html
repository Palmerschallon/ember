<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Reality VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/environment/dist/aframe-environment-component.min.js"></script>
    <style>
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            font-family: monospace;
            border-radius: 5px;
            z-index: 999;
        }
        .glitch {
            animation: glitch 2s infinite;
        }
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, .75), -0.025em -0.05em 0 rgba(0, 255, 0, .75); }
            25% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, .75), 0.05em 0 0 rgba(0, 255, 0, .75); }
            50% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, .75), 0.025em 0.025em 0 rgba(0, 255, 0, .75); }
            75% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, .75), -0.05em -0.05em 0 rgba(0, 255, 0, .75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 0, .75), -0.025em -0.025em 0 rgba(0, 255, 0, .75); }
        }
    </style>
</head>
<body>
    <div id="info">
        <h2 class="glitch">QUANTUM REALITY VR</h2>
        <p>🎮 WASD/Arrows - Move</p>
        <p>🖱️ Click + Drag - Look around</p>
        <p>🌌 Space - Quantum jump</p>
    </div>

    <a-scene fog="type: exponential; color: #111; density: 0.05">
        <!-- Quantum particles system -->
        <a-entity id="particles"></a-entity>
        
        <!-- Reality fragments -->
        <a-entity id="fragments">
            <a-box position="-2 3 -8" rotation="45 45 0" scale="0.5 0.5 0.5" 
                   material="color: #4CC3D9; emissive: #4CC3D9; emissiveIntensity: 0.2"
                   animation="property: rotation; to: 405 405 360; dur: 8000; loop: true; easing: easeInOutQuad"
                   animation__pulse="property: scale; to: 0.6 0.6 0.6; dur: 1500; loop: true; dir: alternate">
            </a-box>
            
            <a-sphere position="3 2 -6" radius="0.4"
                      material="color: #EF2D5E; emissive: #EF2D5E; emissiveIntensity: 0.3"
                      animation="property: position; to: 3 4 -6; dur: 3000; loop: true; dir: alternate; easing: easeInOutQuad">
            </a-sphere>
            
            <a-cylinder position="0 0.75 -4" radius="0.3" height="1.5"
                        material="color: #FFC65D; emissive: #FFC65D; emissiveIntensity: 0.2"
                        animation="property: rotation; to: 0 360 0; dur: 5000; loop: true">
            </a-cylinder>
        </a-entity>

        <!-- Quantum portals -->
        <a-entity id="portal1" position="-5 2 -10">
            <a-ring color="#00FF88" radius-inner="1" radius-outer="2"
                    animation="property: rotation; to: 0 0 360; dur: 4000; loop: true">
            </a-ring>
            <a-ring color="#00FFFF" radius-inner="0.8" radius-outer="1.2"
                    animation="property: rotation; to: 0 0 -360; dur: 3000; loop: true">
            </a-ring>
        </a-entity>

        <a-entity id="portal2" position="5 2 -10">
            <a-ring color="#FF00FF" radius-inner="1" radius-outer="2"
                    animation="property: rotation; to: 0 0 360; dur: 4000; loop: true">
            </a-ring>
            <a-ring color="#FFFF00" radius-inner="0.8" radius-outer="1.2"
                    animation="property: rotation; to: 0 0 -360; dur: 3000; loop: true">
            </a-ring>
        </a-entity>

        <!-- Floating text entities -->
        <a-text value="REALITY.EXE" position="-3 5 -8" color="#00FF00" font="monoid"
                animation="property: opacity; from: 0.1; to: 1; dur: 2000; loop: true; dir: alternate">
        </a-text>
        
        <a-text value="QUANTUM_FIELD" position="3 4.5 -9" color="#FF00FF" font="monoid"
                animation="property: position; to: 3 5.5 -9; dur: 3000; loop: true; dir: alternate">
        </a-text>

        <!-- Environment -->
        <a-sky color="#000011"></a-sky>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" 
                 material="color: #111122; roughness: 0.8; metalness: 0.2"></a-plane>
        
        <!-- Ambient lighting -->
        <a-light type="ambient" color="#222"></a-light>
        <a-light type="point" intensity="0.5" position="0 5 0" color="#00FFFF"></a-light>

        <!-- Camera with controls -->
        <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        // Create quantum particles
        const particlesEl = document.querySelector('#particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('a-sphere');
            particle.setAttribute('radius', '0.05');
            particle.setAttribute('position', {
                x: (Math.random() - 0.5) * 20,
                y: Math.random() * 5,
                z: -Math.random() * 15 - 2
            });
            particle.setAttribute('material', {
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                emissive: `hsl(${Math.random() * 360}, 100%, 50%)`,
                emissiveIntensity: 0.5
            });
            particle.setAttribute('animation', {
                property: 'position',
                to: {
                    x: (Math.random() - 0.5) * 20,
                    y: Math.random() * 5,
                    z: -Math.random() * 15 - 2
                },
                dur: Math.random() * 5000 + 5000,
                loop: true,
                easing: 'easeInOutQuad'
            });
            particlesEl.appendChild(particle);
        }

        // Quantum jump on spacebar
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                const camera = document.querySelector('[camera]');
                const pos = camera.getAttribute('position');
                camera.setAttribute('position', {
                    x: pos.x + (Math.random() - 0.5) * 4,
                    y: pos.y,
                    z: pos.z + (Math.random() - 0.5) * 4
                });
                
                // Flash effect
                const sky = document.querySelector('a-sky');
                sky.setAttribute('animation', {
                    property: 'material.color',
                    from: '#FFFFFF',
                    to: '#000011',
                    dur: 300,
                    easing: 'easeInQuad'
                });
            }
        });

        // Dynamic reality glitches
        setInterval(() => {
            const fragments = document.querySelectorAll('#fragments > *');
            const randomFragment = fragments[Math.floor(Math.random() * fragments.length)];
            randomFragment.setAttribute('visible', false);
            setTimeout(() => randomFragment.setAttribute('visible', true), 100);
        }, 3000);
    </script>
</body>
</html>
