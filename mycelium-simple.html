<!DOCTYPE html>
<html>
<head>
  <title>Mycelium Reality Weaving</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    canvas {
      display: block;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }
    button {
      font-size: 20px;
      padding: 15px 40px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 50px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
      transition: all 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(102, 126, 234, 0.8);
    }
    #info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(102, 126, 234, 0.3);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button onclick="startWeaving()">🔥 WEAVE REALITY</button>
  </div>
  <div id="info">
    <div id="status">Ready</div>
    <div id="stats">Threads: 0 | Density: 0%</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Audio
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playNote(freq) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime); // Quieter
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); // Longer, smoother
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Musical scale
    const scale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

    // State
    let entities = [];
    let active = false;
    let frame = 0;
    let growthRate = 0.15;

    class Entity {
      constructor(x, y, gen) {
        this.x = x;
        this.y = y;
        this.gen = gen;
        this.size = 0;
        this.targetSize = 4 + Math.random() * 4;
        this.alpha = 0;
        this.age = 0;
        this.canReproduce = true;
        this.connections = [];
        this.hue = 250 + gen * 3;
      }

      reproduce() {
        if (!this.canReproduce || this.gen > 8) return;

        const childCount = Math.random() > 0.7 ? 2 : 1;

        for (let i = 0; i < childCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const distance = 30 + Math.random() * 50;

          const child = new Entity(
            this.x + Math.cos(angle) * distance,
            this.y + Math.sin(angle) * distance,
            this.gen + 1
          );

          this.connections.push(child);
          entities.push(child);

          // Play note occasionally
          if (Math.random() < 0.15) {
            playNote(scale[this.gen % scale.length]);
          }
        }

        this.canReproduce = false;
        setTimeout(() => this.canReproduce = true, 800);
      }

      update() {
        this.age++;

        // Grow
        if (this.size < this.targetSize) this.size += 0.3;
        if (this.alpha < 1) this.alpha += 0.02;

        // Reproduce based on growth rate
        if (active && this.age % 15 === 0 && Math.random() < growthRate) {
          this.reproduce();
        }
      }

      draw() {
        // Draw connections
        ctx.strokeStyle = `hsla(${this.hue}, 70%, 60%, ${this.alpha * 0.4})`;
        ctx.lineWidth = 1.5;
        this.connections.forEach(child => {
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(child.x, child.y);
          ctx.stroke();
        });

        // Draw node
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
        gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, ${this.alpha * 0.8})`);
        gradient.addColorStop(1, `hsla(${this.hue}, 70%, 60%, 0)`);
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.fillStyle = `hsla(${this.hue}, 70%, 70%, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // WebSocket to Ember creation bridge
    let emberWs = null;
    let creationType = null;

    function connectEmber() {
      emberWs = new WebSocket('ws://localhost:8084');
      emberWs.onopen = () => console.log('Connected to Ember');
      emberWs.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'creation_complete') {
          console.log('Creation manifested!', data.filename);
          document.getElementById('status').textContent = `✨ Manifested: ${data.filename}`;
          // The creation already opened itself
        } else if (data.type === 'creation_progress') {
          document.getElementById('status').textContent = data.message;
        }
      };
    }

    function startWeaving() {
      initAudio();
      entities = [];
      active = true;
      frame = 0;

      // Seed from center
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      entities.push(new Entity(cx, cy, 0));

      // Choose what to create
      const types = ['game', 'particle-system', 'visualizer', 'tool', '3d-world'];
      creationType = types[Math.floor(Math.random() * types.length)];

      document.getElementById('status').textContent = `Weaving ${creationType}...`;

      // Tell Ember to start creating
      if (emberWs && emberWs.readyState === WebSocket.OPEN) {
        emberWs.send(JSON.stringify({
          type: 'create_random',
          creationType: creationType
        }));
      }
    }

    // Connect on load
    connectEmber();

    function animate() {
      requestAnimationFrame(animate);

      if (!active) {
        // Idle - just show black
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      // Fade background slightly
      ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update and draw all entities
      for (const entity of entities) {
        entity.update();
        entity.draw();
      }

      // Update stats
      frame++;
      if (frame % 10 === 0) {
        const density = Math.min(100, Math.floor(entities.length / 5));
        document.getElementById('stats').textContent =
          `Entities: ${entities.length} | Density: ${density}%`;
      }
    }

    // Start animation loop
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
