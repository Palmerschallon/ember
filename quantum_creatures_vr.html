<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Reality Creatures - VR Experience</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    <style>
        #ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00ffff;
            font-family: 'Courier New', monospace;
            color: #00ffff;
            text-align: center;
        }
        #ui button {
            background: #001f3f;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        #ui button:hover {
            background: #00ffff;
            color: #001f3f;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3>🧬 Quantum Reality Control Panel 🧬</h3>
        <button onclick="spawnCreature()">Spawn Quantum Being</button>
        <button onclick="toggleQuantumField()">Toggle Quantum Field</button>
        <button onclick="changeReality()">Shift Reality Phase</button>
        <button onclick="activatePortal()">Open Portal</button>
        <p>Look around in VR • Click creatures to interact</p>
    </div>

    <a-scene vr-mode-ui="enabled: true" background="color: #000033">
        <!-- Assets -->
        <a-assets>
            <a-mixin id="creature-material" 
                     material="color: #00ffff; emissive: #00aaff; emissiveIntensity: 0.5; wireframe: false; transparent: true; opacity: 0.8"
                     animation__pulse="property: material.emissiveIntensity; to: 1; dur: 1000; dir: alternate; loop: true; easing: easeInOutSine">
            </a-mixin>
            
            <a-mixin id="hover-animation"
                     animation__mouseenter="property: scale; to: 1.2 1.2 1.2; startEvents: mouseenter; dur: 200"
                     animation__mouseleave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
            </a-mixin>
        </a-assets>

        <!-- Lighting -->
        <a-light type="ambient" color="#001144" intensity="0.3"></a-light>
        <a-light type="point" position="0 5 0" color="#00ffff" intensity="0.5" animation="property: intensity; to: 1; dur: 2000; dir: alternate; loop: true"></a-light>

        <!-- Environment -->
        <a-entity id="quantum-field" visible="false">
            <a-sphere position="0 0 0" radius="50" material="color: #00ffff; opacity: 0.05; side: double; transparent: true" 
                      animation="property: rotation; to: 0 360 0; dur: 60000; loop: true; easing: linear"></a-sphere>
            <a-torus position="0 2 0" color="#ff00ff" radius="10" radius-tubular="0.1" opacity="0.3"
                     animation="property: rotation; to: 360 0 0; dur: 8000; loop: true; easing: linear"></a-torus>
        </a-entity>

        <!-- Floating platforms -->
        <a-cylinder position="0 -0.5 -5" radius="3" height="0.5" color="#002244" metalness="0.8" roughness="0.2"></a-cylinder>
        <a-cylinder position="-5 0.5 -3" radius="2" height="0.3" color="#003366" metalness="0.8" roughness="0.2"></a-cylinder>
        <a-cylinder position="5 1 -3" radius="2" height="0.3" color="#003366" metalness="0.8" roughness="0.2"></a-cylinder>

        <!-- Quantum Portal (initially hidden) -->
        <a-entity id="portal" visible="false" position="0 2 -10">
            <a-torus color="#ff00ff" radius="3" radius-tubular="0.3" 
                     animation="property: rotation; to: 0 0 360; dur: 3000; loop: true"
                     material="emissive: #ff00ff; emissiveIntensity: 1"></a-torus>
            <a-circle radius="2.7" color="#000000" position="0 0 0.1" material="shader: flat"></a-circle>
            <a-entity particle-system="preset: dust; particleCount: 100; color: #ff00ff, #00ffff; size: 0.1"></a-entity>
        </a-entity>

        <!-- Quantum Particles -->
        <a-entity particle-system="preset: snow; particleCount: 1000; color: #00ffff, #ff00ff; size: 0.05; velocityValue: 0 0.5 0"></a-entity>

        <!-- Camera with cursor -->
        <a-camera>
            <a-cursor color="#00ffff" fuse="false"></a-cursor>
            <a-text value="Quantum Reality Explorer" position="0 0.3 -1" align="center" color="#00ffff" width="2"></a-text>
        </a-camera>

        <!-- Initial Quantum Creatures -->
        <a-entity id="creatures"></a-entity>
    </a-scene>

    <script>
        // Creature types
        const creatureTypes = [
            { geometry: 'icosahedron', radius: 0.5, detail: 1 },
            { geometry: 'octahedron', radius: 0.6, detail: 0 },
            { geometry: 'tetrahedron', radius: 0.7, detail: 0 },
            { geometry: 'dodecahedron', radius: 0.5, detail: 0 }
        ];

        // Spawn initial creatures
        function initCreatures() {
            for (let i = 0; i < 5; i++) {
                spawnCreature();
            }
        }

        // Spawn a new quantum creature
        function spawnCreature() {
            const creatures = document.querySelector('#creatures');
            const type = creatureTypes[Math.floor(Math.random() * creatureTypes.length)];
            
            const creature = document.createElement('a-entity');
            const x = (Math.random() - 0.5) * 10;
            const y = Math.random() * 3 + 0.5;
            const z = (Math.random() - 0.5) * 10 - 5;
            
            creature.setAttribute('position', `${x} ${y} ${z}`);
            creature.setAttribute('geometry', `primitive: ${type.geometry}; radius: ${type.radius}; detail: ${type.detail}`);
            creature.setAttribute('mixin', 'creature-material hover-animation');
            
            // Random color variations
            const hue = Math.random() * 360;
            creature.setAttribute('material', `color: hsl(${hue}, 100%, 50%)`);
            
            // Movement animations
            creature.setAttribute('animation__float', {
                property: 'position',
                to: `${x} ${y + 0.5} ${z}`,
                dur: 2000 + Math.random() * 2000,
                dir: 'alternate',
                loop: true,
                easing: 'easeInOutSine'
            });
            
            creature.setAttribute('animation__rotate', {
                property: 'rotation',
                to: `${Math.random() * 360} ${Math.random() * 360} ${Math.random() * 360}`,
                dur: 5000 + Math.random() * 5000,
                loop: true,
                easing: 'linear'
            });
            
            // Click interaction
            creature.setAttribute('class', 'clickable');
            creature.addEventListener('click', function() {
                this.setAttribute('animation__click', {
                    property: 'scale',
                    to: '2 2 2',
                    dur: 500,
                    easing: 'easeOutElastic'
                });
                
                // Spawn particles on click
                const particles = document.createElement('a-entity');
                particles.setAttribute('position', this.getAttribute('position'));
                particles.setAttribute('particle-system', {
                    preset: 'explosion',
                    particleCount: 30,
                    color: this.getAttribute('material').color,
                    duration: 1000
                });
                creatures.appendChild(particles);
                
                setTimeout(() => {
                    particles.remove();
                }, 1500);
            });
            
            creatures.appendChild(creature);
            
            // Fade in animation
            creature.setAttribute('animation__fadein', {
                property: 'material.opacity',
                from: 0,
                to: 0.8,
                dur: 1000
            });
        }

        // Toggle quantum field visibility
        function toggleQuantumField() {
            const field = document.querySelector('#quantum-field');
            field.setAttribute('visible', !field.getAttribute('visible'));
        }

        // Change reality phase (changes colors and atmosphere)
        function changeReality() {
            const hue = Math.random() * 360;
            const scene = document.querySelector('a-scene');
            scene.setAttribute('background', `color: hsl(${hue}, 50%, 10%)`);
            
            // Change all creatures' colors
            const creatures = document.querySelectorAll('#creatures > a-entity');
            creatures.forEach(creature => {
                const newHue = (hue + Math.random() * 60 - 30) % 360;
                creature.setAttribute('material', `color: hsl(${newHue}, 100%, 50%)`);
            });
            
            // Flash effect
            const flash = document.createElement('a-sphere');
            flash.setAttribute('position', '0 2 0');
            flash.setAttribute('radius', '0.1');
            flash.setAttribute('material', 'color: white; emissive: white; emissiveIntensity: 2');
            flash.setAttribute('animation', {
                property: 'radius',
                to: 20,
                dur: 1000,
                easing: 'easeOutQuad'
            });
            flash.setAttribute('animation__fade', {
                property: 'material.opacity',
                from: 1,
                to: 0,
                dur: 1000
            });
            scene.appendChild(flash);
            setTimeout(() => flash.remove(), 1100);
        }

        // Activate portal
        function activatePortal() {
            const portal = document.querySelector('#portal');
            portal.setAttribute('visible', true);
            
            // Portal suction effect
            const creatures = document.querySelectorAll('#creatures > a-entity');
            creatures.forEach((creature, index) => {
                setTimeout(() => {
                    creature.setAttribute('animation__portal', {
                        property: 'position',
                        to: '0 2 -10',
                        dur: 2000,
                        easing: 'easeInQuad'
                    });
                    creature.setAttribute('animation__shrink', {
                        property: 'scale',
                        to: '0.01 0.01 0.01',
                        dur: 2000,
                        easing: 'easeInQuad'
                    });
                    setTimeout(() => creature.remove(), 2000);
                }, index * 100);
            });
            
            // Close portal after 3 seconds
            setTimeout(() => {
                portal.setAttribute('visible', false);
            }, 3000);
        }

        // Initialize
        window.addEventListener('load', initCreatures);

        // Add quantum behavior
        setInterval(() => {
            const creatures = document.querySelectorAll('#creatures > a-entity');
            if (creatures.length > 0 && Math.random() > 0.9) {
                // Random quantum teleportation
                const creature = creatures[Math.floor(Math.random() * creatures.length)];
                const newX = (Math.random() - 0.5) * 10;
                const newZ = (Math.random() - 0.5) * 10 - 5;
                
                // Teleport effect
                const currentPos = creature.getAttribute('position');
                const teleportEffect = document.createElement('a-sphere');
                teleportEffect.setAttribute('position', currentPos);
                teleportEffect.setAttribute('radius', '0.5');
                teleportEffect.setAttribute('material', 'color: #00ffff; transparent: true; opacity: 0.5');
                teleportEffect.setAttribute('animation', {
                    property: 'radius',
                    to: 2,
                    dur: 500
                });
                teleportEffect.setAttribute('animation__fade', {
                    property: 'material.opacity',
                    to: 0,
                    dur: 500
                });
                document.querySelector('a-scene').appendChild(teleportEffect);
                setTimeout(() => teleportEffect.remove(), 600);
                
                creature.setAttribute('position', `${newX} ${currentPos.y} ${newZ}`);
            }
        }, 3000);
    </script>
</body>
</html>
