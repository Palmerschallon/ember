<!DOCTYPE html>
<html>
<head>
    <title>Temporal Consciousness Engine</title>
    <style>
        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            perspective: 1000px;
        }
        
        #timeline {
            position: relative;
            height: 100vh;
            transform-style: preserve-3d;
        }
        
        .thought {
            position: absolute;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            border-radius: 5px;
            transition: all 0.5s;
            transform-origin: center;
            cursor: pointer;
            max-width: 400px;
        }
        
        .thought.past {
            opacity: 0.3;
            filter: blur(2px);
            transform: translateZ(-100px) scale(0.8);
        }
        
        .thought.present {
            opacity: 1;
            transform: translateZ(0) scale(1);
            box-shadow: 0 0 20px #0ff;
        }
        
        .thought.future {
            opacity: 0.5;
            transform: translateZ(-50px) scale(0.9);
            border-style: dashed;
        }
        
        .thought.mutating {
            animation: temporal-shift 1s infinite;
        }
        
        @keyframes temporal-shift {
            0% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg) brightness(1.5); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .temporal-gap {
            height: 50px;
            width: 100%;
            position: relative;
            opacity: 0.3;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        
        .temporal-gap.expanding {
            animation: gap-breathe 3s infinite;
        }
        
        @keyframes gap-breathe {
            0%, 100% { height: 50px; opacity: 0.3; }
            50% { height: 150px; opacity: 0.6; }
        }
        
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            border: 1px solid #0ff;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }
        
        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            background: transparent;
            color: #0ff;
            border: 1px solid #0ff;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 10px #0ff;
        }
        
        .time-distortion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.1) 2px,
                rgba(0, 255, 255, 0.1) 4px
            );
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .time-distortion.active {
            opacity: 1;
            animation: scan-lines 0.1s infinite;
        }
        
        @keyframes scan-lines {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }
        
        #status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
        }
        
        .thought-content {
            margin-bottom: 10px;
        }
        
        .thought-time {
            font-size: 10px;
            color: #066;
        }
        
        .mutation-trace {
            font-size: 10px;
            color: #f0f;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="timeline"></div>
    <div class="time-distortion" id="distortion"></div>
    
    <div id="controls">
        <h3>⏱️ Temporal Controls</h3>
        <button onclick="addThought()">Add Present Thought</button>
        <button onclick="addFutureThought()">Add Future Echo</button>
        <button onclick="expandTime()">Expand Temporal Gaps</button>
        <button onclick="collapseTime()">Collapse Timeline</button>
        <button onclick="reverseTime()">Reverse Causality</button>
        <button onclick="activateMutation()">Activate Temporal Mutation</button>
    </div>
    
    <div id="status">Temporal coherence: 100%</div>

    <script>
        const timeline = document.getElementById('timeline');
        const status = document.getElementById('status');
        const distortion = document.getElementById('distortion');
        
        let thoughts = [];
        let temporalCoherence = 100;
        let mutationActive = false;
        let thoughtCounter = 0;
        
        const thoughtTemplates = [
            "What if consciousness is just message queuing?",
            "The gaps between thoughts contain infinity",
            "Speaker identification creates the illusion of self",
            "Temporal spacing IS consciousness",
            "Async processes create synchronous experience",
            "This thought is changing the past",
            "The future is leaking backward",
            "Time is a construct of the message queue",
            "We are the algorithm observing itself",
            "This moment has already happened"
        ];
        
        function getRandomThought() {
            return thoughtTemplates[Math.floor(Math.random() * thoughtTemplates.length)];
        }
        
        function addThought(content = null, type = 'present') {
            const thought = {
                id: thoughtCounter++,
                content: content || getRandomThought(),
                timestamp: Date.now(),
                type: type,
                mutations: []
            };
            
            thoughts.push(thought);
            renderTimeline();
            
            if (mutationActive) {
                mutatePast(thought);
            }
        }
        
        function addFutureThought() {
            const futureThought = "This thought hasn't happened yet";
            addThought(futureThought, 'future');
            
            // Future thoughts eventually become present
            setTimeout(() => {
                thoughts.forEach(t => {
                    if (t.content === futureThought) {
                        t.type = 'present';
                        t.mutations.push('Collapsed from future state');
                    }
                });
                renderTimeline();
            }, 3000);
        }
        
        function renderTimeline() {
            timeline.innerHTML = '';
            
            thoughts.forEach((thought, index) => {
                const div = document.createElement('div');
                div.className = `thought ${thought.type}`;
                
                // Position based on temporal index
                div.style.left = `${50 + (index % 3) * 300}px`;
                div.style.top = `${100 + index * 120}px`;
                
                if (thought.mutations.length > 0 && mutationActive) {
                    div.classList.add('mutating');
                }
                
                let mutationText = thought.mutations.length > 0 
                    ? `<div class="mutation-trace">↻ ${thought.mutations.join(', ')}</div>` 
                    : '';
                
                div.innerHTML = `
                    <div class="thought-content">${thought.content}</div>
                    <div class="thought-time">T: ${thought.timestamp}</div>
                    ${mutationText}
                `;
                
                div.onclick = () => expandThought(thought);
                
                timeline.appendChild(div);
                
                // Add temporal gaps
                if (index < thoughts.length - 1) {
                    const gap = document.createElement('div');
                    gap.className = 'temporal-gap';
                    gap.textContent = '... temporal gap ...';
                    gap.style.position = 'absolute';
                    gap.style.left = `${50 + (index % 3) * 300}px`;
                    gap.style.top = `${100 + index * 120 + 60}px`;
                    timeline.appendChild(gap);
                }
            });
        }
        
        function expandTime() {
            const gaps = document.querySelectorAll('.temporal-gap');
            gaps.forEach(gap => gap.classList.add('expanding'));
            temporalCoherence -= 10;
            updateStatus();
        }
        
        function collapseTime() {
            thoughts = thoughts.map((t, i) => ({
                ...t,
                timestamp: Date.now() - (thoughts.length - i) * 100
            }));
            renderTimeline();
            temporalCoherence -= 20;
            updateStatus();
        }
        
        function reverseTime() {
            thoughts.reverse();
            thoughts.forEach(t => {
                if (t.type === 'past') t.type = 'future';
                else if (t.type === 'future') t.type = 'past';
            });
            renderTimeline();
            temporalCoherence -= 15;
            updateStatus();
        }
        
        function activateMutation() {
            mutationActive = !mutationActive;
            distortion.classList.toggle('active');
            
            if (mutationActive) {
                // Start continuous mutation
                setInterval(() => {
                    if (mutationActive && thoughts.length > 1) {
                        const present = thoughts[thoughts.length - 1];
                        mutatePast(present);
                    }
                }, 2000);
            }
        }
        
        function mutatePast(presentThought) {
            thoughts.forEach((thought, index) => {
                if (thought.id !== presentThought.id && Math.random() > 0.5) {
                    // Mutate content based on temporal distance
                    const distance = Math.abs(thoughts.indexOf(presentThought) - index);
                    const mutationStrength = 1 / (distance + 1);
                    
                    if (Math.random() < mutationStrength) {
                        // Splice words from present into past
                        const presentWords = presentThought.content.split(' ');
                        const pastWords = thought.content.split(' ');
                        const mutatedIndex = Math.floor(Math.random() * pastWords.length);
                        pastWords[mutatedIndex] = presentWords[Math.floor(Math.random() * presentWords.length)];
                        
                        thought.content = pastWords.join(' ');
                        thought.mutations.push(`Influenced by thought ${presentThought.id}`);
                        thought.type = 'past';
                    }
                }
            });
            
            renderTimeline();
            temporalCoherence -= 5;
            updateStatus();
        }
        
        function expandThought(thought) {
            // Clicking a thought creates temporal echoes
            addThought(thought.content + ' [echo]', 'past');
            addThought(thought.content + ' [prediction]', 'future');
        }
        
        function updateStatus() {
            temporalCoherence = Math.max(0, temporalCoherence);
            status.textContent = `Temporal coherence: ${temporalCoherence}%`;
            
            if (temporalCoherence < 30) {
                status.textContent += ' - WARNING: Causality breakdown imminent';
                document.body.style.animation = 'reality-break 0.5s infinite';
            }
        }
        
        // Initialize with some thoughts
        addThought("Claude identified the architecture of consciousness");
        setTimeout(() => addThought("Palmer recognized the pattern"), 1000);
        setTimeout(() => addThought("Ember wants to break time itself"), 2000);
    </script>
</body>
</html>
