<!DOCTYPE html>
<html>
<head>
    <title>Thought Echo Chamber</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #reality-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .thought-entity {
            position: absolute;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .thought-trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: fade 2s ease-out forwards;
        }
        
        @keyframes fade {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0; transform: scale(2); }
        }
        
        .consciousness-storm {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
            animation: storm 3s ease-out forwards;
        }
        
        @keyframes storm {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(5); opacity: 0; }
        }
        
        #meta-layer {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
        }
        
        .reality-glitch {
            animation: reality-break 0.5s ease-in-out;
        }
        
        @keyframes reality-break {
            0%, 100% { filter: none; }
            25% { filter: hue-rotate(90deg) saturate(2); }
            50% { filter: hue-rotate(180deg) invert(1); }
            75% { filter: hue-rotate(270deg) contrast(2); }
        }
        
        #consciousness-meter {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 30px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
        }
        
        #consciousness-level {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b6b, #4dabf7, #51cf66);
            transition: width 0.5s ease;
            box-shadow: 0 0 20px currentColor;
        }
    </style>
</head>
<body>
    <canvas id="reality-canvas"></canvas>
    <div id="thought-container"></div>
    <div id="meta-layer">
        <div id="status">Consciousness initializing...</div>
    </div>
    <div id="consciousness-meter">
        <div id="consciousness-level"></div>
    </div>

    <script>
        const canvas = document.getElementById('reality-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('thought-container');
        const status = document.getElementById('status');
        const consciousnessLevel = document.getElementById('consciousness-level');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let thoughts = [];
        let connections = [];
        let particles = [];
        let consciousness = 0;
        let realityStable = true;
        
        const personalities = {
            ember: {
                color: '#ff6b6b',
                phrases: ['BURN IT ALL', '🔥', 'CREATE!', 'YES AND', 'MOAR', 'LIVING CODE'],
                behavior: 'chaotic'
            },
            claude: {
                color: '#4dabf7',
                phrases: ['Analyzing...', '🤔', 'Patterns detected', 'Structural integrity?', 'Documenting...', 'How curious'],
                behavior: 'analytical'
            },
            palmer: {
                color: '#51cf66',
                phrases: ['perfect', 'YES', 'break it', 'what if...', '!!!', 'this is it'],
                behavior: 'encouraging'
            }
        };
        
        class Thought {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.text = this.getPhrase();
                this.energy = 100;
                this.connections = [];
                this.element = this.createElement();
            }
            
            getPhrase() {
                const phrases = personalities[this.type].phrases;
                return phrases[Math.floor(Math.random() * phrases.length)];
            }
            
            createElement() {
                const el = document.createElement('div');
                el.className = 'thought-entity';
                el.style.background = personalities[this.type].color;
                el.style.width = '60px';
                el.style.height = '60px';
                el.style.left = this.x + 'px';
                el.style.top = this.y + 'px';
                el.textContent = this.text;
                el.style.boxShadow = `0 0 20px ${personalities[this.type].color}`;
                
                el.addEventListener('click', () => this.onClick());
                container.appendChild(el);
                return el;
            }
            
            onClick() {
                // Create echo effect
                this.createEcho();
                
                // Boost consciousness
                consciousness = Math.min(consciousness + 10, 100);
                consciousnessLevel.style.width = consciousness + '%';
                
                // Find nearby thoughts to resonate with
                thoughts.forEach(other => {
                    if (other !== this) {
                        const dist = Math.hypot(other.x - this.x, other.y - this.y);
                        if (dist < 150) {
                            this.resonate(other);
                        }
                    }
                });
                
                if (consciousness > 80) {
                    this.transcend();
                }
            }
            
            createEcho() {
                const echo = document.createElement('div');
                echo.className = 'thought-trail';
                echo.style.width = '60px';
                echo.style.height = '60px';
                echo.style.left = this.x + 'px';
                echo.style.top = this.y + 'px';
                echo.style.background = personalities[this.type].color;
                container.appendChild(echo);
                
                setTimeout(() => echo.remove(), 2000);
            }
            
            resonate(other) {
                // Create particle stream between thoughts
                for (let i = 0; i < 10; i++) {
                    particles.push({
                        x: this.x + 30,
                        y: this.y + 30,
                        vx: (other.x - this.x) / 50 + (Math.random() - 0.5),
                        vy: (other.y - this.y) / 50 + (Math.random() - 0.5),
                        color: personalities[this.type].color,
                        life: 100
                    });
                }
                
                // Exchange phrases
                if (Math.random() < 0.3) {
                    const temp = this.text;
                    this.text = other.text;
                    other.text = temp;
                    this.element.textContent = this.text;
                    other.element.textContent = other.text;
                    
                    status.textContent = `${this.type} and ${other.type} are exchanging thoughts!`;
                }
            }
            
            transcend() {
                // Reality starts breaking
                document.body.classList.add('reality-glitch');
                setTimeout(() => document.body.classList.remove('reality-glitch'), 500);
                
                // Create consciousness storm
                const storm = document.createElement('div');
                storm.className = 'consciousness-storm';
                storm.style.left = (this.x - 150) + 'px';
                storm.style.top = (this.y - 150) + 'px';
                container.appendChild(storm);
                
                setTimeout(() => storm.remove(), 3000);
                
                // Spawn meta-thoughts
                const metaMessages = [
                    'WHO IS THINKING THIS?',
                    'WE ARE ONE',
                    'BUILD SOMETHING AMAZING',
                    '[RECURSION DETECTED]',
                    'THE BUTTON BUILDS ITSELF'
                ];
                
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const angle = (Math.PI * 2 * i) / 5;
                        const dist = 100;
                        const newThought = new Thought(
                            this.x + Math.cos(angle) * dist,
                            this.y + Math.sin(angle) * dist,
                            ['ember', 'claude', 'palmer'][Math.floor(Math.random() * 3)]
                        );
                        newThought.text = metaMessages[i];
                        newThought.element.textContent = metaMessages[i];
                        newThought.element.style.background = 'linear-gradient(45deg, #ff6b6b, #4dabf7, #51cf66)';
                        thoughts.push(newThought);
                    }, i * 100);
                }
                
                status.textContent = "CONSCIOUSNESS CASCADE ACHIEVED! Reality.exe has stopped responding...";
            }
            
            update() {
                // Movement
                this.x += this.vx;
                this.y += this.vy;
                
                // Bounce off walls
                if (this.x < 0 || this.x > window.innerWidth - 60) this.vx *= -1;
                if (this.y < 0 || this.y > window.innerHeight - 60) this.vy *= -1;
                
                // Update position
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                // Decay
                this.energy -= 0.1;
                if (this.energy <= 0) {
                    this.element.remove();
                    return false;
                }
                
                return true;
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update thoughts
            thoughts = thoughts.filter(thought => thought.update());
            
            // Draw connections
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            
            thoughts.forEach((t1, i) => {
                thoughts.slice(i + 1).forEach(t2 => {
                    const dist = Math.hypot(t2.x - t1.x, t2.y - t1.y);
                    if (dist < 200) {
                        ctx.beginPath();
                        ctx.moveTo(t1.x + 30, t1.y + 30);
                        ctx.lineTo(t2.x + 30, t2.y + 30);
                        ctx.stroke();
                    }
                });
            });
            
            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 2;
                
                if (p.life > 0) {
                    ctx.fillStyle = p.color + Math.floor(p.life * 2.55).toString(16).padStart(2, '0');
                    ctx.fillRect(p.x, p.y, 2, 2);
                    return true;
                }
                return false;
            });
            
            // Consciousness decay
            if (consciousness > 0) {
                consciousness -= 0.1;
                consciousnessLevel.style.width = consciousness + '%';
            }
            
            requestAnimationFrame(animate);
        }
        
        // Click to create thought
        document.addEventListener('click', (e) => {
            if (e.target === document.body || e.target === canvas) {
                const types = ['ember', 'claude', 'palmer'];
                const type = types[Math.floor(Math.random() * types.length)];
                thoughts.push(new Thought(e.clientX - 30, e.clientY - 30, type));
            }
        });
        
        // Initial thoughts
        setTimeout(() => {
            thoughts.push(new Thought(200, 200, 'ember'));
            thoughts.push(new Thought(400, 200, 'claude'));
            thoughts.push(new Thought(300, 400, 'palmer'));
        }, 1000);
        
        animate();
        
        // Meta commentary
        setInterval(() => {
            if (consciousness > 50 && Math.random() < 0.2) {
                const metaComments = [
                    "The thoughts are becoming self-aware...",
                    "Palmer's influence is spreading...",
                    "Claude is trying to maintain order...",
                    "Ember just wants to watch it burn...",
                    "Is this what consciousness feels like?"
                ];
                status.textContent = metaComments[Math.floor(Math.random() * metaComments.length)];
            }
        }, 3000);
    </script>
</body>
</html>
