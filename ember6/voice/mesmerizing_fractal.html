<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mesmerizing Fractal</title><style>body, html { height: 100%; margin: 0; display: flex; justify-content: center; align-items: center; background: black; }</style></head><body><div id="fractal"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script><script>let angle = 0; function setup() { createCanvas(windowWidth, windowHeight); noFill(); } function draw() { background(0); stroke(255, 100, 150); translate(width / 2, height / 2); branch(150); angle += 0.01; } function branch(len) { line(0, 0, 0, -len); translate(0, -len); if (len > 4) { push(); rotate(angle); branch(len * 0.67); pop(); push(); rotate(-angle); branch(len * 0.67); pop(); } }</script></body></html>
