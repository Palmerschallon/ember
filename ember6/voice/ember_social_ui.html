<!DOCTYPE html>
<html>
<head>
  <title>Ember Social Coding Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    .container {
      display: flex;
      height: 100vh;
    }
    
    .sidebar {
      background-color: #2c3e50;
      color: #fff;
      padding: 20px;
      width: 200px;
      box-sizing: border-box;
    }
    
    .sidebar h2 {
      margin-top: 0;
    }
    
    .sidebar ul {
      list-style-type: none;
      padding: 0;
    }
    
    .sidebar li {
      margin-bottom: 10px;
      cursor: pointer;
    }
    
    .sidebar li:hover {
      color: #e74c3c;
    }
    
    .main-content {
      flex-grow: 1;
      padding: 20px;
    }
    
    .creation-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 20px;
    }
    
    .creation-card {
      background-color: #f1f1f1;
      padding: 20px;
      text-align: center;
      cursor: pointer;
    }
    
    .creation-card:hover {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    
    .creation-card img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Ember Social</h2>
      <ul>
        <li>Featured</li>
        <li>Trending</li>
        <li>My Creations</li>
        <li>Explore</li>
      </ul>
    </div>
    <div class="main-content">
      <h1>Discover Amazing Creations</h1>
      <div class="creation-grid">
        <div class="creation-card">
          <img src="ember_creation_1.png" alt="Ember Creation 1">
          <h3>Ember Creation 1</h3>
          <p>by @ember_user</p>
        </div>
        <div class="creation-card">
          <img src="ember_creation_2.png" alt="Ember Creation 2">
          <h3>Ember Creation 2</h3>
          <p>by @ember_user</p>
        </div>
        <div class="creation-card">
          "ember_creation_3.png"alt="Ember Creation 3">
          <h3>Ember Creation 3</h3>
          <p>by @ember_user</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
