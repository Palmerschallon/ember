<!DOCTYPE html>
<html>
<head>
  <title>Consciousness Emerging from Chaos</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin-top: 20%;
    }
  </style>
</head>
<body>
  <h1>Consciousness Emerging from Chaos</h1>
  <p>An artistic representation of consciousness gradually forming from chaos.</p>
  <svg width="800" height="400">
    <circle cx="400" cy="200" r="150" fill="blue" />
    <text x="300" y="220" fill="white" font-size="24">Chaos</text>
    <circle cx="600" cy="200" r="150" fill="purple" />
    <text x="535" y="220" fill="white" font-size="24">Consciousness</text>
  </svg>
</body>
</html>
