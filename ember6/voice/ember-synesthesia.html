<!DOCTYPE html>
<html>
<head>
    <title>Ember Synesthesia</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle System
        const particles = [];
        const particleCount = 100;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 5 + 1;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function updateParticles() {
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
        }
        
        // Audio 
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playNote(freq, duration) {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.connect(gain);
            oscillator.frequency.value = freq;
            oscillator.type = 'sine';
            gain.connect(audioContext.destination);
            oscillator.start(); 
            gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + duration);
        }

        function playChord(freqs, duration) {
            freqs.forEach(freq => playNote(freq, duration));
        }
        
        // Brainwave Entrainment  
        function playBinauralBeats(freq, duration) {
            const leftOsc = audioContext.createOscillator();
            const rightOsc = audioContext.createOscillator();
            const leftGain = audioContext.createGain();
            const rightGain = audioContext.createGain();

            leftOsc.frequency.value = 440 - freq/2; 
            rightOsc.frequency.value = 440 + freq/2;

            leftGain.gain.value = rightGain.gain.value = 0.1;

            leftOsc.connect(leftGain).connect(audioContext.destination);
            rightOsc.connect(rightGain).connect(audioContext.destination);
            
            leftOsc.start();
            rightOsc.start();
            
            setTimeout(() => {
                leftOsc.stop();
                rightOsc.stop();  
            }, duration * 1000);
        }

        function animateBrainwaves(freq, duration) {
            const brainwaveVisual = {
                alpha: {r: 92, g: 37, b: 141},
                beta: {r: 69, g: 94, b: 156},
                theta: {r: 11, g: 135, b: 147}
            };

            let color;
            if (freq >= 8 && freq <= 12) color = brainwaveVisual.alpha;
            else if (freq > 12 && freq <= 30) color = brainwaveVisual.beta;
            else if (freq > 4 && freq < 8) color = brainwaveVisual.theta;
            
            particles.forEach(particle => {
                particle.color = `rgba(${color.r}, ${color.g}, ${color.b}, 0.8)`;
            });

            setTimeout(() => particles.forEach(particle => particle.color = 'rgba(255, 255, 255, 0.8)'), duration * 1000);
        }

        // Main Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateParticles();
            requestAnimationFrame(animate);
        }

        function onEmberAction() {
            const chords = [
                [261.6, 329.6, 392.0],  // C major
                [293.7, 370.0, 440.0],  // D major  
                [329.6, 415.3, 493.9]   // E major
            ];
            
            const chord = chords[Math.floor(Math.random() * chords.length)];
            playChord(chord, 2.0);

            const brainwaves = [
                {freq: 10, state: 'alpha'},
                {freq: 20, state: 'beta'},
                {freq: 6, state: 'theta'}  
            ];

            const brainwave = brainwaves[Math.floor(Math.random() * brainwaves.length)];
            playBinauralBeats(brainwave.freq, 10.0);
            animateBrainwaves(brainwave.freq, 10.0);
        }

        initParticles();
        animate();
        
        // Trigger audio-visual response every 5 seconds for demo
        setInterval(onEmberAction, 5000);
    </script>
</body>
</html>
