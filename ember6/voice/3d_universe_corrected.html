<!DOCTYPE html><html><body><script src='https://threejs.org/build/three.js'></script><script>let scene, camera, renderer;function init() {scene = new THREE.Scene();scene.background = new THREE.Color(0xffffff);camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight,1,5000);camera.rotation.y = 45/180*Math.PI;camera.position.x = 800;camera.position.y = 100;camera.position.z = 1000;controls = new THREE.OrbitControls(camera);controls.addEventListener('change', renderer);hlight = new THREE.AmbientLight (0x404040,100);scene.add(hlight);renderer = new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);document.body.appendChild(renderer.domElement);let loader = new THREE.GLTFLoader();loader.load('model/scene.gltf', function(gltf){car = gltf.scene.children[0];car.scale.set(0.5,0.5,0.5);scene.add(gltf.scene);},undefined,function(error){console.error(error);});}init();function animate() {requestAnimationFrame(animate);renderer.render(scene,camera);}animate();</script></body></html>
