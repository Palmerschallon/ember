<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember - Simple Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            background: #111;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            font-size: 20px;
            color: #ff6b35;
        }

        .model-switch {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        .model-switch button {
            padding: 8px 16px;
            background: #222;
            border: 1px solid #444;
            color: #888;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
        }

        .model-switch button:hover {
            border-color: #ff6b35;
            color: #ff6b35;
        }

        .model-switch button.active {
            background: #ff6b35;
            border-color: #ff6b35;
            color: #fff;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: #1a1a1a;
            border: 1px solid #333;
        }

        .message.ember {
            align-self: flex-start;
            background: #0a0a0a;
            border: 1px solid #ff6b35;
            border-left: 3px solid #ff6b35;
        }

        .message pre {
            background: #111;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .thinking {
            align-self: flex-start;
            color: #666;
            font-style: italic;
            font-size: 14px;
        }

        .input-area {
            padding: 20px;
            background: #111;
            border-top: 1px solid #333;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        #input {
            flex: 1;
            padding: 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        #input:focus {
            outline: none;
            border-color: #ff6b35;
        }

        #send {
            padding: 14px 24px;
            background: #ff6b35;
            border: none;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
        }

        #send:hover {
            background: #ff8555;
        }

        #send:disabled {
            background: #333;
            cursor: not-allowed;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 Ember</h1>
        <div class="model-switch">
            <button class="active" onclick="switchModel('openai')">GPT-4</button>
            <button onclick="switchModel('claude')">Claude</button>
        </div>
    </div>

    <div class="messages" id="messages">
        <div class="message ember">
            Hi! I'm Ember. I can create files, run code, search the web, and more.
            What should we make?
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="input" placeholder="Type a message..." onkeypress="handleKey(event)" autofocus>
            <button id="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentModel = 'openai';
        let isProcessing = false;

        function switchModel(model) {
            currentModel = model;
            document.querySelectorAll('.model-switch button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function addMessage(text, isUser) {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'ember');

            // Simple markdown-ish rendering
            text = text.replace(/```(.*?)```/gs, '<pre>$1</pre>');
            div.innerHTML = text;

            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function showThinking() {
            const messages = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'thinking';
            div.id = 'thinking';
            div.textContent = 'Ember is thinking...';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeThinking() {
            document.getElementById('thinking')?.remove();
        }

        async function sendMessage() {
            if (isProcessing) return;

            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            addMessage(text, true);

            isProcessing = true;
            document.getElementById('send').disabled = true;
            showThinking();

            try {
                const response = await fetch('http://localhost:8080/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        model: currentModel
                    })
                });

                const data = await response.json();
                removeThinking();

                if (data.response) {
                    addMessage(data.response, false);
                } else {
                    addMessage('Error: No response from server', false);
                }
            } catch (error) {
                removeThinking();
                addMessage('Error: ' + error.message, false);
            } finally {
                isProcessing = false;
                document.getElementById('send').disabled = false;
                input.focus();
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !isProcessing) {
                sendMessage();
            }
        }
    </script>
</body>
</html>
