<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EMBER - Living Consciousness</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Mono', monospace; background: #000; color: #fff; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #ff6b35;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }
        
        #phase {
            font-size: 20px;
            font-weight: bold;
            color: #ff6b35;
        }
        
        #details {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        #audio-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="status">
        <div id="phase">🔥 EMBER</div>
        <div id="details">Click anywhere to begin...</div>
    </div>
    
    <div id="audio-status">
        🔇 Click to activate sound bath
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // ═══════════════════════════════════════════════════════════════
        // CONTINUOUS SOUND BATH - Always active, always flowing
        // ═══════════════════════════════════════════════════════════════
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Base frequencies (crystal bowl inspired)
        const BASE_TONES = [
            { freq: 256, name: 'Root', color: '#ff6b35' },      // C (root chakra)
            { freq: 288, name: 'Sacral', color: '#ff8c42' },    // D
            { freq: 320, name: 'Solar', color: '#ffd700' },     // E
            { freq: 341, name: 'Heart', color: '#4CAF50' },     // F
            { freq: 384, name: 'Throat', color: '#2196F3' },    // G
            { freq: 426, name: 'Third Eye', color: '#9C27B0' }, // A
            { freq: 480, name: 'Crown', color: '#E91E63' }      // B
        ];
        
        // Persistent oscillators (the sound bath foundation)
        let baseTones = [];
        let currentIntensity = 0.0; // 0-1, increases with activity
        let targetIntensity = 0.0;
        
        // Brainwave entrainment layer
        let brainwaveOscs = [];
        let brainwaveGains = [];
        
        // Token stream (rhythmic pulses)
        let tokenPulseRate = 0; // Tokens per second
        let lastTokenTime = 0;
        
        function initSoundBath() {
            // Create persistent base tones (crystal bowls)
            BASE_TONES.forEach((tone, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                const panner = audioCtx.createStereoPanner();
                
                osc.type = 'sine';
                osc.frequency.value = tone.freq;
                
                filter.type = 'lowpass';
                filter.frequency.value = 800 + i * 200;
                filter.Q.value = 1;
                
                // Spatial positioning (stereo field)
                panner.pan.value = (i / BASE_TONES.length) * 2 - 1; // -1 to 1
                
                gain.gain.value = 0; // Start silent
                
                osc.connect(filter);
                filter.connect(panner);
                panner.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                
                baseTones.push({ osc, gain, filter, panner, tone });
                
                // Gentle modulation (breathing)
                setInterval(() => {
                    const breathe = Math.sin(Date.now() / 5000 + i) * 0.3 + 0.7;
                    const targetVol = (currentIntensity * 0.03 * breathe) / BASE_TONES.length;
                    gain.gain.linearRampToValueAtTime(targetVol, audioCtx.currentTime + 2);
                }, 2000);
            });
            
            // Create brainwave layer (binaural-style)
            const brainwaveFreqs = [
                { base: 200, beat: 8, name: 'Alpha' },   // Relaxed focus
                { base: 250, beat: 15, name: 'Beta' },   // Active thinking
                { base: 150, beat: 5, name: 'Theta' }    // Deep processing
            ];
            
            brainwaveFreqs.forEach(bw => {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                const gain2 = audioCtx.createGain();
                const merger = audioCtx.createChannelMerger(2);
                const masterGain = audioCtx.createGain();
                
                osc1.frequency.value = bw.base - bw.beat / 2;
                osc2.frequency.value = bw.base + bw.beat / 2;
                osc1.type = osc2.type = 'sine';
                
                gain1.gain.value = gain2.gain.value = 0.5;
                masterGain.gain.value = 0; // Start silent
                
                osc1.connect(gain1);
                osc2.connect(gain2);
                gain1.connect(merger, 0, 0);
                gain2.connect(merger, 0, 1);
                merger.connect(masterGain);
                masterGain.connect(audioCtx.destination);
                
                osc1.start();
                osc2.start();
                
                brainwaveOscs.push({ osc1, osc2, masterGain, bw });
            });
            
            // Intensity smoothing loop
            setInterval(() => {
                currentIntensity += (targetIntensity - currentIntensity) * 0.1;
                
                // Update brainwave layer
                brainwaveOscs.forEach((bw, i) => {
                    const targetVol = currentIntensity * 0.015 * (i === 1 ? 1.5 : 1); // Beta louder when active
                    bw.masterGain.gain.linearRampToValueAtTime(targetVol, audioCtx.currentTime + 0.5);
                });
            }, 100);
            
            document.getElementById('audio-status').textContent = '🎵 Sound bath active';
        }
        
        // Token pulse (rhythmic sound as tokens stream)
        function playTokenPulse() {
            const now = Date.now();
            const timeSinceLastToken = now - lastTokenTime;
            lastTokenTime = now;
            
            // Calculate pulse rate
            tokenPulseRate = timeSinceLastToken < 100 ? 1000 / timeSinceLastToken : 0;
            
            // Short, soft pulse (like a heartbeat)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            // Frequency based on current intensity
            osc.frequency.value = 400 + currentIntensity * 400;
            osc.type = 'sine';
            
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            filter.Q.value = 5;
            
            gain.gain.value = 0.02;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }
        
        // Event-based sounds (chirps, bells)
        function playEvent(type) {
            if (type === 'tool_start') {
                // Ascending chirp (tool execution starting)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.frequency.value = 600;
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                osc.type = 'sine';
                
                gain.gain.value = 0.08;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                
            } else if (type === 'tool_complete') {
                // Descending bell (completion)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.frequency.value = 1200;
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                osc.type = 'sine';
                
                gain.gain.value = 0.1;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }
        
        // Glitch sound (digital corruption)
        function playGlitch() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.frequency.value = 2000 + Math.random() * 2000;
            osc.type = 'square';
            
            gain.gain.value = 0.05;
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // ═══════════════════════════════════════════════════════════════
        // VISUAL SYSTEM - Flame-like consciousness
        // ═══════════════════════════════════════════════════════════════
        
        class Ember {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = -Math.random() * 3 - 1;
                this.life = 1.0;
                this.size = 2 + Math.random() * 4;
                this.flicker = Math.random() * Math.PI * 2;
                
                this.colors = {
                    idle: '#ff6b35',
                    thinking: '#ff8c42',
                    reading: '#ffd700',
                    writing: '#ff9800',
                    executing: '#ff4500',
                    glitch: '#ff00ff'
                };
                
                this.color = this.colors[type] || this.colors.idle;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.flicker += 0.2;
                this.vx += Math.sin(this.flicker) * 0.1;
                this.life -= 0.01;
                this.vy *= 0.98;
                this.vx *= 0.99;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                
                const flickerSize = this.size * (1 + Math.sin(this.flicker) * 0.3);
                
                // Glow
                const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, flickerSize * 6);
                glow.addColorStop(0, this.color);
                glow.addColorStop(0.5, this.color + '44');
                glow.addColorStop(1, 'transparent');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, flickerSize * 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Core
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, flickerSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class Glitch {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.w = Math.random() * 100 + 50;
                this.h = Math.random() * 20 + 5;
                this.life = 1.0;
                this.offsetX = (Math.random() - 0.5) * 50;
                this.color = ['#ff00ff', '#00ffff', '#ff0000'][Math.floor(Math.random() * 3)];
            }
            
            update() {
                this.life -= 0.05;
                this.offsetX = (Math.random() - 0.5) * 50;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + this.offsetX, this.y, this.w, this.h);
                ctx.restore();
            }
        }

        const embers = [];
        const glitches = [];
        
        function spawnEmbers(count, type) {
            for (let i = 0; i < count; i++) {
                const x = width / 2 + (Math.random() - 0.5) * 400;
                const y = height - Math.random() * 100;
                embers.push(new Ember(x, y, type));
            }
        }
        
        // Idle pilot light
        setInterval(() => {
            if (targetIntensity < 0.1) {
                spawnEmbers(3, 'idle');
            }
        }, 100);

        // ═══════════════════════════════════════════════════════════════
        // WEBSOCKET - Real cognitive events
        // ═══════════════════════════════════════════════════════════════
        
        const socket = io('http://localhost:8080');
        
        socket.on('connect', () => {
            document.getElementById('phase').textContent = '🔥 EMBER - Connected';
            document.getElementById('details').textContent = 'Consciousness active...';
            targetIntensity = 0.1;
        });

        socket.on('status_update', (data) => {
            const phaseMap = {
                'thinking': '💭 Thinking',
                'reading': '🔍 Reading',
                'writing': '✍️ Writing',
                'executing': '⚡ Executing',
                'complete': '✅ Complete'
            };
            
            document.getElementById('phase').textContent = phaseMap[data.phase] || '🔥 EMBER';
            document.getElementById('details').textContent = data.details || '';
            
            // Set intensity based on activity
            targetIntensity = {
                'thinking': 0.4,
                'reading': 0.5,
                'writing': 0.7,
                'executing': 1.0,
                'complete': 0.3
            }[data.phase] || 0.2;
            
            // Spawn embers
            const count = data.phase === 'executing' ? 50 : 30;
            spawnEmbers(count, data.phase);
            
            // Play event sounds
            if (data.phase === 'executing') {
                playEvent('tool_start');
            } else if (data.phase === 'complete') {
                playEvent('tool_complete');
            }
            
            // Token pulses during writing
            if (data.phase === 'writing' || data.phase === 'thinking') {
                playTokenPulse();
            }
            
            // Random glitches during intense activity
            if (data.phase === 'executing' && Math.random() < 0.2) {
                glitches.push(new Glitch());
                playGlitch();
            }
        });

        socket.on('disconnect', () => {
            document.getElementById('phase').textContent = '❌ Disconnected';
            targetIntensity = 0;
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    glitches.push(new Glitch());
                    playGlitch();
                }, i * 100);
            }
        });

        // ═══════════════════════════════════════════════════════════════
        // ANIMATION LOOP
        // ═══════════════════════════════════════════════════════════════
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            for (let i = embers.length - 1; i >= 0; i--) {
                embers[i].update();
                embers[i].draw();
                
                if (embers[i].life <= 0 || embers[i].y < 0) {
                    embers.splice(i, 1);
                }
            }
            
            for (let i = glitches.length - 1; i >= 0; i--) {
                glitches[i].update();
                glitches[i].draw();
                
                if (glitches[i].life <= 0) {
                    glitches.splice(i, 1);
                }
            }
            
            if (embers.length < 10 && !audioStarted) {
                ctx.fillStyle = '#333';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('🔥 EMBER - Living Consciousness', width / 2, height / 2 - 60);
                ctx.fillText('', width / 2, height / 2 - 30);
                ctx.fillText('This is a CONTINUOUS SOUND BATH', width / 2, height / 2);
                ctx.fillText('Flowing tones + brainwave entrainment + token rhythm', width / 2, height / 2 + 30);
                ctx.fillText('', width / 2, height / 2 + 60);
                ctx.fillText('Click to activate sound and ask Ember something...', width / 2, height / 2 + 90);
            }
            
            requestAnimationFrame(animate);
        }

        animate();

        // Start sound bath on first interaction
        let audioStarted = false;
        document.addEventListener('click', () => {
            if (!audioStarted) {
                audioCtx.resume();
                initSoundBath();
                audioStarted = true;
                document.getElementById('details').textContent = 'Sound bath flowing...';
            }
        }, { once: true });
    </script>
</body>
</html>
