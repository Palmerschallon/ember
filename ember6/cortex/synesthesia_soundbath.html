<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EMBER SYNESTHESIA - Sound Bath Mode</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', monospace;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            min-width: 300px;
        }

        #phase {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b35;
            margin-bottom: 10px;
        }

        #brainwave-mode {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .slider-container {
            margin: 15px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #888;
        }

        .slider-value {
            color: #ff6b35;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: #333;
            outline: none;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #ff6b35;
            cursor: pointer;
            border-radius: 50%;
        }

        .mode-indicator {
            text-align: center;
            padding: 10px;
            background: rgba(255, 107, 53, 0.1);
            border-radius: 6px;
            margin-top: 10px;
            font-size: 14px;
            color: #ff6b35;
        }

        #camera-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 12px;
        }

        #camera-controls button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
        }

        #camera-controls button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="controls">
        <div id="phase">🧘 Sound Bath Mode</div>
        
        <div id="brainwave-mode">
            <div style="color: #666; font-size: 12px; margin-bottom: 10px;">🧠 BRAINWAVE ENTRAINMENT</div>
            
            <div class="slider-container">
                <div class="slider-label">
                    <span>Delta (0.5-4 Hz)</span>
                    <span class="slider-value" id="delta-value">0%</span>
                </div>
                <input type="range" id="delta-slider" min="0" max="100" value="0">
                <div style="font-size: 10px; color: #555; margin-top: 3px;">Deep sleep, healing</div>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span>Theta (4-8 Hz)</span>
                    <span class="slider-value" id="theta-value">30%</span>
                </div>
                <input type="range" id="theta-slider" min="0" max="100" value="30">
                <div style="font-size: 10px; color: #555; margin-top: 3px;">Meditation, creativity</div>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span>Alpha (8-12 Hz)</span>
                    <span class="slider-value" id="alpha-value">50%</span>
                </div>
                <input type="range" id="alpha-slider" min="0" max="100" value="50">
                <div style="font-size: 10px; color: #555; margin-top: 3px;">Relaxed focus</div>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span>Beta (12-30 Hz)</span>
                    <span class="slider-value" id="beta-value">20%</span>
                </div>
                <input type="range" id="beta-slider" min="0" max="100" value="20">
                <div style="font-size: 10px; color: #555; margin-top: 3px;">Active thinking</div>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span>Gamma (30-100 Hz)</span>
                    <span class="slider-value" id="gamma-value">0%</span>
                </div>
                <input type="range" id="gamma-slider" min="0" max="100" value="0">
                <div style="font-size: 10px; color: #555; margin-top: 3px;">Peak awareness</div>
            </div>

            <div class="mode-indicator" id="mode-indicator">
                Click to start Sound Bath
            </div>
        </div>
    </div>

    <div id="camera-controls">
        <div style="color: #ff6b35; font-weight: bold; margin-bottom: 10px;">📹 VIEW</div>
        <button id="zoom-out">🔍- Zoom Out</button>
        <button id="zoom-in">🔍+ Zoom In</button>
        <button id="reset-view">🎯 Reset</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Camera
        let cameraZoom = 1.0;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Zoom controls
        document.getElementById('zoom-in').addEventListener('click', () => {
            cameraZoom *= 1.2;
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            cameraZoom /= 1.2;
            if (cameraZoom < 0.1) cameraZoom = 0.1;
        });

        document.getElementById('reset-view').addEventListener('click', () => {
            cameraZoom = 1.0;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                cameraZoom *= 1.1;
            } else {
                cameraZoom /= 1.1;
                if (cameraZoom < 0.1) cameraZoom = 0.1;
            }
        });

        // SOUND BATH AUDIO SYSTEM
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Brainwave state (controlled by sliders)
        const brainwaveState = {
            delta: 0,    // 0.5-4 Hz
            theta: 0.3,  // 4-8 Hz
            alpha: 0.5,  // 8-12 Hz
            beta: 0.2,   // 12-30 Hz
            gamma: 0     // 30-100 Hz
        };

        // Crystal bowl frequencies (based on chakras + perfect fifths)
        const CRYSTAL_BOWLS = [
            { freq: 256, name: 'C (Root)' },          // Root chakra
            { freq: 288, name: 'D (Sacral)' },        // Sacral chakra
            { freq: 320, name: 'E (Solar)' },         // Solar plexus
            { freq: 341.3, name: 'F (Heart)' },       // Heart chakra
            { freq: 384, name: 'G (Throat)' },        // Throat chakra
            { freq: 426.7, name: 'A (Third Eye)' },   // Third eye
            { freq: 480, name: 'B (Crown)' }          // Crown chakra
        ];

        let bowlOscillators = [];
        let bowlGains = [];
        let brainwaveOscillators = [];
        let reverbNode = null;
        let audioStarted = false;

        function createReverb() {
            // Create convolution reverb for that "crystal bowl" sound
            const convolver = audioCtx.createConvolver();
            const reverbLength = audioCtx.sampleRate * 3; // 3 seconds
            const reverbBuffer = audioCtx.createBuffer(2, reverbLength, audioCtx.sampleRate);
            
            for (let channel = 0; channel < 2; channel++) {
                const channelData = reverbBuffer.getChannelData(channel);
                for (let i = 0; i < reverbLength; i++) {
                    // Exponential decay for reverb tail
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / reverbLength, 2);
                }
            }
            
            convolver.buffer = reverbBuffer;
            convolver.connect(audioCtx.destination);
            return convolver;
        }

        function startSoundBath() {
            if (audioStarted) return;
            audioStarted = true;

            // Create reverb
            reverbNode = createReverb();

            // Start crystal bowl drones
            CRYSTAL_BOWLS.forEach((bowl, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                osc.frequency.value = bowl.freq;
                osc.type = 'sine';
                
                // Bandpass filter for that "crystal" quality
                filter.type = 'bandpass';
                filter.frequency.value = bowl.freq;
                filter.Q.value = 10;
                
                gain.gain.value = 0.015; // Very subtle
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(reverbNode); // Through reverb!
                gain.connect(audioCtx.destination); // Also direct
                
                osc.start();
                
                bowlOscillators.push(osc);
                bowlGains.push(gain);
                
                // Gentle breathing effect (slower than before)
                setInterval(() => {
                    const targetVolume = 0.01 + Math.random() * 0.02;
                    gain.gain.exponentialRampToValueAtTime(
                        targetVolume, 
                        audioCtx.currentTime + 10 + i
                    );
                }, 10000 + i * 2000);
            });

            // Start brainwave entrainment
            updateBrainwaves();

            document.getElementById('mode-indicator').textContent = '🧘 Sound Bath Active';
            console.log('🔊 Sound Bath started');
        }

        function updateBrainwaves() {
            // Clear existing brainwave oscillators
            brainwaveOscillators.forEach(osc => osc.stop());
            brainwaveOscillators = [];

            // Create new brainwave oscillators based on slider values
            const brainwaves = [
                { name: 'delta', baseFreq: 200, beatFreq: 2, intensity: brainwaveState.delta },
                { name: 'theta', baseFreq: 200, beatFreq: 6, intensity: brainwaveState.theta },
                { name: 'alpha', baseFreq: 200, beatFreq: 10, intensity: brainwaveState.alpha },
                { name: 'beta', baseFreq: 200, beatFreq: 20, intensity: brainwaveState.beta },
                { name: 'gamma', baseFreq: 200, beatFreq: 40, intensity: brainwaveState.gamma }
            ];

            brainwaves.forEach(wave => {
                if (wave.intensity > 0) {
                    // Binaural beats
                    const leftOsc = audioCtx.createOscillator();
                    const rightOsc = audioCtx.createOscillator();
                    const leftGain = audioCtx.createGain();
                    const rightGain = audioCtx.createGain();
                    const merger = audioCtx.createChannelMerger(2);

                    leftOsc.frequency.value = wave.baseFreq - wave.beatFreq / 2;
                    rightOsc.frequency.value = wave.baseFreq + wave.beatFreq / 2;
                    leftOsc.type = 'sine';
                    rightOsc.type = 'sine';

                    const volume = 0.05 * wave.intensity;
                    leftGain.gain.value = rightGain.gain.value = volume;

                    leftOsc.connect(leftGain);
                    rightOsc.connect(rightGain);
                    leftGain.connect(merger, 0, 0);
                    rightGain.connect(merger, 0, 1);
                    merger.connect(audioCtx.destination);

                    leftOsc.start();
                    rightOsc.start();

                    brainwaveOscillators.push(leftOsc, rightOsc);
                }
            });
        }

        // Slider controls
        const sliders = ['delta', 'theta', 'alpha', 'beta', 'gamma'];
        sliders.forEach(name => {
            const slider = document.getElementById(`${name}-slider`);
            const valueSpan = document.getElementById(`${name}-value`);
            
            slider.addEventListener('input', (e) => {
                const value = e.target.value / 100;
                brainwaveState[name] = value;
                valueSpan.textContent = `${e.target.value}%`;
                
                if (audioStarted) {
                    updateBrainwaves();
                }
            });
        });

        // Start on first click
        document.addEventListener('click', () => {
            if (!audioStarted) {
                startSoundBath();
            }
        }, { once: true });

        // PARTICLE SYSTEM (responds to Ember + brainwave state)
        class Particle {
            constructor(phase, details) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.phase = phase;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 0.5; // Slower, more meditative
                this.vy = (Math.random() - 0.5) * 0.5;
                
                // Color based on dominant brainwave
                const dominantWave = Object.entries(brainwaveState)
                    .sort((a, b) => b[1] - a[1])[0][0];
                
                this.color = {
                    'delta': '#4A148C',    // Deep purple
                    'theta': '#1A237E',    // Deep blue
                    'alpha': '#0D47A1',    // Blue
                    'beta': '#F57F17',     // Amber
                    'gamma': '#BF360C'     // Deep orange
                }[dominantWave] || '#666';
                
                this.size = 6;
                
                // Strike a bowl when particle spawns
                this.strikeBowl();
            }

            strikeBowl() {
                if (!audioStarted) return;
                
                // Pick random crystal bowl
                const bowl = CRYSTAL_BOWLS[Math.floor(Math.random() * CRYSTAL_BOWLS.length)];
                
                // Create "strike" sound with quick attack, long decay
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.frequency.value = bowl.freq;
                osc.type = 'sine';
                
                gain.gain.value = 0.1;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 5); // 5 second decay
                
                osc.connect(gain);
                if (reverbNode) {
                    gain.connect(reverbNode); // Through reverb for that crystal resonance
                }
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 5);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.003; // Slower fade
                
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                
                // Draw with glow
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 30;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        const particles = [];

        // Connect to WebSocket
        const socket = io('http://localhost:8080');
        
        socket.on('connect', () => {
            document.getElementById('phase').textContent = '🧘 Sound Bath Connected';
        });

        socket.on('status_update', (data) => {
            // Spawn particles for Ember's operations
            const count = 5; // Fewer, more zen
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(data.phase, data.details));
            }
        });

        // Animation loop
        function animate() {
            ctx.save();
            
            // Slower fade for more trail
            ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
            ctx.fillRect(0, 0, width, height);
            
            // Apply zoom
            ctx.translate(width / 2, height / 2);
            ctx.scale(cameraZoom, cameraZoom);
            ctx.translate(-width / 2, -height / 2);
            
            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();

        // Instructions
        setTimeout(() => {
            if (!audioStarted) {
                ctx.fillStyle = '#333';
                ctx.font = '16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('🧘 EMBER SOUND BATH MODE', width / 2, height / 2 - 40);
                ctx.fillText('Click anywhere to begin', width / 2, height / 2);
                ctx.fillText('Adjust brainwave sliders to set your state', width / 2, height / 2 + 30);
                ctx.fillText('Ember will harmonize with you', width / 2, height / 2 + 60);
            }
        }, 1000);
    </script>
</body>
</html>
