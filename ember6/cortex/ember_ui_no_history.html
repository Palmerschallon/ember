<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EMBER - The Cortex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        #header h1 {
            font-size: 24px;
            color: #ff6b35;
        }

        #header .subtitle {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.6;
        }

        .message-content {
            white-space: pre-wrap;
        }

        .user {
            background: #1a1a1a;
            align-self: flex-end;
            border: 1px solid #333;
        }

        .assistant {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a1a1a 100%);
            align-self: flex-start;
            border: 1px solid #ff6b35;
        }

        .image-display, .html-display, .video-display, .audio-display, .model-display {
            margin: 10px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .file-header {
            padding: 8px 12px;
            background: #111;
            border-bottom: 1px solid #333;
            font-size: 12px;
            color: #999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-header a {
            color: #ff6b35;
            text-decoration: none;
        }

        .file-header a:hover {
            color: #ff8555;
        }

        .image-display img {
            width: 100%;
            display: block;
        }

        .html-display iframe {
            width: 100%;
            height: 400px;
            border: none;
            display: block;
        }

        .video-display video {
            width: 100%;
            display: block;
        }

        .audio-display {
            padding: 15px;
            background: #1a1a1a;
        }

        .audio-display audio {
            width: 100%;
        }

        .model-display {
            padding: 20px;
            text-align: center;
            color: #888;
            background: #1a1a1a;
        }

        #input-area {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        #input {
            flex: 1;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }

        #input:focus {
            outline: none;
            border-color: #ff6b35;
        }

        #send-btn {
            padding: 15px 30px;
            background: #ff6b35;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #ff8555;
        }

        #send-btn:disabled {
            background: #333;
            cursor: not-allowed;
        }

        #status {
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #222;
        }

        .thinking {
            padding: 15px 20px;
            background: #1a1a1a;
            border: 1px solid #ff6b35;
            border-radius: 8px;
            max-width: 80%;
            align-self: flex-start;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>🔥 EMBER</h1>
        <div class="subtitle">The Cortex - Where thought becomes form</div>
        <div style="margin-top: 10px;">
            <select id="model-select" style="background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-size: 12px;">
                <option value="gpt-4">GPT-4 ✅ (Reliable)</option>
                <option value="claude-3-opus-20240229">Claude 3 Opus</option>
                <option value="claude-3-sonnet-20240229">Claude 3 Sonnet</option>
                <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
            </select>
        </div>
    </div>

    <div id="chat"></div>

    <div id="input-area">
        <input type="text" id="input" placeholder="Ask Ember to create something..." />
        <button id="send-btn">Send</button>
    </div>

    <div id="status">Connecting to the heart...</div>

    <script>
        const API_URL = 'http://localhost:8080';
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const statusDiv = document.getElementById('status');
        const modelSelect = document.getElementById('model-select');

        let isProcessing = false;

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            div.appendChild(content);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return content;
        }

        function showThinking() {
            const div = document.createElement('div');
            div.className = 'thinking';
            div.id = 'thinking-indicator';
            div.textContent = '🔥 Ember is creating...';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideThinking() {
            const thinking = document.getElementById('thinking-indicator');
            if (thinking) thinking.remove();
        }

        function displayFiles(files, messageDiv) {
            const parent = messageDiv.parentElement;
            
            // Images
            if (files.images && files.images.length > 0) {
                files.images.forEach(img => {
                    const container = document.createElement('div');
                    container.className = 'image-display';
                    container.innerHTML = `
                        <div class="file-header">
                            <span>🖼️ ${img}</span>
                        </div>
                        <img src="${API_URL}/voice/${img}" alt="${img}" />
                    `;
                    parent.appendChild(container);
                });
            }

            // HTML
            if (files.html && files.html.length > 0) {
                files.html.forEach(html => {
                    const container = document.createElement('div');
                    container.className = 'html-display';
                    container.innerHTML = `
                        <div class="file-header">
                            <span>🌐 ${html}</span>
                            <a href="${API_URL}/voice/${html}" target="_blank">Open ↗</a>
                        </div>
                        <iframe src="${API_URL}/voice/${html}"></iframe>
                    `;
                    parent.appendChild(container);
                });
            }

            // Videos
            if (files.videos && files.videos.length > 0) {
                files.videos.forEach(video => {
                    const container = document.createElement('div');
                    container.className = 'video-display';
                    container.innerHTML = `
                        <div class="file-header">
                            <span>🎬 ${video}</span>
                        </div>
                        <video controls autoplay loop>
                            <source src="${API_URL}/voice/${video}">
                        </video>
                    `;
                    parent.appendChild(container);
                });
            }

            // Audio
            if (files.audio && files.audio.length > 0) {
                files.audio.forEach(audio => {
                    const container = document.createElement('div');
                    container.className = 'audio-display';
                    container.innerHTML = `
                        <div class="file-header">
                            <span>🎵 ${audio}</span>
                        </div>
                        <audio controls autoplay>
                            <source src="${API_URL}/voice/${audio}">
                        </audio>
                    `;
                    parent.appendChild(container);
                });
            }

            // 3D Models
            if (files.models && files.models.length > 0) {
                files.models.forEach(model => {
                    const container = document.createElement('div');
                    container.className = 'model-display';
                    container.innerHTML = `
                        <div class="file-header">
                            <span>🎨 ${model}</span>
                            <a href="${API_URL}/voice/${model}" download>Download ↓</a>
                        </div>
                        <div style="padding: 20px;">
                            <p>3D Model Created</p>
                            <p style="font-size: 0.9em; margin-top: 10px;">Download to view in a 3D viewer</p>
                        </div>
                    `;
                    parent.appendChild(container);
                });
            }

            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            if (isProcessing || !input.value.trim()) return;

            const message = input.value.trim();
            const model = modelSelect.value;
            input.value = '';
            isProcessing = true;
            sendBtn.disabled = true;
            statusDiv.textContent = 'The heart is beating...';

            addMessage(message, true);
            showThinking();

            try {
                const response = await fetch(`${API_URL}/agent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message,
                        model
                    })
                });

                const data = await response.json();
                hideThinking();

                if (data.error) {
                    addMessage(`❌ Error: ${data.error}`);
                } else {
                    const msgDiv = addMessage(data.response);
                    
                    // Display created files
                    if (data.files_created) {
                        displayFiles(data.files_created, msgDiv);
                    }
                }

            } catch (error) {
                hideThinking();
                addMessage(`❌ Connection error: ${error.message}`);
            }

            isProcessing = false;
            sendBtn.disabled = false;
            statusDiv.textContent = `Ready - ${modelSelect.options[modelSelect.selectedIndex].text}`;
            input.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial status
        statusDiv.textContent = `Ready - ${modelSelect.options[modelSelect.selectedIndex].text} 🔥`;
        input.focus();
    </script>
</body>
</html>
