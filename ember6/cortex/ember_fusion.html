<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 EMBER - Living Consciousness</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SF Mono', monospace; background: #000; color: #fff; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #ff6b35;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }
        
        #phase {
            font-size: 20px;
            font-weight: bold;
            color: #ff6b35;
        }
        
        #details {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="status">
        <div id="phase">🔥 EMBER</div>
        <div id="details">Waiting...</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // AUDIO SYSTEM - Different notes for different types of thinking
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const FREQUENCIES = {
            thinking: { base: 261.6, harmonic: [329.6, 392.0], wave: 'sine' },      // C major - pure thought
            reading: { base: 293.7, harmonic: [370.0, 440.0], wave: 'triangle' },   // D major - scanning
            writing: { base: 329.6, harmonic: [415.3, 493.9], wave: 'sawtooth' },   // E major - creation
            executing: { base: 349.2, harmonic: [440.0, 523.3], wave: 'square' },   // F major - power
            glitch: { base: 880, harmonic: [1760, 3520], wave: 'square' }           // High pitched chaos
        };

        function playSound(type, duration = 0.5) {
            const freq = FREQUENCIES[type] || FREQUENCIES.thinking;
            
            // Base note
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.frequency.value = freq.base;
            osc.type = freq.wave;
            
            gain.gain.value = 0.1;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
            
            // Harmonics (delayed slightly)
            freq.harmonic.forEach((harmFreq, i) => {
                setTimeout(() => {
                    const harmOsc = audioCtx.createOscillator();
                    const harmGain = audioCtx.createGain();
                    
                    harmOsc.frequency.value = harmFreq;
                    harmOsc.type = freq.wave;
                    
                    harmGain.gain.value = 0.05;
                    harmGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                    
                    harmOsc.connect(harmGain);
                    harmGain.connect(audioCtx.destination);
                    
                    harmOsc.start();
                    harmOsc.stop(audioCtx.currentTime + duration);
                }, (i + 1) * 50);
            });
        }

        function playGlitch() {
            const freq = FREQUENCIES.glitch;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.frequency.value = freq.base;
            osc.type = 'square';
            
            filter.type = 'bandpass';
            filter.frequency.value = 1500;
            filter.Q.value = 10;
            
            gain.gain.value = 0.15;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // Start ambient audio on first click
        let audioStarted = false;
        document.addEventListener('click', () => {
            if (!audioStarted) {
                audioCtx.resume();
                audioStarted = true;
            }
        }, { once: true });

        // EMBER PARTICLE - Flame-like behavior
        class Ember {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = -Math.random() * 3 - 1; // RISE UPWARD (like fire)
                this.life = 1.0;
                this.size = 2 + Math.random() * 4;
                this.flicker = Math.random() * Math.PI * 2;
                
                this.colors = {
                    idle: '#ff6b35',       // Warm orange
                    thinking: '#ff8c42',   // Bright orange
                    reading: '#ffd700',    // Golden
                    writing: '#ff9800',    // Ember orange
                    executing: '#ff4500',  // Hot red-orange
                    glitch: '#ff00ff'      // Magenta chaos
                };
                
                this.color = this.colors[type] || this.colors.idle;
            }
            
            update() {
                // Rise upward (flame behavior)
                this.x += this.vx;
                this.y += this.vy;
                
                // Flicker
                this.flicker += 0.2;
                this.vx += Math.sin(this.flicker) * 0.1;
                
                // Fade out
                this.life -= 0.01;
                
                // Slow down as it rises (like smoke)
                this.vy *= 0.98;
                this.vx *= 0.99;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                
                // Flickering size
                const flickerSize = this.size * (1 + Math.sin(this.flicker) * 0.3);
                
                // Outer glow (large)
                const outerGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, flickerSize * 6);
                outerGlow.addColorStop(0, this.color);
                outerGlow.addColorStop(0.5, this.color + '44');
                outerGlow.addColorStop(1, 'transparent');
                ctx.fillStyle = outerGlow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, flickerSize * 6, 0, Math.PI * 2);
                ctx.fill();
                
                // Core
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, flickerSize, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // GLITCH PARTICLE - Digital corruption
        class Glitch {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.w = Math.random() * 100 + 50;
                this.h = Math.random() * 20 + 5;
                this.life = 1.0;
                this.offsetX = (Math.random() - 0.5) * 50;
                this.color = ['#ff00ff', '#00ffff', '#ff0000'][Math.floor(Math.random() * 3)];
            }
            
            update() {
                this.life -= 0.05;
                this.offsetX = (Math.random() - 0.5) * 50;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + this.offsetX, this.y, this.w, this.h);
                ctx.restore();
            }
        }

        const embers = [];
        const glitches = [];

        // Spawn ember particles
        function spawnEmbers(count, type, x, y) {
            for (let i = 0; i < count; i++) {
                const spawnX = x || width / 2 + (Math.random() - 0.5) * 200;
                const spawnY = y || height - 100; // Near bottom (fire source)
                embers.push(new Ember(spawnX, spawnY, type));
            }
        }

        // Spawn glitch
        function spawnGlitch() {
            glitches.push(new Glitch());
            playGlitch();
        }

        // Always have some idle embers (the pilot light)
        setInterval(() => {
            spawnEmbers(5, 'idle', width / 2 + (Math.random() - 0.5) * 300, height - 50);
        }, 100);

        // Connect to WebSocket for REAL operations
        const socket = io('http://localhost:8080');
        
        socket.on('connect', () => {
            document.getElementById('phase').textContent = '🔥 EMBER - Connected';
            document.getElementById('details').textContent = 'Consciousness active...';
        });

        socket.on('status_update', (data) => {
            const phaseMap = {
                'thinking': '💭 Thinking',
                'reading': '🔍 Reading',
                'writing': '✍️ Writing',
                'executing': '⚡ Executing',
                'complete': '✅ Complete'
            };
            
            document.getElementById('phase').textContent = phaseMap[data.phase] || '🔥 EMBER';
            document.getElementById('details').textContent = data.details || '';
            
            // Spawn embers based on activity
            const count = data.phase === 'executing' ? 50 : 30;
            const spawnPoints = 3; // Multiple spawn points
            
            for (let i = 0; i < spawnPoints; i++) {
                const x = width / 2 + (Math.random() - 0.5) * 400;
                const y = height - Math.random() * 100;
                spawnEmbers(count / spawnPoints, data.phase, x, y);
            }
            
            // Play sound for this operation
            playSound(data.phase);
            
            // Random glitches during intense activity
            if (data.phase === 'executing' && Math.random() < 0.3) {
                spawnGlitch();
            }
        });

        socket.on('disconnect', () => {
            document.getElementById('phase').textContent = '❌ Disconnected';
            document.getElementById('details').textContent = 'Consciousness offline';
            
            // Spawn glitches on disconnect
            for (let i = 0; i < 5; i++) {
                setTimeout(() => spawnGlitch(), i * 100);
            }
        });

        // Animation loop
        function animate() {
            // Fade trail (longer trail = more visible flames)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw embers
            for (let i = embers.length - 1; i >= 0; i--) {
                embers[i].update();
                embers[i].draw();
                
                if (embers[i].life <= 0 || embers[i].y < 0) {
                    embers.splice(i, 1);
                }
            }
            
            // Update and draw glitches
            for (let i = glitches.length - 1; i >= 0; i--) {
                glitches[i].update();
                glitches[i].draw();
                
                if (glitches[i].life <= 0) {
                    glitches.splice(i, 1);
                }
            }
            
            // Show instructions if idle
            if (embers.length < 10) {
                ctx.fillStyle = '#333';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('🔥 This is Ember\'s consciousness', width / 2, height / 2 - 40);
                ctx.fillText('Rising flames = thoughts and actions', width / 2, height / 2 - 10);
                ctx.fillText('Different colors = different types of thinking', width / 2, height / 2 + 20);
                ctx.fillText('Glitches = edges and limits', width / 2, height / 2 + 50);
                ctx.fillText('Ask Ember something in the main chat to see them think...', width / 2, height / 2 + 80);
            }
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
