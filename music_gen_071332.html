<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Music Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        canvas {
            border: 2px solid #00ffcc;
            border-radius: 10px;
            background: rgba(0, 255, 204, 0.05);
            cursor: crosshair;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #00ff99;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        select, input[type="range"] {
            padding: 5px;
            background: #1a1a1a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 5px;
        }

        label {
            color: #00ffcc;
            margin-right: 10px;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 14px;
            line-height: 1.5;
        }

        .note {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            pointer-events: none;
            animation: ripple 2s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info">
            <h2>Interactive Music Generator</h2>
            <p>Click anywhere on the canvas to create tones!</p>
            <p>Y-axis: Frequency (higher = higher pitch)</p>
            <p>X-axis: Pan (left to right)</p>
        </div>

        <canvas id="visualizer"></canvas>

        <div class="controls">
            <label>Wave Type:</label>
            <select id="waveType">
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>

            <label>Duration:</label>
            <input type="range" id="duration" min="0.1" max="2" step="0.1" value="0.5">
            <span id="durationValue">0.5s</span>

            <label>Volume:</label>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">

            <button id="clearBtn">Clear All</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const waveTypeSelect = document.getElementById('waveType');
        const durationSlider = document.getElementById('duration');
        const durationValue = document.getElementById('durationValue');
        const volumeSlider = document.getElementById('volume');
        const clearBtn = document.getElementById('clearBtn');

        // Set canvas size
        canvas.width = 800;
        canvas.height = 400;

        // Audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.connect(audioContext.destination);

        // Store active oscillators
        const activeOscillators = new Set();

        // Waveform visualization
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        function drawWaveform() {
            requestAnimationFrame(drawWaveform);

            analyser.getByteTimeDomainData(dataArray);

            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#00ffcc';
            ctx.beginPath();

            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }

                x += sliceWidth;
            }

            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Draw frequency bars
            analyser.getByteFrequencyData(dataArray);
            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i] / 2;
                
                const hue = (i / bufferLength) * 180 + 160;
                ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.6)`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);

                x += barWidth + 1;
            }
        }

        function createTone(x, y) {
            // Calculate frequency based on y position (inverted so higher = higher pitch)
            const minFreq = 100;
            const maxFreq = 1000;
            const frequency = minFreq + ((canvas.height - y) / canvas.height) * (maxFreq - minFreq);

            // Calculate pan based on x position
            const pan = (x / canvas.width) * 2 - 1;

            // Create oscillator
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const panNode = audioContext.createStereoPanner();

            oscillator.type = waveTypeSelect.value;
            oscillator.frequency.value = frequency;
            
            panNode.pan.value = pan;

            // Connect nodes
            oscillator.connect(gainNode);
            gainNode.connect(panNode);
            panNode.connect(analyser);

            // Set gain envelope
            const now = audioContext.currentTime;
            const duration = parseFloat(durationSlider.value);
            const maxGain = parseFloat(volumeSlider.value);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(maxGain, now + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // Start and stop oscillator
            oscillator.start(now);
            oscillator.stop(now + duration);

            activeOscillators.add(oscillator);
            oscillator.onended = () => {
                activeOscillators.delete(oscillator);
            };

            // Visual feedback
            createRipple(x, y, frequency);
        }

        function createRipple(x, y, frequency) {
            const ripple = document.createElement('div');
            ripple.className = 'note';
            ripple.style.left = x - 15 + 'px';
            ripple.style.top = y - 15 + canvas.offsetTop + 'px';
            
            const hue = ((frequency - 100) / 900) * 180 + 160;
            ripple.style.background = `radial-gradient(circle, hsla(${hue}, 100%, 50%, 0.8), transparent)`;
            
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 2000);
        }

        // Event listeners
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createTone(x, y);
        });

        durationSlider.addEventListener('input', (e) => {
            durationValue.textContent = e.target.value + 's';
        });

        clearBtn.addEventListener('click', () => {
            activeOscillators.forEach(osc => {
                try {
                    osc.stop();
                } catch(e) {}
            });
            activeOscillators.clear();
        });

        // Start visualization
        drawWaveform();

        // Resume audio context on first interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });
    </script>
</body>
</html>
